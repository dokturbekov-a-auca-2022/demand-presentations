<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 18 — The Relative Route</title><style>
:root{--blue:#123b68;--coral:#f06c58;--lime:#d7ec5b;--cream:#fff8e9;--ink:#183047;--sky:#d9f0f2}*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:6vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:slide .35s both}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9rem,#123b6808 9.1rem 9.2rem);pointer-events:none}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#123b68ed 0%,#123b68c7 45%,#123b6830 100%)}.title{position:relative;z-index:2;color:#fff;max-width:48rem;padding-top:12vh}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.84;margin:.1em 0}.title p{font-size:clamp(1.2rem,2vw,1.8rem);line-height:1.25}.eyebrow{font:900 .78rem Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}h2{font-size:clamp(2rem,4vw,4.4rem);line-height:.98;margin:.15em 0 .45em;color:var(--blue)}h3{font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin:.2em 0 .7em}p,li{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.ribbon{display:inline-block;background:var(--lime);color:var(--blue);padding:.5rem .9rem;font-weight:900;transform:skew(-9deg);margin:.2rem}.stage{position:relative;z-index:1;max-width:1150px}.figure{width:100%;max-height:46vh;object-fit:cover;border:10px solid #fff;box-shadow:14px 14px 0 var(--coral)}.rail{display:flex;gap:0;align-items:stretch;margin:1.3rem 0;position:relative}.rail:before{content:'';position:absolute;left:0;right:0;top:50%;height:8px;background:var(--coral)}.stop{position:relative;z-index:1;flex:1;background:var(--sky);border:4px solid var(--blue);padding:1rem;text-align:center;min-height:8rem}.stop b{display:block;color:var(--blue);font-size:1.2rem}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.label{background:#fff;border:3px solid var(--blue);padding:1rem;min-height:8rem;box-shadow:6px 6px 0 #123b6833}.label strong{color:var(--coral);font-size:1.25rem}.choice{background:#fff;border:3px solid var(--blue);padding:1rem;text-align:left;cursor:pointer;font-size:1.1rem;box-shadow:5px 5px 0 #123b6833}.choice:hover,.choice.selected{background:var(--lime);transform:translate(-2px,-2px)}button{font:800 1rem Arial;color:var(--blue);cursor:pointer}.sentence{font-size:clamp(1.5rem,2.8vw,3rem);background:#fff;border-left:12px solid var(--coral);padding:1rem 1.4rem;box-shadow:8px 8px 0 #123b6833;margin:1rem 0}.blank{display:inline-block;border-bottom:5px solid var(--coral);min-width:5rem;color:var(--coral)}.tiles{display:flex;flex-wrap:wrap;gap:.7rem}.tile{background:var(--blue);color:#fff;border:0;padding:.8rem 1rem;box-shadow:4px 4px 0 var(--coral)}.tile.on{background:var(--coral)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.compare>div{padding:1.2rem;background:#fff;border-top:9px solid var(--blue)}.compare>div:last-child{border-color:var(--coral)}.meter{height:16px;background:#b9c9d4;margin:1rem 0}.meter i{display:block;height:100%;width:25%;background:var(--coral);transition:.25s}.feedback{font-weight:800;color:var(--coral);min-height:1.5em}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#123b68f2;color:#fff;padding:.5rem .8rem;display:flex;gap:.65rem;align-items:center}.nav button,.tools button{background:var(--coral);border:0;padding:.55rem .8rem;color:#fff}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.note,.map{display:none;position:fixed;z-index:30;background:#123b68f5;color:#fff;padding:1rem;top:4.5rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(820px,92vw)}.map button{margin:.25rem;padding:.45rem;border:0}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--lime)}@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.labels,.compare{grid-template-columns:1fr}.rail{display:block}.rail:before{left:1.8rem;top:0;bottom:0;width:8px;height:auto}.stop{text-align:left;margin:.75rem 0;padding-left:3rem}.figure{max-height:30vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}.title{padding-top:13vh}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">ROUTE</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(title,n,b)=>({title,n,b});const scenes=[
S('The Relative Route','2 min. Open with the image. Ask: Which person or place would you like to describe first?',`<img class="hero" src="${A}directory-wall.png" alt="Illustrated town directory with teenagers and colorful landmarks"><div class="shade"></div><div class="title"><div class="eyebrow">Lesson 18 · grammar + speaking</div><h1>The<br>Relative<br>Route</h1><p>Describe people and places with details that travel inside the sentence.</p><span class="ribbon">WHO</span><span class="ribbon">WHICH</span><span class="ribbon">WHERE</span></div>`),
S('Check-in: choose a landmark','4 min. Students choose one place and explain why it matters. Fictional answers are welcome.',`<div class="stage"><h3>01 · check-in</h3><h2>Which place would you show a visitor?</h2><div class="labels" id="landmarks">${['the café','the library','the skate park','the lighthouse','the market','a place I invent'].map(x=>`<button class="choice" data-place="${x}">${x}</button>`).join('')}</div><p id="landmarkOut" class="feedback">Choose a place, then say: “It is a place where …”</p></div>`),
S('Bridge from Lesson 17','3 min. Connect behaviour reading to describing people: a detail helps us identify a person.',`<div class="stage"><h3>02 · bridge</h3><h2>A detail can turn a label into a picture.</h2><div class="compare"><div><b>Too general</b><p>“Mina is friendly.”</p></div><div><b>More useful</b><p>“Mina is the student <span class="blank">who</span> always welcomes new classmates.”</p></div></div><p>What extra detail helps you imagine Mina?</p></div>`),
S('Meet the town directory','5 min. Use the picture as a prediction board. Students point and make one sentence about a person or place.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>Every face and place has a story.</h2><img class="figure" src="${A}neighborhood-map.png" alt="Cutaway illustrated neighborhood map with four places and tiny characters"><p class="feedback">Point, describe, and let your partner guess: “It’s the place where …”</p></div>`),
S('Today’s route','1 min. Preview the progression from identifying to creating.',`<div class="stage"><h3>04 · route board</h3><h2>We will build longer, clearer sentences.</h2><div class="rail"><div class="stop"><b>Spot</b>the noun</div><div class="stop"><b>Choose</b>the linker</div><div class="stop"><b>Join</b>the ideas</div><div class="stop"><b>Describe</b>your world</div></div></div>`),
S('Vocabulary: people who…','5 min. Students tap a word and complete an oral sentence.',`<div class="stage"><h3>05 · word shelf</h3><h2>Choose a person, then add a job or habit.</h2><div class="tiles" id="people">${['artist','baker','coach','neighbour','scientist','volunteer','photographer','guide'].map(x=>`<button class="tile" data-word="${x}">${x}</button>`).join('')}</div><p id="peopleOut" class="sentence">“A ___ is a person <span class="blank">who</span> …”</p></div>`),
S('Vocabulary: places where…','5 min. Elicit a verb for each place before revealing the frame.',`<div class="stage"><h3>06 · place shelf</h3><h2>Places carry actions inside them.</h2><div class="tiles" id="places">${['library','bakery','stadium','museum','station','beach'].map(x=>`<button class="tile" data-place2="${x}">${x}</button>`).join('')}</div><p id="placesOut" class="sentence">“A ___ is a place <span class="blank">where</span> …”</p></div>`),
S('The joining move','4 min. Demonstrate two short sentences becoming one.',`<div class="stage"><h3>07 · grammar discovery</h3><h2>Relative clauses are sentence bridges.</h2><div class="sentence">I met a guide. The guide knows every alley.<br><span class="blank">↓</span><br>I met a guide <b>who</b> knows every alley.</div><p>The bridge word points back to the noun before it.</p></div>`),
S('Who, which, where','5 min. Students hold up fingers 1/2/3 or click the correct bridge.',`<div class="stage"><h3>08 · choose the bridge</h3><h2>Match the linker to its noun.</h2><div class="labels" id="linkerQuiz">${[['the boy ___ won','who'],['the room ___ has windows','which'],['the park ___ we play','where']].map(([q,a])=>`<button class="choice" data-link="${a}">${q}<br><small>who · which · where</small></button>`).join('')}</div><p id="linkerOut" class="feedback">People → who · things → which · places → where.</p></div>`),
S('Meaning: identify the right one','4 min. Explain that the clause helps us know exactly which person or place.',`<div class="stage"><h3>09 · meaning</h3><h2>The detail answers “Which one?”</h2><div class="compare"><div><p>“I visited the shop.”</p><p>Which shop?</p></div><div><p>“I visited the shop <b>that sells blue cakes</b>.”</p><p>Now we can find it.</p></div></div></div>`),
S('Form: the sentence rail','5 min. Students click tiles in order; the rail fills with a complete sentence.',`<div class="stage"><h3>10 · form</h3><h2>Put the parts on the rail.</h2><div class="sentence" id="buildSentence">The singer <span class="blank">…</span></div><div class="tiles" id="formTiles">${['is','the person','who','plays','the violin'].map(x=>`<button class="tile" data-form="${x}">${x}</button>`).join('')}</div><p id="formOut" class="feedback">Build: The singer is the person who plays the violin.</p></div>`),
S('Positive, negative, questions','5 min. Notice the position of not and the question mark.',`<div class="stage"><h3>11 · form studio</h3><h2>Three shapes, one bridge.</h2><div class="labels"><div class="label"><strong>+</strong><p>This is the café <b>where</b> we meet.</p></div><div class="label"><strong>−</strong><p>This isn’t the café <b>where</b> we meet.</p></div><div class="label"><strong>?</strong><p>Is this the café <b>where</b> we meet?</p></div></div></div>`),
S('Whose detail?','4 min. Add whose as an optional stretch for ownership.',`<div class="stage"><h3>12 · stretch bridge</h3><h2>Whose tells us about a person’s thing.</h2><div class="sentence">I know a girl <b>whose</b> brother runs the bakery.</div><div class="labels"><div class="label">whose = her / his / their</div><div class="label">person + whose + noun</div></div></div>`),
S('Punctuation traffic lights','3 min. Keep identifying clauses tight; pause only when the meaning needs it.',`<div class="stage"><h3>13 · punctuation</h3><h2>Use the pause to show extra information.</h2><div class="rail"><div class="stop"><b>Green</b><br>essential detail<br>no pause</div><div class="stop"><b>Amber</b><br>extra detail<br>small pause</div><div class="stop"><b>Red</b><br>don’t split<br>the noun and bridge</div></div>`),
S('Controlled practice: pick the bridge','5 min. Students click each answer and explain the noun it refers to.',`<div class="stage"><h3>14 · controlled practice</h3><h2>Which word completes the sentence?</h2><div class="labels" id="bridgeChoices">${[['The woman ___ teaches art is my aunt.','who'],['The building ___ has a glass roof is new.','which'],['The street ___ we live is quiet.','where']].map(([q,a])=>`<button class="choice" data-bridge="${a}">${q}<br><small>who · which · where</small></button>`).join('')}</div><p id="bridgeOut" class="feedback">Click, then justify your choice.</p></div>`),
S('Repair the wobbly sentence','4 min. Turn each error into a smooth sentence.',`<div class="stage"><h3>15 · error repair</h3><h2>Find the missing bridge.</h2><div class="labels"><div class="label"><p>“I know a boy plays chess.”</p><button class="choice fix">Add <b>who</b></button></div><div class="label"><p>“This is the place which we meet.”</p><button class="choice fix">Try <b>where</b></button></div><div class="label"><p>“The museum who is free…”</p><button class="choice fix">Try <b>which</b></button></div></div><p id="fixOut" class="feedback">Every bridge needs a noun it can point back to.</p></div>`),
S('Reading board: The Last Stop','2 min. Preview the short text and assign each sentence a picture.',`<div class="stage"><h3>16 · reading</h3><h2>Follow a visitor through the town.</h2><div class="sentence">Read for the people and places <b>that</b> make the route memorable.</div><div class="rail"><div class="stop">arrival</div><div class="stop">market</div><div class="stop">lighthouse</div><div class="stop">goodbye</div></div></div>`),
S('Text: The Last Stop','6 min. Read silently, then partner-read with a different voice for each person.',`<div class="stage"><h3>17 · close reading</h3><div class="sentence"><p>Amir met Jo, <b>who</b> was carrying a camera. Jo took him to a market <b>that</b> sells handmade maps. They walked to the lighthouse, <b>where</b> the wind was loud. Amir thanked Jo, <b>whose</b> local knowledge had saved the afternoon.</p><p>He left with a map and a friend who knew every shortcut.</p></div><p>Underline one person clause, circle one thing clause, and box one place clause.</p></div>`),
S('Reading check: point to the line','4 min. Students click the answer; insist on evidence from the text.',`<div class="stage"><h3>18 · evidence check</h3><h2>What does each clause describe?</h2><div class="labels" id="readCheck">${[['Who carried a camera?','Jo'],['What sold handmade maps?','the market'],['Where was the wind loud?','the lighthouse']].map(([q,a])=>`<button class="choice" data-read="${a}">${q}</button>`).join('')}</div><p id="readOut" class="feedback">Use the exact noun from the reading.</p></div>`),
S('Map the route','5 min. Click the stops in the order they appear in the text.',`<div class="stage"><h3>19 · sequence</h3><h2>Build Amir’s route.</h2><div class="rail" id="routeStops">${['lighthouse','market','Jo','goodbye'].map((x,i)=>`<button class="stop" data-route="${i}">${x}</button>`).join('')}</div><p id="routeOut" class="feedback">Tap: Jo → market → lighthouse → goodbye.</p></div>`),
S('Information gap: describe, don’t point','6 min. Partner A chooses a secret landmark; Partner B asks questions using relative clauses.',`<div class="stage"><h3>20 · pair mission</h3><h2>Can your partner find the place?</h2><div class="labels"><div class="label"><strong>Ask</strong><p>Is it the place <b>where</b> people borrow books?</p></div><div class="label"><strong>Answer</strong><p>Yes, it’s the place <b>where</b> people borrow books.</p></div><div class="label"><strong>Switch</strong><p>Change roles and choose a new place.</p></div></div></div>`),
S('Portrait + place studio','6 min. Use the image as a speaking gallery. Students create one label for a person and one for a place.',`<div class="stage"><h3>21 · production setup</h3><h2>Curate two labels for the gallery.</h2><img class="figure" src="${A}museum-match.png" alt="Illustrated museum-style display matching fictional teenagers with landmarks"><div class="labels"><div class="label">Person: the one <b>who</b> …</div><div class="label">Place: the one <b>where</b> …</div><div class="label">Thing: the one <b>which</b> …</div></div></div>`),
S('Gallery labels','7 min. Students write or draw three labels. Allow fictional people and places.',`<div class="stage"><h3>22 · production</h3><h2>Make a tiny town gallery.</h2><div class="compare"><div><b>Portrait label</b><p>“This is Nia, who …”</p><p>“She is the person whose …”</p></div><div><b>Place label</b><p>“This is the square where …”</p><p>“It is the place which …”</p></div></div><p class="feedback">Aim for three accurate bridges, not three long paragraphs.</p></div>`),
S('Gallery walk: leave a route clue','5 min. Readers leave one accurate relative-clause sentence for a classmate’s gallery.',`<div class="stage"><h3>23 · response trail</h3><h2>Read a label. Add one useful detail.</h2><div class="rail"><div class="stop"><b>Look</b><br>read the noun</div><div class="stop"><b>Choose</b><br>who / which / where</div><div class="stop"><b>Leave</b><br>one sentence</div></div>`),
S('Review: bridge builder','5 min. Teams complete the four prompts orally.',`<div class="stage"><h3>24 · review</h3><h2>Choose the bridge that fits.</h2><div class="labels" id="review"><button class="choice">a person ___ helps</button><button class="choice">a place ___ we play</button><button class="choice">a thing ___ shines</button><button class="choice">a student ___ bag is red</button></div><p id="reviewOut" class="feedback">who · where · which · whose</p></div>`),
S('Self-check: where are you now?','3 min. Students point to a level and say one sentence.',`<div class="stage"><h3>25 · reflection</h3><h2>How steady is your bridge?</h2><div class="meter"><i id="level"></i></div><div class="tiles" id="levels"><button class="tile" data-level="25">I can spot it</button><button class="tile" data-level="55">I can choose it</button><button class="tile" data-level="85">I can create it</button></div><p id="levelOut" class="feedback">Move the meter, then complete one sentence.</p></div>`),
S('Homework: describe a real or invented corner','2 min. Keep it visual and short.',`<div class="stage"><h3>26 · homework</h3><h2>Bring one place to life.</h2><div class="labels"><div class="label"><strong>Draw</strong><p>A person, place, or object.</p></div><div class="label"><strong>Describe</strong><p>Write 4 sentences using who, which, where, or whose.</p></div><div class="label"><strong>Ask</strong><p>Write one question for a partner to guess the place.</p></div></div></div>`),
S('Exit ticket: take the bridge with you','2 min. Students choose one prompt aloud or on paper. Preview airport listening.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Finish one sentence before you leave.</h2><div class="labels" id="exit"><button class="choice">A person who …</button><button class="choice">A place where …</button><button class="choice">A thing which …</button></div><p id="exitOut" class="feedback">Choose a frame and make it true, imagined, or funny.</p><p class="eyebrow">Next: Listening Lesson · Airport & Travelling</p></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-i="${i}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--lime)">The Relative Route</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#prev').onclick=()=>show(cur-1);document.querySelector('#mapBtn').onclick=()=>map.classList.toggle('open');document.querySelector('#noteBtn').onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#noteBtn').click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-place]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#landmarkOut').textContent=`${b.dataset.place}: It is a place where people can meet, explore, or make a memory.`});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{document.querySelector('#peopleOut').innerHTML=`“A ${b.dataset.word} is a person <b>who</b> …”`});document.querySelectorAll('[data-place2]').forEach(b=>b.onclick=()=>{document.querySelector('#placesOut').innerHTML=`“A ${b.dataset.place2} is a place <b>where</b> …”`});document.querySelectorAll('[data-link],[data-bridge]').forEach(b=>b.onclick=()=>{const good=['who','which','where'].includes(b.dataset.link||b.dataset.bridge);b.classList.add('selected');(document.querySelector('#linkerOut')||document.querySelector('#bridgeOut')).textContent=good?'Check the noun before the gap: person, thing, or place.':'Try again: the bridge must match the noun.'});document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');document.querySelector('#formOut').textContent='Read the rail aloud: The singer is the person who plays the violin.'});document.querySelectorAll('.fix').forEach(b=>b.onclick=()=>document.querySelector('#fixOut').textContent='Repaired: I know a boy who plays chess · the place where we meet · the museum which is free.');document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{document.querySelector('#readOut').textContent=`Evidence: ${b.dataset.read}. Point to that line in the text.`});let route=[];document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{if(!route.includes(+b.dataset.route))route.push(+b.dataset.route);b.classList.add('selected');document.querySelector('#routeOut').textContent=route.length===4?'Route complete: Jo → market → lighthouse → goodbye.':`${route.length}/4 stops chosen.`});document.querySelectorAll('#levels [data-level]').forEach(b=>b.onclick=()=>{document.querySelector('#level').style.width=b.dataset.level+'%';document.querySelector('#levelOut').textContent='Now say one sentence with the bridge you trust most.'});document.querySelectorAll('#exit .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');document.querySelector('#exitOut').textContent='Great — say it to a partner, then swap.'});document.querySelectorAll('#landmarks .choice,#review .choice').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #001b38}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffb09f!important}.shade{background:linear-gradient(90deg,#123b68c9 0%,#123b6880 45%,#123b6820 100%)}</style></body></html>
