<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 20 — Then / Now</title><style>
:root{--plum:#41243f;--yellow:#f8dc83;--turq:#52cbbb;--red:#e95e57;--paper:#fff7e5;--ink:#32263b}*{box-sizing:border-box}body{margin:0;background:var(--plum);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--paper);position:relative;overflow:auto}.scene.active{display:block;animation:flip .35s both}.scene:before{content:'◌';position:absolute;right:4vw;top:2vh;font-size:10rem;color:var(--turq);opacity:.12}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#41243fe9,#41243fa8 48%,#41243f20)}.title{position:relative;z-index:2;color:#fff;max-width:50rem;padding:11vh 2rem 2rem;border-left:10px solid var(--yellow);background:#41243f80}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.15em 0}.title p{font-size:clamp(1.15rem,2vw,1.7rem)}.eyebrow,h3{font:900 .78rem Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--plum);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.45vw,1.4rem);line-height:1.42}.sticker{display:inline-block;background:var(--yellow);color:var(--plum);padding:.45rem .75rem;font-weight:900;transform:rotate(-4deg);margin:.2rem}.split{display:grid;grid-template-columns:1fr 1fr;gap:0;box-shadow:10px 10px 0 #41243f25}.era{padding:1.3rem;min-height:11rem}.era.then{background:#f4c9a2}.era.now{background:#bde8df}.era h3{color:var(--plum)}.polaroids{display:flex;flex-wrap:wrap;gap:1.2rem}.polaroid{background:#fff;padding:.7rem .7rem 1.4rem;box-shadow:7px 7px 0 #41243f25;transform:rotate(-2deg);min-width:180px}.polaroid:nth-child(2){transform:rotate(3deg);background:#fff0bd}.polaroid strong{display:block;margin-top:.65rem}.dial{width:210px;height:210px;border-radius:50%;background:conic-gradient(var(--red) 0 35%,var(--turq) 35% 67%,var(--yellow) 67%);margin:1rem auto;display:grid;place-items:center;border:14px solid var(--plum);box-shadow:inset 0 0 0 12px var(--paper)}.dial span{background:var(--paper);border-radius:50%;width:110px;height:110px;display:grid;place-items:center;text-align:center;font-weight:900}.tabs{display:flex;gap:.5rem;flex-wrap:wrap}.tab,.choice{border:3px solid var(--plum);background:#fff;padding:.85rem 1rem;font-weight:900;color:var(--plum);cursor:pointer;box-shadow:4px 4px 0 #41243f22}.tab.on,.choice.selected{background:var(--turq)}.choice{text-align:left;font-size:1rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.sentence{font-size:clamp(1.35rem,2.4vw,2.7rem);background:#fff;border-left:12px solid var(--red);padding:1.1rem;box-shadow:8px 8px 0 #41243f22}.feedback{font-weight:900;color:var(--red);min-height:1.5em}.meter{height:20px;background:#d9c9c0;margin:1rem 0}.meter i{display:block;height:100%;width:30%;background:var(--turq);transition:.25s}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--red)}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--red);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#41243fef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff45}.progress i{height:100%;display:block;background:var(--yellow)}.note,.map{display:none;position:fixed;z-index:30;background:#41243ff5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.reveal{background:#fff;padding:1rem;border:3px dashed var(--red);cursor:pointer}.reveal .hidden{display:none}.reveal.open .hidden{display:block}@keyframes flip{from{opacity:0;transform:rotateX(8deg)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.grid,.grid2{grid-template-columns:1fr}.split{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="experience-v3.css">
</head><body><main id="deck"></main><div class="tools"><button id="mapBtn">TIME MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Then / Now','2 min. Open with the split image and ask what has changed.',`<img class="hero" src="${A}then-now-room.png" alt="Split-screen bedroom showing childhood objects and a modern teen desk"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 20 · grammar + speaking</div><h1>Then<br>/ Now</h1><p>Talk about old habits — and the habits that feel normal today.</p><span class="sticker">USED TO</span><span class="sticker">BE USED TO</span></div>`),
S('Check-in: one small “then”','4 min. Students may choose an imaginary example.',`<div class="stage"><h3>01 · check-in</h3><h2>What did you use to do?</h2><div class="polaroids"><button class="choice">play outside</button><button class="choice">collect something</button><button class="choice">watch a favourite show</button><button class="choice">visit family</button><button class="choice">invent my own</button></div><p class="feedback">Choose one and say: “I used to …”</p></div>`),
S('Bridge from Lesson 19','3 min. Contrast airport actions with repeated past routines.',`<div class="stage"><h3>02 · bridge</h3><div class="split"><div class="era then"><h3>One trip</h3><p>We waited at Gate 6 yesterday.</p></div><div class="era now"><h3>Old routine</h3><p>We used to wait for the bus every morning.</p></div></div><p>One past event is not the same as a repeated past habit.</p></div>`),
S('Picture warm-up: the neighborhood changes','5 min. Students notice details before naming grammar.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What changed? What stayed?</h2><img class="figure" src="${A}playground-then-now.png" alt="Illustrated neighborhood changing from an old playground to a modern community space"><p class="feedback">Use “There used to be …” for one detail.</p></div>`),
S('Today’s time capsule','1 min. Preview the lesson route.',`<div class="stage"><h3>04 · route</h3><h2>Open, compare, rebuild.</h2><div class="grid"><div class="polaroid"><strong>Open</strong><p>find old routines</p></div><div class="polaroid"><strong>Compare</strong><p>used to / be used to</p></div><div class="polaroid"><strong>Rebuild</strong><p>tell a then-now story</p></div></div></div>`),
S('Habit words','5 min. Students tap a word and mime or draw it.',`<div class="stage"><h3>05 · vocabulary</h3><h2>Fill the old photo album.</h2><div class="tabs" id="habits">${['ride a bike','play with dolls','walk to school','share a room','watch cartoons','write letters','visit grandparents','keep a diary'].map(x=>`<button class="tab" data-habit="${x}">${x}</button>`).join('')}</div><p id="habitOut" class="feedback">Tap a habit and put it in a sentence.</p></div>`),
S('Used to: the shape','5 min. Model affirmative, negative, and question forms.',`<div class="stage"><h3>06 · grammar discovery</h3><h2>Used to points backward.</h2><div class="sentence">I <b>used to</b> walk to school.<br>I <b>didn’t use to</b> take the bus.<br><b>Did</b> you <b>use to</b> share a room?</div><p>After did / didn’t, use <b>use</b>, not used.</p></div>`),
S('Meaning dial: finished habit','4 min. Turn the dial toward “past only.”',`<div class="stage"><h3>07 · meaning</h3><div class="dial"><span>past habit<br>not true now</span></div><p class="sentence">We used to play outside. Now we play online.</p></div>`),
S('Be used to: the different engine','5 min. Contrast grammar + noun/gerund.',`<div class="stage"><h3>08 · contrast</h3><div class="grid2"><div class="era then"><h3>Used to + base verb</h3><p>I used to wake up late.</p><p>Past habit.</p></div><div class="era now"><h3>Be used to + noun / -ing</h3><p>I am used to waking up early.</p><p>It feels normal now.</p></div></div></div>`),
S('Sort the time capsule','5 min. Students place each sentence in the correct pocket.',`<div class="stage"><h3>09 · sorting</h3><div class="grid2" id="sort"><button class="choice" data-kind="past">I used to draw comics.</button><button class="choice" data-kind="now">I am used to drawing on a tablet.</button><button class="choice" data-kind="past">She didn’t use to like tea.</button><button class="choice" data-kind="now">She is used to the taste now.</button></div><p id="sortOut" class="feedback">Choose a sentence and name its time meaning.</p></div>`),
S('Negative + question repair','4 min. Fix the tiny grammar hinges.',`<div class="stage"><h3>10 · repair shop</h3><div class="polaroids"><div class="polaroid"><p>Did you <b>used to</b> play?</p><button class="choice fix">Change to “use”</button></div><div class="polaroid"><p>I didn’t <b>used to</b> walk.</p><button class="choice fix">Change to “use”</button></div><div class="polaroid"><p>I am used to <b>walk</b>.</p><button class="choice fix">Change to “walking”</button></div></div><p id="fixOut" class="feedback">One small word changes the whole mechanism.</p></div>`),
S('Time expressions','4 min. Match expressions to a past habit or present routine.',`<div class="stage"><h3>11 · signal words</h3><div class="tabs"><span class="sticker">when I was younger</span><span class="sticker">as a child</span><span class="sticker">now</span><span class="sticker">these days</span><span class="sticker">at first</span></div><p>“When I was younger” often opens a used-to sentence. “Now / these days” often completes the contrast.</p></div>`),
S('Controlled choice','5 min. Students choose the form that fits the meaning.',`<div class="stage"><h3>12 · controlled practice</h3><h2>Choose the right engine.</h2><div class="grid" id="forms"><button class="choice">I used to live in a village.</button><button class="choice">I am used to living in a city.</button><button class="choice">Did you use to ride a bike?</button><button class="choice">I didn’t use to enjoy mornings.</button><button class="choice">She is used to the noise.</button><button class="choice">We used to share a room.</button></div><p class="feedback">Read each aloud; feel the difference in meaning.</p></div>`),
S('A short then-now reading','2 min. Predict the change before reading.',`<div class="stage"><h3>13 · reading preview</h3><h2>Meet Talia’s time capsule.</h2><div class="sentence">Talia used to live above a bakery. Now she is used to the quiet of a small house.</div><p>Which detail do you expect: noise, food, or transport?</p></div>`),
S('Text: Talia’s two mornings','6 min. Partner-read and underline past routines.',`<div class="stage"><h3>14 · close reading</h3><div class="sentence"><p>Talia used to wake up when the bakery downstairs opened. She used to smell warm bread and walk to school with her cousin. After moving, she didn’t use to enjoy the quiet. Now she is used to waking up later, and she is used to studying in her own room.</p></div><p>Circle two <b>used to</b> phrases. Box one <b>be used to</b> phrase.</p></div>`),
S('Reading check: old or normal now?','4 min. Click the line that supports each answer.',`<div class="stage"><h3>15 · evidence check</h3><div class="grid2" id="read"><button class="choice">Old routine: bakery opened</button><button class="choice">Old routine: walk with cousin</button><button class="choice">Normal now: own room</button><button class="choice">Normal now: waking later</button></div><p id="readOut" class="feedback">Point to the exact phrase in the text.</p></div>`),
S('Time-capsule image','4 min. Use the artwork to generate one past and one present sentence.',`<div class="stage"><h3>16 · visual language</h3><img class="figure" src="${A}time-capsule.png" alt="Illustrated open time capsule box with diary, photos, sneakers and a controller"><p class="feedback">Choose two objects: “I used to …” and “I am used to …”</p></div>`),
S('Sentence flipbook','5 min. Click a page to reveal the changed form.',`<div class="stage"><h3>17 · transformation</h3><div class="reveal" id="flip"><p><b>Past:</b> I used to play outside.</p><div class="hidden"><p><b>Now:</b> I am used to playing online.</p></div></div><div class="reveal"><p><b>Past:</b> She used to share a room.</p><div class="hidden"><p><b>Now:</b> She is used to having her own room.</p></div></div><p>Tap each page, then read both lines.</p></div>`),
S('Information gap: then / now cards','6 min. Partners describe a card without showing it.',`<div class="stage"><h3>18 · pair task</h3><h2>Can your partner rebuild the routine?</h2><div class="grid2"><div class="era then"><h3>Card A · then</h3><p>walk to school · share a room · play outside</p></div><div class="era now"><h3>Card B · now</h3><p>take the bus · own room · play online</p></div></div><p>Ask: “Did you use to …?” Answer: “Yes, I did / No, I didn’t.”</p></div>`),
S('Problem corner: new routine','5 min. Use be used to to describe an adjustment.',`<div class="stage"><h3>19 · speaking support</h3><div class="sentence">“I moved to a new school. I’m not used to <span class="sticker">speaking in front of groups</span> yet.”</div><div class="tabs"><span class="sticker">the noise</span><span class="sticker">the timetable</span><span class="sticker">meeting new people</span></div></div>`),
S('Then-now interview','7 min. Students interview a partner with safe or invented answers.',`<div class="stage"><h3>20 · interview</h3><div class="grid"><div class="polaroid"><strong>Then</strong><p>What did you use to do after school?</p></div><div class="polaroid"><strong>Change</strong><p>What changed?</p></div><div class="polaroid"><strong>Now</strong><p>What are you used to now?</p></div></div><p>Report one answer: “They used to … but now they are used to …”</p></div>`),
S('Build a time-capsule panel','7 min. Students make a two-column mini poster.',`<div class="stage"><h3>21 · production setup</h3><h2>Two snapshots, one story.</h2><div class="split"><div class="era then"><h3>Then</h3><p>Draw or write 2 old habits.</p></div><div class="era now"><h3>Now</h3><p>Add 2 current routines.</p></div></div><p>Connect them with one “but now …” sentence.</p></div>`),
S('Gallery swap','5 min. Partners leave one accurate follow-up question.',`<div class="stage"><h3>22 · response</h3><div class="polaroids"><div class="polaroid"><strong>Notice</strong><p>Find one used to sentence.</p></div><div class="polaroid"><strong>Ask</strong><p>“Are you used to it now?”</p></div><div class="polaroid"><strong>Encourage</strong><p>“That change is clear.”</p></div></div></div>`),
S('Review wheel','5 min. Spin by choosing a segment; answer aloud.',`<div class="stage"><h3>23 · review</h3><div class="dial"><span id="wheelText">choose a prompt</span></div><div class="tabs" id="wheel"><button class="tab" data-prompt="used to + verb">USED TO</button><button class="tab" data-prompt="be used to + -ing">BE USED TO</button><button class="tab" data-prompt="question with did">QUESTION</button></div><p id="wheelOut" class="feedback">Choose a segment, then make a true or invented sentence.</p></div>`),
S('Self-check meter','3 min. Students choose the statement that fits today.',`<div class="stage"><h3>24 · reflection</h3><h2>How steady is your time-capsule grammar?</h2><div class="meter"><i id="meter"></i></div><div class="tabs" id="levels"><button class="tab" data-level="30">I can spot the past habit</button><button class="tab" data-level="60">I can contrast the meanings</button><button class="tab" data-level="90">I can tell a then-now story</button></div><p id="levelOut" class="feedback">Choose honestly; this is a progress dial.</p></div>`),
S('Homework: a four-frame time capsule','2 min. Keep it personal, fictional, or about a character.',`<div class="stage"><h3>25 · homework</h3><div class="grid"><div class="polaroid"><strong>Frame 1</strong><p>“I used to …”</p></div><div class="polaroid"><strong>Frame 2</strong><p>“I didn’t use to …”</p></div><div class="polaroid"><strong>Frame 3</strong><p>“Now I am used to …”</p></div></div><p>Add one drawing or object from the time capsule.</p></div>`),
S('Exit ticket','2 min. Students finish one frame aloud or on paper. Preview Business English.',`<div class="stage"><h3>26 · exit ticket</h3><h2>Close the capsule with one sentence.</h2><div class="tabs" id="exit"><button class="tab">I used to …</button><button class="tab">I didn’t use to …</button><button class="tab">I am used to …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Business English Basics</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--turq)">Then / Now map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');habitOut.textContent=`${b.dataset.habit}: say “I used to ${b.dataset.habit}.”`});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{b.classList.add('selected');sortOut.textContent='Good — say whether it is a past habit or a current normal routine.'});document.querySelectorAll('.fix').forEach(b=>b.onclick=()=>fixOut.textContent='Repaired: Did you use to play? I didn’t use to walk. I am used to walking.');document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>b.classList.toggle('open'));document.querySelectorAll('#wheel [data-prompt]').forEach(b=>b.onclick=()=>wheelOut.textContent=`Prompt: ${b.dataset.prompt}. Make your own sentence.`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{meter.style.width=b.dataset.level+'%';levelOut.textContent='Now say one example aloud.'});document.querySelectorAll('#exit .tab').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Complete the frame for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #1f0e1e}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe3a0!important}</style><script src="experience-v3.js"></script>
</body></html>
