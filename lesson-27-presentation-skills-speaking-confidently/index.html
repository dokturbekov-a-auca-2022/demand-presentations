<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 27 — Stagecraft Studio</title><style>
:root{--violet:#30234d;--yellow:#f7d45d;--coral:#ef725d;--blue:#a9dce5;--cream:#fff6e4;--ink:#272131}*{box-sizing:border-box}body{margin:0;background:var(--violet);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:cue .35s both}.scene:before{content:'✦';position:absolute;right:4vw;bottom:7vh;font-size:8rem;color:var(--yellow);opacity:.14}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#30234de9,#30234da8 48%,#30234d20)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--yellow);background:#30234d9b}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--violet);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.cue{display:inline-block;background:var(--yellow);color:var(--violet);padding:.45rem .8rem;font-weight:900;margin:.2rem;transform:skew(-8deg)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.card{background:#fff;border:3px solid var(--violet);padding:1.1rem;min-height:8rem;box-shadow:7px 7px 0 #30234d22}.card:nth-child(2){background:var(--blue)}.card:nth-child(3){background:var(--yellow)}.choice{background:#fff;border:3px solid var(--violet);padding:.85rem 1rem;color:var(--violet);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #30234d22}.choice:hover,.choice.selected{background:var(--blue)}.speech{background:#fff;border-left:12px solid var(--coral);padding:1.2rem 1.5rem;font-size:clamp(1.3rem,2.2vw,2.2rem);box-shadow:8px 8px 0 #30234d22}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--blue)}.feedback{font-weight:900;color:var(--coral);min-height:1.5em}.meter{height:20px;background:#d7c9ce;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--coral);transition:.25s}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--violet)}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#30234def;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--yellow)}.note,.map{display:none;position:fixed;z-index:30;background:#30234df5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.reveal{display:inline-block;background:var(--blue);padding:1rem;cursor:pointer;min-width:12rem;text-align:center}.reveal .back{display:none}.reveal.open .front{display:none}.reveal.open .back{display:block}@keyframes cue{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.board,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">STAGE MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Stagecraft Studio','2 min. Open with the speaker image. Ask what makes a presentation feel confident.',`<img class="hero" src="${A}stage-speaker.png" alt="Illustrated teenager presenting on a stage with microphone cue cards and audience"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 27 · presentation skills</div><h1>Stagecraft<br>Studio</h1><p>Build a clear talk, use your voice, and connect with an audience.</p><span class="cue">PLAN</span><span class="cue">REHEARSE</span><span class="cue">CONNECT</span></div>`),
S('Check-in: your speaker strength','4 min. Students choose a real or imagined strength.',`<div class="stage"><h3>01 · check-in</h3><h2>What can you bring to a stage?</h2><div class="board" id="strength"><button class="card choice">a clear voice</button><button class="card choice">good ideas</button><button class="card choice">interesting stories</button><button class="card choice">calm breathing</button><button class="card choice">helpful visuals</button><button class="card choice">encouragement</button></div><p id="strengthOut" class="feedback">Choose one and explain how it helps.</p></div>`),
S('Bridge from Lesson 26','3 min. Connect small talk to opening a presentation.',`<div class="stage"><h3>02 · bridge</h3><div class="speech">“You’re ready to begin, aren’t you?”<br><br>Today we turn that friendly connection into a confident opening.</div></div>`),
S('Read the stage','5 min. Students predict useful presentation objects.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What helps a speaker feel prepared?</h2><img class="figure" src="${A}backstage-table.png" alt="Illustrated backstage rehearsal table with cue cards timer microphone and water"><p class="feedback">Name three objects and one reason for each.</p></div>`),
S('The rehearsal route','1 min. Preview the presentation arc.',`<div class="stage"><h3>04 · route</h3><div class="board"><div class="card"><b>Open</b><p>hook the room</p></div><div class="card"><b>Build</b><p>three clear points</p></div><div class="card"><b>Land</b><p>finish strongly</p></div></div></div>`),
S('The three-part talk','5 min. Students sort ideas into opening, body, closing.',`<div class="stage"><h3>05 · structure</h3><div class="board" id="parts"><button class="card choice">“Today I’ll show you …”</button><button class="card choice">“First … Next … Finally …”</button><button class="card choice">“So my main message is …”</button></div><p id="partsOut" class="feedback">Tap each line and name its job.</p></div>`),
S('Hook cards','5 min. Students choose a hook for a fictional topic.',`<div class="stage"><h3>06 · openings</h3><div class="board" id="hooks"><button class="card choice">a surprising question</button><button class="card choice">a quick story</button><button class="card choice">a bold fact</button><button class="card choice">a prop or image</button><button class="card choice">a clear promise</button><button class="card choice">a short pause</button></div><p id="hookOut" class="feedback">Choose a hook and write its first sentence.</p></div>`),
S('Signpost language','5 min. Students rehearse the language that guides listeners.',`<div class="stage"><h3>07 · signposts</h3><div class="speech">First, let’s look at …<br>Now, move to …<br>This matters because …<br>Finally, remember …</div></div>`),
S('Visuals that help','4 min. Compare a useful slide with a crowded slide.',`<div class="stage"><h3>08 · visual design</h3><div class="grid2"><div class="card"><b>Useful</b><p>one image · three words · large type</p></div><div class="card"><b>Crowded</b><p>tiny text · five colors · every detail</p></div></div></div>`),
S('Voice spotlight','5 min. Students practise volume, pace, and pause.',`<div class="stage"><h3>09 · voice</h3><div class="board"><div class="card"><b>Volume</b><p>reach the back wall</p></div><div class="card"><b>Pace</b><p>slow the key line</p></div><div class="card"><b>Pause</b><p>let the idea land</p></div></div></div>`),
S('Body language dial','4 min. Choose the body-language choice that supports a message.',`<div class="stage"><h3>10 · presence</h3><div class="grid2" id="body"><button class="choice">look up, then scan the room</button><button class="choice">read every word from the screen</button><button class="choice">stand balanced and breathe</button><button class="choice">hide behind the desk</button></div><p id="bodyOut" class="feedback">Choose the actions that connect with listeners.</p></div>`),
S('Rehearsal flip cards','5 min. Tap each card to reveal the rehearsal move.',`<div class="stage"><h3>11 · rehearsal</h3><div class="board"><button class="reveal"><span class="front">1 · practise</span><span class="back">out loud, not only in your head</span></button><button class="reveal"><span class="front">2 · time</span><span class="back">keep the opening short</span></button><button class="reveal"><span class="front">3 · mark</span><span class="back">circle the key words</span></button></div></div>`),
S('Question handling','5 min. Practise a calm answer when you need time.',`<div class="stage"><h3>12 · audience questions</h3><div class="speech">“That’s an interesting question. Let me think.”<br>“I’m not sure yet, but I would check …”<br>“Could you repeat the question, please?”</div></div>`),
S('Common presentation traps','4 min. Repair three habits that hide a good idea.',`<div class="stage"><h3>13 · repair</h3><div class="board"><div class="card"><b>Too much text</b><p>turn it into a keyword</p></div><div class="card"><b>No signposts</b><p>add first / next / finally</p></div><div class="card"><b>Rushed ending</b><p>write the last line</p></div></div></div>`),
S('Read the rehearsal note','2 min. Predict which advice matters most.',`<div class="stage"><h3>14 · reading preview</h3><div class="speech">“Maya has strong ideas, but she speaks too quickly when she feels nervous.”</div><p>Which rehearsal move could help first?</p></div>`),
S('Text: Maya’s two rehearsals','6 min. Partner-read and underline changes.',`<div class="stage"><h3>15 · close reading</h3><div class="speech"><p>In her first rehearsal, Maya put every idea on one slide and rushed through the opening. Her partner suggested three keywords, one picture, and a pause after the hook. In the second rehearsal, Maya looked up more often and finished with a clear message. The talk felt shorter, but the audience remembered more.</p></div><p>Circle the problem. Box the changes. Star the result.</p></div>`),
S('Reading check','4 min. Click the detail that shows improvement.',`<div class="stage"><h3>16 · evidence</h3><div class="grid2" id="read"><button class="choice">three keywords</button><button class="choice">one picture</button><button class="choice">a pause after the hook</button><button class="choice">a clear final message</button></div><p id="readOut" class="feedback">Choose the details that changed the rehearsal.</p></div>`),
S('Spotlight arcs','4 min. Use the image to practise where to look and pause.',`<div class="stage"><h3>17 · visual language</h3><img class="figure" src="${A}spotlight-arcs.png" alt="Illustrated stage floor with spotlight arcs and audience feedback symbols"><p class="feedback">Point to three audience zones: left, centre, right.</p></div>`),
S('Information gap: talk cards','6 min. Partner A has a topic; Partner B has an audience. Adapt the opening.',`<div class="stage"><h3>18 · pair task</h3><div class="grid2"><div class="speech"><b>Topic</b><br>How to make a school day calmer</div><div class="speech"><b>Audience</b><br>new students · 30 seconds</div></div><p>Choose a hook and make a promise for this audience.</p></div>`),
S('Feedback language','5 min. Practise feedback that is specific and kind.',`<div class="stage"><h3>19 · peer language</h3><div class="board"><div class="card"><b>I noticed …</b><p>name a clear strength</p></div><div class="card"><b>It would be stronger if …</b><p>offer one useful change</p></div><div class="card"><b>My question is …</b><p>invite reflection</p></div></div></div>`),
S('Rehearsal carousel','6 min. Rotate through hook, body, and closing stations.',`<div class="stage"><h3>20 · speaking circuit</h3><div class="board"><div class="card"><b>Station 1</b><p>deliver the hook</p></div><div class="card"><b>Station 2</b><p>use a signpost</p></div><div class="card"><b>Station 3</b><p>land the ending</p></div></div></div>`),
S('Build your mini-talk','7 min. Students prepare a one-minute presentation.',`<div class="stage"><h3>21 · production setup</h3><div class="board"><div class="card"><b>Topic</b><p>one clear idea</p></div><div class="card"><b>Visual</b><p>one image or object</p></div><div class="card"><b>Ending</b><p>one memorable line</p></div></div></div>`),
S('Present with a spotlight','7 min. Students deliver, then answer one audience question.',`<div class="stage"><h3>22 · production</h3><div class="speech">Open with a hook. Guide us with signposts. Pause on the main message. Finish with confidence.</div><p>Listeners write one phrase they remember.</p></div>`),
S('Peer director’s notes','5 min. Use three checks after each talk.',`<div class="stage"><h3>23 · feedback</h3><div class="board"><div class="card"><b>Clear</b><p>I knew the main message.</p></div><div class="card"><b>Connected</b><p>The speaker looked up.</p></div><div class="card"><b>Memorable</b><p>I remember one phrase.</p></div></div></div>`),
S('Final stage quiz','5 min. Teams choose the strongest presentation move.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">use three keywords on a slide</button><button class="choice">read every sentence from the screen</button><button class="choice">pause before the key message</button><button class="choice">finish without a conclusion</button></div><p id="quizOut" class="feedback">Choose the moves that help an audience follow.</p></div>`),
S('One-minute spotlight','2 min. Students speak under a short timer.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START SPOTLIGHT</button><p>Deliver a hook, two points, and a final message.</p></div>`),
S('Homework: speaker’s cue sheet','2 min. Students prepare a short talk with a visual.',`<div class="stage"><h3>26 · homework</h3><div class="board"><div class="card"><b>Write</b><p>hook + three keywords</p></div><div class="card"><b>Mark</b><p>one pause + one gesture</p></div><div class="card"><b>Rehearse</b><p>time it twice</p></div></div></div>`),
S('Exit ticket','2 min. Students finish one speaker line. Preview Linking Words.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Take one cue off the stage.</h2><div class="board" id="exit"><button class="card choice">My strongest speaking move is …</button><button class="card choice">One thing I will rehearse is …</button><button class="card choice">One phrase I want listeners to remember is …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Linking Words · Giving Opinions</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--yellow)">Stagecraft Studio map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('#strength .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');strengthOut.textContent='Now explain how that strength helps a speaker.'});document.querySelectorAll('#parts .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');partsOut.textContent='Name its job: opening, body, or closing.'});document.querySelectorAll('#hooks .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');hookOut.textContent='Write the first sentence for your hook.'});document.querySelectorAll('#body .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');bodyOut.textContent='Choose the actions that connect with listeners.'});document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>b.classList.toggle('open'));document.querySelectorAll('#read .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');readOut.textContent='Evidence selected — point to the reading.'});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Keep the moves that help the audience follow.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');exitOut.textContent='Complete the speaker line for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #1b102c}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe0a0!important}</style></body></html>
