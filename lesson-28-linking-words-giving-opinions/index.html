<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 28 — Opinion Loom</title><style>
:root{--indigo:#26345f;--coral:#e9685e;--mustard:#e9bf53;--mint:#a8d9c8;--cream:#fff7e5;--ink:#262a36}*{box-sizing:border-box}body{margin:0;background:var(--indigo);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:weave .35s both}.scene:before{content:'✣';position:absolute;right:4vw;bottom:7vh;color:var(--coral);font-size:8rem;opacity:.13}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#26345fe9,#26345fa5 48%,#26345f20)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--mustard);background:#26345f9b}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font:900 .78rem 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--indigo);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.thread{display:inline-block;background:var(--mint);color:var(--indigo);padding:.45rem .8rem;font-weight:900;margin:.2rem;transform:rotate(-3deg)}.weave{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.patch{background:#fff;border:3px solid var(--indigo);padding:1.1rem;min-height:8rem;box-shadow:7px 7px 0 #26345f22;position:relative}.patch:nth-child(2){background:var(--mint)}.patch:nth-child(3){background:var(--mustard)}.patch:after{content:'⌁';position:absolute;right:.6rem;top:.4rem;color:var(--coral);font-size:2rem}.choice{background:#fff;border:3px solid var(--indigo);padding:.85rem 1rem;color:var(--indigo);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #26345f22}.choice:hover,.choice.selected{background:var(--mint)}.sentence{background:#fff;border-left:12px solid var(--coral);padding:1.2rem 1.5rem;font-size:clamp(1.3rem,2.2vw,2.2rem);box-shadow:8px 8px 0 #26345f22}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--mustard)}.feedback{font-weight:900;color:var(--coral);min-height:1.5em}.tokens{display:flex;flex-wrap:wrap;gap:.65rem}.token{background:var(--indigo);color:#fff;border:0;padding:.8rem 1rem;font-weight:900;cursor:pointer}.token.on{background:var(--coral)}.meter{height:20px;background:#d8cebd;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--coral);transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#26345fef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--mustard)}.note,.map{display:none;position:fixed;z-index:30;background:#26345ff5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--indigo)}@keyframes weave{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.weave,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">LOOM MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Opinion Loom','2 min. Open with the weaving image. Ask how separate ideas become one clear opinion.',`<img class="hero" src="${A}loom-team.png" alt="Illustrated teens weaving a large tapestry of ideas with colorful ribbons"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 28 · linking words</div><h1>Opinion<br>Loom</h1><p>Connect ideas, balance opinions, and make your meaning stronger.</p><span class="thread">BECAUSE</span><span class="thread">HOWEVER</span><span class="thread">SO</span></div>`),
S('Check-in: one opinion thread','4 min. Students choose a safe or imaginary topic.',`<div class="stage"><h3>01 · check-in</h3><h2>What do you have an opinion about?</h2><div class="tokens" id="topics">${['school uniforms','music','weekends','sport','pets','a topic I invent'].map(x=>`<button class="token" data-topic="${x}">${x}</button>`).join('')}</div><p id="topicOut" class="feedback">Choose one and finish: “I think …”</p></div>`),
S('Bridge from Lesson 27','3 min. Connect presentation structure to linking ideas.',`<div class="stage"><h3>02 · bridge</h3><div class="sentence">My idea is clear <b>because</b> my points are connected.</div><p>Today we add the threads that show reason, contrast, result, and example.</p></div>`),
S('Read the patchwork table','5 min. Students predict which words connect the strips.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>Which thread would join these ideas?</h2><img class="figure" src="${A}patchwork-table.png" alt="Illustrated patchwork table with fabric strips thread spools scissors speech bubbles and opinion cards"><p class="feedback">Point to a thread and name its job.</p></div>`),
S('Today’s weave','1 min. Preview the linking-word route.',`<div class="stage"><h3>04 · route</h3><div class="weave"><div class="patch"><b>Reason</b><p>because</p></div><div class="patch"><b>Contrast</b><p>but / however</p></div><div class="patch"><b>Result</b><p>so / therefore</p></div></div></div>`),
S('Reason thread','5 min. Join an opinion to its reason.',`<div class="stage"><h3>05 · because</h3><div class="sentence">I like school clubs <b>because</b> I meet new people.</div><div class="tokens" id="reason">${['because','since','as'].map(x=>`<button class="token" data-reason="${x}">${x}</button>`).join('')}</div><p id="reasonOut" class="feedback">Choose a reason thread and complete the sentence.</p></div>`),
S('Contrast thread','5 min. Notice the turn in the sentence.',`<div class="stage"><h3>06 · contrast</h3><div class="grid2"><div class="sentence">I like the idea, <b>but</b> it is expensive.</div><div class="sentence">I like the idea. <b>However</b>, it is expensive.</div></div><p>Contrast threads show two ideas that do not fully match.</p></div>`),
S('Result thread','4 min. Build a cause → result sentence.',`<div class="stage"><h3>07 · result</h3><div class="sentence">The bus was late, <b>so</b> we walked.</div><div class="tokens"><span class="thread">therefore</span><span class="thread">as a result</span><span class="thread">so</span></div></div>`),
S('Example thread','4 min. Add a specific example to a broad opinion.',`<div class="stage"><h3>08 · examples</h3><div class="sentence">I enjoy outdoor hobbies, <b>for example</b>, cycling and hiking.</div><p>Use “for example” to make an opinion concrete.</p></div>`),
S('Choose the thread','5 min. Students select the connector that fits the relationship.',`<div class="stage"><h3>09 · choice</h3><div class="grid2" id="choose"><button class="choice">I was tired, ___ I finished. (but)</button><button class="choice">I stayed home ___ it rained. (because)</button><button class="choice">The shop was closed, ___ we returned. (so)</button><button class="choice">I like fruit, ___ apples. (for example)</button></div><p id="chooseOut" class="feedback">Name the relationship: reason, contrast, result, example.</p></div>`),
S('Punctuation knots','4 min. Untangle commas and full stops.',`<div class="stage"><h3>10 · punctuation</h3><div class="sentence">I like the plan, <b>but</b> it needs more time.<br><br>I like the plan. <b>However</b>, it needs more time.</div><p>Short connectors often join with a comma. However can start a new sentence.</p></div>`),
S('Balanced opinion frame','5 min. Students build an opinion with two sides.',`<div class="stage"><h3>11 · balance</h3><div class="sentence">On the one hand, ___ . On the other hand, ___ .</div><p>Use this frame when a topic has more than one reasonable view.</p></div>`),
S('Common linking mistakes','4 min. Repair missing or repeated connectors.',`<div class="stage"><h3>12 · repair</h3><div class="weave"><div class="patch"><b>✗</b><p>Because I was late, so I ran.</p></div><div class="patch"><b>✓</b><p>Because I was late, I ran.</p></div><div class="patch"><b>✓</b><p>I was late, so I ran.</p></div></div></div>`),
S('Read the opinion patch','2 min. Predict the writer’s position.',`<div class="stage"><h3>13 · reading preview</h3><div class="sentence">“School clubs should be longer; however, students also need free time.”</div><p>Which side does the writer include? Find the contrast thread.</p></div>`),
S('Text: One More Hour?','6 min. Partner-read and highlight the connector jobs.',`<div class="stage"><h3>14 · close reading</h3><div class="sentence"><p>Some students want clubs to last longer because they enjoy practising together. However, a longer club can make the day tiring. For example, students who travel far need time to get home. A good plan could add one extra session each month, so students get more practice without losing every afternoon.</p></div><p>Circle reason, contrast, example, and result threads.</p></div>`),
S('Reading check','4 min. Click the line that matches each relationship.',`<div class="stage"><h3>15 · evidence</h3><div class="grid2" id="read"><button class="choice">because they enjoy practising</button><button class="choice">However, a longer club …</button><button class="choice">For example, students …</button><button class="choice">so students get more practice</button></div><p id="readOut" class="feedback">Name the job of the thread you chose.</p></div>`),
S('Finished tapestry','4 min. Use the image to compare two viewpoints.',`<div class="stage"><h3>16 · visual language</h3><img class="figure" src="${A}opinion-tapestry.png" alt="Finished wall tapestry made from connected viewpoint panels and arrows"><p class="feedback">Join two panels with however, because, or so.</p></div>`),
S('Information gap: opinion cards','6 min. Partners connect two different cards into one sentence.',`<div class="stage"><h3>17 · pair task</h3><div class="grid2"><div class="sentence"><b>Card A:</b> Homework helps practice.</div><div class="sentence"><b>Card B:</b> Too much homework feels stressful.</div></div><p>Use: “On the one hand … On the other hand …”</p></div>`),
S('Thread the evidence','5 min. Students choose an example that makes a claim stronger.',`<div class="stage"><h3>18 · support</h3><div class="grid2" id="support"><button class="choice">Claim: parks are useful.<br>Example: people can exercise there.</button><button class="choice">Claim: parks are useful.<br>Example: I like blue.</button></div><p id="supportOut" class="feedback">Choose the example that actually supports the claim.</p></div>`),
S('Opinion circle','6 min. Students share an opinion, then add a connector.',`<div class="stage"><h3>19 · speaking</h3><div class="weave"><div class="patch"><b>Say</b><p>your opinion</p></div><div class="patch"><b>Thread</b><p>because / however / so</p></div><div class="patch"><b>Extend</b><p>one detail</p></div></div></div>`),
S('Build a viewpoint tapestry','7 min. Students create a four-panel opinion poster.',`<div class="stage"><h3>20 · production setup</h3><div class="weave"><div class="patch"><b>Claim</b><p>I think …</p></div><div class="patch"><b>Reason</b><p>because …</p></div><div class="patch"><b>Contrast</b><p>however …</p></div><div class="patch"><b>Result</b><p>so …</p></div></div></div>`),
S('Present the woven opinion','7 min. Students present a 60-second balanced view.',`<div class="stage"><h3>21 · production</h3><div class="sentence">Aim for: one claim, one reason, one contrast, one example, one result.</div><p>Listeners point to the thread they hear.</p></div>`),
S('Peer weaver notes','5 min. Use three checks for feedback.',`<div class="stage"><h3>22 · feedback</h3><div class="weave"><div class="patch"><b>Connected</b><p>I heard clear links.</p></div><div class="patch"><b>Balanced</b><p>I heard another side.</p></div><div class="patch"><b>Specific</b><p>I heard an example.</p></div></div></div>`),
S('Review: knot quiz','5 min. Teams choose the best connector.',`<div class="stage"><h3>23 · review</h3><div class="grid2" id="quiz"><button class="choice">I stayed home ___ it rained. (because)</button><button class="choice">I was tired; ___, I finished. (however)</button><button class="choice">The road was closed, ___ we turned back. (so)</button><button class="choice">I like fruit, ___ apples. (for example)</button></div><p id="quizOut" class="feedback">Choose four accurate threads.</p></div>`),
S('One-minute opinion sprint','2 min. Students speak under a short timer.',`<div class="stage"><h3>24 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START WEAVE</button><p>Connect five ideas with at least three linking words.</p></div>`),
S('Self-check meter','3 min. Students choose a confidence level.',`<div class="stage"><h3>25 · reflection</h3><div class="meter"><i id="meter"></i></div><div class="tokens" id="levels"><button class="token" data-level="30">I can spot links</button><button class="token" data-level="60">I can choose links</button><button class="token" data-level="90">I can weave a viewpoint</button></div><p id="levelOut" class="feedback">Choose honestly, then name one connector.</p></div>`),
S('Homework: opinion patch','2 min. Students make a short written or recorded viewpoint.',`<div class="stage"><h3>26 · homework</h3><div class="weave"><div class="patch"><b>Claim</b><p>one opinion</p></div><div class="patch"><b>Threads</b><p>because + however + so</p></div><div class="patch"><b>Example</b><p>one specific detail</p></div></div></div>`),
S('Exit ticket','2 min. Students complete one connector frame. Preview Final Speaking Project.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Tie one final knot.</h2><div class="tokens" id="exit"><button class="token">I think … because …</button><button class="token">I agree; however, …</button><button class="token">For example, … so …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Final Speaking Project</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--mustard)">Opinion Loom map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{b.classList.add('on');topicOut.textContent=`Your thread: I think ${b.dataset.topic} …`});document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{b.classList.add('on');reasonOut.textContent=`Use ${b.dataset.reason} to add your reason.`});document.querySelectorAll('#choose .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');chooseOut.textContent='Name the relationship: reason, contrast, result, or example.'});document.querySelectorAll('#read .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');readOut.textContent='Thread selected — explain its job.'});document.querySelectorAll('#support .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');supportOut.textContent='Choose evidence that makes the claim clearer.'});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Good — the connector matches the relationship.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{meter.style.width=b.dataset.level+'%';levelOut.textContent='Now say one sentence with a linking word.'});document.querySelectorAll('#exit .token').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Complete the connector frame for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #07102c}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe2a0!important}</style></body></html>
