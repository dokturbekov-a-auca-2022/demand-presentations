<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 16 — Reported Speech</title><style>
:root{--violet:#291451;--lav:#c6afff;--cream:#fff8e9;--peach:#ff967b;--lemon:#ffe562;--teal:#40cdbb;--ink:#241846;--white:#fffdf8;--shade:#2914512b}*{box-sizing:border-box}body{margin:0;background:var(--violet);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.deck{height:100vh}.scene{display:none;min-height:100%;padding:5.2vh 8vw 9vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:enter .42s both}.scene:before{content:'';position:absolute;width:40vmin;height:40vmin;border-radius:50%;background:var(--lav);opacity:.24;top:-17vmin;right:-13vmin}.scene:after{content:'';position:absolute;width:27vmin;height:27vmin;border-radius:50%;background:var(--lemon);opacity:.28;bottom:-14vmin;left:-10vmin}h1,h2,h3,p,div{position:relative;z-index:1}h1{font-family:Georgia,serif;font-size:clamp(3.6rem,7vw,8.2rem);line-height:.86;margin:.1em 0}h2{font-family:Georgia,serif;font-size:clamp(2.1rem,3.8vw,4.4rem);line-height:.98;margin:.15em 0 .45em}h3{font-size:clamp(.9rem,1.35vw,1.25rem);text-transform:uppercase;letter-spacing:.1em;color:#8f55d6;margin:.3rem 0}.eyebrow,.tag{font-weight:900;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:#8f55d6}.lead,p{font-size:clamp(1rem,1.45vw,1.55rem);line-height:1.42;max-width:72ch}.grid{display:grid;gap:1.1rem;position:relative;z-index:1}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--white);border:2px solid #29145117;border-radius:21px;padding:1.3rem;box-shadow:7px 8px 0 var(--shade)}.card p{font-size:1rem;margin:.35rem 0}.paper{background:#fffdf6;border:2px solid #29145122;padding:1.45rem;border-radius:5px;box-shadow:0 14px 28px var(--shade);transform:rotate(-.35deg)}.quote{font-family:Georgia,serif;font-size:clamp(1.4rem,2.6vw,3rem);font-style:italic;line-height:1.14}.hero{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;z-index:0}.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#291451 0%,#291451eb 39%,#29145155 70%,#29145112 100%)}.titleCopy{position:relative;z-index:2;color:var(--cream);padding-top:9vh;max-width:49rem}.titleCopy h1,.titleCopy p{color:var(--cream)}.titleCopy h3{color:var(--lemon)}.tag{display:inline-block;background:#fff2bf;padding:.55em .75em;border-radius:99px;margin:.2em}.button,button{font:800 1rem Arial,sans-serif;border:0;border-radius:999px;padding:.78rem 1.1rem;background:#8f55d6;color:#fff;cursor:pointer;box-shadow:0 4px 0 #5d338d;transition:.16s transform}.button:hover,button:hover{transform:translateY(-2px)}button:focus{outline:4px solid var(--lemon);outline-offset:3px}.choice{width:100%;text-align:left;background:var(--white);color:var(--ink);box-shadow:0 4px 0 #2914511c;border:2px solid #29145118}.choice.selected,.choice.good{background:#d8fff7}.choice.bad{background:#ffd8cf}.nav{position:fixed;z-index:20;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.65rem;background:#291451ec;padding:.48rem .75rem;border-radius:999px;color:white;font:bold .8rem Arial,sans-serif}.nav button{padding:.52rem .85rem;box-shadow:none;background:var(--peach)}.count{min-width:4.8rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff3b;border-radius:50px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lemon)}.tools{position:fixed;z-index:20;right:1.2rem;top:1.1rem;display:flex;gap:.45rem}.tools button{box-shadow:none;background:var(--violet);padding:.55rem .7rem}.note,.map{display:none;position:fixed;z-index:40;top:4.7rem;right:1.2rem;max-width:min(31rem,91vw);background:#291451f5;color:var(--cream);border-radius:18px;padding:1.25rem;font:1rem/1.45 Arial,sans-serif}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);top:10vh;width:min(760px,92vw)}.map button{box-shadow:none;background:#ffffff1a;margin:.2rem;font-size:.8rem}.reveal{cursor:pointer}.reveal .answer{display:none;border-top:1px dashed #29145142;margin-top:.75rem;padding-top:.75rem}.reveal.open .answer{display:block}.arrow{font:900 clamp(2.5rem,5vw,5rem) Georgia,serif;color:var(--peach);text-align:center}.formula{font:900 clamp(1.3rem,2.2vw,2.35rem) Arial,sans-serif;background:var(--violet);color:var(--cream);padding:1rem 1.4rem;border-radius:18px;display:inline-block}.before{background:#f1e8ff;border-left:8px solid #8f55d6}.after{background:#d8fff7;border-left:8px solid var(--teal)}.word{font-size:1.35rem;font-weight:900;color:#8f55d6}.sentence{font:700 clamp(1.25rem,2vw,2.2rem)/1.3 Arial,sans-serif}.lane{display:flex;gap:1rem;align-items:stretch;position:relative;z-index:1}.lane>div{flex:1}.say{background:#ede4ff;border:3px solid var(--lav);border-radius:20px;padding:1.3rem}.tell{background:#d9fff8;border:3px solid var(--teal);border-radius:20px;padding:1.3rem}.imagePanel{width:100%;max-height:43vh;object-fit:cover;border:6px solid #fffdf8;border-radius:23px;box-shadow:0 16px 28px var(--shade)}.timer{font:900 clamp(4rem,9vw,8.5rem) Arial,sans-serif;text-align:center;color:#8f55d6;margin:.08em}.center{text-align:center}.stamp{display:inline-block;border:2px solid #8f55d6;color:#8f55d6;padding:.42em .62em;font:bold .8rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-3deg);margin:.25em}.footer{position:absolute;left:8vw;right:8vw;bottom:5.4rem;border-top:2px dashed #29145135;z-index:2}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.1rem 1.15rem 6.7rem}.two,.three,.four{grid-template-columns:1fr}.lane{flex-direction:column}.tools{top:.55rem;right:.55rem}.nav{bottom:.6rem}.imagePanel{max-height:28vh}.footer{left:1.2rem;right:1.2rem;bottom:4.7rem}.veil{background:linear-gradient(90deg,#291451e9,#29145175)}h1{font-size:3.6rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><style>button.card{color:var(--ink)}</style><link rel="stylesheet" href="experience-v3.css">
</head><body><main id="deck" class="deck"></main><div class="tools"><button id="menu">Map</button><button id="notesBtn">Notes</button></div><div id="note" class="note"></div><div id="map" class="map"></div><nav class="nav"><button id="prev" aria-label="Previous scene">←</button><span class="count" id="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next scene">→</button></nav><script>
const scenes=[
{t:'Whisper Lab',n:'2 min. Say that today is about retelling messages accurately and kindly, not spreading private information.',b:`<img class="hero" src="assets/whisper-lab-hero.png" alt="Teenagers in a colourful workshop passing a glowing message between speech bubbles and notes"><div class="veil"></div><div class="titleCopy"><h3>Lesson 16 · reported speech</h3><h1>Whisper<br>Lab</h1><p>How do messages change when we pass them on?</p><span class="tag">Listen</span><span class="tag">Retell</span><span class="tag">Check</span></div>`},
{t:'Check in: how do you share news?',n:'4 min. Students may choose a fictional answer. Ask them to give one reason to a partner.',b:`<h3>01 · check-in</h3><h2>When you hear news, what do you usually do first?</h2><div class="grid four" id="moodGrid">${['tell a friend','ask a question','check if it is true','keep it private','post it online','wait and listen','write it down','something else'].map(x=>`<button class="choice" data-choice="${x}">${x}</button>`).join('')}</div><p id="moodResult" class="word">Choose one, then add: “because…”</p>`},
{t:'Bridge: ideas can travel',n:'3 min. Connect to the previous lesson only if appropriate. Elicit a respectful response phrase.',b:`<h3>02 · warm bridge</h3><h2>Last lesson: we challenged ideas with respect.</h2><div class="paper"><p class="quote">Today: we pass on someone else’s words with care.</p><p>Useful reminder: <b>“I heard that…, but I’m not sure if it’s true.”</b></p></div>`},
{t:'What changed?',n:'4 min. Pairs compare the original and the retold version. Do not explain grammar yet; let them notice.',b:`<h3>03 · notice the message</h3><h2>Read both. What is different?</h2><div class="grid two"><div class="card before"><h3>Direct speech</h3><p class="sentence">Mira said, “I am tired.”</p></div><div class="card after"><h3>Reported speech</h3><p class="sentence">Mira said <b>that she was tired.</b></p></div></div><p class="word">Look for: quotation marks · pronoun · verb</p>`},
{t:'Today’s mission',n:'1 min. Read the goals. Emphasise that perfect grammar helps listeners understand the real message.',b:`<h3>04 · objectives</h3><h2>By the end, you can…</h2><div class="grid three"><div class="card"><p class="word">01</p><p>change direct speech into reported speech</p></div><div class="card"><p class="word">02</p><p>use <b>say</b> and <b>tell</b> accurately</p></div><div class="card"><p class="word">03</p><p>retell information responsibly</p></div></div>`},
{t:'Communication vocabulary',n:'5 min. Students tap each card, repeat the word, then make a short example.',b:`<h3>05 · discover words</h3><h2>Tap → reveal → make an example</h2><div class="grid three">${[['rumour','a story people share that may not be true'],['source','the person or place information comes from'],['private','not for everyone to know'],['misunderstand','understand something wrongly'],['clarify','make something clearer'],['pass on','give information to another person']].map(([w,d])=>`<button class="card reveal"><span class="word">${w}</span><div class="answer">${d}<br><br><i>Example: “Can you clarify that?”</i></div></button>`).join('')}</div>`},
{t:'Safe to share?',n:'5 min. Students click a card and explain their decision. Stress that context matters; asking first is often best.',b:`<h3>06 · communication compass</h3><h2>Share, check, or keep private?</h2><div class="grid three" id="sortGrid">${['a friend’s surprise party','a school timetable change','someone’s personal problem','a teacher’s homework reminder','a funny story about yourself','a rumour with no source'].map(x=>`<button class="choice sort" data-item="${x}">${x}</button>`).join('')}</div><p id="sortResult" class="word">Choose one. Say: “I would share / check / keep it private because…”</p>`},
{t:'The basic pattern',n:'4 min. Use colour/gesture: speaker → reporting verb → message. Students repeat both examples.',b:`<h3>07 · grammar focus</h3><h2>We report the idea, not every exact word.</h2><div class="formula">subject + said / told + (that) + reported message</div><div class="grid two"><div class="card"><p class="sentence">Leo said, “I like chess.”</p><p class="arrow">↓</p><p class="sentence">Leo said <b>(that) he liked chess.</b></p></div><div class="card"><p class="sentence">My teacher told us, “The test is on Friday.”</p><p class="arrow">↓</p><p class="sentence">My teacher told us <b>(that) the test was on Friday.</b></p></div></div>`},
{t:'A message changes shape',n:'5 min. Elicit that the reporting happened later. Do not present this as a magic rule; time matters.',b:`<h3>08 · tense shift</h3><h2>Often, the verb moves one step back.</h2><div class="grid four"><div class="card"><span class="stamp">am / is</span><p class="word">was</p></div><div class="card"><span class="stamp">are</span><p class="word">were</p></div><div class="card"><span class="stamp">will</span><p class="word">would</p></div><div class="card"><span class="stamp">can</span><p class="word">could</p></div></div><p class="small">If the information is still true now, we sometimes keep the present tense: “She said she <b>lives</b> in Bishkek.”</p>`},
{t:'Pronouns: who is “I”?',n:'4 min. Ask learners to point to the original speaker and listener. Click to reveal the answer.',b:`<h3>09 · point of view</h3><h2>Change the pronoun to match the new speaker.</h2><div class="grid two">${[['Aruzhan said, “I have my keys.”','Aruzhan said that <b>she</b> had her keys.'],['I told Daniyar, “You are early.”','I told Daniyar that <b>he</b> was early.'],['They said, “We are ready.”','They said that <b>they</b> were ready.'],['Daniyar told me, “I can help you.”','Daniyar told me that <b>he</b> could help <b>me</b>.']].map(([q,a])=>`<button class="card reveal"><p class="sentence">${q}</p><div class="answer">${a}</div></button>`).join('')}</div>`},
{t:'Time and place move too',n:'4 min. Say the direct sentence first, then pretend it happened yesterday. Students complete the matching orally.',b:`<h3>10 · move the context</h3><h2>Some small words move with the message.</h2><div class="grid four"><div class="card"><h3>today</h3><p class="word">that day</p></div><div class="card"><h3>tomorrow</h3><p class="word">the next day</p></div><div class="card"><h3>now</h3><p class="word">then</p></div><div class="card"><h3>here</h3><p class="word">there</p></div></div>`},
{t:'Say or tell?',n:'4 min. Use the person rule. Have students repeat the two examples with a rhythm.',b:`<h3>11 · reporting verbs</h3><h2>Choose the road that fits.</h2><div class="lane"><div class="say"><h2>say</h2><p class="sentence">say + (that) + message</p><p>“He said that he was busy.”</p><p class="small">Not: “He said me…”</p></div><div class="tell"><h2>tell</h2><p class="sentence">tell + person + (that) + message</p><p>“He told <b>me</b> that he was busy.”</p><p class="small">Not: “He told that…”</p></div></div>`},
{t:'Choose the correct route',n:'4 min. Students answer alone, then compare. The feedback gives a short explanation.',b:`<h3>12 · say / tell check</h3><h2>Which sentence is correct?</h2><div class="grid three" id="sayTell"><button class="choice" data-answer="bad">She said me that she was late.</button><button class="choice" data-answer="good">She told me that she was late.</button><button class="choice" data-answer="bad">She told that she was late.</button></div><p id="sayTellResult" class="word">Choose the correct message.</p>`},
{t:'Reported questions',n:'5 min. Keep it simple: question word + subject + verb. No question mark inside the reported part.',b:`<h3>13 · bonus: questions</h3><h2>Questions become a calm sentence order.</h2><div class="grid two"><div class="card before"><p class="sentence">Nura asked, “Where do you live?”</p></div><div class="card after"><p class="sentence">Nura asked <b>where I lived.</b></p></div></div><div class="paper"><p><b>Yes / no questions:</b> “Are you ready?” → He asked <b>if I was ready.</b></p></div>`},
{t:'Fix the message',n:'5 min. Pairs repair each sentence before tapping. Ask them to name the rule they used.',b:`<h3>14 · repair shop</h3><h2>Tap after you fix it.</h2><div class="grid two">${[['Sam said me that he was hungry.','Sam <b>told me</b> that he was hungry.'],['Mira said that I am tired.','Mira said that she <b>was</b> tired.'],['He asked where did I go.','He asked where I <b>went</b>.'],['They told that they would come.','They <b>said</b> that they would come.']].map(([q,a])=>`<button class="card reveal"><p class="sentence">${q}</p><div class="answer">${a}</div></button>`).join('')}</div>`},
{t:'Build the report',n:'5 min. Students take one part from each column and say the full report. Click a row to reveal a model answer.',b:`<h3>15 · sentence builder</h3><h2>Turn the quote into a report.</h2><div class="grid three"><div class="card"><h3>Original</h3><p>“I will call you tomorrow.”</p></div><div class="card"><h3>Reporter</h3><p>Aibek said…</p></div><button class="card reveal"><h3>Your report</h3><p>Say it first.</p><div class="answer"><b>Aibek said that he would call me the next day.</b></div></button></div>`},
{t:'The message relay',n:'5 min. Teacher reads the small story twice: first for the topic; second for details. Learners must not repeat private details in real life.',b:`<h3>16 · reading / listening</h3><h2>Can the group keep the message accurate?</h2><img class="imagePanel" src="assets/message-relay-story.png" alt="Four-panel story of students saying, retelling and checking a message"><div class="paper"><p>Amir said, “I’m meeting our group at the library tomorrow.” Zere heard him and told Maya that Amir was meeting the group at the library the next day. Maya asked if it was at 3 p.m. Zere said she wasn’t sure. They checked with Amir instead of guessing.</p></div>`},
{t:'Check the relay',n:'3 min. Students answer first, then tap. Highlight the responsible action in the final question.',b:`<h3>17 · comprehension</h3><h2>Tap after you answer.</h2><div class="grid three">${[['Where was Amir meeting the group?','At the library.'],['What did Maya ask?','She asked if it was at 3 p.m.'],['What did they do when unsure?','They checked with Amir instead of guessing.']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Before you pass it on…',n:'4 min. This is the lesson’s communication focus. Invite groups to choose one question to use this week.',b:`<h3>18 · careful communication</h3><h2>Pause. Check. Respect.</h2><div class="grid three"><div class="card"><span class="stamp">1. source</span><p>“Who told you that?”</p></div><div class="card"><span class="stamp">2. permission</span><p>“Is it okay to share this?”</p></div><div class="card"><span class="stamp">3. accuracy</span><p>“Did I understand you correctly?”</p></div></div>`},
{t:'Information gap: message cards',n:'6 min. Partner A reads a direct quote secretly. Partner B asks questions and reports it. Then swap. Invent safe, fictional messages.',b:`<h3>19 · pair relay</h3><h2>Don’t show your card. Retell it accurately.</h2><div class="grid two"><div class="card"><h3>Partner A</h3><p>Choose a card: “I can’t come today.” / “We are practising after school.” / “I will bring the poster tomorrow.”</p></div><div class="card"><h3>Partner B</h3><p>Ask one clarifying question. Then report: “A said that…”</p></div></div><p class="word">Swap roles. Use fictional names if you like.</p>`},
{t:'60-second Whisper Lab',n:'5 min. Groups have 60 seconds to transform three quotations. Start timer, then ask one group to explain one change.',b:`<h3>20 · fluency sprint</h3><h2>Transform three messages together.</h2><div id="timer" class="timer">01:00</div><div class="center"><button id="timerStart">Start / pause</button><button id="timerReset">Reset</button></div><p class="center word">“I am busy now.” · “We will meet tomorrow.” · “Can you help me?”</p>`},
{t:'Communication clinic',n:'6 min. Use groups of three: speaker, reporter, checker. The checker listens for one grammar shift and one respectful habit.',b:`<h3>21 · role-play</h3><h2>Give the message a careful journey.</h2><div class="grid three"><div class="card"><h3>Speaker</h3><p>Say a short, fictional message.</p></div><div class="card"><h3>Reporter</h3><p>Tell the message to a new person.</p></div><div class="card"><h3>Checker</h3><p>Ask: “Did you check the source?”</p></div></div>`},
{t:'Message makeover',n:'5 min. Students pick one vague or unsafe message and improve it. Invite non-personal examples only.',b:`<h3>22 · production task</h3><h2>Turn a messy message into a careful one.</h2><div class="grid two"><div class="card before"><h3>Too fast</h3><p class="sentence">“I heard that someone is leaving!”</p></div><div class="card after"><h3>Better</h3><p class="sentence">“I heard a rumour, but I don’t know if it is true. I should check first.”</p></div></div><p>Write or say your own before-and-after pair.</p>`},
{t:'Whisper Lab quiz',n:'5 min. Teams tap to reveal answers. Award a “clarity stamp” for each correct explanation, not only a correct form.',b:`<h3>23 · review</h3><h2>Collect four clarity stamps.</h2><div class="grid two" id="paintQuiz">${[['“I am ready.” → She said that…','she was ready.'],['Which is correct?','He told me that he was late.'],['“Will you come?” → She asked…','if I would come.'],['What should you do with an unclear rumour?','Check the source before sharing.']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Homework: message detective',n:'2 min. Explain that students can use a fictional TV, book or family-safe message. No real private information is required.',b:`<h3>24 · homework</h3><h2>Find, transform, reflect.</h2><div class="grid three"><div class="card"><h3>1. Find</h3><p>Write 3 direct-speech sentences from a safe fictional situation.</p></div><div class="card"><h3>2. Transform</h3><p>Change them into reported speech.</p></div><div class="card"><h3>3. Reflect</h3><p>Write one rule for sharing information kindly.</p></div></div>`},
{t:'Exit ticket',n:'2 min. Students choose one prompt and answer orally or on paper. Praise careful choices, not personal disclosures.',b:`<h3>25 · exit ticket</h3><h2>What can you do now?</h2><div class="grid three" id="exitStrip"><button class="choice">I can change “I am…” into…</button><button class="choice">One difference between say and tell is…</button><button class="choice">Before I share a message, I will…</button></div><p id="exitResult" class="word">Choose one, then give a complete answer.</p><p class="footer"></p><p class="small">Next: Reading Lesson — Psychology & Human Behaviour</p>`}
];
const deck=document.querySelector('#deck');let current=0;deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML=`<h3 style="color:var(--lemon)">Whisper Lab map</h3>${scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('')}`;
function show(i){current=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#count').textContent=`${current+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(current+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#menu').onclick=()=>map.classList.toggle('open');document.querySelector('#notesBtn').onclick=()=>{note.innerHTML=`<b>Teacher note · ${current+1}</b><br>${scenes[current].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#notesBtn').click()});let x0=null;document.addEventListener('touchstart',e=>x0=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].screenX-x0;if(Math.abs(d)>45)show(current+(d<0?1:-1));x0=null},{passive:true});document.querySelectorAll('.reveal').forEach(x=>x.onclick=()=>x.classList.toggle('open'));document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');document.querySelector('#moodResult').textContent=`Good choice: ${x.dataset.choice}. Now add “because…”`});document.querySelectorAll('.sort').forEach(x=>x.onclick=()=>document.querySelector('#sortResult').textContent=`“${x.dataset.item}” — would you share, check, or keep it private? Why?`);document.querySelectorAll('#sayTell .choice').forEach(x=>x.onclick=()=>{document.querySelectorAll('#sayTell .choice').forEach(y=>y.classList.remove('good','bad'));x.classList.add(x.dataset.answer);document.querySelector('#sayTellResult').textContent=x.dataset.answer==='good'?'Correct — use tell + person + message.':'Try again: say has no person after it; tell needs a person.'});document.querySelectorAll('#exitStrip .choice').forEach(x=>x.onclick=()=>{x.classList.add('selected');document.querySelector('#exitResult').textContent='Now give your full answer to a partner or teacher.'});let remaining=60,run=null;const timer=document.querySelector('#timer');function paint(){timer.textContent=`01:${String(remaining).padStart(2,'0')}`.replace('01:00',remaining===60?'01:00':`00:${String(remaining).padStart(2,'0')}`)}paint();document.querySelector('#timerStart').onclick=()=>{if(run){clearInterval(run);run=null;return}run=setInterval(()=>{if(remaining>0){remaining--;paint()}else{clearInterval(run);run=null;timer.textContent='TIME!'}},1000)};document.querySelector('#timerReset').onclick=()=>{clearInterval(run);run=null;remaining=60;paint()};
</script><script>
(()=>{const display=document.querySelector('#timer'),start=document.querySelector('#timerStart'),reset=document.querySelector('#timerReset');let seconds=60,handle=null;const paint=()=>{display.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`};paint();start.onclick=()=>{if(handle){clearInterval(handle);handle=null;return}handle=setInterval(()=>{if(seconds>0){seconds--;paint()}else{clearInterval(handle);handle=null;display.textContent='TIME!'}},1000)};reset.onclick=()=>{clearInterval(handle);handle=null;seconds=60;paint()}})();
</script><script src="experience-v3.js"></script>
</body></html>
