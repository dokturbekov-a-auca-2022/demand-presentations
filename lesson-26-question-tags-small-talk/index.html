<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 26 — Tag Café</title><style>
:root{--cocoa:#553c36;--sage:#a8c9af;--coral:#ed806d;--cream:#fff6e8;--sky:#c2e4ef;--ink:#302a2a}*{box-sizing:border-box}body{margin:0;background:var(--cocoa);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:pour .35s both}.scene:before{content:'☕';position:absolute;right:4vw;bottom:7vh;font-size:8rem;color:var(--coral);opacity:.12}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#553c36ed,#553c36a6 48%,#553c3620)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--sage);background:#553c369b;border-radius:0 28px 28px 0}.title h1{font:900 clamp(4rem,8vw,9rem)/.82 Georgia,serif;margin:.1em 0}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--cocoa);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.item{background:#fff;border:3px solid var(--cocoa);border-radius:18px;padding:1.1rem;min-height:8rem;box-shadow:7px 7px 0 #553c3622;cursor:pointer}.item:nth-child(2){background:var(--sage)}.item:nth-child(3){background:var(--sky)}.item.selected{outline:5px solid var(--coral)}.speech{background:#fff;border:3px solid var(--cocoa);border-radius:24px;padding:1.2rem 1.5rem;font-size:clamp(1.3rem,2.2vw,2.3rem);box-shadow:8px 8px 0 #553c3622;position:relative}.speech:after{content:'';position:absolute;bottom:-16px;left:28px;border-width:16px 16px 0 0;border-style:solid;border-color:var(--cocoa) transparent transparent transparent}.tag{display:inline-block;background:var(--coral);color:#fff;padding:.4rem .65rem;border-radius:99px;font-weight:900;margin:.2rem}.choice{background:#fff;border:3px solid var(--cocoa);border-radius:14px;padding:.85rem 1rem;color:var(--cocoa);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #553c3622}.choice:hover,.choice.selected{background:var(--sage)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;border-radius:24px;box-shadow:12px 12px 0 var(--sky)}.feedback{font-weight:900;color:var(--coral);min-height:1.5em}.flip{display:inline-block;background:var(--sky);padding:1rem;border-radius:18px;cursor:pointer;min-width:12rem;text-align:center}.flip .back{display:none}.flip.open .front{display:none}.flip.open .back{display:block}.meter{height:20px;background:#d8c6b6;border-radius:99px;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--coral);border-radius:99px;transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer;border-radius:12px}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#553c36ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center;border-radius:14px}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44;border-radius:99px}.progress i{display:block;height:100%;background:var(--sage);border-radius:99px}.note,.map{display:none;position:fixed;z-index:30;background:#553c36f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem;border-radius:16px}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0;border-radius:8px}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--cocoa)}@keyframes pour{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.menu,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">CAFÉ MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Tag Café','2 min. Open with the café image. Ask what makes a conversation comfortable.',`<img class="hero" src="${A}cafe-chat.png" alt="Illustrated neighborhood cafe with diverse teens chatting at tables"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 26 · speaking + grammar</div><h1>Tag<br>Café</h1><p>Keep small talk warm, natural, and easy to continue.</p><span class="tag">REACT</span><span class="tag">CHECK</span><span class="tag">CONNECT</span></div>`),
S('Check-in: café mood','4 min. Students choose a mood and give a reason.',`<div class="stage"><h3>01 · check-in</h3><h2>How is your conversation today?</h2><div class="menu" id="mood"><button class="item choice">ready to chat</button><button class="item choice">a little quiet</button><button class="item choice">full of questions</button><button class="item choice">somewhere in between</button></div><p id="moodOut" class="feedback">Choose one. Add: “It is, isn’t it?”</p></div>`),
S('Bridge from Lesson 25','3 min. Connect team decisions to checking agreement.',`<div class="stage"><h3>02 · bridge</h3><div class="speech">We chose the river path, <b>didn’t we?</b></div><p>A question tag turns a statement into a friendly check.</p></div>`),
S('Read the table','5 min. Students predict small-talk topics from the image.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What could these two people talk about?</h2><img class="figure" src="${A}table-cards.png" alt="Illustrated cafe table with mugs conversation cards headphones and a plant"><p class="feedback">Choose a safe topic: music, weekend plans, food, school, or weather.</p></div>`),
S('Today’s café menu','1 min. Preview the conversation sequence.',`<div class="stage"><h3>04 · route</h3><div class="menu"><div class="item"><b>Open</b><p>start a topic</p></div><div class="item"><b>Check</b><p>use a tag</p></div><div class="item"><b>Continue</b><p>ask a follow-up</p></div></div></div>`),
S('Tag recipe','5 min. Notice the positive/negative switch.',`<div class="stage"><h3>05 · grammar recipe</h3><div class="grid2"><div class="speech">You like tea, <b>don’t you?</b></div><div class="speech">You don’t like coffee, <b>do you?</b></div></div><p>Positive statement → negative tag. Negative statement → positive tag.</p></div>`),
S('Be / do / can tags','5 min. Students tap a base and complete the tag.',`<div class="stage"><h3>06 · tag bases</h3><div class="menu" id="bases"><button class="item choice" data-base="be">She is ready, ___?</button><button class="item choice" data-base="do">They play here, ___?</button><button class="item choice" data-base="can">You can join us, ___?</button></div><p id="baseOut" class="feedback">Match the helper: is → isn’t · play → don’t · can → can’t.</p></div>`),
S('Flip the sugar packet','4 min. Tap to reveal the matching tag.',`<div class="stage"><h3>07 · flip reveal</h3><div class="menu"><button class="flip"><span class="front">It’s warm today</span><span class="back">isn’t it?</span></button><button class="flip"><span class="front">You like music</span><span class="back">don’t you?</span></button><button class="flip"><span class="front">We can sit here</span><span class="back">can’t we?</span></button></div></div>`),
S('Intonation dial','5 min. Practise a real question versus a friendly check.',`<div class="stage"><h3>08 · voice</h3><div class="speech">You’re coming with us, aren’t you?</div><div class="menu"><div class="item"><b>Falling ↘</b><p>I expect yes.</p></div><div class="item"><b>Rising ↗</b><p>I really need to know.</p></div></div></div>`),
S('Small-talk openers','5 min. Students select an opener and add a tag.',`<div class="stage"><h3>09 · openers</h3><div class="menu" id="openers"><button class="item choice">Nice weather today, ___?</button><button class="item choice">You’re in the music club, ___?</button><button class="item choice">That was a long week, ___?</button><button class="item choice">You’ve seen this film, ___?</button></div><p id="openOut" class="feedback">Choose one and say it with a warm voice.</p></div>`),
S('Follow-up questions','5 min. Keep the conversation moving after the tag answer.',`<div class="stage"><h3>10 · keep going</h3><div class="menu"><div class="item"><b>Really?</b><p>Show interest.</p></div><div class="item"><b>How about you?</b><p>Return the question.</p></div><div class="item"><b>What happened next?</b><p>Invite detail.</p></div></div></div>`),
S('Repair the tag','4 min. Students correct the helper and polarity.',`<div class="stage"><h3>11 · repair</h3><div class="grid2" id="repair"><button class="choice">You like it, isn’t it?</button><button class="choice">You like it, don’t you?</button><button class="choice">She isn’t late, isn’t she?</button><button class="choice">She isn’t late, is she?</button></div><p id="repairOut" class="feedback">Check the main verb and the positive/negative switch.</p></div>`),
S('Small talk topics','4 min. Sort topics into easy, careful, or avoid.',`<div class="stage"><h3>12 · topic map</h3><div class="menu"><div class="item"><b>Easy</b><p>weather · music · food · hobbies</p></div><div class="item"><b>Careful</b><p>school · travel · plans</p></div><div class="item"><b>Respect boundaries</b><p>private money · health · family details</p></div></div></div>`),
S('Café script','5 min. Students notice the open → tag → follow-up pattern.',`<div class="stage"><h3>13 · model</h3><div class="speech">A: You’ve tried the new café, haven’t you?<br>B: Yes, I have. The cakes are great.<br>A: Really? Which one did you like?</div></div>`),
S('Reading the room','2 min. Predict the topic from the scene.',`<div class="stage"><h3>14 · visual preview</h3><img class="figure" src="${A}park-chat.png" alt="Illustrated evening park with teens greeting and chatting under string lights"><p>Choose one opener that fits this setting.</p></div>`),
S('Text: The bench conversation','6 min. Partner-read and underline the tags.',`<div class="stage"><h3>15 · dialogue</h3><div class="speech"><p>“You’re new to the park club, aren’t you?” asked Mina.</p><p>“Yes, I am. The games are fun, aren’t they?” said Noor.</p><p>“They are. You can join our team, can’t you?”</p><p>Noor smiled. “I can. What do you usually play?”</p></div><p>Circle the tags. Box the follow-up question.</p></div>`),
S('Dialogue check','4 min. Click the line that keeps the conversation moving.',`<div class="stage"><h3>16 · evidence</h3><div class="grid2" id="dialogue"><button class="choice">You’re new, aren’t you?</button><button class="choice">Yes, I am.</button><button class="choice">What do you usually play?</button><button class="choice">No more talking.</button></div><p id="dialogueOut" class="feedback">Choose one tag and one follow-up.</p></div>`),
S('Tag table close-up','4 min. Build two lines from the image.',`<div class="stage"><h3>17 · visual language</h3><img class="figure" src="${A}table-cards.png" alt="Illustrated conversation table with mugs, tag cards and a plant"><p class="feedback">Use: “You like ___, don’t you?” and “You can ___, can’t you?”</p></div>`),
S('Information gap: café cards','6 min. Partner A has a person card; Partner B finds shared interests.',`<div class="stage"><h3>18 · pair task</h3><div class="grid2"><div class="speech"><b>Card A</b><br>likes: jazz · cycling · spicy food</div><div class="speech"><b>Card B</b><br>likes: pop · cycling · noodles</div></div><p>Find one match and ask a tag question about it.</p></div>`),
S('Conversation temperature','5 min. Choose a response that sounds warm, neutral, or closed.',`<div class="stage"><h3>19 · response choices</h3><div class="menu" id="responses"><button class="item choice">Really? Tell me more.</button><button class="item choice">Oh.</button><button class="item choice">How about you?</button><button class="item choice">That’s private.</button></div><p id="responseOut" class="feedback">Choose the responses that keep a safe conversation alive.</p></div>`),
S('Small-talk carousel','6 min. Rotate partners after each topic.',`<div class="stage"><h3>20 · speaking circuit</h3><div class="path"><div class="node">open</div><div class="line"></div><div class="node">tag</div><div class="line"></div><div class="node">answer</div><div class="line"></div><div class="node">follow up</div></div><p>Use a new topic each round.</p></div>`),
S('Build a café conversation','7 min. Students create a four-line dialogue.',`<div class="stage"><h3>21 · production setup</h3><div class="menu"><div class="item"><b>Line 1</b><p>topic opener</p></div><div class="item"><b>Line 2</b><p>question tag</p></div><div class="item"><b>Line 3</b><p>answer + detail</p></div><div class="item"><b>Line 4</b><p>follow-up</p></div></div></div>`),
S('Perform the dialogue','7 min. Pairs perform with natural intonation.',`<div class="stage"><h3>22 · production</h3><div class="speech">Aim for: one rising tag, one falling tag, one follow-up, and one “How about you?”</div><p>Listeners note the topic they heard.</p></div>`),
S('Peer café check','5 min. Use three quick checks.',`<div class="stage"><h3>23 · feedback</h3><div class="menu"><div class="item"><b>Warm</b><p>Did the voice sound friendly?</p></div><div class="item"><b>Accurate</b><p>Did the helper match?</p></div><div class="item"><b>Open</b><p>Did the talk continue?</p></div></div></div>`),
S('Review: tag menu','5 min. Teams choose the best tag for each line.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">You’re ready, aren’t you?</button><button class="choice">They don’t eat meat, do they?</button><button class="choice">We can start, can’t we?</button><button class="choice">She likes it, doesn’t she?</button></div><p id="quizOut" class="feedback">Choose four accurate tags.</p></div>`),
S('One-minute café round','2 min. Students speak under a short timer.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START CHAT</button><p>Open, add a tag, answer, and ask a follow-up.</p></div>`),
S('Homework: small-talk menu','2 min. Students prepare six safe topics and tag questions.',`<div class="stage"><h3>26 · homework</h3><div class="menu"><div class="item"><b>Write</b><p>six topic openers</p></div><div class="item"><b>Add</b><p>one question tag to each</p></div><div class="item"><b>Prepare</b><p>two follow-ups</p></div></div></div>`),
S('Exit ticket','2 min. Students complete one friendly line. Preview presentation skills.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Leave the café with a question.</h2><div class="tokens" id="exit"><button class="tag">You like …, don’t you?</button><button class="tag">You can …, can’t you?</button><button class="tag">It’s …, isn’t it?</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Presentation Skills · Speak Confidently</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--sage)">Tag Café map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('#mood .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');moodOut.textContent='Now add a tag: It is, isn’t it?'});document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{b.classList.add('selected');baseOut.textContent='Good — match the auxiliary and switch polarity.'});document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>b.classList.toggle('open'));document.querySelectorAll('#openers .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');openOut.textContent='Say it with a friendly tag and eye contact.'});document.querySelectorAll('#repair .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');repairOut.textContent='Check the helper and polarity.'});document.querySelectorAll('#dialogue .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');dialogueOut.textContent='Choose one tag and one follow-up.'});document.querySelectorAll('#responses .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');responseOut.textContent='Which response keeps the talk moving?'});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Good — accurate tags help the conversation flow.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .tag').forEach(b=>b.onclick=()=>{b.classList.add('selected');exitOut.textContent='Complete the tag for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #241410}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe0a4!important}</style></body></html>
