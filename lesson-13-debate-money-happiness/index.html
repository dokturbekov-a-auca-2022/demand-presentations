<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 13 — Money & Happiness</title>
<style>
:root{--ink:#082d35;--paper:#fff7e7;--coral:#ef6c55;--sun:#f6bd3e;--mint:#a9d8c5;--blue:#4384c4;--white:#fffdfa;--shadow:0 18px 40px #082d3530}*{box-sizing:border-box}body{margin:0;background:var(--ink);font-family:Georgia,'Trebuchet MS',serif;color:var(--ink);overflow:hidden}.deck{height:100vh}.scene{display:none;height:100%;padding:5.4vh 8vw 9vh;background:var(--paper);position:relative;overflow:auto}.scene.active{display:block;animation:arrive .45s both}.scene:before{content:'';position:absolute;width:44vmin;height:44vmin;border-radius:50%;background:var(--mint);opacity:.35;right:-16vmin;top:-16vmin}.scene:after{content:'';position:absolute;width:30vmin;height:30vmin;border-radius:50%;background:var(--sun);opacity:.16;left:-12vmin;bottom:-16vmin}h1,h2,h3,p{position:relative;z-index:1}h1{font-size:clamp(3rem,6.8vw,7.8rem);line-height:.9;margin:.1em 0}h2{font-size:clamp(2rem,3.6vw,4.2rem);line-height:1;margin:.1em 0 .45em}h3{font-family:Arial,sans-serif;font-size:clamp(1rem,1.5vw,1.45rem);letter-spacing:.06em;text-transform:uppercase;margin:.25em 0;color:var(--coral)}p,.lead{font-family:Arial,sans-serif;font-size:clamp(1rem,1.65vw,1.6rem);line-height:1.45;max-width:70ch}.eyebrow,.tag{font-family:Arial,sans-serif;font-weight:800;letter-spacing:.11em;text-transform:uppercase;font-size:.76rem;color:var(--coral)}.tag{display:inline-block;background:#fff2d4;padding:.55em .8em;border-radius:99px;margin:.2em}.grid{position:relative;z-index:1;display:grid;gap:1.25rem}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--white);border:2px solid #082d3518;border-radius:20px;padding:1.3rem;box-shadow:7px 8px 0 #082d3512;font-family:Arial,sans-serif}.card h3{margin-top:0}.card p{font-size:1rem;margin:.4em 0}.paper{background:#fffdf7;border:2px solid #082d3520;border-radius:4px;padding:1.6rem;box-shadow:var(--shadow);transform:rotate(-.4deg)}.quote{font-size:clamp(1.45rem,2.6vw,3rem);line-height:1.18;font-style:italic}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.heroShade{position:absolute;inset:0;background:linear-gradient(90deg,#082d35 0%,#082d35eF 34%,#082d3560 64%,#082d3500 100%);z-index:1}.titleCopy{position:relative;z-index:2;color:var(--paper);max-width:48rem;padding-top:10vh}.titleCopy h3{color:var(--sun)}.titleCopy p{color:#fff7e7}.button,button{font:800 1rem Arial,sans-serif;border:0;border-radius:999px;padding:.8rem 1.15rem;background:var(--coral);color:white;cursor:pointer;box-shadow:0 4px 0 #9e3f31;transition:.18s transform,.18s box-shadow}.button:hover,button:hover{transform:translateY(-2px);box-shadow:0 6px 0 #9e3f31}.button:focus,button:focus{outline:4px solid var(--sun);outline-offset:3px}.choice{width:100%;text-align:left;background:#fffdf7;color:var(--ink);box-shadow:0 4px 0 #082d3520;border:2px solid #082d3518}.choice.selected,.choice.good{background:var(--mint)}.choice.bad{background:#ffd0c6}.nav{position:fixed;z-index:20;bottom:1.5rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.7rem;background:#082d35e8;padding:.5rem .8rem;border-radius:999px;color:white;font:700 .8rem Arial,sans-serif}.nav button{padding:.55rem .85rem;box-shadow:none}.nav button:hover{box-shadow:none}.count{min-width:4.7rem;text-align:center}.progress{height:5px;width:8rem;background:#ffffff40;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sun)}.topTools{position:fixed;right:1.3rem;top:1.2rem;z-index:20;display:flex;gap:.5rem}.topTools button{box-shadow:none;padding:.56rem .7rem;background:var(--ink)}.notes,.map{position:fixed;z-index:30;background:#082d35f5;color:var(--paper);padding:1.4rem;border-radius:18px;max-width:min(31rem,90vw);right:1.4rem;top:4.6rem;font:1rem/1.45 Arial,sans-serif;display:none}.notes.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(760px,92vw);top:12vh}.map button{margin:.2rem;background:#ffffff18;box-shadow:none;font-size:.8rem}.timer{font:800 clamp(3.5rem,8vw,8rem) Arial,sans-serif;color:var(--coral);text-align:center;margin:.1em 0}.timerControls{text-align:center}.metric{font:900 clamp(3rem,6vw,6rem) Arial,sans-serif;color:var(--coral);line-height:1}.stem{font-family:Arial,sans-serif;font-size:clamp(1.25rem,2.1vw,2.15rem);line-height:1.25}.word{font:bold 1.4rem Arial,sans-serif;color:var(--blue)}.reveal{cursor:pointer;min-height:8rem}.reveal .answer{display:none;margin-top:.8rem;border-top:1px dashed #082d3540;padding-top:.8rem}.reveal.open .answer{display:block}.split{display:flex;gap:1rem;align-items:stretch;position:relative;z-index:1}.side{flex:1;padding:1.5rem;border-radius:22px;border:3px solid}.for{background:#e4f4e7;border-color:#4eaa78}.against{background:#ffe3d8;border-color:#d96b51}.middle{background:#e9f0fb;border-color:var(--blue)}ul{font:1.15rem/1.55 Arial,sans-serif;padding-left:1.2rem}.score{font:800 1.1rem Arial,sans-serif;color:var(--coral)}.small{font-size:.9rem}.imagePanel{position:relative;z-index:1;width:100%;max-height:44vh;object-fit:cover;border-radius:22px;box-shadow:var(--shadow);border:6px solid #fffdf7}.stamp{font:bold .85rem Arial,sans-serif;display:inline-block;transform:rotate(-3deg);border:2px solid var(--coral);color:var(--coral);padding:.5em .7em;text-transform:uppercase;margin:.3em}.check{font:800 1.1rem Arial,sans-serif}.footerLine{position:absolute;bottom:5.5rem;left:8vw;right:8vw;border-top:2px dashed #082d3530;z-index:1}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.2rem 1.2rem 6.8rem}.two,.three,.four{grid-template-columns:1fr}.split{flex-direction:column}.heroShade{background:linear-gradient(90deg,#082d35eF,#082d3565)}h1{font-size:3.5rem}.card{padding:1rem}.imagePanel{max-height:28vh}.topTools{right:.55rem;top:.55rem}.nav{bottom:.65rem}.footerLine{bottom:4.8rem;left:1.2rem;right:1.2rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="deck" id="deck"></main><div class="topTools"><button id="menu" title="Scene map (M)">Map</button><button id="notesBtn" title="Teacher note (N)">Notes</button></div><div id="notes" class="notes"></div><div id="map" class="map"></div><nav class="nav"><button id="prev" aria-label="Previous scene">←</button><span class="count" id="count">1 / 25</span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next scene">→</button></nav>
<script>
const scenes=[
{t:'Money can buy… happiness?',k:'Lesson 13 · Debate lesson',n:'2 min. Let the title question sit. Say that the class will practise ideas and respectful disagreement, not find one “correct” life choice.',b:`<img class="hero" src="assets/happiness-exchange-hero.png" alt="Teenagers balancing money and wellbeing in a colourful community square"><div class="heroShade"></div><div class="titleCopy"><h3>Happiness Exchange</h3><h1>Can money<br>buy happiness?</h1><p>Build ideas. Listen closely. Debate with respect.</p><span class="tag">Speak</span><span class="tag">Support</span><span class="tag">Respond</span></div>`},
{t:'Check in: your best “free” thing',n:'4 min. Students may choose an imaginary answer. Invite a one-sentence explanation to a partner.',b:`<h3>01 · check-in</h3><h2>Which thing makes your day better — and costs little or nothing?</h2><div class="grid four" id="moodGrid">${['talking to a friend','sleeping well','a walk outside','music','helping someone','playing a game','time with family','something else'].map(x=>`<button class="choice" data-choice="${x}">${x}</button>`).join('')}</div><p class="score" id="moodResult">Choose one, then explain why.</p>`},
{t:'Bridge from Lesson 12',n:'3 min. Elicit one second-conditional sentence. Keep it fictional if students prefer.',b:`<h3>02 · quick bridge</h3><h2>If you had $1,000, what would you do?</h2><div class="grid two"><div class="paper"><p class="quote">“If I had $1,000, I would…”</p><p>Finish the idea in two ways: one purchase and one experience or action.</p></div><div class="card"><h3>Try a balanced answer</h3><p>“I would buy a new laptop, but I would also take my family to the mountains.”</p><p class="small">Today we are moving from imaginary situations to <b>reasons and responses</b>.</p></div></div>`},
{t:'Vote before you know more',n:'3 min. This is an opening position, not a test. Do not reveal the class total until students have voted.',b:`<h3>03 · silent vote</h3><h2>Can money buy happiness?</h2><div class="split"><button class="side for vote" data-vote="yes"><h3>Mostly yes</h3><p class="stem">Money can solve real problems and create choices.</p></button><button class="side middle vote" data-vote="both"><h3>It depends</h3><p class="stem">Money matters, but it is not the whole story.</p></button><button class="side against vote" data-vote="no"><h3>Mostly no</h3><p class="stem">The best things are not things you can buy.</p></button></div><p class="score" id="voteResult">Tap a position. You may change your mind later.</p>`},
{t:'Today’s mission',n:'1 min. Read goals together and connect the last goal to the final debate.',b:`<h3>04 · objectives</h3><h2>By the end, you can…</h2><div class="grid three"><div class="card"><div class="metric">01</div><p>use key vocabulary about money, needs and wellbeing</p></div><div class="card"><div class="metric">02</div><p>agree and disagree without attacking a person</p></div><div class="card"><div class="metric">03</div><p>give a claim, a reason and an example in a debate</p></div></div>`},
{t:'Words that change the debate',n:'5 min. Students tap each card, repeat the word, then make a simple example.',b:`<h3>05 · vocabulary discovery</h3><h2>Tap → read → use it in an example</h2><div class="grid three">${[['income','money you receive from work or another source'],['expense','something you spend money on'],['afford','have enough money to buy or do something'],['need','something important for life or health'],['want','something nice, but not essential'],['wellbeing','feeling healthy, safe and satisfied']].map(([w,d])=>`<button class="card reveal"><span class="word">${w}</span><div class="answer">${d}<br><br><i>Example: “I can afford a bus ticket.”</i></div></button>`).join('')}</div>`},
{t:'Need, want, or both?',n:'5 min. Students click a card, then say a reason. Accept different answers for “both”.',b:`<h3>06 · value sort</h3><h2>Choose the best category. Explain one difficult choice.</h2><div class="grid three" id="sortGrid">${['clean water','new trainers','safe home','weekend trip','healthy food','a phone','medicine','time with friends','internet access'].map(x=>`<button class="choice sort" data-item="${x}">${x}</button>`).join('')}</div><p id="sortResult" class="score">Click an item. Say: “For me, this is a need / want / both because…”</p>`},
{t:'Debate language toolkit',n:'4 min. Drill intonation in the sentence starters. Ask pairs to add a true or fictional ending.',b:`<h3>07 · speak with care</h3><h2>Strong ideas. Respectful voices.</h2><div class="grid three"><div class="card"><h3>Build</h3><p>In my opinion, …</p><p>I believe that … because …</p><p>For example, …</p></div><div class="card"><h3>Agree</h3><p>I see your point.</p><p>That’s true, especially when …</p><p>I agree to some extent.</p></div><div class="card"><h3>Disagree</h3><p>I’m not sure I agree.</p><p>However, I think …</p><p>Could it also be true that …?</p></div></div>`},
{t:'Fact, opinion, or experience?',n:'4 min. Let students decide privately, then click each statement. Explain that a personal experience can be evidence but is not universal proof.',b:`<h3>08 · evidence detective</h3><h2>What kind of support is this?</h2><div class="grid two" id="evidenceGrid">${[['“A bus ticket costs more than last year.”','fact / checkable claim'],['“Money is the most important thing.”','opinion'],['“My cousin felt calmer after she got a job.”','personal experience'],['“Everyone with money is happy.”','overgeneralisation — be careful!']].map(([a,b])=>`<button class="card reveal"><p class="stem">${a}</p><div class="answer"><b>${b}</b></div></button>`).join('')}</div>`},
{t:'The rules make the debate better',n:'3 min. Nominate a class “respect keeper” for the later debate.',b:`<h3>09 · debate agreement</h3><h2>We challenge ideas, not people.</h2><div class="grid four"><div class="card"><div class="metric">1</div><p>Let a speaker finish.</p></div><div class="card"><div class="metric">2</div><p>Use names and kind language.</p></div><div class="card"><div class="metric">3</div><p>Give a reason, not only “yes” or “no”.</p></div><div class="card"><div class="metric">4</div><p>It is okay to change your mind.</p></div></div>`},
{t:'Build an argument',n:'5 min. Model one complete argument. Students choose parts to make another. The target is a clear shape, not perfect vocabulary.',b:`<h3>10 · argument machine</h3><h2>A strong argument has three parts.</h2><div class="grid three"><div class="card"><h3>Claim</h3><p>Money <b>can</b> buy some happiness.</p></div><div class="card"><h3>Reason</h3><p>It helps people pay for needs and feel safer.</p></div><div class="card"><h3>Example</h3><p>For example, a family can pay for medicine or warm clothes.</p></div></div><p class="quote">Claim + reason + example = a voice people can follow.</p>`},
{t:'Make the claim stronger',n:'4 min. Click one answer at a time. Ask why the strongest claim is more believable.',b:`<h3>11 · precise language</h3><h2>Which claim is strongest for a debate?</h2><div id="claimGame" class="grid three"><button class="choice" data-answer="bad">Money always makes people happy.</button><button class="choice" data-answer="good">Money can improve wellbeing when it helps people meet needs.</button><button class="choice" data-answer="bad">Money is happiness.</button></div><p id="claimResult" class="score">Choose the claim you could support with reasons.</p>`},
{t:'Two Saturdays',n:'5 min. Teacher reads the short text aloud twice. First time: what makes each teen feel good? Second time: notice money and non-money benefits.',b:`<h3>12 · teacher-read listening</h3><h2>Listen for the sources of happiness.</h2><img class="imagePanel" src="assets/two-saturdays.png" alt="Collage showing teenagers earning, shopping, spending time with friends and family, and relaxing outdoors"><div class="paper"><p><b>Sam</b> worked at a café for three hours on Saturday. He saved some money and bought second-hand headphones. He felt proud because he had earned them. <b>Lina</b> cooked with her aunt, played football with friends and called her grandmother. She spent almost no money, but she laughed a lot. Both teenagers said their Saturday was good.</p></div>`},
{t:'What did you hear?',n:'3 min. Students answer individually, then compare. Tap cards to reveal concise answers.',b:`<h3>13 · listening check</h3><h2>Tap after you answer.</h2><div class="grid three">${[['Why was Sam proud?','He earned money and bought something he wanted.'],['Did Lina spend much money?','No. Her happy activities cost little or nothing.'],['What is the balanced message?','Money and non-money experiences can both support happiness.']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Evidence cards: use, question, improve',n:'5 min. Groups choose one card. They prepare one sentence beginning “This is useful evidence because…” or “This is not enough because…”',b:`<h3>14 · evidence lab</h3><h2>Does this evidence help your argument?</h2><div class="grid three"><div class="card"><h3>Card A</h3><p>“I bought a bicycle and I was happy.”</p><span class="stamp">personal experience</span></div><div class="card"><h3>Card B</h3><p>“A safe home and healthy food reduce daily stress.”</p><span class="stamp">strong reason</span></div><div class="card"><h3>Card C</h3><p>“Rich people never have problems.”</p><span class="stamp">weak claim</span></div></div>`},
{t:'Team FOR: prepare',n:'6 min. Assign roughly half the groups to FOR. Their claim is not “money is everything”; it is “money can buy or support some happiness.”',b:`<h3>15 · team for</h3><div class="side for"><h2>Money can buy some happiness.</h2><p class="stem">Prepare 2 arguments and 1 example.</p><ul><li>needs: food, housing, healthcare</li><li>choices: education, travel, hobbies</li><li>safety: fewer daily worries</li></ul><p><b>Challenge:</b> Add “However, money cannot…” so your team sounds balanced.</p></div>`},
{t:'Team AGAINST: prepare',n:'6 min. Assign the other half to AGAINST. Encourage them to acknowledge that money can help with needs.',b:`<h3>16 · team against</h3><div class="side against"><h2>Money cannot buy the most important happiness.</h2><p class="stem">Prepare 2 arguments and 1 example.</p><ul><li>relationships cannot be bought</li><li>purpose and kindness cost little</li><li>too much focus on money can create stress</li></ul><p><b>Challenge:</b> Add “Of course, money is important for…” so your team sounds fair.</p></div>`},
{t:'The middle ground',n:'4 min. Pairs turn the three parts into one position statement. This keeps the debate nuanced and accessible.',b:`<h3>17 · bridge builders</h3><h2>Can both sides be partly right?</h2><div class="split"><div class="side for"><h3>Yes, because…</h3><p>Money can meet basic needs and give choices.</p></div><div class="side middle"><h3>And also…</h3><p>Happiness depends on relationships, health, time and meaning.</p></div><div class="side against"><h3>So perhaps…</h3><p>Money is a tool, not the final goal.</p></div></div><p class="quote">“Money can support happiness, but it cannot create every kind of happiness.”</p>`},
{t:'Speed debate',n:'6 min. Put pairs face-to-face. Partner A speaks for 45 seconds; Partner B responds for 45 seconds. Then switch roles and repeat with a new idea.',b:`<h3>18 · 45-second challenge</h3><h2>Speak. Respond. Switch.</h2><div class="timer" id="timer">00:45</div><div class="timerControls"><button id="timerStart">Start / pause</button><button id="timerReset">Reset</button></div><p class="score" style="text-align:center">Use at least one: “I see your point, however…” · “For example…” · “Could it also be true that…?”</p>`},
{t:'The main debate',n:'10–12 min. Arrange 4 roles per team. Allow students to use notes, but speakers should look up often.',b:`<h3>19 · structured debate</h3><h2>Motion: “Money can buy happiness.”</h2><div class="grid four"><div class="card"><h3>Opener</h3><p>State your team’s position.</p></div><div class="card"><h3>Reason giver</h3><p>Give two supported reasons.</p></div><div class="card"><h3>Responder</h3><p>Reply to one opposing idea.</p></div><div class="card"><h3>Closer</h3><p>Summarise your best point.</p></div></div><p><span class="tag">1 minute prepare</span><span class="tag">1 minute FOR</span><span class="tag">1 minute AGAINST</span><span class="tag">30 sec responses</span><span class="tag">30 sec closers</span></p>`},
{t:'Switch the side — stretch your thinking',n:'5 min. Pair students with an opposite team. They must give the best argument for the side they did not choose.',b:`<h3>20 · perspective switch</h3><h2>Defend the other side.</h2><div class="paper"><p class="quote">“One point I understand from the other side is…”</p><p>Speaking goal: use a respectful phrase and one concrete example. You do not have to change your personal opinion.</p></div>`},
{t:'Audience feedback',n:'4 min. Give each listener two stamps. They should praise a language move, not choose “the best person”.',b:`<h3>21 · listen like a coach</h3><h2>Give useful feedback.</h2><div class="grid three"><div class="card"><span class="stamp">clear claim</span><p>“I understood your main idea immediately.”</p></div><div class="card"><span class="stamp">good example</span><p>“Your example made the idea believable.”</p></div><div class="card"><span class="stamp">respectful reply</span><p>“You disagreed politely and clearly.”</p></div></div>`},
{t:'Did your view move?',n:'3 min. Invite students to share only if they want to. Value a more detailed view, not only a changed answer.',b:`<h3>22 · reflection</h3><h2>Finish one sentence.</h2><div class="grid two"><div class="card"><p class="quote">“At the beginning, I thought… Now I think…”</p></div><div class="card"><p class="quote">“The strongest idea I heard was…”</p></div></div><p class="small">You can talk about a fictional person instead of your own life.</p>`},
{t:'Passport stamp challenge',n:'5 min. Students answer in teams. Clicking gives feedback; use it as a review game.',b:`<h3>23 · review quiz</h3><h2>Earn 4 debate stamps.</h2><div class="grid two" id="paintQuiz">${[['Which word means “have enough money for something”?','afford'],['Which is a respectful disagreement?','I see your point; however, I think…'],['What makes an argument stronger?','a claim, reason and example'],['Can you change your opinion after listening?','Yes — that shows thinking.']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Homework: happiness map',n:'2 min. Explain choice-based homework. It works as a one-page written task or a short voice note.',b:`<h3>24 · homework</h3><h2>Make a “Happiness Map”</h2><div class="grid three"><div class="card"><h3>1. Draw</h3><p>Make two circles: <b>Money can help with…</b> / <b>Money cannot buy…</b></p></div><div class="card"><h3>2. Write</h3><p>Add 3 ideas to each circle and one balanced conclusion.</p></div><div class="card"><h3>3. Optional voice</h3><p>Record 45 seconds: “Can money buy happiness? I think…”</p></div></div>`},
{t:'Exit ticket',n:'2 min. Students choose one answer, then write or say one sentence before leaving.',b:`<h3>25 · take-away</h3><h2>What are you taking with you?</h2><div class="grid three" id="exitStrip"><button class="choice">One new word I can use is…</button><button class="choice">One respectful phrase I can use is…</button><button class="choice">My balanced final view is…</button></div><p id="exitResult" class="score">Choose one. Give your answer to a partner or your teacher.</p><p class="footerLine"></p><p class="small">Next: Passive Voice — Technology & Inventions</p>`}
];
const deck=document.querySelector('#deck');let current=0;deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');
const notes=document.querySelector('#notes'),map=document.querySelector('#map');map.innerHTML=`<h3 style="color:var(--sun)">Happiness Exchange map</h3>${scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('')}`;
function show(i){current=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#count').textContent=`${current+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(current+1)/scenes.length*100}%`;notes.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);
document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#menu').onclick=()=>map.classList.toggle('open');document.querySelector('#notesBtn').onclick=()=>{notes.innerHTML=`<b>Teacher note · ${current+1}</b><br>${scenes[current].n}`;notes.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#notesBtn').click()});let touchX=null;document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(touchX===null)return;let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>45)show(current+(d<0?1:-1));touchX=null},{passive:true});
document.querySelectorAll('.reveal').forEach(x=>x.onclick=()=>x.classList.toggle('open'));document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');document.querySelector('#moodResult').textContent=`Great choice: ${x.dataset.choice}. Now add “because…”`});document.querySelectorAll('.sort').forEach(x=>x.onclick=()=>document.querySelector('#sortResult').textContent=`“${x.dataset.item}” — discuss: need, want, or both?`);document.querySelectorAll('.vote').forEach(x=>x.onclick=()=>{document.querySelectorAll('.vote').forEach(y=>y.style.transform='');x.style.transform='translateY(-8px)';document.querySelector('#voteResult').textContent=`Position saved: ${x.dataset.vote}. Keep an open mind.`});document.querySelectorAll('#claimGame .choice').forEach(x=>x.onclick=()=>{document.querySelectorAll('#claimGame .choice').forEach(y=>y.classList.remove('good','bad'));x.classList.add(x.dataset.answer);document.querySelector('#claimResult').textContent=x.dataset.answer==='good'?'Exactly — it is careful, specific and supportable.':'Try again — avoid “always” and very general claims.'});document.querySelectorAll('#exitStrip .choice').forEach(x=>x.onclick=()=>{x.classList.add('selected');document.querySelector('#exitResult').textContent='Now say or write one full sentence.'});
let remaining=45,run=null;const timer=document.querySelector('#timer');function paint(){timer.textContent=`00:${String(remaining).padStart(2,'0')}`}paint();document.querySelector('#timerStart').onclick=()=>{if(run){clearInterval(run);run=null;return}run=setInterval(()=>{if(remaining>0){remaining--;paint()}else{clearInterval(run);run=null;timer.textContent='SWITCH!'}},1000)};document.querySelector('#timerReset').onclick=()=>{clearInterval(run);run=null;remaining=45;paint()};
</script></body></html>
