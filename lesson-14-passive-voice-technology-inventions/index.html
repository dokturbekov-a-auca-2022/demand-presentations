<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 14 — Passive Voice</title><style>
:root{--navy:#071f3d;--cream:#fff8e7;--white:#fffdf9;--cyan:#42d9e8;--orange:#ff7c54;--lime:#c5e85a;--magenta:#d977c8;--ink:#102542;--muted:#56708e;--shade:#071f3d30}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.deck{height:100vh}.scene{display:none;height:100%;padding:5.4vh 8vw 9vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:arrive .45s both}.scene:before{content:'';position:absolute;width:42vmin;height:42vmin;right:-14vmin;top:-17vmin;border-radius:50%;background:var(--cyan);opacity:.2}.scene:after{content:'';position:absolute;width:28vmin;height:28vmin;left:-11vmin;bottom:-15vmin;border-radius:50%;background:var(--lime);opacity:.25}h1,h2,h3,p,div{position:relative;z-index:1}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(3.5rem,7vw,8rem);line-height:.86;margin:.1em 0}h2{font-size:clamp(2.05rem,3.75vw,4.35rem);line-height:1;margin:.12em 0 .5em}h3{font-size:clamp(.84rem,1.35vw,1.2rem);letter-spacing:.1em;text-transform:uppercase;color:#167e9a;margin:.3rem 0}.eyebrow,.tag{font:900 .76rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#167e9a}.lead,p{font-size:clamp(1rem,1.45vw,1.5rem);line-height:1.43;max-width:72ch}.grid{display:grid;gap:1.1rem;position:relative;z-index:1}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--white);border:2px solid #071f3d19;border-radius:20px;padding:1.25rem;box-shadow:7px 8px 0 var(--shade)}.card p{font-size:1rem;margin:.35rem 0}.paper{background:#fffdf7;border:2px solid #071f3d22;border-radius:5px;padding:1.4rem;box-shadow:0 15px 30px var(--shade);transform:rotate(-.3deg)}.quote{font:italic clamp(1.4rem,2.5vw,2.9rem)/1.15 Georgia,serif}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#071f3df5 0%,#071f3ddd 37%,#071f3d62 71%,#071f3d10 100%)}.titleCopy{position:relative;z-index:2;color:var(--cream);padding-top:9vh;max-width:48rem}.titleCopy h1,.titleCopy p{color:var(--cream)}.titleCopy h3{color:var(--lime)}.tag{display:inline-block;background:#f9f2bf;padding:.55em .75em;border-radius:99px;margin:.2em}.button,button{font:800 1rem Arial,sans-serif;border:0;border-radius:999px;padding:.78rem 1.1rem;background:#167e9a;color:white;cursor:pointer;box-shadow:0 4px 0 #0b4d60;transition:.16s transform}.button:hover,button:hover{transform:translateY(-2px)}button:focus{outline:4px solid var(--orange);outline-offset:3px}.choice{width:100%;text-align:left;background:var(--white);color:var(--ink);box-shadow:0 4px 0 #071f3d22;border:2px solid #071f3d1a}.choice.selected,.choice.good{background:#e6ffd0}.choice.bad{background:#ffd8d0}.tools{position:fixed;z-index:20;right:1.2rem;top:1.1rem;display:flex;gap:.45rem}.tools button{box-shadow:none;background:var(--navy);padding:.55rem .7rem}.nav{position:fixed;z-index:20;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.65rem;background:#071f3df0;padding:.48rem .75rem;border-radius:999px;color:white;font:bold .8rem Arial,sans-serif}.nav button{padding:.52rem .86rem;box-shadow:none;background:var(--orange)}.count{min-width:4.8rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff3b;border-radius:50px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime)}.note,.map{display:none;position:fixed;z-index:40;top:4.7rem;right:1.2rem;max-width:min(31rem,91vw);background:#071f3df5;color:var(--cream);border-radius:18px;padding:1.25rem;font:1rem/1.45 Arial,sans-serif}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);top:10vh;width:min(760px,92vw)}.map button{box-shadow:none;background:#ffffff19;margin:.2rem;font-size:.8rem}.reveal{cursor:pointer}.reveal .answer{display:none;border-top:1px dashed #071f3d44;margin-top:.7rem;padding-top:.7rem}.reveal.open .answer{display:block}.formula{display:inline-block;background:var(--navy);color:var(--cream);padding:1rem 1.35rem;border-radius:17px;font:900 clamp(1.25rem,2.2vw,2.3rem) Arial,sans-serif}.activeBox{background:#e7faff;border-left:8px solid var(--cyan)}.passiveBox{background:#efffd8;border-left:8px solid var(--lime)}.sentence{font:700 clamp(1.15rem,2vw,2.15rem)/1.28 Arial,sans-serif}.word{font:900 1.25rem Arial,sans-serif;color:#167e9a}.arrow{font:900 clamp(2.5rem,5vw,5rem) Georgia,serif;color:var(--orange);text-align:center}.figure{width:100%;max-height:44vh;object-fit:cover;border:6px solid var(--white);border-radius:22px;box-shadow:0 16px 28px var(--shade)}.icon{font-size:2.6rem;display:block;margin-bottom:.2rem}.badge{display:inline-block;border:2px solid var(--orange);color:#a93e21;padding:.35em .6em;font:bold .76rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;transform:rotate(-3deg)}.timeline{display:flex;gap:.5rem;align-items:center;position:relative;z-index:1}.timeline .node{flex:1;border-radius:16px;padding:1rem;text-align:center;background:var(--white);border:2px solid #071f3d22}.timeline .line{height:5px;flex:0 0 3rem;background:var(--orange)}.timer{font:900 clamp(4rem,9vw,8.5rem) Arial,sans-serif;text-align:center;color:#167e9a;margin:.08em}.center{text-align:center}.footer{position:absolute;left:8vw;right:8vw;bottom:5.4rem;border-top:2px dashed #071f3d3d;z-index:2}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.1rem 1.15rem 6.7rem}.two,.three,.four{grid-template-columns:1fr}.tools{top:.55rem;right:.55rem}.nav{bottom:.6rem}.figure{max-height:28vh}.footer{left:1.2rem;right:1.2rem;bottom:4.7rem}.veil{background:linear-gradient(90deg,#071f3ded,#071f3d78)}h1{font-size:3.6rem}.timeline{flex-direction:column}.timeline .line{height:2rem;width:5px;flex:0 0 2rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="experience-v3.css">
</head><body><main id="deck" class="deck"></main><div class="tools"><button id="menu">Map</button><button id="notesBtn">Notes</button></div><div id="note" class="note"></div><div id="map" class="map"></div><nav class="nav"><button id="prev" aria-label="Previous scene">←</button><span class="count" id="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next scene">→</button></nav><script>
const scenes=[
{t:'Invented Here',n:'2 min. Let students study the collage silently. Ask: What is being made, tested or powered? Do not explain the grammar yet.',b:`<img class="hero" src="assets/invented-here-hero.png" alt="Teenagers presenting a solar backpack, robot, water bottle, 3D printer and wind charger in a maker lab"><div class="veil"></div><div class="titleCopy"><h3>Lesson 14 · passive voice</h3><h1>Invented<br>Here</h1><p>Technology, inventions and the grammar of how things get made.</p><span class="tag">Notice</span><span class="tag">Build</span><span class="tag">Explain</span></div>`},
{t:'Check in: what do you use?',n:'4 min. Students may choose an imaginary invention. Pair-share one reason.',b:`<h3>01 · check-in</h3><h2>Which invention helps you most?</h2><div class="grid four" id="moodGrid">${['a phone','a bicycle','a washing machine','the internet','a robot','a game console','a camera','something imaginary'].map(x=>`<button class="choice" data-choice="${x}">${x}</button>`).join('')}</div><p id="moodResult" class="word">Choose one, then add: “It is useful because…”</p>`},
{t:'Bridge from Lesson 13',n:'3 min. Use the previous debate’s language: “In my opinion…” Then shift focus from opinions to objects and processes.',b:`<h3>02 · warm bridge</h3><h2>Last lesson was about ideas. Today we watch what happens to things.</h2><div class="paper"><p class="quote">“People design inventions. Inventions are designed.”</p><p>Who is important in each sentence: the people, or the invention?</p></div>`},
{t:'Picture detective',n:'5 min. Display the four-image sheet. Students choose one object and describe what happens to it using gestures or simple verbs.',b:`<h3>03 · visual lead-in</h3><h2>What is happening in the pictures?</h2><img class="figure" src="assets/invention-cards.png" alt="Four visual invention cards showing a robot watering a plant, a wind charger, a 3D printer and a water filter"><div class="grid four"><div class="card"><span class="icon">🤖</span><p>It waters a plant.</p></div><div class="card"><span class="icon">🌬️</span><p>It charges a phone.</p></div><div class="card"><span class="icon">🖨️</span><p>It prints an object.</p></div><div class="card"><span class="icon">💧</span><p>It filters water.</p></div></div>`},
{t:'Today’s mission',n:'1 min. Read the objectives. Point to the visual figure on the next scenes as a preview.',b:`<h3>04 · objectives</h3><h2>By the end, you can…</h2><div class="grid three"><div class="card"><p class="word">01</p><p>describe inventions with passive sentences</p></div><div class="card"><p class="word">02</p><p>choose the correct form of <b>be + past participle</b></p></div><div class="card"><p class="word">03</p><p>explain a process and present an invention</p></div></div>`},
{t:'Invention words',n:'5 min. Tap, repeat and mime each word. Use the pictures as memory hooks.',b:`<h3>05 · vocabulary discovery</h3><h2>Tap → reveal → use it</h2><div class="grid three">${[['design','plan how something will look or work'],['invent','create something new'],['assemble','put parts together'],['test','check if something works'],['power','give energy to a machine'],['recycle','use material again']].map(([w,d])=>`<button class="card reveal"><span class="word">${w}</span><div class="answer">${d}<br><br><i>Example: “The machine is tested every week.”</i></div></button>`).join('')}</div>`},
{t:'Process verbs in pictures',n:'4 min. Students match each verb to a stage with a partner. Click to reveal the passive form.',b:`<h3>06 · picture practice</h3><h2>What happens to the invention?</h2><div class="grid four">${[['🧩','assemble','is assembled'],['🔍','test','is tested'],['⚡','power','is powered'],['♻️','recycle','is recycled']].map(([i,w,a])=>`<button class="card reveal"><span class="icon">${i}</span><span class="word">${w}</span><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Active or passive?',n:'5 min. Students compare the focus of each sentence. Tap the cards to reveal the “spotlight”.',b:`<h3>07 · grammar discovery</h3><h2>Same event. Different spotlight.</h2><div class="grid two"><button class="card reveal activeBox"><h3>Active</h3><p class="sentence">Engineers test the robot.</p><div class="answer">Spotlight: <b>engineers</b> (the doer).</div></button><button class="card reveal passiveBox"><h3>Passive</h3><p class="sentence">The robot is tested.</p><div class="answer">Spotlight: <b>the robot</b> (the result/object).</div></button></div><p class="word">Passive voice is useful when the action/result matters more than the doer.</p>`},
{t:'The passive formula',n:'4 min. Say the formula with hand beats: be / past participle. Students complete the examples aloud.',b:`<h3>08 · form</h3><h2>Build the machine of the sentence.</h2><div class="formula">subject + be + past participle</div><div class="grid three"><div class="card"><p class="word">Present</p><p class="sentence">The bottle <b>is cleaned</b>.</p></div><div class="card"><p class="word">Past</p><p class="sentence">The bottle <b>was invented</b>.</p></div><div class="card"><p class="word">Future</p><p class="sentence">The bottle <b>will be improved</b>.</p></div></div>`},
{t:'Present passive',n:'4 min. Elicit <b>am / is / are</b> from the subject. Use the quick choices for agreement.',b:`<h3>09 · present form</h3><h2>Facts and routines</h2><div class="grid three" id="presentGrid"><button class="choice" data-answer="good">Solar panels are used on this roof.</button><button class="choice" data-answer="bad">Solar panels is used on this roof.</button><button class="choice" data-answer="good">The robot is charged at night.</button></div><p id="presentResult" class="word">Choose a sentence that sounds correct.</p>`},
{t:'Past passive',n:'4 min. Connect the grammar to history: the invention happened before now.',b:`<h3>10 · past form</h3><h2>Finished inventions and discoveries</h2><div class="timeline"><div class="node"><b>Past</b><br><span class="word">was / were</span></div><div class="line"></div><div class="node"><b>Now</b><br>we know the result</div></div><div class="grid two"><div class="card"><p class="sentence">The first photograph <b>was taken</b> in the 1800s.</p></div><div class="card"><p class="sentence">Many early tools <b>were made</b> by hand.</p></div></div>`},
{t:'Negative and questions',n:'5 min. Students transform one sentence with a partner, then click a model.',b:`<h3>11 · forms</h3><h2>Turn the switch.</h2><div class="grid three"><div class="card"><h3>Positive</h3><p class="sentence">The battery <b>is recycled</b>.</p></div><div class="card"><h3>Negative</h3><p class="sentence">The battery <b>isn’t recycled</b>.</p></div><div class="card"><h3>Question</h3><p class="sentence"><b>Is</b> the battery recycled?</p></div></div><p class="word">Short answer: Yes, it is. / No, it isn’t.</p>`},
{t:'By whom?',n:'4 min. Explain that <b>by + agent</b> is optional. Add it when the doer is important or interesting.',b:`<h3>12 · agents</h3><h2>Sometimes the inventor matters.</h2><div class="grid two"><div class="card passiveBox"><p class="sentence">The light bulb was improved <b>by many inventors</b>.</p><p>Useful when we want to name the people.</p></div><div class="card activeBox"><p class="sentence">The light bulb was improved.</p><p>Useful when the result is the main point.</p></div></div>`},
{t:'Modal + passive',n:'4 min. Keep the pattern visual: modal + be + past participle. Students choose a sensible invention rule.',b:`<h3>13 · can / must</h3><h2>Rules for responsible technology</h2><div class="grid three"><div class="card"><p class="sentence">Old phones <b>can be recycled</b>.</p></div><div class="card"><p class="sentence">Passwords <b>must be protected</b>.</p></div><div class="card"><p class="sentence">Batteries <b>should be stored</b> safely.</p></div></div>`},
{t:'Time to notice the participle',n:'4 min. Students sort regular and irregular forms. Tap for the answer.',b:`<h3>14 · word forms</h3><h2>Spot the past participle.</h2><div class="grid four">${[['design','designed'],['invent','invented'],['make','made'],['build','built'],['write','written'],['choose','chosen'],['test','tested'],['discover','discovered']].map(([a,b])=>`<button class="card reveal"><span class="word">${a}</span><div class="answer">${b}</div></button>`).join('')}</div>`},
{t:'Repair the machine',n:'5 min. Pairs correct the sentence before tapping. Ask for the rule: missing be, wrong be, or wrong participle.',b:`<h3>15 · common mistakes</h3><h2>Find the broken part.</h2><div class="grid two">${[['The phone is make in Korea.','The phone is <b>made</b> in Korea.'],['The robots are tested yesterday.','The robots <b>were tested</b> yesterday.'],['The screen built by engineers.','The screen <b>was built</b> by engineers.'],['The batteries must recycled.','The batteries must <b>be recycled</b>.']].map(([q,a])=>`<button class="card reveal"><p class="sentence">${q}</p><div class="answer">${a}</div></button>`).join('')}</div>`},
{t:'Controlled practice',n:'5 min. Students choose answers individually, then explain one choice to a partner.',b:`<h3>16 · choose the form</h3><h2>Which sentence fits the picture?</h2><div class="grid two" id="practiceGrid">${[['Every day, the robot ___ (charge) at 8 p.m.','is charged'],['Last year, the prototype ___ (test) in a lab.','was tested'],['Old parts ___ (can / recycle).','can be recycled'],['The next model ___ (will / improve) next month.','will be improved']].map(([q,a])=>`<button class="card reveal"><p class="sentence">${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'The invention timeline',n:'5 min. Ask groups to point at each stage and produce one passive sentence. Then reveal the model line.',b:`<h3>17 · process figure</h3><h2>From material to useful object</h2><img class="figure" src="assets/invention-process.png" alt="Four-step wordless process showing materials entering a workshop, a solar backpack being assembled, tested and displayed"><div class="timeline"><div class="node">materials<br><span class="word">are collected</span></div><div class="line"></div><div class="node">parts<br><span class="word">are assembled</span></div><div class="line"></div><div class="node">design<br><span class="word">is tested</span></div><div class="line"></div><div class="node">product<br><span class="word">is displayed</span></div></div>`},
{t:'Read the maker story',n:'5 min. Teacher reads twice. Students listen for passive verbs. On the second read, they underline the process words.',b:`<h3>18 · reading / listening</h3><h2>A solar backpack is born.</h2><div class="paper"><p>First, recycled fabric <b>is collected</b>. Next, small solar panels <b>are attached</b> to the bag. The wires <b>are connected</b> and the backpack <b>is tested</b> in bright sunlight. Finally, it <b>is shown</b> at the school invention fair. The first model <b>was designed</b> by a student team.</p></div><div class="grid three"><div class="card"><span class="badge">collect</span><p>materials</p></div><div class="card"><span class="badge">attach</span><p>panels</p></div><div class="card"><span class="badge">test</span><p>the result</p></div></div>`},
{t:'Reading check',n:'4 min. Students answer first, then tap the cards. Accept full-sentence answers.',b:`<h3>19 · comprehension</h3><h2>What happened to the backpack?</h2><div class="grid three">${[['What is collected first?','Recycled fabric is collected.'],['Where are the panels attached?','They are attached to the bag.'],['Who designed the first model?','A student team designed it.']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Picture-to-sentence lab',n:'5 min. Groups choose one invention picture and write three passive sentences: what it is, how it is powered, and how it is tested.',b:`<h3>20 · group practice</h3><h2>Make the picture speak.</h2><div class="grid two"><div class="card"><p class="word">Choose</p><p>robot · wind charger · 3D printer · water filter</p><p class="small">Use the visual card sheet from Scene 4 as your reference.</p></div><div class="card passiveBox"><p class="word">Sentence frame</p><p class="sentence">“The ___ is ___.”</p><p class="sentence">“It is powered by ___.”</p><p class="sentence">“It is tested ___.”</p></div></div>`},
{t:'Invention museum labels',n:'6 min. Pairs pretend they work in a museum. One student is the guide; one is the visitor. Use passive voice in every label.',b:`<h3>21 · speaking</h3><h2>Explain an invention to a visitor.</h2><div class="grid three"><div class="card"><h3>What is it?</h3><p>“This device is called…”</p></div><div class="card"><h3>How is it made?</h3><p>“It is made from…”</p></div><div class="card"><h3>Why is it useful?</h3><p>“It can be used to…”</p></div></div><p class="word">Use a real or imaginary invention.</p>`},
{t:'90-second design pitch',n:'7 min. Teams prepare a tiny pitch. Start the timer. Each team must use at least four passive forms.',b:`<h3>22 · production task</h3><h2>Present: “Our invention is…”</h2><div id="timer" class="timer">01:30</div><div class="center"><button id="timerStart">Start / pause</button><button id="timerReset">Reset</button></div><div class="grid four"><div class="card"><span class="word">is designed</span></div><div class="card"><span class="word">is powered</span></div><div class="card"><span class="word">is tested</span></div><div class="card"><span class="word">can be used</span></div></div>`},
{t:'Peer feedback: spot the passive',n:'4 min. Listeners hold up one finger for each passive sentence they hear. Then give one kind, specific comment.',b:`<h3>23 · feedback</h3><h2>Listen like an engineer.</h2><div class="grid three"><div class="card"><span class="icon">👂</span><p>I heard a clear passive sentence.</p></div><div class="card"><span class="icon">🔧</span><p>I understood how it works.</p></div><div class="card"><span class="icon">💡</span><p>I can imagine using it.</p></div></div>`},
{t:'Invented Here quiz',n:'5 min. Teams tap to reveal answers. Award a visual “maker badge” for accurate explanations.',b:`<h3>24 · review quiz</h3><h2>Collect four maker badges.</h2><div class="grid two" id="paintQuiz">${[['What is the passive formula?','be + past participle'],['“Engineers test the robot.” →','The robot is tested.'],['Which is correct?','The parts were assembled.'],['Complete: Old phones can ___ recycled.','be']].map(([q,a])=>`<button class="card reveal"><p>${q}</p><div class="answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Homework: invention blueprint',n:'2 min. Students may draw an imaginary device instead of using personal information or a real product.',b:`<h3>25 · homework</h3><h2>Draw the blueprint.</h2><div class="grid three"><div class="card"><h3>Draw</h3><p>Sketch an invention and label 4 parts.</p></div><div class="card"><h3>Describe</h3><p>Write 5 passive sentences about how it is made or used.</p></div><div class="card"><h3>Challenge</h3><p>Add one past passive sentence: “It was invented by…”</p></div></div>`},
{t:'Exit ticket',n:'2 min. Students choose one prompt and answer with a complete sentence. Preview Lesson 15.',b:`<h3>26 · exit ticket</h3><h2>What can you explain now?</h2><div class="grid three" id="exitStrip"><button class="choice">One passive sentence I can say is…</button><button class="choice">One invention process I can describe is…</button><button class="choice">One mistake I will avoid is…</button></div><p id="exitResult" class="word">Choose one, then answer aloud or on paper.</p><p class="footer"></p><p class="small">Next: Pronunciation + Fluency — Sound Natural in English</p>`}
];
const deck=document.querySelector('#deck');let current=0;deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML=`<h3 style="color:var(--lime)">Invented Here map</h3>${scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('')}`;
function show(i){current=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#count').textContent=`${current+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(current+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#menu').onclick=()=>map.classList.toggle('open');document.querySelector('#notesBtn').onclick=()=>{note.innerHTML=`<b>Teacher note · ${current+1}</b><br>${scenes[current].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#notesBtn').click()});let x0=null;document.addEventListener('touchstart',e=>x0=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].screenX-x0;if(Math.abs(d)>45)show(current+(d<0?1:-1));x0=null},{passive:true});document.querySelectorAll('.reveal').forEach(x=>x.onclick=()=>x.classList.toggle('open'));document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');document.querySelector('#moodResult').textContent=`Good choice: ${x.dataset.choice}. Now add “because…”`});document.querySelectorAll('#presentGrid .choice').forEach(x=>x.onclick=()=>{document.querySelectorAll('#presentGrid .choice').forEach(y=>y.classList.remove('good','bad'));x.classList.add(x.dataset.answer);document.querySelector('#presentResult').textContent=x.dataset.answer==='good'?'Correct — check the subject and choose is/are.':'Try again — match is/are to the subject.'});document.querySelectorAll('#exitStrip .choice').forEach(x=>x.onclick=()=>{x.classList.add('selected');document.querySelector('#exitResult').textContent='Now give your complete answer.'});let seconds=90,handle=null;const timer=document.querySelector('#timer');const paint=()=>{timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`};paint();document.querySelector('#timerStart').onclick=()=>{if(handle){clearInterval(handle);handle=null;return}handle=setInterval(()=>{if(seconds>0){seconds--;paint()}else{clearInterval(handle);handle=null;timer.textContent='TIME!'}},1000)};document.querySelector('#timerReset').onclick=()=>{clearInterval(handle);handle=null;seconds=90;paint()};
</script><style>.titleCopy{color:#fff!important;text-shadow:0 3px 14px #000b}.titleCopy h1,.titleCopy p{color:#fff!important}</style><script src="experience-v3.js"></script>
