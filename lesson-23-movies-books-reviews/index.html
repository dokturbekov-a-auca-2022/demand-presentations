<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 23 — Critics’ Zine</title><style>
:root{--black:#141414;--red:#e84f3d;--cream:#fff2c8;--cyan:#71d9e5;--ink:#222}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:cut .35s both}.scene:after{content:'★';position:absolute;right:4vw;bottom:7vh;color:var(--red);font-size:5rem;opacity:.13}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#141414ed,#141414aa 50%,#14141422)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--red);background:#1414149e}.title h1{font:900 clamp(4rem,8vw,9rem)/.8 'Courier New',monospace;text-transform:uppercase;margin:.1em 0}.title p{font:clamp(1.1rem,2vw,1.7rem)/1.25 Georgia,serif}.eyebrow,h3{font:900 .78rem 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}h2{font:900 clamp(2rem,4vw,4.2rem)/.92 'Courier New',monospace;text-transform:uppercase;color:var(--black);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.marquee{background:var(--black);color:var(--cream);padding:1rem 1.3rem;border-left:12px solid var(--red);font:900 clamp(1.3rem,2.2vw,2.3rem)/1.1 'Courier New',monospace;text-transform:uppercase;letter-spacing:.03em}.strip{display:flex;gap:.8rem;flex-wrap:wrap}.frame{background:#fff;border:3px solid var(--black);padding:1rem;box-shadow:7px 7px 0 var(--red);min-height:8rem}.frame:nth-child(2){box-shadow:7px 7px 0 var(--cyan)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--cyan)}.choice{background:#fff;border:3px solid var(--black);padding:.85rem 1rem;font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #14141422}.choice:hover,.choice.selected{background:var(--cyan)}.quote{background:#fff;padding:1.2rem;border-left:10px solid var(--red);font:italic clamp(1.3rem,2.2vw,2.1rem)/1.2 Georgia,serif;box-shadow:8px 8px 0 #14141422}.stars{font-size:2.3rem;letter-spacing:.15em;color:var(--red);cursor:pointer}.stars span{opacity:.25}.stars span.on{opacity:1}.poster{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}.poster .frame{min-height:10rem}.feedback{font-weight:900;color:var(--red);min-height:1.5em}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--red);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#141414ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--cyan)}.note,.map{display:none;position:fixed;z-index:30;background:#141414f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.meter{height:20px;background:#d9c8a2;margin:1rem 0}.meter i{display:block;height:100%;width:30%;background:var(--cyan);transition:.25s}.timer{font:900 clamp(4rem,8vw,7rem) 'Courier New';text-align:center;color:var(--red)}@keyframes cut{from{opacity:0;transform:translateY(12px) rotate(-.5deg)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.grid2,.poster{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">ZINE MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Critics’ Zine','2 min. Open on the film-club image. Ask what makes a story worth sharing.',`<img class="hero" src="${A}cinema-club.png" alt="Illustrated teen film club in a small cinema with projector and notebooks"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 23 · speaking lesson</div><h1>Critics’<br>Zine</h1><p>Talk about movies and books with reasons, reactions, and respectful reviews.</p><span class="marquee">WATCH · READ · REVIEW</span></div>`),
S('Check-in: pick a story','4 min. Students may choose a real or imaginary title.',`<div class="stage"><h3>01 · check-in</h3><h2>Which story would you recommend?</h2><div class="strip" id="pick"><button class="choice">a funny movie</button><button class="choice">a mystery book</button><button class="choice">a superhero story</button><button class="choice">a documentary</button><button class="choice">one I invent</button></div><p id="pickOut" class="feedback">Choose one and say why.</p></div>`),
S('Bridge from Lesson 22','3 min. Reuse hobby language to discuss watching and reading.',`<div class="stage"><h3>02 · bridge</h3><div class="quote">“I enjoy reading stories that surprise me.”</div><p>Today we grow that sentence into a review with a plot, a character, and a reason.</p></div>`),
S('Read the poster','5 min. Students predict vocabulary from the image.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What is on the critic’s desk?</h2><img class="figure" src="${A}review-desk.png" alt="Illustrated review desk with open book movie ticket headphones pencil and star stickers"><p class="feedback">Name three objects and one opinion word.</p></div>`),
S('Today’s zine route','1 min. Preview the speaking progression.',`<div class="stage"><h3>04 · route</h3><div class="poster"><div class="frame"><b>Notice</b><p>story parts</p></div><div class="frame"><b>React</b><p>feelings + reasons</p></div><div class="frame"><b>Publish</b><p>a mini review</p></div></div></div>`),
S('Story ingredients','5 min. Students tap an ingredient and give an example.',`<div class="stage"><h3>05 · vocabulary</h3><div class="poster" id="ingredients"><button class="frame choice" data-ing="plot"><b>plot</b><p>what happens</p></button><button class="frame choice" data-ing="character"><b>character</b><p>who is in it</p></button><button class="frame choice" data-ing="setting"><b>setting</b><p>where/when</p></button><button class="frame choice" data-ing="ending"><b>ending</b><p>how it finishes</p></button><button class="frame choice" data-ing="scene"><b>scene</b><p>one moment</p></button><button class="frame choice" data-ing="theme"><b>theme</b><p>big idea</p></button></div><p id="ingOut" class="feedback">Tap one and use it in a sentence.</p></div>`),
S('Reaction words','5 min. Students place a word on a feeling line.',`<div class="stage"><h3>06 · reactions</h3><div class="strip" id="react"><button class="choice">moving</button><button class="choice">confusing</button><button class="choice">hilarious</button><button class="choice">tense</button><button class="choice">thought-provoking</button><button class="choice">predictable</button></div><p id="reactOut" class="feedback">Choose one. Add “because …”</p></div>`),
S('Reasons make opinions useful','4 min. Model opinion + evidence.',`<div class="stage"><h3>07 · review formula</h3><div class="marquee">OPINION + BECAUSE + DETAIL</div><div class="quote">“I found the ending moving because the character finally told the truth.”</div></div>`),
S('Book or movie?','4 min. Students choose the language that fits the medium.',`<div class="stage"><h3>08 · compare</h3><div class="grid2"><div class="frame"><b>Book</b><p>page · chapter · narrator · author</p></div><div class="frame"><b>Movie</b><p>scene · actor · soundtrack · director</p></div></div></div>`),
S('Star bar','4 min. Students rate a fictional story and explain the number.',`<div class="stage"><h3>09 · rating</h3><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><p id="starOut" class="feedback">Choose a rating, then give one reason.</p></div>`),
S('Polite disagreement','5 min. Practise disagreeing with the idea, not the person.',`<div class="stage"><h3>10 · discussion tools</h3><div class="poster"><div class="frame"><b>I see your point, but …</b></div><div class="frame"><b>For me, the strongest part was …</b></div><div class="frame"><b>Maybe, although I felt …</b></div></div></div>`),
S('Review opener lab','5 min. Students choose an opener and complete it.',`<div class="stage"><h3>11 · openings</h3><div class="strip" id="openers"><button class="choice">This story follows …</button><button class="choice">The book is set in …</button><button class="choice">The film works because …</button><button class="choice">I would recommend it to …</button></div><p id="openOut" class="feedback">Tap an opener and add a title.</p></div>`),
S('A mini review','5 min. Students notice the four moves in a model.',`<div class="stage"><h3>12 · model</h3><div class="quote"><b>Title:</b> The Paper Moon<br><b>Plot:</b> A shy student builds a radio.<br><b>Reaction:</b> I found it hopeful because the friendships felt real.<br><b>Recommendation:</b> I’d recommend it to people who like quiet adventures.</div></div>`),
S('Common review traps','4 min. Repair vague or rude comments.',`<div class="stage"><h3>13 · repair</h3><div class="grid2"><div class="frame"><b>Too vague</b><p>“It was good.”</p><p>Add a detail.</p></div><div class="frame"><b>Too personal</b><p>“Anyone who likes it is silly.”</p><p>Disagree politely.</p></div></div></div>`),
S('Read the zine excerpt','2 min. Predict the reviewer’s opinion.',`<div class="stage"><h3>14 · reading preview</h3><div class="quote">“The Glass Elevator is strange, bright, and difficult to forget.”</div><p>Which word sounds positive? Which sounds uncertain?</p></div>`),
S('Text: The Glass Elevator','6 min. Partner-read and mark evidence.',`<div class="stage"><h3>15 · close reading</h3><div class="quote"><p>The Glass Elevator follows Noor, a teenager who discovers a lift that stops at forgotten memories. The setting is imaginative, and the soundtrack makes every floor feel tense. Some scenes are confusing, but the final chapter gives the story a warm, surprising ending. I would recommend it to readers who enjoy unusual adventures.</p></div><p>Underline the plot. Circle one reaction. Box the recommendation.</p></div>`),
S('Evidence check','4 min. Click the detail that supports each statement.',`<div class="stage"><h3>16 · evidence</h3><div class="grid2" id="evidence"><button class="choice">The setting is imaginative.</button><button class="choice">The soundtrack creates tension.</button><button class="choice">Some scenes are confusing.</button><button class="choice">The ending is warm and surprising.</button></div><p id="evidOut" class="feedback">Point to the sentence that proves it.</p></div>`),
S('Compare two scenes','4 min. Use the image to contrast book and movie choices.',`<div class="stage"><h3>17 · visual compare</h3><img class="figure" src="${A}compare-scenes.png" alt="Illustrated split scene showing teens comparing a film frame and a book scene"><p class="feedback">Use: “The book…, while the movie…”</p></div>`),
S('Question cards for critics','5 min. Partners ask and answer three review questions.',`<div class="stage"><h3>18 · pair questions</h3><div class="poster"><div class="frame"><b>What happens?</b><p>Give a spoiler-free plot.</p></div><div class="frame"><b>Who stands out?</b><p>Describe one character.</p></div><div class="frame"><b>Would you recommend it?</b><p>Give a reason.</p></div></div></div>`),
S('Information gap: mystery title','6 min. Partner A has clues; Partner B guesses the genre and audience.',`<div class="stage"><h3>19 · information gap</h3><div class="grid2"><div class="marquee">CLUES: fog · old house · missing diary</div><div class="marquee">CLUES: robots · future city · big question</div></div><p>Ask: “Is it a mystery?” “Who would enjoy it?”</p></div>`),
S('Review speed-date','6 min. Switch partners after each one-minute review.',`<div class="stage"><h3>20 · speaking circuit</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START REVIEW ROUND</button><p>Use one opener, one reaction, one reason, and one recommendation.</p></div>`),
S('Build a zine page','7 min. Students create a visual review page for a real or invented story.',`<div class="stage"><h3>21 · production setup</h3><div class="poster"><div class="frame"><b>Headline</b><p>Title + one strong adjective.</p></div><div class="frame"><b>Body</b><p>Plot + detail + reaction.</p></div><div class="frame"><b>Stamp</b><p>Recommend / maybe / skip.</p></div></div></div>`),
S('Publish your review','7 min. Students present their page in 45 seconds.',`<div class="stage"><h3>22 · production</h3><div class="marquee">NO SPOILERS · SPECIFIC REASONS · RESPECTFUL VOICES</div><p>Listeners write one detail they remember and one question they still have.</p></div>`),
S('Peer editor marks','5 min. Partners use three editor stamps.',`<div class="stage"><h3>23 · feedback</h3><div class="strip"><span class="stamp">CLEAR PLOT</span><span class="stamp">STRONG REASON</span><span class="stamp">POLITE VOICE</span></div></div>`),
S('Review quiz','5 min. Teams choose the strongest review sentence.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">It was good.</button><button class="choice">I found the ending moving because the detail felt honest.</button><button class="choice">Anyone who dislikes it is wrong.</button><button class="choice">I’d recommend it to readers who enjoy mysteries.</button></div><p id="quizOut" class="feedback">Choose the sentences that include useful detail or a respectful recommendation.</p></div>`),
S('Star bar reflection','3 min. Students rate their own speaking today.',`<div class="stage"><h3>25 · reflection</h3><div class="stars" id="selfStars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><p id="selfOut" class="feedback">Choose a star and name one skill you used.</p></div>`),
S('Homework: publish a micro-review','2 min. Students write or record a 60-second spoiler-free review.',`<div class="stage"><h3>26 · homework</h3><div class="marquee">TITLE · PLOT · REACTION · REASON · RECOMMENDATION</div><p>Choose a movie, book, series, or invented story. Add one comparison if you can.</p></div>`),
S('Exit ticket','2 min. Students complete one critic’s line. Preview Phrasal Verbs.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Sign off your zine.</h2><div class="strip" id="exit"><button class="choice">I recommend … because …</button><button class="choice">The character who stood out was …</button><button class="choice">One respectful phrase I can use is …</button></div><p id="exitOut" class="feedback">Choose one and finish it for a partner.</p><div class="eyebrow">Next: Phrasal Verbs · Daily Life</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--cyan)">Critics’ Zine map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{b.classList.add('selected');ingOut.textContent=`Use “${b.dataset.ing}” in a review sentence.`});document.querySelectorAll('#react .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');reactOut.textContent=`${b.textContent} — add because + a detail.`});document.querySelectorAll('#ingredients .choice').forEach(b=>b.onclick=()=>ingOut.textContent=`${b.dataset.ing}: give one example.`);document.querySelectorAll('#openers .choice').forEach(b=>b.onclick=()=>openOut.textContent=`Add a title after: ${b.textContent}`);document.querySelectorAll('#evidence .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');evidOut.textContent='Evidence selected — point to the line.'});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Keep the sentences with a detail or respectful recommendation.'});document.querySelectorAll('#stars span,#selfStars span').forEach((s,i,all)=>s.onclick=()=>{all.forEach((x,n)=>x.classList.toggle('on',n<=i));(s.closest('#stars')?starOut:selfOut).textContent=`${i+1} stars — add a reason.`});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');exitOut.textContent='Finish the critic’s line for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #000}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe1a2!important}</style></body></html>
