<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>Lesson 23 - Midnight Story Festival</title>
  <style>
    :root{--midnight:#07101f;--ink:#10213b;--ivory:#f6f0e4;--amber:#f4b942;--red:#9e2735;--blue:#2c5fff;--silver:#b9c6d6;--white:#fffdf7;--green:#b7d96f;--muted:#57687a}
    *{box-sizing:border-box}html,body{height:100%;touch-action:pan-x pan-y pinch-zoom}body{margin:0;background:var(--midnight);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}button{font:800 1rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer;touch-action:manipulation}#deck{height:100vh}

    .scene.active[data-transition="iris"]{animation:irisIn .68s cubic-bezier(.2,.8,.2,1) both}.scene.active[data-transition="shutter"]{animation:shutterIn .55s cubic-bezier(.2,.8,.2,1) both}.scene.active[data-transition="focus"]{animation:focusIn .62s ease-out both}.scene.active[data-transition="light"]{animation:lightIn .62s cubic-bezier(.15,.8,.25,1) both}

    .hero,.awardHero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}.heroShade,.awardShade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#07101ff8 0 40%,#07101fa8 56%,transparent 77%)}.titleCopy{color:var(--white);max-width:45rem;padding-top:9vh}.titleCopy p{font-size:clamp(1.15rem,1.9vw,1.6rem);max-width:30ch}.titleRule{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:1rem}.titleRule span{padding:.42rem .68rem;border:1px solid #fff7;color:var(--amber);letter-spacing:.08em;font-weight:900}
    .taskNote{display:flex;gap:.65rem;align-items:flex-start;margin:.7rem 0 1rem;padding:.78rem 1rem;background:#e5edf5;border-left:8px solid var(--red);font-weight:800;line-height:1.4}.taskIcon{display:inline-grid;place-items:center;flex:0 0 1.65rem;height:1.65rem;border-radius:50%;background:var(--ink);color:var(--white);font-family:Georgia,serif;font-style:italic}
    .passLine{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.55rem}.pass{min-height:9.5rem;padding:.8rem .55rem;background:var(--white);border-top:8px solid var(--tone);color:var(--ink);text-align:left;box-shadow:0 7px 0 #10213b18}.pass strong{display:block;font:900 2rem/1 Georgia;color:var(--tone);margin-bottom:.5rem}.pass.selected{background:#fff0c3;transform:translateY(-5px)}
    .splitStage{display:grid;grid-template-columns:1.05fr .95fr;gap:1.3rem;align-items:center}.splitStage>*{min-width:0}.featureImage{width:100%;max-height:61vh;object-fit:cover;border:7px solid var(--midnight);box-shadow:12px 12px 0 var(--amber)}.genreList{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.genre{padding:.7rem;background:var(--white);border-left:7px solid var(--tone);font-weight:900}
    .objectiveArc{display:flex;gap:.55rem;align-items:stretch}.objective{flex:1;padding:1rem;background:var(--midnight);color:var(--white);border-bottom:9px solid var(--tone);min-height:8rem}.objective b{display:block;color:var(--amber);font-size:1.15rem;margin-bottom:.35rem}
    .deskFrame{position:relative}.deskFrame img{width:100%;height:65vh;object-fit:cover;border:7px solid var(--midnight)}.deskLabel{position:absolute;padding:.55rem .7rem;background:var(--white);border:2px solid var(--ink);font-weight:900;box-shadow:4px 4px 0 var(--amber)}.deskLabel:nth-of-type(1){left:34%;top:34%}.deskLabel:nth-of-type(2){left:8%;top:13%}.deskLabel:nth-of-type(3){right:12%;top:18%}.deskLabel:nth-of-type(4){right:11%;bottom:21%}.deskLabel:nth-of-type(5){left:8%;bottom:18%}

    .disagreeStage{display:grid;grid-template-columns:.78fr 1.22fr;gap:1rem}.disagreeCore{padding:1.1rem;background:var(--midnight);color:var(--white)}.disagreeCore h2{color:var(--white)}.phraseStack{display:grid;gap:.55rem}.phrase{padding:.8rem 1rem;background:var(--white);border-bottom:7px solid var(--tone);font-weight:900}

    .storyHero{position:relative}.storyHero img{width:100%;height:66vh;object-fit:cover;border:7px solid var(--midnight)}.storyPanel{position:absolute;left:4%;top:50%;transform:translateY(-50%);width:min(31rem,42%);padding:1.1rem;background:#07101fe9;color:var(--white);border-left:10px solid var(--amber)}.storyPanel h2{color:var(--white)}

    .shortlistFrame{position:relative}.shortlistFrame img{width:100%;height:62vh;object-fit:cover;border:7px solid var(--midnight)}.shortlistCards{position:absolute;left:3%;right:3%;bottom:4%;display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.shortlist{padding:.85rem;background:#fffdf3ed;border-top:8px solid var(--tone);color:var(--ink);text-align:left}.shortlist.selected{background:#ffe4a0;transform:translateY(-5px)}.shortlist b{display:block;font-size:1.2rem}
    .juryStage{position:relative}.juryStage img{width:100%;height:64vh;object-fit:cover;border:7px solid var(--midnight)}.juryBrief{position:absolute;left:3%;top:50%;transform:translateY(-50%);width:min(28rem,38%);padding:1.1rem;background:#f6f0e4ec;border-left:10px solid var(--red);box-shadow:10px 10px 0 var(--amber)}
    .juryRoles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.juryRole{min-height:12rem;padding:.75rem .55rem;background:var(--white);border-bottom:9px solid var(--tone)}.juryRole strong{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--midnight);color:var(--white);margin-bottom:.45rem}.juryRole b{display:block;margin-bottom:.35rem}.juryRole small{line-height:1.35;color:var(--muted)}
    .timerStage{display:grid;grid-template-columns:.72fr 1.28fr;gap:1rem;align-items:center}.timerBox{padding:1.2rem;background:var(--midnight);color:var(--white);text-align:center}.timer{font:900 clamp(4rem,8vw,7rem)/1 Georgia;color:var(--amber)}.timerButton{padding:.8rem 1rem;border:2px solid var(--amber);background:var(--red);color:var(--white)}.reviewCue{display:grid;gap:.55rem}.cue{padding:.8rem 1rem;background:var(--white);border-bottom:7px solid var(--tone);font-weight:900}
    .reviewWall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}.reviewCard{min-height:9rem;padding:.8rem;background:var(--midnight);color:var(--white);border:3px solid var(--midnight);text-align:left;transform:rotate(var(--r))}.reviewCard .back{display:none;color:var(--amber);margin-top:.6rem}.reviewCard.open{background:var(--ivory);color:var(--ink)}.reviewCard.open .back{display:block}.score{font:900 1.15rem Georgia;color:var(--red);margin-top:.8rem}
    .awardCopy{color:var(--white);max-width:38rem;padding-top:7vh}.awardCopy h2{color:var(--white)}.awardChecklist{display:grid;gap:.45rem}.awardChecklist span{padding:.55rem .75rem;background:#f6f0e4e8;color:var(--ink);font-weight:900}
    .finalSplit{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.homework{padding:1.1rem;background:var(--white);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--blue)}.exit{padding:1.1rem;background:#ffe4a0;border:4px solid var(--ink)}.exitOptions{display:grid;gap:.55rem}.exitOption{padding:.72rem;background:var(--white);border:2px solid var(--ink);color:var(--ink);text-align:left}.exitOption.selected{background:var(--green)}
    .feedback{font-weight:900;color:var(--red);min-height:1.5em}.tools{position:fixed;z-index:40;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--red);color:var(--white);padding:.58rem .82rem;font-weight:900}.tools button{box-shadow:3px 3px 0 var(--midnight)}.nav{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:1rem;background:#07101ff2;color:var(--white);padding:.5rem .8rem;display:flex;gap:.65rem;align-items:center;border-radius:999px;box-shadow:0 7px 22px #0005}.count{min-width:5rem;text-align:center;font-weight:900}.progress{width:8rem;height:5px;background:#ffffff35}.progress i{display:block;height:100%;background:var(--amber);transition:.35s}.note,.map{display:none;position:fixed;z-index:55;background:#07101ff8;color:var(--white);padding:1rem;top:4.4rem;right:1rem;max-width:32rem;border:2px solid var(--amber)}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(900px,92vw);max-height:78vh;overflow:auto}.map button{margin:.2rem;padding:.45rem;border:0}
    @keyframes irisIn{from{opacity:.2;clip-path:circle(0 at 50% 50%)}to{opacity:1;clip-path:circle(75%)}}@keyframes shutterIn{from{opacity:.2;clip-path:inset(50% 0)}to{opacity:1;clip-path:inset(0)}}@keyframes focusIn{from{opacity:0;filter:blur(13px);transform:scale(1.035)}to{opacity:1;filter:none;transform:none}}@keyframes lightIn{from{opacity:.15;clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{opacity:1;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}@keyframes riseIn{from{opacity:0;transform:translateY(22px)}}@keyframes wave{50%{transform:scaleY(.42);opacity:.45}}
    @media(max-width:980px){.passLine,.storyParts,.comparePrompts,.juryRoles{grid-template-columns:repeat(4,minmax(0,1fr))}.objectiveArc{flex-wrap:wrap}.objective{flex:1 1 12rem}}
    @media(max-width:700px){.scene{padding:4.7rem 1rem 6.9rem}h1{font-size:3.65rem}h2{font-size:2.25rem;max-width:none}.splitStage,.spoilerStage,.disagreeStage,.audioModel,.readingStage,.compareStage,.timerStage,.finalSplit{grid-template-columns:1fr}.passLine,.storyParts,.comparePrompts,.juryRoles,.reviewWall{grid-template-columns:1fr}.objectiveArc{display:grid}.reactionSpectrum{grid-template-columns:1fr}.reaction{min-height:0}.evidenceFormula{grid-template-columns:1fr}.plus{text-align:center}.reviewSequence{display:grid}.classifyGrid,.opinionRun,.questionRun{grid-template-columns:1fr}.classify:nth-child(7),.opinionCard:nth-child(7),.question:nth-child(7){grid-column:auto}.featureImage,.readingImage,.compareImage{max-height:32vh}.deskFrame img{height:55vh;object-position:center}.deskLabel{position:relative!important;inset:auto!important;display:inline-block;margin:.3rem}.storyHero img{height:66vh;object-position:54% center}.storyPanel{position:relative;left:auto;top:auto;transform:none;width:calc(100% - 1rem);margin:-4rem .5rem 0}.shortlistFrame img{height:45vh}.shortlistCards{position:relative;left:auto;right:auto;bottom:auto;grid-template-columns:1fr;margin-top:-2rem;padding:0 .5rem}.juryStage img{height:45vh;object-position:62% center}.juryBrief{position:relative;left:auto;top:auto;transform:none;width:calc(100% - 1rem);margin:-3rem .5rem 0}.hero{object-position:69% center}.awardHero{object-position:72% center}.heroShade,.awardShade{background:#07101fdc}.titleCopy{padding-top:13vh}.awardCopy{padding-top:10vh}.tools{top:.55rem;right:.55rem}.nav{bottom:.55rem}}

<body>
  <main id="deck"></main>
  <div class="tools"><button id="mapBtn">FESTIVAL MAP</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside><aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">&larr;</button><span id="count" class="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">&rarr;</button></nav>
  <script>
    const A='assets/';const S=(title,n,b)=>({title,n,b});const info=text=>`<div class="taskNote motion" style="--d:1"><span class="taskIcon">i</span><span>${text}</span></div>`;
    const scenes=[
      S('Midnight Story Festival','2 min. Introduce the speaking lesson and final jury decision. Ask what the students are carrying.',`<img class="hero" src="${A}festival-entrance-v2.png" alt="Seven teenagers arriving at a midnight film and book festival"><div class="heroShade"></div><div class="stage titleCopy"><div class="kicker" style="color:var(--amber)">Lesson 23 - speaking</div><h1>Midnight<br>Story Festival</h1><p>Discuss movies and books with clear reasons and respectful opinions.</p><div class="titleRule"><span>DESCRIBE</span><span>REACT</span><span>RECOMMEND</span></div></div>`),
      S('Choose your festival pass','5 min. Give each student one preference if the group has seven. Students add a reason and example.',`<div class="stage"><div class="kicker">01 - check-in</div><h2>What kind of story do you usually choose?</h2>${info('Choose one pass. Name one story you know or invent an example. Explain your choice.')}<div class="passLine" id="passLine">${[['M','mystery'],['C','comedy'],['SF','science fiction'],['F','fantasy'],['A','adventure'],['D','drama'],['DOC','documentary']].map((x,i)=>`<button class="pass" data-pass="${x[1]}" style="--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><strong>${x[0]}</strong>${x[1]}</button>`).join('')}</div><p id="passOut" class="feedback">Choose one pass.</p></div>`),
      S('Identify seven genres','6 min. One genre per student. Students identify a projected world and explain one visual clue.',`<div class="stage splitStage"><img class="featureImage motion" src="${A}genre-gallery-v2.png" alt="Seven projected story worlds representing different genres"><div><div class="kicker">02 - visual lead-in</div><h2>Which genre fits each projected world?</h2>${info('One genre per student. Point to a visual clue and complete: “It could be ___ because...”')}<div class="genreList">${['mystery','comedy','science fiction','fantasy','adventure','drama','documentary'].map((x,i)=>`<div class="genre" style="--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}">${x}</div>`).join('')}</div></div></div>`),
      S('Lesson objectives','2 min. Students choose the objective they most need for the final jury task.',`<div class="stage"><div class="kicker">03 - objectives</div><h2>By the end of the lesson, you can...</h2><div class="objectiveArc">${[['Summarise','a plot without spoilers'],['React','with precise adjectives'],['Support','an opinion with evidence'],['Compare','a book and adaptation'],['Discuss','and choose a winner']].map((x,i)=>`<div class="objective motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>${info('Choose one objective. Say what makes it difficult.')}</div>`),
      S('Objects used by a reviewer','5 min. Students identify objects, then explain how a reviewer could use each one.',`<div class="stage"><div class="kicker">04 - critic tools</div><h2>What does a reviewer use?</h2><div class="deskFrame"><img src="${A}critic-desk-v2.png" alt="Critic desk with an open book headphones ticket star tokens film strip and notebook"><span class="deskLabel">open book</span><span class="deskLabel">headphones</span><span class="deskLabel">ticket</span><span class="deskLabel">star rating</span><span class="deskLabel">film strip</span></div>${info('Choose one object. Explain how it helps someone review a story.')}</div>`),
      S('Seven useful story words','7 min. Assign one word per student. Students give an example from a familiar or invented story.',`<div class="stage"><div class="kicker">05 - vocabulary</div><h2>Use these words to describe a story.</h2>${info('One word per student. Read the meaning, then give one specific example.')}<div class="storyParts">${[
        ['plot','what happens'],['character','a person in the story'],['setting','where and when'],['pace','how quickly it moves'],['performance','how an actor plays a role'],['ending','how it finishes'],['theme','the important idea']
      ].map((x,i)=>`<div class="storyPart motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><strong>${i+1}</strong><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div>`),
      S('Choose precise reaction words','6 min. Students select one word and support it with a detail. Contrast positive, neutral, and negative reactions.',`<div class="stage"><div class="kicker">06 - reactions</div><h2>How did the story affect you?</h2>${info('Choose one word. Add because plus one detail from the story.')}<div class="reactionSpectrum" id="reactionSpectrum">${[
        ['moving','emotional','7rem'],['hilarious','very funny','8rem'],['tense','full of worry','9rem'],['original','new and different','10rem'],['confusing','hard to follow','9rem'],['predictable','easy to guess','8rem'],['disappointing','not as good as expected','7rem']
      ].map((x,i)=>`<button class="reaction" style="--h:${x[2]}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div><p id="reactionOut" class="feedback">Choose one reaction.</p></div>`),
      S('Support every opinion','5 min. Model opinion plus evidence and ask students to improve a vague comment.',`<div class="stage"><div class="kicker">07 - evidence</div><h2>A useful review explains why.</h2><div class="evidenceFormula"><div class="formulaPart" style="--tone:var(--red)"><b>OPINION</b>I found it tense</div><div class="plus">+</div><div class="formulaPart" style="--tone:var(--amber)"><b>LINK</b>because</div><div class="plus">+</div><div class="formulaPart" style="--tone:var(--blue)"><b>EVIDENCE</b>the train never stopped</div></div><div class="evidenceExample">Weak: “It was good.”<br><b>Useful:</b> “I found the setting original because the train crossed different planets.”</div>${info('Improve “It was good” with one precise reaction and one detail.')}</div>`),
      S('Structure a short review','5 min. Explain the five moves. Students choose the move they expect to find hardest.',`<div class="stage"><div class="kicker">08 - review structure</div><h2>A clear review has five moves.</h2><div class="reviewSequence">${[
        ['1','Title','name the story'],['2','Plot','one spoiler-free sentence'],['3','Reaction','use a precise adjective'],['4','Evidence','give a specific reason'],['5','Audience','say who would enjoy it']
      ].map((x,i)=>`<div class="reviewMove motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><strong>${x[0]}</strong><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>${info('Choose one move. Explain what information belongs there.')}</div>`),
      S('Keep plot summaries spoiler-free','6 min. Students compare the summaries, select one, and explain what the other reveals.',`<div class="stage spoilerStage"><div class="spoilerRule"><div class="kicker" style="color:var(--amber)">09 - plot summary</div><h2 style="color:white">Give the situation, not the final answer.</h2><p>Include the main character, goal, and problem.</p><p>Do not reveal the ending, solution, winner, or surprise.</p></div><div><h3>Which summary is safe?</h3><div class="summaryOptions" id="summaryOptions"><button class="summaryChoice" data-good="true">A student enters a night train and tries to discover where it is going.</button><button class="summaryChoice" data-good="false">A student enters a night train and finally learns that the driver is her future self.</button><button class="summaryChoice" data-good="true">Three friends try to save their school cooking club before the competition.</button></div>${info('Choose one spoiler-free summary. Explain exactly what makes it safe.')}<p id="summaryOut" class="feedback">Select a summary.</p></div></div>`),
      S('Identify the five review moves','8 min. Assign one or two lines to each student. Students identify the function before revealing.',`<div class="stage"><div class="kicker">10 - controlled practice</div><h2>What job does each sentence do?</h2>${info('One line per student. Choose: title, plot, reaction, evidence, or audience. Click to check.')}<div class="classifyGrid">${[
        ['The story is called The Paper Moon.','title'],['A shy student builds a radio to contact a distant island.','plot'],['I found the film hopeful.','reaction'],['The friendship felt honest and changed slowly.','evidence'],['I would recommend it to viewers who like quiet adventures.','audience'],['The final scene was moving.','reaction'],['The actor showed fear without using many words.','evidence']
      ].map((x,i)=>`<button class="classify"><b>${i+1}. ${x[0]}</b><span class="answer">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Disagree politely','6 min. Play the audio. Students identify the disagreement phrase and the detail that supports it.',`<div class="stage disagreeStage"><div class="disagreeCore"><div class="kicker" style="color:var(--amber)">11 - discussion language</div><h2>Disagree with the idea, not the person.</h2><p>Listen for one respectful phrase, one different opinion, and one supporting detail.</p></div><div><div class="phraseStack">${[
        ['I see your point, but...','var(--red)'],['That is fair. I noticed...','var(--blue)'],['Maybe, although I felt...','var(--amber)'],['I agree about ___, but not about...','var(--red)']
      ].map((x,i)=>`<div class="phrase motion" style="--d:${i};--tone:${x[1]}">${x[0]}</div>`).join('')}</div>${info('Listen twice. Then use one phrase to disagree with a harmless opinion.')}</div></div>`),
      S('Practise seven disagreements','9 min. Assign one opinion per student. Students respond politely and add evidence.',`<div class="stage"><div class="kicker">12 - speaking practice</div><h2>Respond respectfully and specifically.</h2>${info('One opinion per student. Use a polite disagreement phrase and one supporting detail.')}<div class="opinionRun">${[
        ['The ending was perfect.','discuss the ending'],['The main character was brave.','discuss one action'],['The movie was better than the book.','compare one detail'],['The story was too slow.','discuss the pace'],['The soundtrack was distracting.','discuss one scene'],['The setting felt realistic.','discuss a location'],['Everyone should watch this story.','name a suitable audience']
      ].map((x,i)=>`<div class="opinionCard" style="--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><b>${i+1}. “${x[0]}”</b><small>${x[1]}</small></div>`).join('')}</div></div>`),
      S('Listen to a complete micro-review','6 min. Play once for the overall opinion and again for the five review moves.',`<div class="stage audioModel"><div class="soundPoster"><div class="kicker" style="color:var(--amber)">13 - model review</div><h2>What does the reviewer recommend?</h2><div class="wave"></div></div><div><div class="modelMoves">${['Title','Spoiler-free plot','Reaction','Specific evidence','Audience recommendation'].map((x,i)=>`<div class="modelLine motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}">${i+1}. ${x}</div>`).join('')}</div>${info('First listen: answer the title and audience. Second listen: note all five moves.')}</div></div>`),
      S('Rebuild the model review','6 min. Students order the five lines, then compare with the audio transcript.',`<div class="stage"><div class="kicker">14 - model analysis</div><h2>Put the review in a logical order.</h2>${info('Select the lines in order: title, plot, reaction, evidence, recommendation. The order indicator gives immediate feedback.')}<div class="modelMoves" id="modelOrder">${[
        [2,'I found it hopeful.'],[4,'I would recommend it to viewers who enjoy gentle stories.'],[0,'The Paper Moon is a quiet adventure.'],[3,'The friendships felt honest.'],[1,'It follows a shy student who builds a radio.']
      ].map((x,i)=>`<button class="modelLine" data-order="${x[0]}" style="--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}">${x[1]}</button>`).join('')}</div><p id="orderOut" class="feedback">0 / 5 lines selected.</p></div>`),
      S('Preview the festival story','5 min. Students use only the image to predict character, setting, goal, and mood.',`<div class="stage"><div class="storyHero"><img src="${A}last-stop-orion-v2.png" alt="Teenage girl holding a silver key on a night train crossing a star-filled landscape"><div class="storyPanel"><div class="kicker" style="color:var(--amber)">15 - story preview</div><h2>Last Stop Orion</h2><p>A fictional festival selection.</p>${info('Predict four details: main character, setting, goal, and mood. Do not create an ending.')}</div></div></div>`),
      S('Read a festival review','8 min. Students read silently, then assign one paragraph to each small group for evidence marking.',`<div class="stage"><article class="readingCopy" style="max-width:980px;margin:auto"><div class="kicker">16 - reading</div><h2>Review: Last Stop Orion</h2><p><b>Plot:</b> Seventeen-year-old Mira boards the final train home, but every station appears on a different planet. She finds a silver key and tries to discover which door it opens before the train reaches Orion.</p><p><b>Reaction:</b> I found the story mysterious and surprisingly warm. The first half is slow, but the pace improves when Mira begins speaking to the other passengers.</p><p><b>Evidence:</b> The train setting feels original because each carriage changes with the passengers’ memories. The lead performance is quiet but convincing, especially when Mira must choose whether to trust the conductor.</p><p><b>Recommendation:</b> I would recommend it to viewers who enjoy thoughtful science fiction. People who prefer fast action may find the opening too slow. I give it four out of five stars.</p></article></div>`),
      S('Answer seven reading questions','8 min. Assign one question per student. Students answer with evidence before revealing.',`<div class="stage"><div class="kicker">17 - reading check</div><h2>Use the review as evidence.</h2>${info('One question per student. Answer in a full sentence, point to the relevant line, then click to check.')}<div class="questionRun">${[
        ['Who is the main character?','Seventeen-year-old Mira.'],['What is unusual about the setting?','Every station appears on a different planet.'],['What does Mira try to discover?','Which door the silver key opens.'],['How does the reviewer describe the pace?','Slow at first, then better.'],['Why does the setting feel original?','Each carriage changes with the passengers’ memories.'],['Who would probably enjoy it?','Viewers who enjoy thoughtful science fiction.'],['What rating does it receive?','Four out of five stars.']
      ].map((x,i)=>`<button class="question"><b>${i+1}. ${x[0]}</b><span class="answer">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Compare the book and film','6 min. Students inspect both versions and identify at least three visible differences.',`<div class="stage compareStage"><img class="compareImage motion" src="${A}adaptation-compare-v2.png" alt="The same cosmic train scene shown as a book illustration and a live-action film"><div><div class="kicker">18 - adaptation</div><h2>How did the scene change on screen?</h2>${info('Find three differences in colour, character, setting, mood, or detail. Use comparison language.')}<div class="compareLanguage"><div class="compareLine" style="--tone:var(--red)">In the book..., while in the film...</div><div class="compareLine" style="--tone:var(--blue)">Both versions show...</div><div class="compareLine" style="--tone:var(--amber)">The film makes ___ more...</div></div></div></div>`),
      S('Use clear comparison language','5 min. Model the four sentence structures. Students adapt each one to the image.',`<div class="stage"><div class="kicker">19 - comparison language</div><h2>Compare one specific feature at a time.</h2><div class="evidenceFormula"><div class="formulaPart" style="--tone:var(--red)"><b>SIMILARITY</b>Both versions show...</div><div class="plus">/</div><div class="formulaPart" style="--tone:var(--amber)"><b>CONTRAST</b>In the book..., while...</div><div class="plus">/</div><div class="formulaPart" style="--tone:var(--blue)"><b>PREFERENCE</b>I prefer ___ because...</div></div>${info('Make one similarity, one contrast, and one preference sentence.')}</div>`),
      S('Give every student a comparison','8 min. Assign one prompt per student. Students speak for 20 seconds and include evidence.',`<div class="stage"><div class="kicker">20 - comparison task</div><h2>Compare one feature in both versions.</h2>${info('One feature per student. Make two comparison sentences and one preference sentence.')}<div class="comparePrompts">${[
        ['Character','appearance and expression'],['Setting','train and landscape'],['Colour','warm and cool tones'],['Mood','mysterious or hopeful'],['Detail','the silver key'],['Action','what Mira is doing'],['Impact','which version is stronger']
      ].map((x,i)=>`<div class="comparePrompt motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><strong>${i+1}</strong><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div>`),
      S('Meet the festival shortlist','7 min. Present the three fictional titles. Students choose an initial favourite and give one reason.',`<div class="stage"><div class="kicker">21 - shortlist</div><h2>Which story should the jury discuss first?</h2><div class="shortlistFrame"><img src="${A}festival-shortlist-v2.png" alt="Three fictional story scenes showing an observatory mystery a cooking club comedy and a floating-city adventure"><div class="shortlistCards" id="shortlistCards">${[
        ['The Silent Observatory','mystery','A student follows a light inside a closed observatory.'],['Kitchen Number Seven','comedy','A chaotic school cooking club enters a competition.'],['City Above the Tide','science fiction','Three friends search for a floating city’s missing engine.']
      ].map((x,i)=>`<button class="shortlist" data-title="${x[0]}" style="--tone:${i===0?'var(--red)':i===1?'var(--amber)':'var(--blue)'}"><b>${x[0]}</b><small>${x[1]} - ${x[2]}</small></button>`).join('')}</div></div>${info('Choose one title. Give a reason based only on the image and short plot.')}<p id="shortlistOut" class="feedback">Choose an initial favourite.</p></div>`),
      S('Prepare the jury discussion','6 min. Use the image to establish respectful discussion behaviour before assigning roles.',`<div class="stage"><div class="juryStage"><img src="${A}jury-discussion-v2.png" alt="Seven teenagers discussing stories around a table in a cinema lounge"><div class="juryBrief"><div class="kicker">22 - jury preparation</div><h2>Choose one winner using evidence.</h2>${info('Before opening the role task, agree on three rules for a respectful online discussion.')}</div></div></div>`),
      S('Assign seven jury roles','8 min. Give each student one role. Open the full task after every student understands their responsibility.',`<div class="stage"><div class="kicker">23 - jury roles</div><h2>Every jury member has a different responsibility.</h2>${info('Take one numbered role. Prepare one point before the discussion. Then open the full jury task.')}<div class="juryRoles">${[
        ['Chair','invite speakers and close the vote'],['Plot analyst','compare the story ideas'],['Character analyst','judge character potential'],['Visual analyst','discuss setting and atmosphere'],['Audience analyst','name the best audience'],['Counter-critic','challenge one weak reason politely'],['Recorder','track evidence and announce the result']
      ].map((x,i)=>`<div class="juryRole motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}"><strong>${i+1}</strong><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div>`),
      S('Deliver a 45-second review','8 min. Play the cue audio. Students prepare and deliver one review each with no spoilers.',`<div class="stage timerStage"><div class="timerBox"><div class="kicker" style="color:var(--amber)">24 - individual speaking</div><div class="timer" id="timer">45</div><button class="timerButton" id="startTimer">START 45 SECONDS</button></div><div><h2>Review a real or invented story.</h2><div class="reviewCue">${['Title and genre','One-sentence plot','Precise reaction','Specific evidence','Audience recommendation'].map((x,i)=>`<div class="cue motion" style="--d:${i};--tone:${i%3===0?'var(--red)':i%3===1?'var(--blue)':'var(--amber)'}">${i+1}. ${x}</div>`).join('')}</div>${info('Choose a story. Speak for 45 seconds. Listeners note one strong detail and one question.')}</div></div>`),
      S('Review the lesson language','7 min. One card per student. Students answer before revealing and score one point for accuracy plus one for a full sentence.',`<div class="stage"><div class="kicker">25 - review game</div><h2>Complete or improve each review line.</h2>${info('One card per student. Answer first, then open it. Give two points for a correct, complete response.')}<div class="reviewWall" id="reviewWall">${[
        ['Name five review moves.','title, plot, reaction, evidence, audience'],['Improve: It was good.','Use a precise reaction plus evidence.'],['Give a spoiler-free plot.','character + goal + problem, no ending'],['Disagree politely.','I see your point, but...'],['Compare book and film.','In the book..., while in the film...'],['Recommend an audience.','I would recommend it to...'],['Explain four stars.','rating plus one specific reason']
      ].map((x,i)=>`<button class="reviewCard" style="--r:${i%2?'.55deg':'-.55deg'}"><b>${i+1}. ${x[0]}</b><span class="back">${x[1]}</span></button>`).join('')}</div><div id="reviewScore" class="score">0 / 7 cards opened</div></div>`),
      S('Announce the audience winner','6 min. The jury announces its choice. Classmates give evidence-based feedback on the decision.',`<img class="awardHero" src="${A}festival-awards-v2.png" alt="Seven teenagers presenting a story award on a cinema stage"><div class="awardShade"></div><div class="stage awardCopy"><div class="kicker" style="color:var(--amber)">26 - festival result</div><h2>Announce the winner and defend the decision.</h2><div class="awardChecklist"><span>Winner and genre</span><span>Two reasons with evidence</span><span>Best audience</span><span>One respectful reply to another opinion</span></div>${info('The recorder announces the result. Two students respond with agreement or polite disagreement.')}</div>`),
      S('Homework and exit ticket','4 min. Explain the recording task, then every student completes one exit prompt before leaving.',`<div class="stage finalSplit"><div class="homework"><div class="kicker">27 - homework</div><h2>Record a 60-90 second review.</h2><p>Choose a movie, book, series, game story, or invented title.</p><p>Include a spoiler-free plot, precise reaction, evidence, and audience recommendation.</p><p><b>Optional:</b> compare it with another version.</p></div><div class="exit"><div class="kicker">28 - exit ticket</div><h2>Show one skill independently.</h2>${info('Choose one prompt and answer without reading a model.')}<div class="exitOptions" id="exitOptions"><button class="exitOption">Give one opinion with evidence.</button><button class="exitOption">Give one polite disagreement.</button><button class="exitOption">Give one spoiler-free recommendation.</button></div><p id="exitOut" class="feedback">Choose one exit prompt.</p><p><b>Next:</b> Phrasal Verbs in Daily Life.</p></div></div>`)
    ];
    const transitions=['focus','light','iris','shutter'];const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}" data-transition="${transitions[i%transitions.length]}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--amber)">Midnight Story Festival</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');let cur=0;
    function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>{x.classList.toggle('active',n===cur);if(n===cur){x.scrollTop=0;x.querySelectorAll('.motion').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''})}});document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open')}show(0);
    document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#prev').onclick=()=>show(cur-1);document.querySelector('#mapBtn').onclick=()=>map.classList.toggle('open');document.querySelector('#noteBtn').onclick=()=>{note.innerHTML=`<b>Teacher note - ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#noteBtn').click()});
    let sx=0,sy=0,browserGesture=false;document.addEventListener('touchstart',e=>{browserGesture=e.touches.length!==1||(window.visualViewport?.scale||1)>1.01;if(!browserGesture){sx=e.touches[0].screenX;sy=e.touches[0].screenY}},{passive:true});document.addEventListener('touchend',e=>{if(browserGesture||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4)show(cur+(dx<0?1:-1))},{passive:true});
    document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pass]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#passOut').textContent=`Selected: ${b.dataset.pass}. Give a title and a reason.`});document.querySelectorAll('.reaction').forEach(b=>b.onclick=()=>{document.querySelectorAll('.reaction').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#reactionOut').textContent=`Use “${b.querySelector('b').textContent}” with because plus evidence.`});document.querySelectorAll('.summaryChoice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.summaryChoice').forEach(x=>x.classList.remove('correct','incorrect'));const good=b.dataset.good==='true';b.classList.add(good?'correct':'incorrect');document.querySelector('#summaryOut').textContent=good?'Spoiler-free. It gives the situation without the solution.':'This reveals an important surprise. Choose a safer summary.'});document.querySelectorAll('.classify,.question').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    let order=[];document.querySelectorAll('#modelOrder [data-order]').forEach(b=>b.onclick=()=>{if(order.includes(+b.dataset.order))return;order.push(+b.dataset.order);b.style.background='#ffe4a0';const correct=order.every((x,i)=>x===i);document.querySelector('#orderOut').textContent=!correct?'The order is not correct. Leave the slide and return to reset.':order.length===5?'Correct. Read the complete review aloud.':`${order.length} / 5 lines selected in the correct order.`});document.querySelectorAll('.shortlist').forEach(b=>b.onclick=()=>{document.querySelectorAll('.shortlist').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#shortlistOut').textContent=`Initial favourite: ${b.dataset.title}. Give one reason.`});let seconds=45,run;document.querySelector('#startTimer').onclick=()=>{clearInterval(run);seconds=45;document.querySelector('#timer').textContent=seconds;run=setInterval(()=>{seconds--;document.querySelector('#timer').textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};let opened=0;document.querySelectorAll('.reviewCard').forEach(b=>b.onclick=()=>{const was=b.classList.contains('open');b.classList.toggle('open');opened+=was?-1:1;document.querySelector('#reviewScore').textContent=`${opened} / 7 cards opened`});document.querySelectorAll('.exitOption').forEach(b=>b.onclick=()=>{document.querySelectorAll('.exitOption').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#exitOut').textContent='Selected. Give your complete answer now.'});
  </script>
  <script src="experience-v3.js"></script>
</body>
