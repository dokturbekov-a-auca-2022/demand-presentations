<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 21 — Office Outfitters</title><style>
:root{--ink:#17334a;--mint:#b9eadc;--coral:#ef7654;--cream:#fff8e8;--graph:#26323b;--blue:#27658d}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--graph);font-family:Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:paper .35s both}.scene:before{content:'✎';position:absolute;right:5vw;top:2vh;color:var(--coral);font-size:8rem;opacity:.12}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#17334aee,#17334aa6 48%,#17334a20)}.title{position:relative;z-index:2;color:#fff;max-width:50rem;padding:11vh 2rem 2rem;border-left:10px solid var(--mint);background:#17334a88}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.15em 0}.title p{font-size:clamp(1.15rem,2vw,1.7rem)}.eyebrow,h3{font:900 .78rem Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--ink);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.45vw,1.4rem);line-height:1.42}.label{display:inline-block;background:var(--mint);color:var(--ink);padding:.45rem .8rem;font-weight:900;transform:rotate(-2deg);margin:.2rem}.desk{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.supply{background:#fff;border:3px solid var(--ink);padding:1rem;min-height:8rem;box-shadow:6px 6px 0 #17334a22;cursor:pointer}.supply.on,.supply.selected{background:var(--mint)}.memo{background:#fff;border-left:12px solid var(--coral);padding:1.2rem 1.5rem;box-shadow:9px 9px 0 #17334a22;font-size:clamp(1.25rem,2vw,1.8rem);line-height:1.45}.memo small{font:900 .72rem Arial;color:var(--coral);letter-spacing:.12em;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--mint)}.slider{height:24px;background:#c9d8d5;border-radius:99px;position:relative;margin:1.3rem 0}.slider i{display:block;width:34%;height:100%;background:var(--coral);border-radius:99px}.slider button{position:absolute;top:-.65rem;left:32%;border-radius:50%;width:2.2rem;height:2.2rem;border:4px solid var(--ink);background:var(--mint);cursor:pointer}.choice{background:#fff;border:3px solid var(--ink);padding:.85rem 1rem;color:var(--ink);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #17334a22}.choice:hover,.choice.selected{background:var(--mint)}.feedback{font-weight:900;color:var(--coral);min-height:1.5em}.email{background:#fff;border:3px solid var(--blue);padding:1.2rem;box-shadow:8px 8px 0 #17334a20}.email b{color:var(--blue)}.stamp{border:3px dashed var(--coral);padding:.7rem 1rem;display:inline-block;transform:rotate(-3deg);font-weight:900;color:var(--coral)}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#17334aef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--mint)}.note,.map{display:none;position:fixed;z-index:30;background:#17334af5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.timer{font-size:clamp(3.5rem,8vw,7rem);font-weight:900;text-align:center;color:var(--coral)}@keyframes paper{from{opacity:0;transform:translateY(10px) rotate(.3deg)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.desk,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">DESK MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Office Outfitters','2 min. Open with the flat-lay and ask what makes a team feel ready to work.',`<img class="hero" src="${A}desk-flatlay.png" alt="Illustrated office desk with notebook coffee calculator and a small planning team"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 21 · vocabulary</div><h1>Office<br>Outfitters</h1><p>Business English basics for messages, meetings, money, and teamwork.</p><span class="label">PLAN</span><span class="label">WRITE</span><span class="label">TEAM</span></div>`),
S('Check-in: what makes work easier?','4 min. Students may choose school, club, or an imaginary team.',`<div class="stage"><h3>01 · check-in</h3><h2>Pick one useful office item.</h2><div class="desk" id="items">${['a clear plan','a friendly email','a quiet place','a good deadline','a helpful teammate','a shared calendar'].map(x=>`<button class="supply" data-item="${x}">${x}</button>`).join('')}</div><p id="itemOut" class="feedback">Choose one and explain: “It helps because …”</p></div>`),
S('Bridge from Lesson 20','3 min. Connect routines to workplace habits.',`<div class="stage"><h3>02 · bridge</h3><div class="grid2"><div class="memo"><small>Old routine</small><br>I used to work alone.</div><div class="memo"><small>New team habit</small><br>Now I’m used to sharing updates.</div></div><p>Today we collect the words that make teamwork clear.</p></div>`),
S('Picture the meeting','5 min. Students predict useful verbs and nouns from the image.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What is this team doing?</h2><img class="figure" src="${A}team-meeting.png" alt="Illustrated diverse teen team meeting around a table with notebooks"><p class="feedback">Point, predict, and use one action verb.</p></div>`),
S('Today’s desk map','1 min. Preview the four language drawers.',`<div class="stage"><h3>04 · route</h3><div class="desk"><div class="supply"><b>People</b><br>roles + teamwork</div><div class="supply"><b>Actions</b><br>plan + report</div><div class="supply"><b>Messages</b><br>email + calls</div><div class="supply"><b>Money</b><br>price + budget</div></div></div>`),
S('Roles on the team','5 min. Students tap a role and say what that person does.',`<div class="stage"><h3>05 · people</h3><h2>Who is in the office?</h2><div class="desk" id="roles">${['client','customer','manager','designer','assistant','supplier','team leader','colleague'].map(x=>`<button class="supply" data-role="${x}">${x}</button>`).join('')}</div><p id="roleOut" class="feedback">Choose a role and add a verb: “A designer creates …”</p></div>`),
S('Action drawer','5 min. Match each verb to a real or school-team example.',`<div class="stage"><h3>06 · actions</h3><div class="desk" id="actions">${['schedule','confirm','deliver','discuss','update','solve','design','organise'].map(x=>`<button class="supply" data-action="${x}">${x}</button>`).join('')}</div><p id="actionOut" class="feedback">Tap a verb, then complete: “We need to …”</p></div>`),
S('Meeting phrases','4 min. Choral repetition, then choose one phrase for a role-play.',`<div class="stage"><h3>07 · meeting language</h3><div class="memo"><span class="stamp">Could we start?</span> <span class="stamp">I agree.</span> <span class="stamp">What do you think?</span> <span class="stamp">Let’s decide.</span> <span class="stamp">I’ll take notes.</span></div></div>`),
S('Register slider','5 min. Move from casual to professional and discuss the difference.',`<div class="stage"><h3>08 · tone</h3><h2>Same meaning, different outfit.</h2><div class="slider" id="tone"><i></i><button id="toneKnob" aria-label="Tone slider"></button></div><div class="grid2"><div class="memo">Casual: “Can you send it?”</div><div class="memo">Professional: “Could you send it, please?”</div></div><p id="toneOut" class="feedback">Slide right for a more professional tone.</p></div>`),
S('Email parts','5 min. Students label the parts of a short email.',`<div class="stage"><h3>09 · messages</h3><div class="email"><b>Subject:</b> Meeting time<br><br><b>Hi Maya,</b><p>Could we meet on Thursday at 3 p.m. to discuss the new design?</p><p>Best,<br>Sam</p></div><div class="desk"><div class="supply">subject</div><div class="supply">greeting</div><div class="supply">request</div><div class="supply">closing</div></div></div>`),
S('Email repair strip','5 min. Choose the phrase that makes the email clear and polite.',`<div class="stage"><h3>10 · email repair</h3><div class="grid2" id="emailChoices"><button class="choice">Could you confirm the time?</button><button class="choice">Send me that now.</button><button class="choice">Thanks for your help.</button><button class="choice">I want it. Quickly.</button></div><p id="emailOut" class="feedback">Choose the professional options.</p></div>`),
S('Money drawer','5 min. Students sort price, cost, and budget into a mini scenario.',`<div class="stage"><h3>11 · money</h3><div class="desk"><div class="supply"><b>price</b><br>what something sells for</div><div class="supply"><b>cost</b><br>money needed to make/buy it</div><div class="supply"><b>budget</b><br>money available to spend</div><div class="supply"><b>profit</b><br>money left after costs</div></div></div>`),
S('Deadline and schedule','4 min. Students build a sentence that prevents a missed deadline.',`<div class="stage"><h3>12 · time</h3><div class="memo"><small>Brief</small><br>The deadline is Friday. Please send the draft by Thursday afternoon.</div><p>Useful chunks: <span class="label">by Friday</span><span class="label">on Thursday</span><span class="label">at 3 p.m.</span></p></div>`),
S('Team problem desk','5 min. Teams choose the best response to a small workplace problem.',`<div class="stage"><h3>13 · problem solving</h3><h2>The client has not replied.</h2><div class="grid2" id="problem"><button class="choice">Let’s send a polite reminder.</button><button class="choice">Ignore the project.</button><button class="choice">Could we call them tomorrow?</button><button class="choice">The deadline is not important.</button></div><p id="problemOut" class="feedback">Choose two useful responses.</p></div>`),
S('Invoice workspace','4 min. Use the visual to predict business words.',`<div class="stage"><h3>14 · visual language</h3><img class="figure" src="${A}email-workspace.png" alt="Illustrated email and invoice workspace with folders calendar and checklist"><p class="feedback">Find: invoice, attachment, due date, total.</p></div>`),
S('Phone call phrases','5 min. Students practise opening, checking, and closing a call.',`<div class="stage"><h3>15 · phone call</h3><div class="memo"><span class="stamp">Hello, this is …</span><span class="stamp">I’m calling about …</span><span class="stamp">Could you repeat that?</span><span class="stamp">I’ll call you back.</span></div></div>`),
S('Mini meeting agenda','5 min. Put three actions into a sensible meeting order.',`<div class="stage"><h3>16 · meeting order</h3><div class="desk" id="agenda">${['welcome','share updates','make a decision','next steps'].map((x,i)=>`<button class="supply" data-agenda="${i}">${x}</button>`).join('')}</div><p id="agendaOut" class="feedback">Tap the steps in order.</p></div>`),
S('Listen for the action','4 min. Teacher reads the memo twice; students choose what the team must do.',`<div class="stage"><h3>17 · listening-style check</h3><div class="memo">“The supplier changed the delivery date. Please update the calendar and tell the client.”</div><div class="grid2" id="listen"><button class="choice">update the calendar</button><button class="choice">cancel the order</button><button class="choice">tell the client</button><button class="choice">change the supplier</button></div><p id="listenOut" class="feedback">Choose the two actions you heard.</p></div>`),
S('Information gap: the missing details','6 min. Partner A has a brief; Partner B has a calendar. Ask for the missing details.',`<div class="stage"><h3>18 · pair task</h3><div class="grid2"><div class="memo"><small>Brief A</small><br>Client call · Wednesday · 2 p.m. · Room 4</div><div class="memo"><small>Calendar B</small><br>Wednesday · ______ · ______</div></div><p>Ask: “When is the call?” “Where is it?” Then swap.</p></div>`),
S('Register rewrite','5 min. Turn blunt lines into professional requests.',`<div class="stage"><h3>19 · tone workshop</h3><div class="desk" id="rewrite"><button class="supply">Send the file.</button><button class="supply">I need it now.</button><button class="supply">Tell me the price.</button></div><p id="rewriteOut" class="feedback">Choose one. Add “Could you …, please?”</p></div>`),
S('Team meeting role-play','7 min. Groups run a short meeting with roles and a decision.',`<div class="stage"><h3>20 · production setup</h3><div class="desk"><div class="supply"><b>facilitator</b><br>starts + closes</div><div class="supply"><b>client</b><br>asks for a change</div><div class="supply"><b>designer</b><br>offers an idea</div><div class="supply"><b>note-taker</b><br>records next steps</div></div></div>`),
S('Build a one-page brief','7 min. Students create a fictional mini-project brief.',`<div class="stage"><h3>21 · production</h3><h2>Outfit your project with business English.</h2><div class="grid2"><div class="memo"><small>Project</small><br>name + client + goal</div><div class="memo"><small>Plan</small><br>deadline + budget + next step</div></div><p>Present it in 45 seconds using at least five target words.</p></div>`),
S('Peer desk check','5 min. Listeners use a clear checklist.',`<div class="stage"><h3>22 · feedback</h3><div class="desk"><div class="supply"><b>Clear</b><br>I know the goal.</div><div class="supply"><b>Polite</b><br>I heard a professional phrase.</div><div class="supply"><b>Complete</b><br>I know the next step.</div><div class="supply"><b>Useful</b><br>I heard five words.</div></div></div>`),
S('Review: office drawer quiz','5 min. Teams choose the best word for each mini-situation.',`<div class="stage"><h3>23 · review</h3><div class="grid2" id="quiz"><button class="choice">money available = budget</button><button class="choice">last day = deadline</button><button class="choice">person who buys = customer</button><button class="choice">message file = attachment</button></div><p id="quizOut" class="feedback">Choose four correct labels.</p></div>`),
S('One-minute meeting','2 min. Students practise opening and closing a meeting with a timer.',`<div class="stage"><h3>24 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START TIMER</button><p class="feedback">Open: “Could we start?” Close: “Let’s confirm the next step.”</p></div>`),
S('Self-check: your desk today','3 min. Students choose a confidence level.',`<div class="stage"><h3>25 · reflection</h3><div class="slider"><i id="meter"></i></div><div class="desk" id="levels"><button class="supply" data-level="30">I can recognise words</button><button class="supply" data-level="60">I can use them in messages</button><button class="supply" data-level="90">I can run a mini meeting</button></div><p id="levelOut" class="feedback">Choose honestly; this is a progress note.</p></div>`),
S('Homework: an office message','2 min. Keep the situation fictional, school-based, or real.',`<div class="stage"><h3>26 · homework</h3><div class="memo"><small>Write</small><br>One short professional email with a subject, greeting, request, deadline, and closing.</div><p>Optional challenge: add one polite follow-up question.</p></div>`),
S('Exit ticket','2 min. Students choose one prompt and finish it aloud or on paper.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Close the desk for today.</h2><div class="desk" id="exit"><button class="supply">One word I can use is …</button><button class="supply">One polite phrase I can use is …</button><button class="supply">One teamwork action I can explain is …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Gerunds & Infinitives · Hobbies & Interests</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--mint)">Office Outfitters map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');itemOut.textContent=`${b.dataset.item}: explain why it helps.`});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>roleOut.textContent=`${b.dataset.role}: complete “A ${b.dataset.role} …”`);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actionOut.textContent=`${b.dataset.action}: use it in “We need to …”`);toneKnob.onclick=()=>{toneKnob.style.left='72%';tone.querySelector('i').style.width='74%';toneOut.textContent='Professional tone selected — add please, could, or would.'};document.querySelectorAll('#emailChoices .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');emailOut.textContent='Choose the line that sounds clear and respectful.'});document.querySelectorAll('#problem .choice,#listen .choice,#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');problemOut&&(problemOut.textContent='Select the useful team responses.');listenOut&&(listenOut.textContent='Choose the actions from the memo.');quizOut&&(quizOut.textContent='Keep checking the business meaning.')});let ag=[];document.querySelectorAll('[data-agenda]').forEach(b=>b.onclick=()=>{ag.push(+b.dataset.agenda);b.classList.add('selected');agendaOut.textContent=ag.length===4?'Agenda complete: welcome → updates → decision → next steps.':`${ag.length}/4 steps chosen.`});document.querySelectorAll('#rewrite .supply').forEach(b=>b.onclick=()=>rewriteOut.textContent='Professional rewrite: Could you send the file, please?');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{meter.style.width=b.dataset.level+'%';levelOut.textContent='Now name one phrase you can use.'});document.querySelectorAll('#exit .supply').forEach(b=>b.onclick=()=>{b.classList.add('selected');exitOut.textContent='Finish the sentence for a partner.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #061827}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe1a2!important}</style></body></html>
