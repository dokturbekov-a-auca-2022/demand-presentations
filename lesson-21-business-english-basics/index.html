<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>Lesson 21 - Pop-Up Studio</title>
  <style>
    :root{--ink:#102d48;--paper:#fff5dd;--orange:#ff6846;--lime:#cddd31;--aqua:#24bdb7;--white:#fffdf7;--soft:#d9efea;--muted:#607584}
    *{box-sizing:border-box}
    html,body{height:100%;touch-action:pan-x pan-y pinch-zoom}
    body{margin:0;background:var(--ink);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
    button{font:800 1rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer}
    #deck{height:100vh}
    .scene{display:none;width:100%;height:100vh;max-height:100vh;padding:5.2vh 7.5vw 10vh;background:var(--paper);position:relative;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;isolation:isolate}
    .scene.active{display:block;animation:sceneIn .42s cubic-bezier(.2,.8,.2,1) both}
    .scene:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 88% 12%,#24bdb720 0 8rem,transparent 8.1rem),linear-gradient(115deg,transparent 0 72%,#cddd3115 72% 78%,transparent 78%)}
    .stage{position:relative;z-index:1;width:min(1180px,100%);margin:0 auto}
    @media(min-width:701px){
      .stage{min-height:72vh;display:flex;flex-direction:column;justify-content:center}
      .visualSplit,.emailCanvas,.listenBoard{display:grid}
    }
    .kicker{font:900 .78rem/1 "Trebuchet MS",sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#c84125;margin:.2rem 0 .7rem}
    h1,h2,h3{font-family:"Arial Black","Trebuchet MS",sans-serif}
    h1{font-size:clamp(4rem,8.2vw,9rem);line-height:.82;margin:.08em 0}
    h2{font-size:clamp(2rem,4vw,4.35rem);line-height:.98;margin:.1em 0 .5em;max-width:19ch}
    h3{font-size:clamp(1.1rem,1.55vw,1.45rem);line-height:1.08;margin:.2em 0 .45em}
    p,li{font-size:clamp(1rem,1.35vw,1.3rem);line-height:1.43}
    .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .heroShade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#102d48f7 0%,#102d48e6 37%,#102d4870 61%,transparent 100%)}
    .titleCopy{color:var(--paper);max-width:48rem;padding-top:10vh}
    .titleCopy p{font-size:clamp(1.2rem,2vw,1.75rem);max-width:34ch}
    .tag{display:inline-block;padding:.45rem .72rem;margin:.2rem .3rem .2rem 0;background:var(--lime);color:var(--ink);font-weight:900;transform:rotate(-1deg)}
    .taskNote{display:flex;gap:.65rem;align-items:flex-start;margin:.8rem 0 1.1rem;padding:.8rem 1rem;background:var(--soft);border-left:8px solid var(--orange);font-weight:800;line-height:1.4}
    .taskIcon{display:inline-grid;place-items:center;flex:0 0 1.7rem;height:1.7rem;border-radius:50%;background:var(--ink);color:var(--paper);font-family:Georgia,serif;font-style:italic}
    .visualSplit{display:grid;grid-template-columns:1.02fr .98fr;gap:1.3rem;align-items:center}
    .featureImage{width:100%;max-height:58vh;object-fit:cover;border:7px solid var(--ink);box-shadow:12px 12px 0 var(--aqua)}
    .featureImage.rightFocus{object-position:74% center}
    .briefSheet{background:var(--white);padding:1.3rem 1.5rem;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--orange);position:relative}
    .briefSheet:before{content:"CLIENT BRIEF";position:absolute;right:1rem;top:-.7rem;background:var(--lime);padding:.35rem .6rem;font-weight:900;font-size:.72rem;letter-spacing:.1em}
    .briefLines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:1rem}
    .briefLine{border-bottom:4px solid var(--aqua);padding:.55rem .2rem;font-weight:800}
    .objectivePath{display:flex;align-items:stretch;gap:.5rem;margin-top:1.3rem}
    .objective{flex:1;padding:1rem;background:var(--ink);color:var(--paper);clip-path:polygon(0 0,91% 0,100% 50%,91% 100%,0 100%,8% 50%)}
    .objective:first-child{clip-path:polygon(0 0,91% 0,100% 50%,91% 100%,0 100%)}
    .objective b{display:block;color:var(--lime);font-size:1.25rem;margin-bottom:.35rem}
    .roleOrbit{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.55rem;align-items:end;margin-top:1rem}
    .roleNode{min-height:9rem;padding:.8rem .55rem;background:var(--white);border:3px solid var(--ink);box-shadow:0 7px 0 #102d4822;text-align:center;animation:itemIn .45s calc(var(--i)*.06s) both}
    .roleNode:before{content:attr(data-icon);display:grid;place-items:center;width:3rem;height:3rem;margin:0 auto .5rem;background:var(--tone,var(--aqua));border-radius:50%;font-size:1.45rem}
    .roleNode b{display:block;font-size:1rem}
    .roleNode small{font-size:.82rem;line-height:1.25;color:#39566b}
    .matchRows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
    .matchRow{display:flex;gap:.6rem;align-items:center;padding:.75rem;background:var(--white);border-left:8px solid var(--aqua);text-align:left;color:var(--ink)}
    .matchRow strong{display:grid;place-items:center;flex:0 0 2rem;height:2rem;background:var(--orange);color:#fff;border-radius:50%}
    .matchRow .answerText{display:none;color:#27620c;margin-left:auto}
    .matchRow.open{background:#f2f7c9}
    .matchRow.open .answerText{display:block}
    .wordWall{columns:3;column-gap:1rem;margin-top:1rem}
    .wordTile{break-inside:avoid;margin:0 0 1rem;padding:1rem;background:var(--white);border-top:9px solid var(--tone,var(--orange));box-shadow:5px 6px 0 #102d481c}
    .wordTile b{font-size:1.35rem}
    .wordTile span{display:block;color:#405c70;margin-top:.35rem}
    .collocationTrack{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap;margin-top:1rem}
    .collocation{flex:1 1 13rem;min-height:7rem;padding:.9rem;background:var(--ink);color:var(--paper);border-bottom:8px solid var(--tone,var(--lime));text-align:left}
    .collocation em{display:none;color:var(--lime);font-style:normal;margin-top:.6rem}
    .collocation.open em{display:block}
    .contrastGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
    .contrast{position:relative;background:var(--white);border:3px solid var(--ink);padding:1rem 1.2rem;min-height:9rem}
    .contrast .vs{position:absolute;left:50%;top:-1rem;transform:translateX(-50%);background:var(--orange);color:#fff;padding:.25rem .5rem;font-weight:900}
    .contrastPair{display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:center}
    .contrastPair b{font-size:1.25rem;color:var(--ink)}
    .briefFill{display:grid;grid-template-columns:1.2fr .8fr;gap:1rem}
    .reading{background:var(--white);border-left:12px solid var(--aqua);padding:1.25rem 1.45rem;box-shadow:8px 8px 0 #102d481d}
    .blank{display:inline-block;min-width:7rem;border-bottom:4px solid var(--orange);color:#b93c23;font-weight:900}
    .wordBank{display:flex;flex-wrap:wrap;align-content:flex-start;gap:.55rem}
    .bankWord{padding:.65rem .8rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
    .bankWord.used{background:var(--lime)}
    .requestFormula{display:grid;grid-template-columns:1fr auto 1fr;gap:.7rem;align-items:center;margin:1rem 0}
    .formulaPart{padding:1rem;background:var(--ink);color:var(--paper);font-weight:900;text-align:center}
    .formulaPlus{font-size:2rem;color:var(--orange);font-weight:900}
    .requestExamples{display:flex;flex-wrap:wrap;gap:.7rem}
    .requestBubble{flex:1 1 16rem;padding:1rem;border-radius:1.2rem 1.2rem 1.2rem .2rem;background:var(--white);border:3px solid var(--ink)}
    .choiceLanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
    .choice{padding:.85rem 1rem;background:var(--white);border:3px solid var(--ink);color:var(--ink);text-align:left;box-shadow:4px 4px 0 #102d4820}
    .choice.selected{background:var(--aqua)}
    .choice.correct{background:#e8f29e}
    .choice.incorrect{background:#ffd1c6}
    .emailCanvas{display:grid;grid-template-columns:.9fr 1.1fr;gap:1rem;align-items:center}
    .emailCard{background:var(--white);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--orange);overflow:hidden}
    .emailTop{display:flex;gap:.5rem;background:var(--ink);padding:.65rem}
    .emailTop i{width:.8rem;height:.8rem;border-radius:50%;background:var(--orange)}
    .emailBody{padding:1rem 1.2rem}
    .emailLine{padding:.55rem 0;border-bottom:2px solid #b8d7d1}
    .emailLine b{color:#b53c25}
    .repairList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
    .repair{padding:.8rem;background:var(--white);border-left:8px solid var(--orange);text-align:left;color:var(--ink)}
    .repair .fixed{display:none;margin-top:.5rem;color:#27620c}
    .repair.open{background:#eff8cf}
    .repair.open .fixed{display:block}
    .listenBoard{display:grid;grid-template-columns:.8fr 1.2fr;gap:1rem;align-items:start}
    .listenPrompt{background:var(--ink);color:var(--paper);padding:1.2rem;clip-path:polygon(0 0,94% 0,100% 9%,100% 100%,0 100%)}
    .listenPrompt h3{color:var(--lime)}
    .questionStrip{display:grid;gap:.55rem}
    .question{padding:.75rem;background:var(--white);border-bottom:5px solid var(--aqua);font-weight:800}
    .meetingArc{display:flex;gap:.55rem;align-items:stretch;margin-top:1rem}
    .meetingStep{flex:1;padding:.85rem;background:var(--white);border-top:8px solid var(--tone,var(--aqua));text-align:center;min-height:8rem}
    .meetingStep b{display:block;color:#b93c23;margin-bottom:.35rem}
    .teamRoles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem;margin-top:1rem}
    .teamRole{padding:.75rem .55rem;background:var(--white);border:2px solid var(--ink);min-height:9rem}
    .teamRole strong{display:grid;place-items:center;width:2rem;height:2rem;background:var(--orange);color:#fff;border-radius:50%;margin-bottom:.45rem}
    .scenario{background:var(--ink);color:var(--paper);padding:1.2rem 1.4rem;border-left:12px solid var(--orange);font-size:clamp(1.15rem,1.8vw,1.55rem);line-height:1.42}
    .decisionBar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-top:1rem}
    .decision{padding:.9rem;background:var(--white);border:3px solid var(--ink)}
    .orderList{display:grid;gap:.55rem;counter-reset:order}
    .orderItem{counter-increment:order;padding:.8rem 1rem;background:var(--white);border-left:8px solid var(--aqua);text-align:left;color:var(--ink)}
    .orderItem:before{content:counter(order);display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;margin-right:.5rem;border-radius:50%;background:var(--ink);color:#fff}
    .orderItem.selected{background:var(--lime)}
    .pitchHero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .pitchShade{position:absolute;inset:0;background:linear-gradient(90deg,#102d48f2 0 38%,#102d4888 53%,transparent 75%);z-index:-1}
    .pitchCopy{color:var(--paper);max-width:34rem;padding-top:8vh}
    .pitchCopy h2{color:var(--paper)}
    .pitchChecklist{display:grid;gap:.45rem}
    .pitchChecklist span{padding:.55rem .75rem;background:#fff5dded;color:var(--ink);font-weight:900}
    .pitchParts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
    .pitchPart{min-height:10rem;padding:.7rem;background:var(--white);border-bottom:8px solid var(--tone,var(--aqua))}
    .pitchPart strong{display:block;font-size:1.35rem;color:#b93c23;margin-bottom:.45rem}
    .reviewDeck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
    .reviewCard{min-height:9rem;padding:.8rem;background:var(--ink);color:var(--paper);border:3px solid var(--ink);text-align:left;transform:rotate(var(--r,0deg))}
    .reviewCard .back{display:none;color:var(--lime);margin-top:.6rem}
    .reviewCard.open{background:var(--paper);color:var(--ink)}
    .reviewCard.open .back{display:block}
    .homeworkSheet{display:grid;grid-template-columns:1.15fr .85fr;gap:1rem}
    .homeworkMain{padding:1.2rem;background:var(--white);border:3px solid var(--ink);box-shadow:9px 9px 0 var(--aqua)}
    .homeworkCheck{padding:1.2rem;background:var(--lime);border:3px solid var(--ink)}
    .meter{height:17px;background:#b9d2ce;margin:1rem 0}.meter i{display:block;height:100%;width:25%;background:var(--orange);transition:.3s}
    .feedback{font-weight:900;color:#b93c23;min-height:1.5em}
    .tools{position:fixed;z-index:25;right:1rem;top:1rem;display:flex;gap:.4rem}
    .tools button,.nav button{border:0;background:var(--orange);color:#fff;padding:.58rem .82rem;font-weight:900}
    .nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:1rem;background:#102d48f0;color:#fff;padding:.5rem .8rem;display:flex;gap:.65rem;align-items:center;border-radius:999px}
    .count{min-width:5rem;text-align:center;font-weight:900}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--lime)}
    .note,.map{display:none;position:fixed;z-index:35;background:#102d48f7;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:32rem;border:2px solid var(--lime)}
    .note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(850px,92vw);max-height:78vh;overflow:auto}.map button{margin:.2rem;padding:.45rem;border:0}
    @keyframes sceneIn{from{opacity:0;transform:translateY(12px);clip-path:inset(0 0 12% 0)}to{opacity:1;transform:none;clip-path:inset(0)}}
    @keyframes itemIn{from{opacity:0;transform:translateY(18px) rotate(1deg)}to{opacity:1;transform:none}}
    @media(max-width:900px){.roleOrbit,.teamRoles,.pitchParts{grid-template-columns:repeat(4,minmax(0,1fr))}.meetingArc{flex-wrap:wrap}.meetingStep{flex:1 1 12rem}}
    @media(max-width:700px){
      .scene{padding:4.5rem 1rem 6.8rem}
      h1{font-size:3.7rem}h2{font-size:2.3rem;max-width:none}
      .visualSplit,.briefFill,.emailCanvas,.listenBoard,.homeworkSheet{grid-template-columns:1fr}
      .featureImage{max-height:31vh}.objectivePath{display:grid}.objective,.objective:first-child{clip-path:none}
      .roleOrbit,.teamRoles,.pitchParts,.reviewDeck{grid-template-columns:1fr}
      .matchRows,.contrastGrid,.repairList,.choiceLanes,.decisionBar{grid-template-columns:1fr}
      .wordWall{columns:1}.meetingArc{display:grid}.meetingStep{min-height:0}
      .pitchCopy{padding-top:10vh}.pitchShade{background:#102d48d9}.pitchHero{object-position:68% center}
      .tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}.titleCopy{padding-top:15vh}.briefLines{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
  <link rel="stylesheet" href="experience-v3.css">
</head>
<body>
  <main id="deck"></main>
  <div class="tools"><button id="mapBtn">STUDIO MAP</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside><aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">&larr;</button><span id="count" class="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">&rarr;</button></nav>
  <script>
    const A='assets/';
    const S=(title,n,b)=>({title,n,b});
    const scenes=[
      S('Pop-Up Studio','2 min. Introduce the lesson as a realistic student business project. Ask students what the team is making.',`<img class="hero" src="${A}studio-hero-v2.png" alt="Seven high-school students developing reusable bottle prototypes in a creative startup studio"><div class="heroShade"></div><div class="stage titleCopy"><div class="kicker" style="color:var(--lime)">Lesson 21 - vocabulary</div><h1>Pop-Up<br>Studio</h1><p>Business English for a small team project.</p><span class="tag">PEOPLE</span><span class="tag">PROJECTS</span><span class="tag">MESSAGES</span></div>`),
      S('Business English in daily life','5 min. Students choose one situation and describe the English they might need.',`<div class="stage"><div class="kicker">01 - check-in</div><h2>Where might you use business English?</h2><div class="taskNote"><span class="taskIcon">i</span><span>Choose one situation. Name two words or phrases you might need there.</span></div><div class="collocationTrack" id="checkIn">${['school club','online shop','cafe job','sports team','charity event','creative project','summer job'].map((x,i)=>`<button class="collocation" data-check="${x}" style="--tone:${i%2?'var(--lime)':'var(--aqua)'}">${x}<em>Explain your choice.</em></button>`).join('')}</div><p id="checkOut" class="feedback">Select one situation.</p></div>`),
      S('The client brief','6 min. Read the brief aloud. Students identify the product, audience, quantity, budget, and deadline.',`<div class="stage visualSplit"><img class="featureImage" src="${A}client-brief-v2.png" alt="Teen client presenting a reusable bottle brief to a student startup team"><div><div class="kicker">02 - project context</div><h2>What does the client need?</h2><div class="briefSheet"><p>A school event needs <b>200 reusable bottles</b> for students aged 13-17.</p><div class="briefLines"><div class="briefLine">Budget: $600</div><div class="briefLine">Deadline: Friday</div><div class="briefLine">Style: bright and practical</div><div class="briefLine">Goal: reduce plastic waste</div></div></div><div class="taskNote"><span class="taskIcon">i</span><span>Find five facts in the brief. Which fact is most important?</span></div></div></div>`),
      S('Lesson objectives','2 min. Preview the language and final task. Students choose the objective they expect to find hardest.',`<div class="stage"><div class="kicker">03 - objectives</div><h2>By the end of the lesson, you can...</h2><div class="objectivePath"><div class="objective"><b>Understand</b>15 useful business words</div><div class="objective"><b>Use</b>7 common collocations</div><div class="objective"><b>Write</b>a polite request or update</div><div class="objective"><b>Run</b>a short project meeting</div></div><div class="taskNote"><span class="taskIcon">i</span><span>Choose one objective. Say why it will be useful.</span></div></div>`),
      S('People in a small business','6 min. Assign one role to each student. Students read the definition and add one action.',`<div class="stage"><div class="kicker">04 - people</div><h2>Who does what?</h2><div class="roleOrbit">${[['client','asks for work','◎'],['customer','buys a product','◉'],['manager','organises people','◆'],['designer','creates the look','✎'],['supplier','provides materials','⬡'],['sales assistant','helps customers','✦'],['colleague','works with you','●']].map((x,i)=>`<div class="roleNode" data-icon="${x[2]}" style="--i:${i};--tone:${i%3===0?'var(--orange)':i%3===1?'var(--lime)':'var(--aqua)'}"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>Each student chooses one role and completes: “A ___ usually...”</span></div></div>`),
      S('Match roles to situations','7 min. Give one numbered situation to each student. Students answer before clicking to reveal.',`<div class="stage"><div class="kicker">05 - controlled practice</div><h2>Which person should handle it?</h2><div class="taskNote"><span class="taskIcon">i</span><span>One situation per student. Say the role and explain why. Click to check.</span></div><div class="matchRows" id="roleMatch">${[['We need 200 metal bottles.','supplier'],['The product colours need changing.','designer'],['Someone wants to buy one bottle.','customer'],['The team needs a clear schedule.','manager'],['The school asks for a new product.','client'],['A visitor needs help at the stall.','sales assistant'],['You need help from someone on your team.','colleague']].map((x,i)=>`<button class="matchRow"><strong>${i+1}</strong><span>${x[0]}</span><span class="answerText">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Project vocabulary','6 min. Pronounce each word and connect it to the client brief.',`<div class="stage"><div class="kicker">06 - project words</div><h2>Seven words organise a project.</h2><div class="wordWall">${[['goal','the result you want','var(--orange)'],['task','a specific piece of work','var(--aqua)'],['deadline','the final time for work','var(--lime)'],['budget','money available to spend','var(--orange)'],['schedule','a plan of dates and times','var(--aqua)'],['update','new information about progress','var(--lime)'],['feedback','comments that help improve work','var(--orange)']].map(x=>`<div class="wordTile" style="--tone:${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>Choose one word and make a sentence about the bottle project.</span></div></div>`),
      S('Business collocations','7 min. Students guess the missing noun, then click each strip to reveal the complete collocation.',`<div class="stage"><div class="kicker">07 - word partnerships</div><h2>Which words commonly go together?</h2><div class="taskNote"><span class="taskIcon">i</span><span>One strip per student. Complete the phrase, click to check, then use it in a sentence.</span></div><div class="collocationTrack" id="collocations">${[['meet a...','deadline'],['set a...','budget'],['place an...','order'],['send an...','attachment'],['give...','feedback'],['make a...','decision'],['solve a...','problem']].map((x,i)=>`<button class="collocation" style="--tone:${i%2?'var(--lime)':'var(--aqua)'}">${x[0]}<em>${x[1]}</em></button>`).join('')}</div></div>`),
      S('Words with similar meanings','6 min. Compare each pair. Students create one example that shows the difference.',`<div class="stage"><div class="kicker">08 - meaning</div><h2>Choose the precise word.</h2><div class="contrastGrid">${[[['client','asks a business to do work'],['customer','buys a product']], [['price','what the customer pays'],['cost','money needed to make it']], [['goal','the final result'],['task','one action in the plan']], [['update','new progress information'],['feedback','comments about the work']]].map(x=>`<div class="contrast"><span class="vs">OR</span><div class="contrastPair"><div><b>${x[0][0]}</b><p>${x[0][1]}</p></div><div><b>${x[1][0]}</b><p>${x[1][1]}</p></div></div></div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>Choose one pair. Give two short examples that show the difference.</span></div></div>`),
      S('Complete the project brief','7 min. Students read the text and select words from the bank in order.',`<div class="stage"><div class="kicker">09 - reading in context</div><h2>Complete the bottle project plan.</h2><div class="taskNote"><span class="taskIcon">i</span><span>Read the full brief. Select the seven words in the order of the gaps.</span></div><div class="briefFill"><div class="reading">Our <span class="blank">1</span> is to make reusable bottles for the school event. The <span class="blank">2</span> is $600, and the <span class="blank">3</span> is Friday. Each person has one <span class="blank">4</span>. The <span class="blank">5</span> shows when we work. On Wednesday, we will send an <span class="blank">6</span> and ask the client for <span class="blank">7</span>.</div><div><div class="wordBank" id="briefBank">${['goal','budget','deadline','task','schedule','update','feedback'].map(x=>`<button class="bankWord" data-bank="${x}">${x}</button>`).join('')}</div><p id="briefOut" class="feedback">0 / 7 words selected.</p></div></div></div>`),
      S('Listen to a polite email','6 min. Play the email once for purpose and once for details. Keep the transcript hidden until after answers.',`<div class="stage listenBoard"><div class="listenPrompt"><div class="kicker" style="color:var(--lime)">10 - listening</div><h2 style="color:var(--paper)">What does Alex ask the client to do?</h2><p>Listen for the attachment, deadline, and request.</p></div><div class="questionStrip"><div class="question">1. What is attached?</div><div class="question">2. Which day is mentioned?</div><div class="question">3. What should Ms Khan check?</div><div class="question">4. Which phrase makes the request polite?</div></div><div class="taskNote"><span class="taskIcon">i</span><span>First listen: answer question 3. Second listen: answer all four.</span></div></div>`),
      S('Polite request patterns','6 min. Model each structure. Students identify the base verb and purpose.',`<div class="stage"><div class="kicker">11 - functional language</div><h2>Use a question to make a polite request.</h2><div class="requestFormula"><div class="formulaPart">Could you</div><div class="formulaPlus">+</div><div class="formulaPart">base verb...?</div></div><div class="requestExamples"><div class="requestBubble"><b>Could you confirm</b> the deadline?</div><div class="requestBubble"><b>Can we discuss</b> the budget?</div><div class="requestBubble"><b>Please could you send</b> the file?</div><div class="requestBubble"><b>Would you like to meet</b> on Thursday?</div></div><div class="taskNote"><span class="taskIcon">i</span><span>Choose one pattern and make a request about the bottle project.</span></div></div>`),
      S('Choose the professional request','7 min. Give one pair to each student. Only one choice in each pair should remain active.',`<div class="stage"><div class="kicker">12 - controlled practice</div><h2>Which sentence is clear and polite?</h2><div class="taskNote"><span class="taskIcon">i</span><span>One pair per student. Choose one sentence, then explain what makes it professional.</span></div><div class="choiceLanes" id="politeChoices">${[['Send the price now.','Could you confirm the price, please?',1],['I want the design.','Could you send the design?',1],['Change this.','Could we discuss one change?',1],['Give me Friday.','Would Friday work for you?',1],['Where is it?','Could you tell me where the file is?',1],['Your plan is bad.','Could I give you some feedback?',1],['Call me.','Could you call me this afternoon?',1]].map((x,i)=>`<div class="contrastPair" data-pair="${i}"><button class="choice" data-good="${x[2]===0}">${x[0]}</button><button class="choice" data-good="${x[2]===1}">${x[1]}</button></div>`).join('')}</div><p id="politeOut" class="feedback">Choose one sentence in each pair.</p></div>`),
      S('Identify the parts of an email','6 min. Use the visual, then label the six parts in the sample email.',`<div class="stage emailCanvas"><img class="featureImage" src="${A}communications-desk-v2.png" alt="Risograph communications desk with laptop phone calendar attachment card invoice and bottle prototype"><div><div class="kicker">13 - email structure</div><h2>A useful email has six clear parts.</h2><div class="emailCard"><div class="emailTop"><i></i><i></i><i></i></div><div class="emailBody"><div class="emailLine"><b>Subject:</b> Bottle design update</div><div class="emailLine"><b>Hello Ms Khan,</b></div><div class="emailLine">Please find the new design attached.</div><div class="emailLine">Could you confirm the colour by Wednesday?</div><div class="emailLine">Best wishes,<br>Alex</div></div></div><div class="taskNote"><span class="taskIcon">i</span><span>Point to the subject, greeting, attachment, request, deadline, and closing.</span></div></div></div>`),
      S('Repair a business email','9 min. Assign one line to each student. Students improve it before clicking to reveal a model.',`<div class="stage"><div class="kicker">14 - email editing</div><h2>Make each line clear and professional.</h2><div class="taskNote"><span class="taskIcon">i</span><span>One line per student. Say your improved version, then click to compare.</span></div><div class="repairList" id="emailRepair">${[['No subject','Subject: Bottle order update'],['Hey!','Hello Ms Khan,'],['I send file.','Please find the design attached.'],['Check it.','Could you check the new design?'],['Tell me today.','Could you reply by 4 p.m. today?'],['The price is maybe wrong.','Could you confirm the final price?'],['Bye.','Best wishes, Alex']].map((x,i)=>`<button class="repair"><strong>${i+1}. ${x[0]}</strong><span class="fixed">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Listen to a client phone call','6 min. Play the call twice. Students listen for purpose first, then the date and time.',`<div class="stage visualSplit"><img class="featureImage" src="${A}communications-desk-v2.png" alt="Phone and laptop prepared for a client call in a student startup studio"><div><div class="kicker">15 - phone listening</div><h2>Why does the caller phone Bright Ideas?</h2><div class="questionStrip"><div class="question">Purpose: What needs confirmation?</div><div class="question">Deadline day: Which day?</div><div class="question">Deadline time: What time?</div><div class="question">Polite phrase: Which request do you hear?</div></div><div class="taskNote"><span class="taskIcon">i</span><span>First listen: purpose only. Second listen: write all four details.</span></div></div></div>`),
      S('Check the phone-call details','6 min. Give one question to each student. Students answer before clicking to reveal.',`<div class="stage"><div class="kicker">16 - listening check</div><h2>What information did the caller receive?</h2><div class="taskNote"><span class="taskIcon">i</span><span>Answer from the phone call. Click each question to reveal the model.</span></div><div class="matchRows" id="callCheck">${[['Who answers the phone?','Lina'],['What is the caller asking about?','the project deadline'],['What verb follows “Could you”?','confirm'],['Which day is the file due?','Friday'],['What time is it due?','3 p.m.'],['What does “due” mean here?','must be finished by'],['What should the caller do next?','use the confirmed deadline']].map((x,i)=>`<button class="matchRow"><strong>${i+1}</strong><span>${x[0]}</span><span class="answerText">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Listen to a mini-meeting','6 min. Play the meeting once for the problem and once for the decision.',`<div class="stage"><div class="kicker">17 - meeting listening</div><h2>What does the team decide?</h2><div class="listenBoard"><div class="listenPrompt"><h3>Listen for four details</h3><p>1. What is ready?<br>2. What needs checking?<br>3. Who will contact the customer?<br>4. When will the update be sent?</p></div><div class="meetingArc"><div class="meetingStep" style="--tone:var(--aqua)"><b>Update</b>design status</div><div class="meetingStep" style="--tone:var(--lime)"><b>Problem</b>budget check</div><div class="meetingStep" style="--tone:var(--orange)"><b>Decision</b>contact customer</div><div class="meetingStep" style="--tone:var(--aqua)"><b>Deadline</b>tomorrow</div></div></div><div class="taskNote"><span class="taskIcon">i</span><span>First listen: identify the decision. Second listen: complete all four details.</span></div></div>`),
      S('Useful meeting language','7 min. Assign one stage to each student. Students add one original phrase for that stage.',`<div class="stage"><div class="kicker">18 - meeting phrases</div><h2>Use a clear phrase at each meeting stage.</h2><div class="meetingArc">${[['Open','Could we start?'],['Update','The design is ready.'],['Ask','What do you think?'],['Suggest','Could we change the order?'],['Agree','I agree with that.'],['Assign','I will contact the client.'],['Close','Let’s confirm the next step.']].map((x,i)=>`<div class="meetingStep" style="--tone:${i%3===0?'var(--orange)':i%3===1?'var(--aqua)':'var(--lime)'}"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>One stage per student. Read the model and add a different useful phrase.</span></div></div>`),
      S('Assign seven meeting roles','7 min. Give each student one role. Allow students to prepare one sentence before the meeting.',`<div class="stage"><div class="kicker">19 - speaking preparation</div><h2>Everyone has one clear responsibility.</h2><div class="teamRoles">${[['facilitator','open and close'],['project manager','explain the problem'],['budget lead','check the cost'],['designer','offer an option'],['supplier','explain delivery'],['client representative','ask for an update'],['note-taker','record action and deadline']].map((x,i)=>`<div class="teamRole"><strong>${i+1}</strong><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>Prepare one sentence for your role. Use at least one target collocation.</span></div></div>`),
      S('Solve the delivery problem','10 min. Run the live group task. The meeting must produce one action, one owner, one deadline, and one client message.',`<div class="stage"><div class="kicker">20 - production meeting</div><h2>The bottles will arrive two days late.</h2><div class="scenario">The school event is Friday. The supplier can deliver only 120 bottles by Friday; the other 80 will arrive on Sunday. The budget cannot increase.</div><div class="decisionBar"><div class="decision"><b>Decision</b><br>What will the team do?</div><div class="decision"><b>Owner and deadline</b><br>Who acts, and by when?</div><div class="decision"><b>Client update</b><br>What will you tell the client?</div></div><div class="taskNote"><span class="taskIcon">i</span><span>Use your assigned role. The facilitator must hear every student before the final decision.</span></div></div>`),
      S('Write the client update','8 min. Teams put the message in order, then replace the model details with their meeting decision.',`<div class="stage"><div class="kicker">21 - follow-up writing</div><h2>Send a clear update after the meeting.</h2><div class="taskNote"><span class="taskIcon">i</span><span>Select the four lines in the best order. Then adapt them to your decision.</span></div><div class="orderList" id="emailOrder">${['Hello Ms Khan,','I am writing with an update about the bottle order.','Could we deliver 120 bottles on Friday and 80 on Monday?','Please let us know if this plan works for you. Best wishes, the Pop-Up Studio team'].map((x,i)=>`<button class="orderItem" data-order="${i}">${x}</button>`).join('')}</div><p id="orderOut" class="feedback">0 / 4 lines selected.</p></div>`),
      S('Prepare the final proposal','8 min. Teams organise the final presentation. Each point should use specific business vocabulary.',`<img class="pitchHero" src="${A}final-pitch-v2.png" alt="Seven students presenting reusable bottle prototypes to a client"><div class="pitchShade"></div><div class="stage pitchCopy"><div class="kicker" style="color:var(--lime)">22 - presentation planning</div><h2>Present a complete proposal.</h2><div class="pitchChecklist"><span>1. Client need</span><span>2. Product idea</span><span>3. Budget and price</span><span>4. Schedule and deadline</span><span>5. Current problem</span><span>6. Team decision</span><span>7. Polite client request</span></div><div class="taskNote"><span class="taskIcon">i</span><span>Assign one point to each student. Prepare one or two sentences each.</span></div></div>`),
      S('Seven-part team proposal','9 min. Each student presents one part. Listeners record one strong word or phrase from every speaker.',`<div class="stage"><div class="kicker">23 - final speaking task</div><h2>Each person presents one part.</h2><div class="pitchParts">${[['1','Client need','The client needs...'],['2','Product','Our product is...'],['3','Budget','We set a budget of...'],['4','Schedule','Our deadline is...'],['5','Problem','The supplier...'],['6','Decision','We decided to...'],['7','Request','Could you confirm...?']].map((x,i)=>`<div class="pitchPart" style="--tone:${i%3===0?'var(--orange)':i%3===1?'var(--aqua)':'var(--lime)'}"><strong>${x[0]}</strong><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><div class="taskNote"><span class="taskIcon">i</span><span>Speak for 20-30 seconds. Use at least two target words or collocations.</span></div></div>`),
      S('Review the key language','8 min. Give one card to each student. They answer before clicking to reveal.',`<div class="stage"><div class="kicker">24 - review game</div><h2>Define it, complete it, or improve it.</h2><div class="taskNote"><span class="taskIcon">i</span><span>One card per student. Give a complete answer and one example before revealing.</span></div><div class="reviewDeck" id="reviewDeck">${[['Define “deadline”.','the final time for work'],['Complete: meet a...','deadline'],['Complete: place an...','order'],['Client or customer: asks you to do work?','client'],['Improve: Send the file.','Could you send the file, please?'],['What follows “Could you”?','a base verb'],['Name four project details.','goal, budget, schedule, deadline']].map((x,i)=>`<button class="reviewCard" style="--r:${i%2?'.6deg':'-.6deg'}"><strong>${i+1}. ${x[0]}</strong><span class="back">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Homework: professional project message','3 min. Explain both submission options and the required language.',`<div class="stage"><div class="kicker">25 - homework</div><h2>Write or record a project update.</h2><div class="homeworkSheet"><div class="homeworkMain"><h3>Situation</h3><p>Your team is preparing a school event. One task is late.</p><h3>Your message</h3><p>Write 80-100 words or record 45-60 seconds. Explain the problem, give an update, propose a next step, and make one polite request.</p></div><div class="homeworkCheck"><h3>Include</h3><p>✓ subject or clear opening<br>✓ 5 target words<br>✓ 2 collocations<br>✓ 1 polite request<br>✓ deadline and next action</p></div></div></div>`),
      S('Exit check','4 min. Students choose one confidence statement and complete one final prompt.',`<div class="stage"><div class="kicker">26 - reflection</div><h2>What can you do independently now?</h2><div class="meter"><i id="meter"></i></div><div class="choiceLanes" id="levels"><button class="choice" data-level="30">I can recognise business words.</button><button class="choice" data-level="55">I can write a polite request.</button><button class="choice" data-level="80">I can give a project update.</button><button class="choice" data-level="100">I can take part in a short meeting.</button></div><div class="taskNote"><span class="taskIcon">i</span><span>Choose one statement. Give one sentence as evidence.</span></div><p id="levelOut" class="feedback">Select one statement.</p><div class="kicker">Next: Gerunds and Infinitives - Hobbies and Interests</div></div>`)
    ];

    const deck=document.querySelector('#deck');
    deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');
    const note=document.querySelector('#note'),map=document.querySelector('#map');
    map.innerHTML='<h3 style="color:var(--lime)">Pop-Up Studio</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');
    let cur=0;
    function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>{x.classList.toggle('active',n===cur);if(n===cur)x.scrollTop=0});document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open')}
    show(0);
    document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#prev').onclick=()=>show(cur-1);
    document.querySelector('#mapBtn').onclick=()=>map.classList.toggle('open');document.querySelector('#noteBtn').onclick=()=>{note.innerHTML=`<b>Teacher note - ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};
    map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};
    document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#noteBtn').click()});
    let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});

    document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-check]').forEach(x=>x.classList.remove('open'));b.classList.add('open');document.querySelector('#checkOut').textContent=`Selected: ${b.dataset.check}. Name two useful words or phrases.`});
    document.querySelectorAll('.matchRow').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    document.querySelectorAll('#collocations .collocation').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    let bank=[];document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{if(bank.includes(b.dataset.bank))return;bank.push(b.dataset.bank);b.classList.add('used');document.querySelector('#briefOut').textContent=bank.length===7?'Complete: goal, budget, deadline, task, schedule, update, feedback.':`${bank.length} / 7 words selected.`});
    document.querySelectorAll('#politeChoices [data-pair]').forEach(pair=>{pair.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{pair.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','incorrect'));const good=b.dataset.good==='true';b.classList.add(good?'correct':'incorrect');document.querySelector('#politeOut').textContent=good?'Correct. The request is clear and polite.':'Try the other sentence. Use a question form and a polite phrase.'})});
    document.querySelectorAll('.repair').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    let order=[];document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(order.includes(+b.dataset.order))return;order.push(+b.dataset.order);b.classList.add('selected');const correct=order.every((x,i)=>x===i);document.querySelector('#orderOut').textContent=!correct?'The order is not correct. Leave the slide and return to reset.':order.length===4?'Correct. Now adapt the message to your meeting decision.':`${order.length} / 4 lines selected in the correct order.`});
    document.querySelectorAll('.reviewCard').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#meter').style.width=b.dataset.level+'%';document.querySelector('#levelOut').textContent='Give one sentence that proves your choice.'});
  </script>
  <script src="experience-v3.js"></script>
</body>
</html>
