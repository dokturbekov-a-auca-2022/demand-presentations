<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 1 — Postcard Exchange</title><style>
:root{--paper:#fff8e8;--ink:#24344b;--coral:#ef765d;--teal:#3caaa4;--mustard:#f2bd47;--sky:#dff2ee}*{box-sizing:border-box}body{margin:0;background:#d8ebe5;color:var(--ink);font-family:Georgia,serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5vh 8vw 10vh;position:relative;overflow:auto;background:var(--paper)}.scene.active{display:block;animation:stamp .35s both}.scene:after{content:'✉';position:absolute;right:4vw;bottom:6vh;color:var(--coral);font-size:8rem;opacity:.12}.stage{max-width:1150px;position:relative;z-index:1}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#fff8e8f5 0%,#fff8e8ce 45%,#24344b42)}.title{position:relative;max-width:52rem;padding:8vh 2rem 2rem;border:4px solid var(--ink);background:#fff8e8e8;box-shadow:14px 14px 0 var(--coral)}h1{font-size:clamp(4rem,8vw,8rem);line-height:.82;margin:.1em 0;color:var(--ink)}h2{font-size:clamp(2rem,4vw,4rem);line-height:.95;margin:.2em 0 .55em}.eyebrow,h3{font:900 .78rem 'Courier New',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--coral)}p{font-size:clamp(1rem,1.4vw,1.35rem);line-height:1.45}.stamp{display:inline-block;border:3px dashed var(--teal);padding:.45rem .8rem;margin:.3rem .2rem;font:900 .8rem 'Courier New',monospace;transform:rotate(-2deg)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:1.2rem;align-items:start}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.card,.choice{border:3px solid var(--ink);background:white;padding:1rem;box-shadow:6px 6px 0 #24344b22;min-height:7rem}.card:nth-child(2){background:var(--sky)}.card:nth-child(3){background:#ffe5c7}.choice{cursor:pointer;text-align:left;font:900 1rem Georgia;color:var(--ink);min-height:auto}.choice:hover,.choice.selected{background:var(--mustard)}.prompt{border-left:12px solid var(--coral);background:white;padding:1rem 1.3rem;font-size:clamp(1.25rem,2vw,2rem);box-shadow:8px 8px 0 #24344b22}.figure{width:100%;max-height:42vh;object-fit:cover;border:8px solid white;box-shadow:10px 10px 0 var(--teal)}.feedback{color:var(--coral);font-weight:900;min-height:1.5em}.tools{position:fixed;z-index:20;top:1rem;right:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:white;padding:.6rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;background:var(--ink);color:white;padding:.5rem}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff55}.progress i{display:block;height:100%;background:var(--mustard)}.map,.note{display:none;position:fixed;z-index:30;top:4.4rem;right:1rem;max-width:30rem;background:var(--ink);color:white;padding:1rem}.map.open,.note.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(820px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}@keyframes stamp{from{opacity:0;transform:translateY(12px) rotate(.4deg)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6rem}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:12vh}.tools{top:.5rem;right:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">POSTCARD RACK</button><button id="noteBtn">NOTE</button></div><aside id="map" class="map"></aside><aside id="note" class="note"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const units=[
['Check-in','Send a hello','Introduce yourself with three details.',['name + place','interest + reason','one current feeling']],
['Warm-up','Summer or winter?','Choose a picture and describe the update.',['I went…','I am…','I have…']],
['Objectives','Today’s route','By the end, you can revise core forms and keep a conversation moving.',['notice forms','choose forms','use forms']],
['Vocabulary','Postcard words','Match each word to a personal example.',['season','neighbourhood','routine']],
['Vocabulary practice','Sort the stamps','Categorise these words by time.',['usually · every day','yesterday · last week','tomorrow · next month']],
['Present simple','Your usual route','Use the present simple for routines and facts.',['I usually walk.','I am walk.','I walked every day.']],
['Present continuous','Live postcard','Use it for what is happening now.',['I am studying now.','I study now.','I studied now.']],
['Past simple','A finished memory','Use it for finished past events.',['We visited the lake.','We visit the lake yesterday.','We were visit the lake.']],
['Future simple','A promise card','Use will for a quick prediction or promise.',['I will call you.','I calling you.','I called you tomorrow.']],
['Present perfect','Life experience','Use have/has + past participle for experience.',['I have tried sushi.','I tried sushi ever.','I have try sushi.']],
['There is / are','Describe the scene','Choose the form that matches one or many.',['There is a map.','There are a map.','There be a map.']],
['Comparatives','Which is…?','Compare two places or seasons.',['warmer than','more warm than','warmest than']],
['First conditional','If the weather changes…','Complete a real possibility.',['If it rains, I will stay in.','If it rain, I stayed in.','If it raining, I stay.']],
['Grammar gallery','Spot the signal','Which time signal points to the past?',['last summer','right now','next winter']],
['Mixed practice','Choose the postcard','Select the sentence that fits the picture.',['She is packing now.','She packs yesterday.','She will packed.']],
['Reading','A winter update','Read a short update and find the main idea.',['a recent change','a future invention','a comparison chart']],
['Reading evidence','Find the proof','Which detail supports the main idea?',['a specific place','a random adjective','a new question']],
['Listening','Voice postcard','Listen for time markers in a partner’s update.',['first / then','maybe / perhaps','because / so']],
['Listening check','Catch the change','When the speaker says “but now…”, listen for…',['a present change','a past date','a definition']],
['Speaking','Postcard exchange','Ask one question and give one follow-up.',['Where did you go?','Why was it special?','Would you go again?']],
['Pronunciation','Make it natural','Link a short question smoothly.',['What did you do?','What · did · you · do?','WHAT DID YOU DO?']],
['Error clinic','Repair the stamp','Fix one common revision error.',['She went yesterday.','She go yesterday.','She did went yesterday.']],
['Team challenge','Timeline relay','Place four cards in time order.',['past','now','future']],
['Personal production','My update','Draft four connected sentences about your life.',['routine','recent event','next plan']],
['Peer response','Send it back','Give a partner one warm comment and one question.',['clear detail','good time signal','follow-up question']],
['Exit ticket','One star to keep','Choose the form you will practise this week.',['present perfect','first conditional','comparatives']],
['Goodbye','Postcard complete','Share one sentence with the room.',['I can…','I noticed…','Next I will…']]
];
const scenes=[{t:'Postcard Exchange',n:'Welcome learners and explain that the course starts by connecting English to their own life updates.',b:`<img class="hero" src="${A}postcard-classroom.png" alt="Teenagers exchanging postcards in a classroom with a world map"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 1 · revision + introductions</div><h1>Postcard<br>Exchange</h1><p>Meet the class, share a season, and refresh the English you already know.</p><span class="stamp">HELLO</span><span class="stamp">UPDATE</span><span class="stamp">REVISE</span></div>`}];
units.forEach((u,i)=>{let [t,lead,p,opts]=u;let img=i===1?`<img class="figure" src="${A}postcard-classroom.png" alt="Classroom postcard scene with students and a world map">`:i===4?`<img class="figure" src="${A}revision-route.png" alt="Revision cards arranged along a colorful route with clocks and postcards">`:'';let cards=opts.map(o=>`<button class="choice">${o}</button>`).join('');scenes.push({t,n:`${i+2} min. ${lead} Invite a few learners to personalise the prompt, then move on.`,b:`<div class="stage"><h3>${String(i+1).padStart(2,'0')} · ${t}</h3><div class="grid"><div><h2>${lead}</h2><div class="prompt">${p}</div><div class="cards">${cards}</div><p class="feedback"></p></div>${img}</div></div>`})});
const deck=document.querySelector('#deck'),map=document.querySelector('#map'),note=document.querySelector('#note'),count=document.querySelector('#count'),bar=document.querySelector('#bar');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');map.innerHTML='<h3 style="color:var(--mustard)">Postcard rack</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((s,n)=>s.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;map.classList.remove('open');note.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')mapBtn.click();if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');let f=b.closest('.grid').querySelector('.feedback');if(f)f.textContent='Postcard marked — explain your choice to a partner.'});
</script></body></html>
