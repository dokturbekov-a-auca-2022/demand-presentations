<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 17 — Mind Atlas</title><style>
:root{--paper:#f4ead6;--paper2:#fffaf0;--ink:#172d3b;--navy:#15394a;--rust:#b9563b;--moss:#718b55;--lilac:#9c8db9;--ochre:#d6a84e;--shadow:#172d3b2b}*{box-sizing:border-box}body{margin:0;background:#102b37;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}.deck{height:100vh}.scene{display:none;min-height:100%;padding:5.4vh 8vw 9vh;background:var(--paper);position:relative;overflow:auto}.scene.active{display:block;animation:leaf .42s both}.scene:before{content:'';position:absolute;right:-13vmin;top:-16vmin;width:40vmin;height:40vmin;border-radius:50%;background:var(--ochre);opacity:.16}.scene:after{content:'✦';position:absolute;left:4vw;bottom:7vh;font-size:5rem;color:var(--rust);opacity:.14;transform:rotate(-12deg)}h1{font-size:clamp(3.8rem,7.4vw,8.5rem);line-height:.82;margin:.1em 0;font-weight:700}h2{font-size:clamp(2rem,3.5vw,4rem);line-height:1.02;margin:.1em 0 .55em}h3{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--rust);font-size:.78rem;margin:.25em 0}.lead,p{font-size:clamp(1rem,1.4vw,1.45rem);line-height:1.45;max-width:70ch}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.inkveil{position:absolute;inset:0;background:linear-gradient(90deg,#102b37ed 0%,#102b37d9 38%,#102b3760 70%,#102b370e 100%);z-index:1}.titleCopy{position:relative;z-index:2;color:var(--paper);padding-top:10vh;max-width:48rem;text-shadow:0 2px 10px #0008}.titleCopy h1,.titleCopy p{color:var(--paper)}.titleCopy h3{color:var(--ochre)}.tag{display:inline-block;background:#f1d68b;color:var(--ink);font:900 .72rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:.55em .75em;border-radius:2px;transform:rotate(-2deg);margin:.2em}.eyebrow{font:900 .75rem Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--rust)}.grid{display:grid;gap:1.2rem;position:relative;z-index:1}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.notecard{background:var(--paper2);border:1px solid #172d3b30;padding:1.25rem;box-shadow:5px 7px 0 #172d3b16;position:relative}.notecard:before{content:'';position:absolute;left:12px;right:12px;top:8px;border-top:1px solid #b9563b40}.notecard h3{margin-top:.45rem}.journal{background:var(--paper2);border:1px solid #172d3b30;padding:1.7rem 2rem;box-shadow:0 15px 32px var(--shadow);transform:rotate(-.45deg);position:relative;z-index:1}.journal:after{content:'FIELD NOTE';position:absolute;right:1rem;top:1rem;color:var(--rust);font:bold .68rem Arial,sans-serif;letter-spacing:.12em;transform:rotate(5deg)}.quote{font-size:clamp(1.45rem,2.5vw,2.8rem);line-height:1.12;font-style:italic}.button,button{font:800 .98rem Arial,sans-serif;border:0;border-radius:3px;padding:.78rem 1.05rem;background:var(--navy);color:var(--paper);cursor:pointer;box-shadow:4px 4px 0 #102b3740;transition:.15s transform}.button:hover,button:hover{transform:translate(-2px,-2px)}button:focus{outline:3px solid var(--ochre);outline-offset:3px}.pin{border:2px solid var(--rust);background:var(--paper2);color:var(--ink);text-align:left;padding:1rem;position:relative;box-shadow:3px 4px 0 #172d3b18}.pin:before{content:'●';position:absolute;top:-.75rem;left:50%;transform:translateX(-50%);color:var(--rust);font-size:1.2rem}.pin.selected{background:#f3d89b}.strip{display:flex;gap:.75rem;align-items:stretch;position:relative;z-index:1}.strip .step{flex:1;background:var(--paper2);border-bottom:5px solid var(--moss);padding:1rem;min-height:7rem}.arrow{align-self:center;font-size:2rem;color:var(--rust)}.fold{background:var(--paper2);border:1px solid #172d3b35;padding:1rem;cursor:pointer;min-height:9rem;position:relative}.fold .inside{display:none;border-top:1px dashed #172d3b45;margin-top:.7rem;padding-top:.7rem}.fold.open .inside{display:block}.lens{border:2px solid var(--navy);background:transparent;color:var(--navy);padding:.55rem .8rem;margin:.2rem}.lens.active{background:var(--navy);color:var(--paper)}.lensText{background:#edf0df;border-left:7px solid var(--moss);padding:1rem;min-height:6rem}.imagePanel{position:relative;z-index:1;width:100%;max-height:43vh;object-fit:cover;border:7px solid var(--paper2);box-shadow:0 16px 30px var(--shadow)}.caption{font:.9rem Arial,sans-serif;color:#506272;margin:.35rem 0 1rem}.article{position:relative;z-index:1;background:var(--paper2);padding:1.7rem 2.4rem;max-width:75ch;box-shadow:9px 9px 0 #172d3b18;border-left:9px solid var(--rust);font-size:clamp(1.12rem,1.55vw,1.5rem);line-height:1.6}.article mark{background:#f1d68b;color:var(--ink);cursor:pointer;padding:.06em .15em}.article mark.hit{background:#c5d7a6}.sideNote{position:relative;z-index:1;border-left:3px solid var(--lilac);padding:1rem 1.2rem;font:1rem/1.45 Arial,sans-serif;color:#465a68}.meter{position:relative;z-index:1;height:19px;background:#d9cdb8;border-radius:2px;overflow:hidden}.meter i{display:block;width:35%;height:100%;background:var(--rust);transition:.3s}.bigNumber{font:bold clamp(3rem,6vw,6rem) Arial,sans-serif;color:var(--rust);line-height:1}.timeline{display:flex;align-items:center;gap:.5rem;position:relative;z-index:1}.timeline .node{flex:1;padding:1rem;background:var(--paper2);border:1px solid #172d3b35;text-align:center}.timeline .line{height:3px;background:var(--rust);width:4rem}.timer{font:bold clamp(4rem,9vw,8rem) Arial,sans-serif;text-align:center;color:var(--rust);margin:.1em}.center{text-align:center}.tools{position:fixed;right:1.2rem;top:1.1rem;z-index:20;display:flex;gap:.45rem}.tools button{box-shadow:none;background:var(--navy);padding:.55rem .7rem}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:1.4rem;z-index:20;display:flex;align-items:center;gap:.65rem;background:#102b37ef;color:var(--paper);padding:.45rem .75rem;border-radius:3px;font:bold .78rem Arial,sans-serif}.nav button{padding:.5rem .8rem;background:var(--rust);box-shadow:none}.count{min-width:4.8rem;text-align:center}.progress{height:5px;width:8rem;background:#ffffff3b}.progress i{display:block;height:100%;background:var(--ochre)}.note,.map{display:none;position:fixed;z-index:40;top:4.5rem;right:1.2rem;max-width:min(31rem,90vw);padding:1.2rem;background:#102b37f5;color:var(--paper);border:2px solid var(--ochre);font:1rem/1.45 Arial,sans-serif}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);top:9vh;width:min(760px,92vw)}.map button{font-size:.76rem;margin:.2rem;box-shadow:none;background:#ffffff16}.result{font:bold 1.05rem Arial,sans-serif;color:var(--rust)}.footer{position:absolute;bottom:5.4rem;left:8vw;right:8vw;border-top:1px dashed #172d3b55;z-index:1}@keyframes leaf{from{opacity:0;transform:translateY(10px) rotate(.3deg)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4rem 1.1rem 6.7rem}.two,.three,.four{grid-template-columns:1fr}.strip{flex-direction:column}.strip .arrow{transform:rotate(90deg);text-align:center}.tools{top:.55rem;right:.55rem}.nav{bottom:.6rem}.imagePanel{max-height:27vh}.article{padding:1.2rem 1.2rem;font-size:1.05rem}.footer{left:1.1rem;right:1.1rem;bottom:4.7rem}.timeline{flex-direction:column}.timeline .line{height:1.5rem;width:3px}.inkveil{background:linear-gradient(90deg,#102b37e7,#102b3770)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><style>.fold,.notecard,.strip .step{color:var(--ink)}.playExample{position:relative;z-index:1;margin-top:1rem;padding:1rem 1.2rem;background:#edf0df;border-left:7px solid var(--moss);font:1rem/1.45 Arial,sans-serif}.playExample b{color:var(--rust)}</style><link rel="stylesheet" href="experience-v3.css">
</head><body><main id="deck" class="deck"></main><div class="tools"><button id="menu">Atlas</button><button id="notesBtn">Notes</button></div><div id="note" class="note"></div><div id="map" class="map"></div><nav class="nav"><button id="prev" aria-label="Previous scene">←</button><span id="count" class="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next scene">→</button></nav><script>
const scenes=[
{t:'Mind Atlas',n:'2 min. Let the image set the tone. Ask students to name one thing they notice, not what they think it means.',b:`<img class="hero" src="assets/mind-atlas-hero.png" alt="Teenagers studying a giant map of thoughts with a magnifying glass, memory snapshots and a maze"><div class="inkveil"></div><div class="titleCopy"><h3>Lesson 17 · reading lesson</h3><h1>Mind<br>Atlas</h1><p>Psychology & human behaviour: read closely, think twice, notice more.</p><span class="tag">Observe</span><span class="tag">Infer</span><span class="tag">Question</span></div>`},
{t:'Check in: your attention',n:'4 min. Students can choose an imaginary example. Invite one “because” sentence.',b:`<h3>01 · field check</h3><h2>What steals your attention most easily?</h2><div class="grid four" id="checkPins">${['a bright colour','a sudden sound','a message','a familiar face','a funny idea','movement','a smell','something else'].map(x=>`<button class="pin" data-pin="${x}">${x}</button>`).join('')}</div><p id="checkResult" class="result">Choose a pin, then explain: “I notice it because…”</p>`},
{t:'Bridge from Lesson 16',n:'3 min. Connect reported speech to reading: information changes when we retell it. Ask what can change when we interpret behaviour.',b:`<h3>02 · bridge note</h3><div class="journal"><p class="quote">“A person looked away.”</p><p>What do we <i>know</i>? What might we <i>infer</i>? Keep the two lines separate.</p><div class="strip"><div class="step"><b>Observation</b><br>eyes moved away</div><div class="arrow">→</div><div class="step"><b>Possible interpretation</b><br>maybe distracted</div></div></div>`},
{t:'Look through three lenses',n:'5 min. Show the image. Students choose a lens, discuss with a partner, then compare how the question changes.',b:`<h3>03 · visual warm-up</h3><h2>One moment. Three ways to read it.</h2><img class="imagePanel" src="assets/behaviour-moments.png" alt="Four paper-collage panels showing memory, different interpretations, breathing before speaking and changing an opinion"><div class="center"><button class="lens active" data-lens="observe">Observe</button><button class="lens" data-lens="feel">Feel</button><button class="lens" data-lens="question">Question</button></div><p class="lensText" id="lensText">What can you see without guessing? Name colours, actions and objects.</p>`},
{t:'Today’s route',n:'1 min. Preview the expedition: students will read, annotate, compare evidence and create one small field note.',b:`<h3>04 · route card</h3><h2>Today we will…</h2><div class="timeline"><div class="node"><b>Notice</b><br>the scene</div><div class="line"></div><div class="node"><b>Read</b><br>two short texts</div><div class="line"></div><div class="node"><b>Test</b><br>our inferences</div><div class="line"></div><div class="node"><b>Map</b><br>human behaviour</div></div>`},
{t:'Words for the mind',n:'5 min. Students unfold each word, pronounce it, and write a tiny example in the air or notebook.',b:`<h3>05 · vocabulary field cards</h3><h2>Open the fold.</h2><div class="grid three">${[['attention','what your mind focuses on','“My attention moved to the bright sign.”'],['assumption','an idea you accept before checking','“That is an assumption, not a fact.”'],['cue','a small signal that gives information','“Her smile was a cue.”'],['bias','a preference that can affect judgement','“A bias can change what we notice.”'],['memory','what your mind keeps from the past','“Memory is not always a perfect recording.”'],['perspective','a particular way of seeing a situation','“Try another perspective.”']].map(([w,d,e])=>`<button class="fold"><span class="word">${w}</span><div class="inside">${d}<br><br><i>${e}</i></div></button>`).join('')}</div>`},
{t:'Evidence or interpretation?',n:'5 min. Students place each strip mentally on one of two notebook columns. Click to check.',b:`<h3>06 · sorting strips</h3><h2>Read the line. Which kind is it?</h2><div class="grid two" id="sortLines">${[['The boy checks the clock twice.','evidence'],['He is nervous.','interpretation'],['She keeps her notebook closed.','evidence'],['She does not trust us.','interpretation'],['The room is quiet.','evidence'],['Everyone feels uncomfortable.','overgeneralisation']].map(([q,a])=>`<button class="notecard reveal" data-answer="${a}"><p>${q}</p><div class="inside answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Prediction ladder',n:'4 min. Pairs choose one scene from the visual and climb from “I see” to “I wonder”.',b:`<h3>07 · before reading</h3><h2>Make a careful prediction.</h2><div class="strip"><div class="step"><b>I see…</b><br>a person looking at a phone.</div><div class="arrow">→</div><div class="step"><b>I think…</b><br>they may be waiting.</div><div class="arrow">→</div><div class="step"><b>I wonder…</b><br>what happened before?</div></div><p class="result">A good reader keeps “may” and “might” available.</p>`},
{t:'Reading map: The Red Umbrella',n:'2 min. Explain that this is a short accessible psychology reading, not a diagnosis or a test of personality.',b:`<h3>08 · reading map</h3><div class="journal"><p class="eyebrow">Text A · selective attention</p><h2>The Red Umbrella</h2><p>Read once for the story. Read again for the moments when the writer notices something—and misses something else.</p><div class="grid three"><div class="notecard"><b>First pass</b><br>What happens?</div><div class="notecard"><b>Second pass</b><br>What is noticed?</div><div class="notecard"><b>Third pass</b><br>What is inferred?</div></div></div>`},
{t:'Text A: The Red Umbrella',n:'6 min. Students read silently first. Then read aloud in pairs, changing readers at each paragraph.',b:`<h3>09 · close reading</h3><article class="article"><p>On the way to the café, Lina decided to count red things. She noticed a red umbrella, a red bicycle and a red cup on a table. At the door, her friend Sam waved, but Lina did not see him. Inside, Lina told Sam about the red umbrella. Sam laughed: he had been standing beside it.</p><p>Lina was not careless. Her attention had simply been tuned to one colour. When Sam pointed to the dog sleeping under the chair, Lina noticed that too. The dog had been there from the beginning.</p></article><div class="sideNote">Reader’s pencil: circle the object Lina notices first. Underline the moment her attention changes.</div>`},
{t:'Pin the evidence',n:'4 min. Students answer the questions, then click each pin to reveal a text-based answer.',b:`<h3>10 · text A evidence</h3><h2>Return to the lines, not your memory.</h2><div class="grid three" id="evidencePins">${[['What was Lina counting?','red things'],['Who did Lina miss at the door?','Sam'],['What changed her attention?','Sam pointed to the dog']].map(([q,a])=>`<button class="pin reveal"><p>${q}</p><div class="inside answer"><b>${a}</b></div></button>`).join('')}</div>`},
{t:'Selective attention',n:'5 min. Compare the panels. Students name what is foregrounded in each and what is easy to miss.',b:`<h3>11 · visual figure</h3><h2>Noticing is a spotlight, not a camera.</h2><img class="imagePanel" src="assets/selective-attention.png" alt="Two café scenes showing a spotlight on a red umbrella in one panel and a dog in the other"><div class="meter"><i id="spotlight"></i></div><div class="center"><button id="spotLeft">Spotlight: umbrella</button><button id="spotRight">Spotlight: dog</button></div><p id="spotText" class="result">A spotlight helps us notice one thing—and can hide another.</p>`},
{t:'Inference clinic',n:'4 min. Model how a strong reader uses cautious language. Students repair the overconfident sentence.',b:`<h3>12 · language noticing</h3><h2>Make the interpretation safer.</h2><div class="grid two"><div class="notecard"><p class="quote">“Lina missed Sam, so she is careless.”</p><span class="badge">too certain</span></div><div class="notecard"><p class="quote">“Lina may have missed Sam because her attention was on red things.”</p><span class="badge">supported inference</span></div></div>`},
{t:'Text B: The Almost-Remembered Route',n:'2 min. Preview the second reading. Ask students to predict why memory can feel certain.',b:`<h3>13 · reading map</h3><div class="journal"><p class="eyebrow">Text B · memory and confidence</p><h2>The Almost-Remembered Route</h2><p>As you read, track the difference between <b>remembering a detail</b> and <b>feeling sure</b> about a detail.</p><div class="timeline"><div class="node">event</div><div class="line"></div><div class="node">memory</div><div class="line"></div><div class="node">confidence</div></div></div>`},
{t:'Text B: The Almost-Remembered Route',n:'6 min. Students read, then retell the route using the sequence strips on the next scene.',b:`<h3>14 · close reading</h3><article class="article"><p>During a class trip, Noor remembered turning left at a fountain and then crossing a small bridge. She felt completely sure. When the group checked the map, there was no fountain on the route. There was a blue sign near a bridge.</p><p>Noor was surprised. Her memory was not a video. It had kept the bridge, but it had mixed the sign with a fountain from another walk. Her confidence had felt like proof, but confidence and accuracy were not exactly the same.</p></article><div class="sideNote">Reader’s pencil: mark the detail that changed. Put a star beside the sentence that gives the main idea.</div>`},
{t:'Sequence strips',n:'5 min. Students put the four strips in order by clicking. A correct order reveals the route.',b:`<h3>15 · reorder the route</h3><h2>What happened first, next, then, finally?</h2><div id="sequence" class="strip">${['Noor remembered a fountain.','The group checked the map.','The map showed a blue sign.','Noor understood the mix-up.'].map((x,i)=>`<button class="step" data-seq="${i}">${x}</button>`).join('')}</div><p id="sequenceResult" class="result">Tap strips in the order you think they happened.</p>`},
{t:'Find the main idea',n:'4 min. Students choose one sentence that could sit in the margin as a summary.',b:`<h3>16 · main idea</h3><h2>Which line covers the whole text?</h2><div class="grid three" id="mainIdea">${['Noor likes walking near fountains.','Memory can feel certain while still mixing details.','Blue signs are useful on class trips.'].map((x,i)=>`<button class="notecard choice" data-main="${i}">${x}</button>`).join('')}</div><p id="mainResult" class="result">Choose the widest idea, not the smallest detail.</p>`},
{t:'Truth, clue, or question?',n:'4 min. Students place a sentence into a mental notebook: known from text, clue, or open question.',b:`<h3>17 · reading moves</h3><div class="grid three"><div class="notecard"><h3>Known</h3><p>“The map showed a blue sign.”</p></div><div class="notecard"><h3>Clue</h3><p>“Noor may have mixed two walks.”</p></div><div class="notecard"><h3>Question</h3><p>“Why did the memory feel so certain?”</p></div></div><p class="quote">Strong readers leave room for a question mark.</p>`},
{t:'Mini experiment: change the lens',n:'5 min. One student describes an image for 20 seconds. The partner writes only observable details. Compare notes: what got filtered out?',b:`<h3>18 · paired investigation</h3><h2>Observation is a choice.</h2><div class="journal"><p class="eyebrow">Protocol</p><div class="strip"><div class="step"><b>20 sec</b><br>look silently</div><div class="arrow">→</div><div class="step"><b>30 sec</b><br>describe details</div><div class="arrow">→</div><div class="step"><b>1 min</b><br>compare notes</div></div><p>Finish: “I noticed ___, but I missed ___.”</p></div>`},
{t:'Case file: two readers',n:'6 min. Groups choose a case file and prepare an explanation using one observation, one inference and one question.',b:`<h3>19 · group case file</h3><h2>Choose one case. Build three careful lines.</h2><div class="grid two"><div class="notecard"><h3>Case A · the silent chat</h3><p>A friend reads a message and does not reply for an hour.</p><p><span class="badge">do not assume</span></p></div><div class="notecard"><h3>Case B · the quiet teammate</h3><p>A teammate speaks less during a new activity than usual.</p><p><span class="badge">look for context</span></p></div></div><div class="playExample"><b>How to play online:</b> In breakout rooms, choose A or B. Student 1 states the observation, Student 2 offers an idea with <i>might</i> or <i>could</i>, and Student 3 asks an open question.<br><b>Example:</b> “We observed that the friend did not reply for an hour. They might be busy. We still wonder if they saw the message at a bad time.”</div>`},
{t:'Perspective swap',n:'5 min. Partners take two different perspectives. They must use “might” or “could” at least once.',b:`<h3>20 · perspective switch</h3><h2>Same behaviour, different possible stories.</h2><div class="grid two"><div class="notecard"><h3>Lens 1</h3><p>“They are quiet because they are bored.”</p></div><div class="notecard"><h3>Lens 2</h3><p>“They could be quiet because they are concentrating.”</p></div></div><p>Which extra piece of evidence would help you decide?</p>`},
{t:'Build a Mind Atlas page',n:'7 min. Students create a tiny field note about a fictional everyday behaviour. They may draw instead of writing.',b:`<h3>21 · production task</h3><h2>Map a moment, not a person.</h2><div class="grid three"><div class="notecard"><h3>Sketch</h3><p>Draw the scene or use a safe fictional one.</p></div><div class="notecard"><h3>Annotate</h3><p>Write 2 observations and 1 possible explanation.</p></div><div class="notecard"><h3>Stay curious</h3><p>Add 1 question you cannot answer yet.</p></div></div><p class="quote">“A behaviour is a clue, not a complete biography.”</p>`},
{t:'Gallery walk',n:'5 min. Students walk or pass pages. Each reader leaves one “I noticed…” note and one “I wonder…” note.',b:`<h3>22 · response trail</h3><div class="strip"><div class="step"><b>Look</b><br>read the field note</div><div class="arrow">→</div><div class="step"><b>Notice</b><br>name one detail</div><div class="arrow">→</div><div class="step"><b>Wonder</b><br>ask one open question</div></div><p class="result">No “good / bad person” labels. Stay with the behaviour.</p>`},
{t:'Mind Atlas review',n:'5 min. Teams choose a flap, answer, then explain why. Keep the discussion about reading choices, not diagnoses.',b:`<h3>23 · review flaps</h3><h2>Open four final notes.</h2><div class="grid four">${[['Evidence','What can you observe?','a detail you can point to'],['Inference','What might it mean?','a careful possibility'],['Perspective','What else could be true?','another lens'],['Memory','Is confidence proof?','not always']].map(([a,q,ans])=>`<button class="fold"><span class="word">${a}</span><p>${q}</p><div class="inside"><b>${ans}</b></div></button>`).join('')}</div>`},
{t:'Reflection: update your map',n:'3 min. Students compare their first prediction with their final thinking.',b:`<h3>24 · reflection</h3><div class="journal"><p class="quote">“At the beginning I thought… Now I would check…”</p><p>Complete one sentence with a partner, a fictional example, or a private note.</p></div>`},
{t:'Homework: one-page field note',n:'2 min. Explain the privacy-friendly choices: fictional scene, public picture, or book/film moment.',b:`<h3>25 · homework</h3><h2>Make one careful Mind Atlas page.</h2><div class="grid three"><div class="notecard"><h3>Observe</h3><p>Sketch a safe everyday scene and list 3 visible details.</p></div><div class="notecard"><h3>Interpret</h3><p>Write 2 possible explanations using <i>may / might / could</i>.</p></div><div class="notecard"><h3>Question</h3><p>Write one question you would ask before deciding.</p></div></div>`},
{t:'Exit ticket',n:'2 min. Students choose one prompt and answer aloud or on paper. Preview Relative Clauses.',b:`<h3>26 · exit ticket</h3><h2>What will you notice differently?</h2><div class="grid three" id="exitStrip"><button class="pin">One word I can use is…</button><button class="pin">One reading move I can use is…</button><button class="pin">One assumption I can question is…</button></div><p id="exitResult" class="result">Choose one and finish the sentence.</p><p class="footer"></p><p class="caption">Next: Relative Clauses — Describing People & Places</p>`}
];
const deck=document.querySelector('#deck');let current=0;deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML=`<h3 style="color:var(--ochre)">Mind Atlas route</h3>${scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('')}`;
function show(i){current=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===current));document.querySelector('#count').textContent=`${current+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(current+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#menu').onclick=()=>map.classList.toggle('open');document.querySelector('#notesBtn').onclick=()=>{note.innerHTML=`<b>Teacher note · ${current+1}</b><br>${scenes[current].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#notesBtn').click()});let x0=null;document.addEventListener('touchstart',e=>x0=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].screenX-x0;if(Math.abs(d)>45)show(current+(d<0?1:-1));x0=null},{passive:true});document.querySelectorAll('.fold,.reveal').forEach(x=>x.onclick=()=>x.classList.toggle('open'));document.querySelectorAll('[data-pin]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-pin]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');document.querySelector('#checkResult').textContent=`You chose “${x.dataset.pin}”. Explain why it catches your attention.`});const lensText={observe:'What can you see without guessing? Name colours, actions and objects.',feel:'What emotion might be present? Use “may / might” and explain the clue.',question:'What do you still need to know? Write an open question.'};document.querySelectorAll('.lens').forEach(x=>x.onclick=()=>{document.querySelectorAll('.lens').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector('#lensText').textContent=lensText[x.dataset.lens]});document.querySelectorAll('#spotLeft,#spotRight').forEach(x=>x.onclick=()=>{const left=x.id==='spotLeft';document.querySelector('#spotlight').style.width=left?'72%':'25%';document.querySelector('#spotText').textContent=left?'The umbrella becomes the foreground; the dog can disappear.':'The dog becomes the foreground; the umbrella can disappear.'});let seq=[];document.querySelectorAll('[data-seq]').forEach(x=>x.onclick=()=>{if(!seq.includes(+x.dataset.seq)){seq.push(+x.dataset.seq);x.style.background='#c5d7a6';document.querySelector('#sequenceResult').textContent=seq.length===4?(seq.join(',')==='0,1,2,3'?'Excellent — the route is in order.':'Good thinking — compare your order with the story.'): `Selected ${seq.length}/4 strips.`}});document.querySelectorAll('[data-main]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-main]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');document.querySelector('#mainResult').textContent=x.dataset.main==='1'?'Yes — it explains the whole text.':'That is one detail; look for the wider message.'});document.querySelectorAll('#exitStrip .pin').forEach(x=>x.onclick=()=>{x.classList.add('selected');document.querySelector('#exitResult').textContent='Now complete your sentence for a partner or your notebook.'});document.querySelectorAll('.article mark').forEach(x=>x.onclick=()=>x.classList.toggle('hit'));
</script><style>.titleCopy{z-index:10!important;color:#fff!important;text-shadow:0 3px 14px #000b}.titleCopy h1,.titleCopy p{color:#fff!important}</style><script src="experience-v3.js"></script>
