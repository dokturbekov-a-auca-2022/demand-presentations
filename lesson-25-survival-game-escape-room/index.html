<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 25 — Escape Protocol</title><style>
:root{--navy:#102b45;--orange:#f47b43;--teal:#47c7bd;--cream:#f5edda;--ink:#1d2b35;--line:#8eb8b4}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:'Courier New',monospace;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:deploy .35s both}.scene:before{content:'⌁';position:absolute;right:4vw;bottom:7vh;color:var(--orange);font-size:8rem;opacity:.12}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#102b45eb,#102b45a8 48%,#102b4520)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--orange);background:#102b459b}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font:clamp(1.1rem,2vw,1.7rem)/1.3 Arial,sans-serif}.eyebrow,h3{font:900 .76rem 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}h2{font:900 clamp(2rem,4vw,4.2rem)/.95 'Courier New',monospace;text-transform:uppercase;color:var(--navy);margin:.2em 0 .55em}p{font:clamp(1rem,1.4vw,1.35rem)/1.42 Arial,sans-serif}.badge{display:inline-block;background:var(--orange);color:#fff;padding:.45rem .7rem;font-weight:900;margin:.2rem;transform:rotate(-2deg)}.blueprint{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.zone{background:#fff;border:3px dashed var(--navy);padding:1.1rem;min-height:8rem;position:relative}.zone:after{content:'◈';position:absolute;right:.7rem;top:.5rem;color:var(--teal)}.zone strong{color:var(--navy);font-size:1.25rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--teal)}.clue{background:#fff5c7;border:3px solid var(--orange);padding:1rem;box-shadow:7px 7px 0 #102b4522}.choice{background:#fff;border:3px solid var(--navy);padding:.85rem 1rem;color:var(--navy);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #102b4522}.choice:hover,.choice.selected{background:var(--teal)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.tokens{display:flex;flex-wrap:wrap;gap:.65rem}.token{background:var(--navy);color:#fff;border:0;padding:.8rem 1rem;font-weight:900;cursor:pointer}.token.on{background:var(--orange)}.lock{width:190px;height:190px;border-radius:50%;border:14px solid var(--navy);background:conic-gradient(var(--orange) 0 25%,var(--teal) 25% 55%,var(--cream) 55%);display:grid;place-items:center;margin:1rem auto}.lock span{background:var(--cream);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-weight:900;text-align:center}.feedback{font-weight:900;color:var(--orange);min-height:1.5em}.meter{height:18px;background:#c8d3c8;margin:1rem 0}.meter i{display:block;height:100%;width:30%;background:var(--orange);transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--orange);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#102b45ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--teal)}.note,.map{display:none;position:fixed;z-index:30;background:#102b45f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--navy)}@keyframes deploy{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.blueprint,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">MISSION MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Escape Protocol','2 min. Open with the bunker image. Explain that success means good teamwork, not speed alone.',`<img class="hero" src="${A}bunker-briefing.png" alt="Illustrated escape-room bunker with teens, map table, ropes and coded locks"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 25 · problem solving</div><h1>Escape<br>Protocol</h1><p>Survive the scenario, explain your choices, unlock the language.</p><span class="badge">NOTICE</span><span class="badge">PLAN</span><span class="badge">DECIDE</span></div>`),
S('Check-in: your survival strength','4 min. Students choose a safe fictional strength.',`<div class="stage"><h3>01 · check-in</h3><h2>What would you bring to a team?</h2><div class="tokens" id="strength">${['calm thinking','a map','good memory','quick ideas','careful listening','encouragement'].map(x=>`<button class="token" data-strength="${x}">${x}</button>`).join('')}</div><p id="strengthOut" class="feedback">Choose one and explain how it helps.</p></div>`),
S('Bridge from Lesson 24','3 min. Connect daily-life phrasal verbs to mission actions.',`<div class="stage"><h3>02 · bridge</h3><div class="clue">“We ran out of water, so we looked for a river and carried on.”</div><p>Today we add plans, evidence, priorities, and decisions.</p></div>`),
S('Read the bunker briefing','5 min. Students predict the problems they may need to solve.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What clues can you see?</h2><img class="figure" src="${A}clue-kit.png" alt="Illustrated clue kit with compass folded note key rope bottle and lock dial"><p class="feedback">Name three objects and one possible use.</p></div>`),
S('Mission map','1 min. Preview the decision cycle.',`<div class="stage"><h3>04 · mission route</h3><div class="blueprint"><div class="zone"><strong>Observe</strong><br>What do we know?</div><div class="zone"><strong>Plan</strong><br>What are our options?</div><div class="zone"><strong>Act</strong><br>What happens next?</div></div></div>`),
S('Team roles','5 min. Assign roles and rotate them.',`<div class="stage"><h3>05 · team setup</h3><div class="blueprint"><div class="zone"><strong>Navigator</strong><br>tracks the route</div><div class="zone"><strong>Evidence keeper</strong><br>points to clues</div><div class="zone"><strong>Speaker</strong><br>explains the decision</div></div></div>`),
S('Survival kit vocabulary','5 min. Students tap a tool and describe a use.',`<div class="stage"><h3>06 · vocabulary</h3><div class="tokens" id="kit">${['compass','rope','torch','water bottle','first-aid kit','map','key','signal mirror'].map(x=>`<button class="token" data-kit="${x}">${x}</button>`).join('')}</div><p id="kitOut" class="feedback">Choose a tool: “We need it to …”</p></div>`),
S('Priority ladder','5 min. Rank what matters first in a storm scenario.',`<div class="stage"><h3>07 · priorities</h3><div class="blueprint" id="priority"><button class="zone choice">find shelter</button><button class="zone choice">check the map</button><button class="zone choice">share water</button><button class="zone choice">take a photo</button></div><p id="priorityOut" class="feedback">Which two actions protect the team first?</p></div>`),
S('Evidence or guess?','4 min. Students separate facts from assumptions.',`<div class="stage"><h3>08 · evidence</h3><div class="grid2" id="evidence"><button class="choice">The bridge is broken. (visible clue)</button><button class="choice">The cave is dangerous. (guess)</button><button class="choice">There is one bottle left. (counted)</button><button class="choice">The storm will last all day. (guess)</button></div><p id="evidOut" class="feedback">Label each line: evidence or assumption.</p></div>`),
S('Conditionals for choices','5 min. Build if/then plans orally.',`<div class="stage"><h3>09 · planning language</h3><div class="clue">If we cross the bridge, we will reach the cave.<br>If the bridge is unsafe, we will follow the river.</div><p>Use “If …, we will …” for a team plan.</p></div>`),
S('Lock dial: choose a code','5 min. Teams click the safest plan; the lock opens with feedback.',`<div class="stage"><h3>10 · lock 1</h3><div class="lock"><span id="lockText">LOCK<br>01</span></div><div class="grid2" id="lock1"><button class="choice">cross the broken bridge</button><button class="choice">check the rope bridge first</button><button class="choice">leave the water behind</button><button class="choice">share the water</button></div><p id="lockOut" class="feedback">Choose the plan with evidence and care.</p></div>`),
S('Route map: three paths','4 min. Compare risk, time, and supplies.',`<div class="stage"><h3>11 · route choice</h3><img class="figure" src="${A}island-map.png" alt="Illustrated overhead survival island map with river cave bridge supply crate and routes"><div class="blueprint"><div class="zone"><strong>Cliff path</strong><br>fast · risky</div><div class="zone"><strong>River path</strong><br>slow · water</div><div class="zone"><strong>Forest path</strong><br>unknown · shade</div></div></div>`),
S('Decision matrix','5 min. Teams score each route.',`<div class="stage"><h3>12 · compare</h3><div class="blueprint"><div class="zone"><strong>Safety</strong><br>What could go wrong?</div><div class="zone"><strong>Resources</strong><br>What will we use?</div><div class="zone"><strong>Goal</strong><br>Will it get us there?</div></div><p>Explain: “We choose ___ because ___.”</p></div>`),
S('Repair the plan','4 min. Find the missing step in a weak plan.',`<div class="stage"><h3>13 · plan repair</h3><div class="clue">“We will run to the cave. We have no map, no water, and no idea where the bridge is.”</div><div class="tokens"><span class="badge">pause</span><span class="badge">check evidence</span><span class="badge">share resources</span></div></div>`),
S('Read the mission brief','2 min. Predict the decision before reading the details.',`<div class="stage"><h3>14 · reading preview</h3><div class="clue">Your team has 30 minutes, one bottle of water, a compass, and three possible routes.</div><p>Which route would you investigate first?</p></div>`),
S('Text: The North Ridge','6 min. Partner-read and mark evidence for the final decision.',`<div class="stage"><h3>15 · mission reading</h3><div class="clue"><p>The team reaches a fork. The cliff path is short, but the rocks are wet. The river path is longer, yet it leads to water and a flat place to rest. The forest path looks safe, but the map has no details about it. The team checks its supplies and chooses the river path. They can refill the bottle and move carefully.</p></div><p>Underline two facts. Circle the reason for the decision.</p></div>`),
S('Evidence check','4 min. Click the line that supports the team’s choice.',`<div class="stage"><h3>16 · evidence lock</h3><div class="grid2" id="read"><button class="choice">The cliff rocks are wet.</button><button class="choice">The river leads to water.</button><button class="choice">The forest map has no details.</button><button class="choice">The team wants a photo.</button></div><p id="readOut" class="feedback">Which facts support a careful plan?</p></div>`),
S('Clue kit close-up','4 min. Use the objects to make an if/then plan.',`<div class="stage"><h3>17 · visual planning</h3><img class="figure" src="${A}clue-kit.png" alt="Illustrated clue kit with compass rope key bottle and lock dial"><p class="feedback">Choose two objects and build: “If we use …, we will …”</p></div>`),
S('Information gap: supply cards','6 min. Partner A has supplies; Partner B has route problems. Negotiate a plan.',`<div class="stage"><h3>18 · pair mission</h3><div class="grid2"><div class="clue"><b>Supply card</b><br>rope · torch · half bottle · compass</div><div class="clue"><b>Problem card</b><br>dark cave · broken bridge · no sign</div></div><p>Ask: “What do we have?” “What should we use first?”</p></div>`),
S('Lock 2: the team vote','5 min. Teams vote, then justify the majority decision.',`<div class="stage"><h3>19 · decision</h3><div class="grid2" id="vote"><button class="choice">follow the river</button><button class="choice">take the cliff path</button><button class="choice">wait for daylight</button><button class="choice">split the team</button></div><p id="voteOut" class="feedback">Choose one plan and defend it with two reasons.</p></div>`),
S('Useful disagreement','4 min. Practise challenging an idea respectfully.',`<div class="stage"><h3>20 · team language</h3><div class="blueprint"><div class="zone"><strong>I see your point, but …</strong></div><div class="zone"><strong>What evidence do we have?</strong></div><div class="zone"><strong>Could we compare another option?</strong></div></div></div>`),
S('Escape-room round','7 min. Groups solve a three-clue chain.',`<div class="stage"><h3>21 · production setup</h3><div class="blueprint"><div class="zone"><strong>Clue 1</strong><br>find the safe object</div><div class="zone"><strong>Clue 2</strong><br>choose the route</div><div class="zone"><strong>Clue 3</strong><br>explain the exit plan</div></div></div>`),
S('Present the solution','7 min. Teams give a 60-second briefing.',`<div class="stage"><h3>22 · production</h3><div class="clue">“We observed … We considered … We chose … If …, we will …”</div><p>Listeners ask one challenge question and one support question.</p></div>`),
S('Peer evaluator','5 min. Use the three checks as feedback.',`<div class="stage"><h3>23 · feedback</h3><div class="blueprint"><div class="zone"><strong>Evidence</strong><br>Did they point to clues?</div><div class="zone"><strong>Teamwork</strong><br>Did everyone contribute?</div><div class="zone"><strong>Clarity</strong><br>Did the plan have steps?</div></div></div>`),
S('Final lock quiz','5 min. Teams choose the strongest problem-solving move.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">check evidence before guessing</button><button class="choice">choose the fastest path automatically</button><button class="choice">share resources</button><button class="choice">explain the next step</button></div><p id="quizOut" class="feedback">Choose the moves that make a plan safer.</p></div>`),
S('One-minute briefing','2 min. Students speak under a short countdown.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START BRIEFING</button><p>Use: observed · considered · chose · if/then.</p></div>`),
S('Homework: design a mission','2 min. Students create a safe fictional challenge.',`<div class="stage"><h3>26 · homework</h3><div class="blueprint"><div class="zone"><strong>Map</strong><br>draw three locations</div><div class="zone"><strong>Clues</strong><br>add three objects</div><div class="zone"><strong>Solution</strong><br>write an if/then plan</div></div></div>`),
S('Exit ticket','2 min. Students finish one mission sentence. Preview Question Tags.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Unlock the final sentence.</h2><div class="tokens" id="exit"><button class="token">We chose … because …</button><button class="token">If …, we will …</button><button class="token">One clue we used was …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Question Tags · Small Talk</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--teal)">Escape Protocol map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-strength]').forEach(b=>b.onclick=()=>{b.classList.add('on');strengthOut.textContent=`You chose ${b.dataset.strength}. Explain its value.`});document.querySelectorAll('[data-kit]').forEach(b=>b.onclick=()=>{b.classList.add('on');kitOut.textContent=`Use the ${b.dataset.kit}: “We need it to …”`});document.querySelectorAll('#evidence .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');evidOut.textContent='Classify it as evidence or assumption.'});document.querySelectorAll('#lock1 .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');lockOut.textContent='Good — justify the plan with a clue.';lockText.textContent='OPEN'});document.querySelectorAll('#priority .choice,#read .choice,#vote .choice,#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');priorityOut&&(priorityOut.textContent='Compare safety, resources, and goal.');readOut&&(readOut.textContent='Evidence selected — point to the text.');voteOut&&(voteOut.textContent='Defend your choice with two reasons.');quizOut&&(quizOut.textContent='Keep the moves that improve the plan.')});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .token').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Complete the mission sentence for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #05121f}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe2a0!important}</style></body></html>
