<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <title>Lesson 25 | ORBIT 09: Signal Lost</title>
  <link rel="stylesheet" href="experience-v5.css">
</head>
<body>
  <main id="deck"></main>
  <div class="mission-hud"><span>O₂ <b id="oxygenHud">72%</b></span><span>CREW <b id="scoreHud">00</b></span></div>
  <div class="tools"><button id="mapBtn">MISSION PATH</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside><aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">→</button></nav>
  <script>
    const A='assets/';
    const info=text=>`<div class="instruction"><span>i</span>${text}</div>`;
    const S=(title,note,body,style='void')=>({title,note,body,style});
    const scenes=[
      S('ORBIT 09: Signal Lost','Open with the full crew image. Explain that language quality and teamwork determine the outcome.',`<img class="fullbleed" src="${A}orbit-crew-v2.png" alt="Exactly seven teenagers planning around a glowing table in an orbital station"><div class="hero-shade"></div><div class="hero-copy"><small>LESSON 25 · PROBLEM SOLVING</small><h1>ORBIT 09</h1><h2>SIGNAL<br>LOST</h2><p>Restore oxygen. Reach the pod. Keep all seven crew members together.</p><button id="bootMission">BEGIN MISSION</button></div><div class="impact-ring"></div>`,'hero void'),
      S('Choose your survival strength','Each student chooses a different strength where possible.',`<div class="sector">01 · CREW CHECK</div><h2 class="wide-title">What can you contribute when a plan goes wrong?</h2><div class="strength-orbit" id="strengths">${['calm thinking','careful listening','clear speaking','quick ideas','good memory','fair decisions','encouragement'].map((x,i)=>`<button data-strength="${x}" style="--a:${i*51.4}deg">${x}</button>`).join('')}</div>${info('Choose one strength. Give a real or fictional example of when it helps a team.')}<p id="strengthOut" class="signal-line">Select your crew strength.</p>`,'signal'),
      S('The station has lost main power','Let students inspect the image silently, then collect concrete observations.',`<img class="fullbleed" src="${A}damaged-corridor-v2.png" alt="Dark orbital station corridor with emergency lights, a sealed airlock, papers, and floating tools"><div class="scanlines"></div><div class="incident-copy"><small>02 · INCIDENT</small><h2>POWER<br>OFFLINE.</h2><p>Oxygen is falling. The main corridor is blocked. The escape pod has limited reserve power.</p></div>${info('Name three visible facts. Do not guess what caused the damage yet.')}`,'image void'),
      S('Your mission has four measurable goals','Students paraphrase one objective each.',`<div class="sector">03 · MISSION GOALS</div><div class="goal-cross"><div><b>01</b><span>Identify facts before making assumptions.</span></div><div><b>02</b><span>Compare options using risk and evidence.</span></div><div><b>03</b><span>Use should, could, and if/will accurately.</span></div><div><b>04</b><span>Present one clear team solution.</span></div></div><div class="radar"><i></i><span></span></div>`,'light'),
      S('Assign all seven crew roles','Roles remain active during every later discussion.',`<div class="sector">04 · CREW FORMATION</div><h2>Seven people.<br>One decision.</h2><div class="crew-ring">${[['Commander','invites every voice'],['Evidence officer','separates facts from guesses'],['Route analyst','compares paths'],['Supply officer','tracks equipment'],['Safety officer','checks risks'],['Timekeeper','controls speaking time'],['Reporter','presents the final plan']].map((x,i)=>`<button class="crew-role" style="--i:${i}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}<div class="crew-core">07</div></div>${info('One role per student. Read your responsibility aloud and keep it for the full mission.')}`,'void'),
      S('Use language that moves a decision forward','Teacher models one complete chain before students create another.',`<div class="language-chain"><strong>WE <i>SHOULD</i> ...</strong><span>because the evidence shows ...</span><strong>WE <i>COULD</i> ...</strong><span>but the risk is ...</span><strong>IF WE ..., <i>WE WILL</i> ...</strong><span>so our final choice is ...</span></div>${info('Build one four-line plan about a blocked door, low oxygen, or a missing key.')}`,'orange'),
      S('Separate evidence from assumptions','Students must explain the word or detail that influenced their decision.',`<div class="sector">06 · SENSOR LOG</div><h2 class="split-title">FACT<br><i>or</i><br>GUESS?</h2><div class="evidence-stream" id="evidenceStream">${[['The oxygen meter reads 72%.','fact'],['The greenhouse pipe is leaking.','fact'],['The service ring is probably safe.','guess'],['The exterior route is the shortest.','fact'],['The alarm will stop soon.','guess'],['The keycard is beside the airlock.','fact'],['The crew can repair everything.','guess']].map((x,i)=>`<button data-state="${x[1]}"><b>${String(i+1).padStart(2,'0')}</b><span>${x[0]}</span><em>?</em></button>`).join('')}</div>${info('One line per student. Say fact or guess, explain why, then click to confirm.')}<p id="evidenceOut" class="signal-line">Evidence requires something observed, measured, or recorded.</p>`,'light'),
      S('Inspect the emergency supplies','Students identify objects before seeing the vocabulary list.',`<img class="fullbleed" src="${A}survival-supplies-v2.png" alt="Emergency supplies arranged on a dark spacecraft workbench"><div class="supply-scan"><span>SCAN 08</span><i></i></div><div class="supply-copy"><h2>YOU CAN<br>TAKE ONLY<br>THREE.</h2></div>${info('Name as many objects as possible. Explain one possible use for each object you recognise.')}`,'image void'),
      S('Make every object useful','One item per student; classmates improve vague explanations.',`<div class="sector">08 · EQUIPMENT LANGUAGE</div><div class="equipment-wave">${[['oxygen canister','breathe if pressure falls'],['water pouch','prevent dehydration'],['first-aid kit','treat a minor injury'],['magnetic rope','cross or secure an area'],['flashlight','see in a dark corridor'],['repair tool','close a valve or fix a panel'],['signal beacon','show the pod our location']].map((x,i)=>`<button><b>${x[0]}</b><span>We need it to ${x[1]}.</span></button>`).join('')}</div>${info('One item per student. Explain its use without reading the model, then click to compare.')}`,'cyan'),
      S('Build a three-item loadout','The capacity indicator prevents more than three active choices.',`<div class="sector">09 · LOADOUT</div><h2>Choose exactly<br><i>three supplies.</i></h2><div class="loadout" id="loadout">${[['oxygen canister',3],['water pouch',1],['first-aid kit',2],['magnetic rope',2],['flashlight',1],['repair tool',3],['signal beacon',2]].map(x=>`<button data-points="${x[1]}">${x[0]}</button>`).join('')}</div><div class="capacity"><span id="capacityFill"></span></div><p id="loadoutOut" class="signal-line">0 / 3 selected. Explain what problem each item solves.</p>${info('Agree on three supplies. The Supply Officer clicks them; the Commander explains the final loadout.')}`,'light'),
      S('Listen to the emergency announcement','Play once for the main danger and once for exact instructions.',`<div class="alert-stage"><div class="alert-symbol">!</div><div><small>10 · STATION ANNOUNCEMENT</small><h2>What must the crew do before opening an airlock?</h2><div class="pulse-wave">${Array.from({length:25},(_,i)=>`<i style="--h:${22+(i*23)%70}%"></i>`).join('')}</div></div></div>${info('First listen: identify the main danger. Second listen: write four required actions.')}`,'void'),
      S('Put the emergency response in order','The sequence indicator stops at the first incorrect move.',`<div class="sector">11 · RESPONSE SEQUENCE</div><h2>What happens first?</h2><div class="sequence-rail" id="alertOrder">${[[4,'choose a route'],[0,'stay together'],[6,'enter the escape pod'],[2,'check the evidence'],[1,'listen to the full message'],[5,'test the airlock'],[3,'choose supplies']].map(x=>`<button data-order="${x[0]}">${x[1]}</button>`).join('')}</div>${info('Select all seven actions in order. Explain why each step must happen before the next one.')}<p id="alertOrderOut" class="signal-line">0 / 7 actions selected.</p>`,'signal'),
      S('Oxygen changes the priorities','Students distinguish urgent actions from useful but non-urgent actions.',`<img class="object oxygen-object" src="${A}oxygen-canister-v2.png" alt="Emergency oxygen canister with a glowing pressure gauge"><div class="oxygen-stage"><div class="oxygen-number" id="oxygenNumber">72</div><span>PERCENT</span><h2>What protects the crew first?</h2><div class="priority-lines">${[['close the leaking valve','urgent'],['check everyone can breathe','urgent'],['take a team photo','later'],['collect the keycard','necessary'],['charge every tablet','later'],['choose a safe route','necessary'],['argue about who caused it','never']].map((x,i)=>`<button data-priority="${x[1]}"><b>${i+1}</b>${x[0]}<em>${x[1]}</em></button>`).join('')}</div></div>${info('One action per student. Classify it as urgent, necessary, later, or never. Click to reveal.')}`,'void'),
      S('The greenhouse is losing pressure','Use only what can be seen or logically inferred from the visible clues.',`<img class="fullbleed" src="${A}greenhouse-leak-v2.png" alt="Orbital greenhouse with a leaking pipe, fallen ladder, tools, and emergency lighting"><div class="greenhouse-copy"><small>13 · OXYGEN RING</small><h2>Find the<br>problem.<br>Build a plan.</h2></div>${info('Identify four clues in the picture. Use should, could, and if/will to propose a repair plan.')}`,'image void'),
      S('Choose how to handle the leak','Only one option can be active; the score rewards evidence-based care.',`<div class="sector">14 · DECISION ONE</div><h2 class="decision-title">The pipe is leaking.<br><i>What should we do?</i></h2><div class="decision-fan" id="leakDecision">${[['Run past it without stopping.',0],['Close the nearby valve, test the pressure, then continue.',4],['Split the crew: some repair it, others leave.',1],['Wait without checking the sensor.',0]].map((x,i)=>`<button data-points="${x[1]}"><b>0${i+1}</b><span>${x[0]}</span></button>`).join('')}</div><p id="leakOut" class="signal-line">Choose one plan and support it with two visible clues.</p>${info('Discuss all four options. The Safety Officer selects one only after every student speaks.')}`,'orange'),
      S('Three routes lead to the escape pod','Students inspect architecture and visible damage before reading route data.',`<img class="fullbleed" src="${A}station-routes-v2.png" alt="Damaged orbital station with an exterior arm, dark service ring, and bright greenhouse tunnel"><div class="route-labels"><b>EXTERIOR ARM</b><b>SERVICE RING</b><b>GREENHOUSE TUNNEL</b></div>${info('Locate the three routes. Predict one advantage and one risk for each route.')}`,'image void'),
      S('Seven analysts compare the routes','Each student contributes one criterion to one shared decision.',`<div class="sector">16 · ROUTE ANALYSIS</div><h2>Compare before<br>you choose.</h2><div class="analyst-lines">${[['Distance analyst','Which route is shortest?'],['Damage analyst','Which route has visible damage?'],['Oxygen analyst','Which route may improve air supply?'],['Equipment analyst','Which route matches our loadout?'],['Time analyst','Which route can we complete in six minutes?'],['Team analyst','Which route keeps everyone together?'],['Risk analyst','What is the worst possible problem?']].map((x,i)=>`<div><b>${i+1}</b><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>${info('One analyst per student. Give one evidence-based comparison using safer, shorter, more useful, or less risky.')}`,'light'),
      S('Commit to one route','The choice changes the mission score and remains visible in the HUD.',`<div class="route-choice" id="routeDecision"><button data-route="Exterior arm" data-points="1"><b>FASTEST</b><span>exposed · damaged · no cover</span></button><button data-route="Service ring" data-points="2"><b>DARKEST</b><span>protected · longer · smoke reported</span></button><button data-route="Greenhouse tunnel" data-points="4"><b>BRIGHTEST</b><span>repairable leak · direct access · oxygen plants</span></button></div><p id="routeOut" class="signal-line">No route selected.</p>${info('Each analyst reports. The Commander chooses one route and gives two reasons plus one risk.')}`,'signal'),
      S('Listen to the captain’s evidence log','The first listening identifies the recommendation; the second separates facts from cautions.',`<div class="log-stage"><small>18 · CAPTAIN LOG 14:30</small><h2>Which route does the captain recommend?</h2><div class="orbit-voice"><i></i><i></i><i></i><i></i><i></i></div><p>Listen for: two observations, one contrast, one recommendation, and one backup plan.</p></div>${info('Listen twice. Open the transcript only after recording the five requested details.')}`,'void'),
      S('Check seven details from the log','Students answer with exact evidence, not memory-only guesses.',`<div class="sector">19 · LOG CHECK</div><div class="log-questions">${[['Where was smoke reported?','Near the service ring.'],['What did the temperature sensor show?','A normal temperature.'],['What was leaking?','A greenhouse pipe.'],['Which route was shortest?','The exterior maintenance arm.'],['Which route did the captain recommend first?','The greenhouse route.'],['What should the crew close?','The leaking valve.'],['When should the crew return?','If the pressure falls again.']].map((x,i)=>`<button data-answer="${x[1]}"><b>${i+1}</b><span>${x[0]}</span><em>${x[1]}</em></button>`).join('')}</div>${info('One question per student. Answer in a full sentence, cite the log, then click to reveal.')}`,'cyan'),
      S('Challenge ideas without attacking people','Students use the assigned reply and add mission evidence.',`<div class="sector">20 · CREW LANGUAGE</div><h2>Disagree.<br><i>Keep the plan moving.</i></h2><div class="reply-spiral">${[['I see your point, but...','the evidence is different'],['That could work. However...','there is one risk'],['What evidence supports that?','ask for a fact'],['Could we compare another option?','suggest a route'],['I agree about ___, but...','challenge one detail'],['If we do that, we will...','predict a result'],['My concern is...','name a safety issue']].map((x,i)=>`<button style="--i:${i}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div>${info('One reply per student. Respond to “We should take the exterior arm because it is fastest.” Add one specific fact.')}`,'light'),
      S('Find the access key','The key is an overlaid interactive object; the visual search has a short timer.',`<img class="fullbleed" src="${A}key-search-bay-v2.png" alt="Orbital station maintenance bay with cables, gloves, a thermal blanket, and floor grates"><button id="hiddenKey" aria-label="Hidden access key"><img src="${A}access-key-v2.png" alt="Glowing orbital station access key"></button><div class="search-ui"><div id="keyTimer">12</div><h2>Find the access key.</h2><button id="keyStart">START SCAN</button><p id="keyOut">Search silently. Describe the location only after time ends.</p></div>${info('Search for 12 seconds. Then describe the key’s location using precise place language.')}`,'image void'),
      S('Unlock the pod access code','Seven clues produce one seven-symbol sequence.',`<img class="object beacon-object" src="${A}signal-beacon-v2.png" alt="Glowing emergency signal beacon"><div class="code-stage"><small>22 · ACCESS LOCK</small><h2>Build the seven-part code.</h2><div class="code-clues" id="codeClues">${[['First letter of oxygen','O'],['Number of selected supplies','3'],['First letter of the safest route','G'],['Opposite of guess','FACT'],['Modal for advice','SHOULD'],['Result clause after if','WILL'],['Number of crew members','7']].map((x,i)=>`<button data-code="${x[1]}"><b>${i+1}</b><span>${x[0]}</span><em>?</em></button>`).join('')}</div><p id="codeOut" class="signal-line">Code: _ · _ · _ · _ · _ · _ · _</p></div>${info('One clue per student. Solve aloud, then click. Read the complete code together.')}`,'void'),
      S('The escape pod is ready','Students identify what still needs to be checked before launch.',`<img class="fullbleed" src="${A}escape-pod-v2.png" alt="Empty orbital escape pod with seats, harnesses, controls, and Earth outside"><div class="pod-copy"><small>23 · FINAL LOCATION</small><h2>Do not launch yet.</h2><p>Check the crew, supplies, route evidence, oxygen, harnesses, signal, and backup plan.</p></div>${info('Assign one final check to each student. Report “ready” only with a complete sentence.')}`,'image void'),
      S('Prepare the seven-person launch briefing','Every role has a required contribution and cannot be skipped.',`<div class="sector">24 · FINAL BRIEFING</div><h2>Seven voices.<br>Ninety seconds.</h2><div class="launch-roles">${[['Commander','state the final goal'],['Evidence officer','give two facts'],['Route analyst','name the route and comparison'],['Supply officer','name three supplies and uses'],['Safety officer','name one risk and response'],['Timekeeper','give the order of actions'],['Reporter','summarise the final if/will plan']].map((x,i)=>`<div><b>${i+1}</b><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>${info('Prepare one sentence per role. Rehearse once, then deliver the briefing without reading.')}`,'orange'),
      S('Deliver the launch plan under pressure','The timer has three visual phases so the team knows what to cover.',`<div class="launch-stage"><div class="launch-timer" id="launchTimer">90</div><div class="launch-phases"><span>0-30 · evidence</span><span>31-60 · route + supplies</span><span>61-90 · risk + if/will</span></div><button id="launchStart">START BRIEFING</button><h2>Speak clearly.<br>Stay together.</h2></div>${info('All seven students speak. Listeners record one strong reason and one unclear step for feedback.')}`,'void'),
      S('Your decisions determine the outcome','Outcome text updates from the accumulated mission score.',`<div class="outcome-stage"><small>26 · MISSION RESULT</small><div class="outcome-score" id="outcomeScore">00</div><h2 id="outcomeTitle">MISSION AWAITING DATA</h2><p id="outcomeText">Complete the loadout, leak, and route decisions to calculate the result.</p><button id="recalculate">CALCULATE OUTCOME</button><div class="reentry"><i></i></div></div>${info('The Reporter reads the outcome. The team explains which earlier decision had the greatest effect.')}`,'signal'),
      S('Debrief the mission and take one skill home','Close with evidence-based reflection before assigning the short homework.',`<div class="closing-grid"><div><small>27 · DEBRIEF</small><h2>One decision<br>we improved was...</h2><div id="exitChoices">${['We checked evidence before...','We changed our route because...','If the pressure fell, we would...','Our clearest team phrase was...'].map(x=>`<button>${x}</button>`).join('')}</div>${info('Choose one line. Complete it with a concrete mission detail and rate your contribution from 1 to 5.')}<p id="exitOut" class="signal-line">Next lesson: Question Tags for Small Talk.</p></div><div class="homework"><small>HOMEWORK · DESIGN A MINI MISSION</small><p><b>1.</b> Draw three locations.<br><b>2.</b> Add seven clues or supplies.<br><b>3.</b> Write three options with risks.<br><b>4.</b> Record a 60-second solution using should, could, and if/will.</p></div></div>`,'light')
    ];
    const deck=document.querySelector('#deck');
    deck.innerHTML=scenes.map((scene,index)=>`<section class="scene ${index===0?'active ':''}${scene.style} transition-${index%5}" data-scene="${index+1}">${scene.body}</section>`).join('');
  </script>
  <script src="experience-v5.js"></script>
</body>
</html>
