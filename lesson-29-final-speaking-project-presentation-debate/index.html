<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 29 — Forum Mosaic</title><style>
:root{--blue:#234f78;--red:#c95c4c;--gold:#f0c75e;--mint:#acd8c4;--cream:#fff7e7;--ink:#27303b}*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:tile .35s both}.scene:before{content:'▦';position:absolute;right:4vw;bottom:7vh;color:var(--red);font-size:8rem;opacity:.13}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#234f78eb,#234f78a7 48%,#234f7820)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--gold);background:#234f789b}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--blue);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.tile{background:#fff;border:3px solid var(--blue);padding:1.1rem;min-height:8rem;box-shadow:7px 7px 0 #234f7822;cursor:pointer}.tile:nth-child(2){background:var(--mint)}.tile:nth-child(3){background:var(--gold)}.tile.selected{outline:5px solid var(--red)}.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.statement{background:#fff;border-left:12px solid var(--red);padding:1.2rem 1.5rem;font-size:clamp(1.3rem,2.2vw,2.2rem);box-shadow:8px 8px 0 #234f7822}.choice{background:#fff;border:3px solid var(--blue);padding:.85rem 1rem;color:var(--blue);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #234f7822}.choice:hover,.choice.selected{background:var(--mint)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--gold)}.feedback{font-weight:900;color:var(--red);min-height:1.5em}.token{display:inline-block;background:var(--blue);color:#fff;padding:.7rem 1rem;margin:.25rem;cursor:pointer;font-weight:900}.token.on{background:var(--red)}.meter{height:20px;background:#d5cdb6;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--red);transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--red);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#234f78ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--gold)}.note,.map{display:none;position:fixed;z-index:30;background:#234f78f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--blue)}@keyframes tile{from{opacity:0;transform:scale(.98) translateY(10px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.mosaic,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">FORUM MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Forum Mosaic','2 min. Open with the forum image. Explain that today’s goal is a clear, respectful final project.',`<img class="hero" src="${A}forum-circle.png" alt="Illustrated community forum with teens in a semicircle and a blank mosaic wall"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 29 · final speaking project</div><h1>Forum<br>Mosaic</h1><p>Build a presentation or debate that gives every idea a place.</p><span class="token">CLAIM</span><span class="token">EVIDENCE</span><span class="token">VOICE</span></div>`),
S('Check-in: choose your route','4 min. Students choose presentation or debate.',`<div class="stage"><h3>01 · check-in</h3><h2>Which final route fits you?</h2><div class="mosaic" id="route"><button class="tile choice">a solo presentation</button><button class="tile choice">a team presentation</button><button class="tile choice">a friendly debate</button><button class="tile choice">a creative showcase</button></div><p id="routeOut" class="feedback">Choose one and explain why.</p></div>`),
S('Bridge from Lesson 28','3 min. Connect linking words to the final project.',`<div class="stage"><h3>02 · bridge</h3><div class="statement">A strong project has a claim, evidence, and links that show how the ideas fit.</div></div>`),
S('Read the forum wall','5 min. Students predict what makes a project convincing.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What belongs on the wall?</h2><img class="figure" src="${A}argument-table.png" alt="Illustrated table with argument tiles evidence cards timer microphone and voting tokens"><p class="feedback">Name one thing a speaker needs and one thing a listener needs.</p></div>`),
S('Project map','1 min. Preview the final-project cycle.',`<div class="stage"><h3>04 · route</h3><div class="mosaic"><div class="tile"><b>Choose</b><p>topic + audience</p></div><div class="tile"><b>Build</b><p>claim + evidence</p></div><div class="tile"><b>Share</b><p>voice + response</p></div></div></div>`),
S('Topic tiles','5 min. Students choose a safe, interesting topic.',`<div class="stage"><h3>05 · topics</h3><div class="mosaic" id="topics"><button class="tile choice">school life</button><button class="tile choice">technology</button><button class="tile choice">money</button><button class="tile choice">health</button><button class="tile choice">free time</button><button class="tile choice">a topic I invent</button></div><p id="topicOut" class="feedback">Pick a topic and make it narrower.</p></div>`),
S('Audience tiles','4 min. Students adapt the same idea to different listeners.',`<div class="stage"><h3>06 · audience</h3><div class="mosaic"><div class="tile"><b>Classmates</b><p>use a story or question</p></div><div class="tile"><b>School leaders</b><p>use evidence + solution</p></div><div class="tile"><b>Parents</b><p>use clear context</p></div></div></div>`),
S('Claim or topic?','5 min. Students turn a broad topic into a clear position.',`<div class="stage"><h3>07 · claim</h3><div class="grid2"><div class="statement">Topic: school uniforms</div><div class="statement">Claim: Schools should offer a choice of uniform styles.</div></div><p>A claim is something your project can support or challenge.</p></div>`),
S('Evidence tiles','5 min. Sort examples into strong, weak, or missing.',`<div class="stage"><h3>08 · evidence</h3><div class="mosaic" id="evidence"><button class="tile choice">a survey of 40 students</button><button class="tile choice">“everyone knows”</button><button class="tile choice">one personal example</button><button class="tile choice">a clear comparison</button><button class="tile choice">no example</button><button class="tile choice">a number with no source</button></div><p id="evidOut" class="feedback">Choose one and explain how useful it is.</p></div>`),
S('Presentation blueprint','5 min. Students plan opening, body, and close.',`<div class="stage"><h3>09 · presentation route</h3><div class="mosaic"><div class="tile"><b>Opening</b><p>hook + claim</p></div><div class="tile"><b>Middle</b><p>two points + evidence</p></div><div class="tile"><b>Close</b><p>message + action</p></div></div></div>`),
S('Debate blueprint','5 min. Students plan a claim, response, and conclusion.',`<div class="stage"><h3>10 · debate route</h3><div class="mosaic"><div class="tile"><b>Position</b><p>We believe …</p></div><div class="tile"><b>Reply</b><p>We understand, however …</p></div><div class="tile"><b>Close</b><p>Therefore …</p></div></div></div>`),
S('Speaking tokens','4 min. Students rehearse useful project language.',`<div class="stage"><h3>11 · language</h3><div class="statement">Our main point is …<br>For example …<br>However …<br>We recommend …<br>What do you think?</div></div>`),
S('Visual mosaic design','4 min. Compare a readable project visual with a crowded one.',`<div class="stage"><h3>12 · visual design</h3><div class="grid2"><div class="tile"><b>Readable</b><p>one image · three keywords · clear contrast</p></div><div class="tile"><b>Crowded</b><p>tiny paragraphs · many colors · no focus</p></div></div></div>`),
S('Counterpoint practice','5 min. Students respond without attacking the person.',`<div class="stage"><h3>13 · counterpoint</h3><div class="statement">“I see your point, but our evidence suggests …”<br>“That is one possibility. Another is …”</div></div>`),
S('Read the sample pitch','2 min. Predict the claim and evidence.',`<div class="stage"><h3>14 · model preview</h3><div class="statement">“Schools should create a quiet study corner because many students need a calm place to focus.”</div></div>`),
S('Text: The Study Corner pitch','6 min. Analyze the sample project.',`<div class="stage"><h3>15 · model analysis</h3><div class="statement"><p>Our school should create a quiet study corner. First, students who need to focus would have a calm place to work. A short class survey showed that 18 of 25 students sometimes struggle to concentrate. However, the space would need clear rules, so it should be available only during breaks.</p></div><p>Underline the claim, circle the evidence, and box the solution.</p></div>`),
S('Model check','4 min. Click the tile that identifies each part.',`<div class="stage"><h3>16 · evidence check</h3><div class="grid2" id="model"><button class="choice">claim: create a quiet study corner</button><button class="choice">evidence: 18 of 25 students</button><button class="choice">counterpoint: clear rules</button><button class="choice">solution: use it during breaks</button></div><p id="modelOut" class="feedback">Choose a tile and name its job.</p></div>`),
S('Finished mosaic','4 min. Use the image to describe how separate viewpoints connect.',`<div class="stage"><h3>17 · visual synthesis</h3><img class="figure" src="${A}mosaic-wall.png" alt="Finished mosaic wall made from connected viewpoint tiles with teens presenting"><p class="feedback">Use: “This idea connects to … because …”</p></div>`),
S('Information gap: evidence swap','6 min. Partners trade evidence cards and improve a claim.',`<div class="stage"><h3>18 · pair task</h3><div class="grid2"><div class="statement"><b>Claim A:</b> Students need more outdoor time.</div><div class="statement"><b>Evidence cards:</b> survey · example · comparison</div></div><p>Choose the strongest card and explain your choice.</p></div>`),
S('Rehearsal checkpoint','5 min. Students practise opening and receive one focused note.',`<div class="stage"><h3>19 · rehearsal</h3><div class="mosaic"><div class="tile"><b>Hook</b><p>Does it make us listen?</p></div><div class="tile"><b>Claim</b><p>Can we repeat it?</p></div><div class="tile"><b>Evidence</b><p>Can we trust it?</p></div></div></div>`),
S('Final forum teams','6 min. Set roles for presentation or debate teams.',`<div class="stage"><h3>20 · team setup</h3><div class="mosaic"><div class="tile"><b>Speaker</b><p>delivers the message</p></div><div class="tile"><b>Evidence keeper</b><p>points to support</p></div><div class="tile"><b>Question host</b><p>responds respectfully</p></div></div></div>`),
S('Build the final project','7 min. Teams assemble their claim, evidence, and close.',`<div class="stage"><h3>21 · production setup</h3><div class="mosaic"><div class="tile"><b>1</b><p>write the claim</p></div><div class="tile"><b>2</b><p>choose two supports</p></div><div class="tile"><b>3</b><p>plan the final line</p></div></div></div>`),
S('Forum presentations','7 min. Presentations or debates run in timed rounds.',`<div class="stage"><h3>22 · final project</h3><div class="statement">Audience job: listen for the claim, write one evidence detail, and prepare one respectful question.</div><p>Teams may choose presentation or debate format.</p></div>`),
S('Peer mosaic notes','5 min. Audience members add one tile of feedback.',`<div class="stage"><h3>23 · feedback</h3><div class="mosaic"><div class="tile"><b>Clear</b><p>I understood the message.</p></div><div class="tile"><b>Supported</b><p>I heard evidence.</p></div><div class="tile"><b>Connected</b><p>The ideas linked.</p></div></div></div>`),
S('Final project quiz','5 min. Teams choose the strongest project habits.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">make one clear claim</button><button class="choice">read every word from a slide</button><button class="choice">use specific evidence</button><button class="choice">ignore another viewpoint</button></div><p id="quizOut" class="feedback">Choose the habits that help an audience trust the project.</p></div>`),
S('One-minute forum round','2 min. Students give a compressed final pitch.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START FORUM ROUND</button><p>Claim → evidence → response → final message.</p></div>`),
S('Self-check mosaic','3 min. Students choose the area they strengthened.',`<div class="stage"><h3>26 · reflection</h3><div class="meter"><i id="meter"></i></div><div class="tokens" id="levels"><button class="token" data-level="30">I found a claim</button><button class="token" data-level="60">I used evidence</button><button class="token" data-level="90">I responded confidently</button></div><p id="levelOut" class="feedback">Choose honestly and name one next step.</p></div>`),
S('Exit ticket','2 min. Students close the project with one reflection.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Add your final tile.</h2><div class="mosaic" id="exit"><button class="tile choice">One idea I can explain is …</button><button class="tile choice">One speaking skill I used is …</button><button class="tile choice">One question I can explore next is …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Final Revision & Level Test</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--gold)">Forum Mosaic map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('#route .choice,#topics .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');routeOut&&(routeOut.textContent='Route selected — explain your choice.');topicOut&&(topicOut.textContent='Narrow the topic into a clear claim.')});document.querySelectorAll('#evidence .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');evidOut.textContent='Explain why this support is strong or weak.'});document.querySelectorAll('#model .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');modelOut.textContent='Name the project part this tile represents.'});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Keep the habits that help an audience trust the project.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{meter.style.width=b.dataset.level+'%';levelOut.textContent='Name one next step for your speaking.'});document.querySelectorAll('#exit .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');exitOut.textContent='Complete the reflection for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #07172a}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe0a0!important}</style></body></html>
