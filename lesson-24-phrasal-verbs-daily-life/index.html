<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 24 — Phrasal Verb House</title><style>
:root{--terr:#d66b4b;--blue:#214c78;--mint:#bfe6d4;--sun:#f6ce62;--cream:#fff7e8;--ink:#233342}*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:door .35s both}.scene:before{content:'⌂';position:absolute;right:4vw;bottom:7vh;font-size:8rem;color:var(--blue);opacity:.12}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#214c78eb,#214c78a6 48%,#214c7820)}.title{position:relative;z-index:2;color:#fff;max-width:52rem;padding:11vh 2rem 2rem;border-left:12px solid var(--sun);background:#214c789c;border-radius:0 28px 28px 0}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0;font-weight:900}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terr)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--blue);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.door{background:var(--terr);color:#fff;border-radius:18px;padding:.75rem 1.1rem;font-weight:900;display:inline-block;transform:rotate(-2deg);margin:.2rem}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.room{background:#fff;border:4px solid var(--blue);border-radius:18px;padding:1.1rem;min-height:8rem;box-shadow:7px 7px 0 #214c7833}.room:nth-child(2){background:var(--mint)}.room:nth-child(3){background:var(--sun)}.room strong{font-size:1.3rem;color:var(--blue)}.path{display:flex;align-items:center;gap:.6rem;margin:1.2rem 0}.node{background:var(--mint);border:3px solid var(--blue);border-radius:50%;padding:1rem;text-align:center;min-width:8rem}.line{height:6px;background:var(--terr);flex:1}.choice{background:#fff;border:3px solid var(--blue);border-radius:14px;padding:.85rem 1rem;color:var(--blue);font-weight:900;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #214c7830}.choice:hover,.choice.selected{background:var(--mint)}.memo{background:#fff;border-left:10px solid var(--terr);border-radius:0 16px 16px 0;padding:1.2rem;box-shadow:8px 8px 0 #214c7822;font-size:clamp(1.25rem,2.1vw,2.2rem);line-height:1.35}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;border-radius:20px;box-shadow:12px 12px 0 var(--sun)}.feedback{font-weight:900;color:var(--terr);min-height:1.5em}.tokens{display:flex;flex-wrap:wrap;gap:.65rem}.token{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:.8rem 1rem;font-weight:900;cursor:pointer}.token.on{background:var(--terr)}.meter{height:20px;background:#d9c9a0;border-radius:99px;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--terr);border-radius:99px;transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--terr);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer;border-radius:12px}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#214c78ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center;border-radius:14px}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44;border-radius:99px}.progress i{display:block;height:100%;background:var(--sun);border-radius:99px}.note,.map{display:none;position:fixed;z-index:30;background:#214c78f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem;border-radius:16px}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0;border-radius:8px}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--blue)}@keyframes door{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.rooms,.grid2{grid-template-columns:1fr}.path{display:block}.node{margin:.45rem auto}.line{height:1.4rem;width:6px;margin:auto}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">HOUSE MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Phrasal Verb House','2 min. Open with the cutaway home. Ask what actions happen first in the morning.',`<img class="hero" src="${A}apartment-cutaway.png" alt="Cutaway apartment with teens doing daily tasks in different rooms"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 24 · vocabulary + speaking</div><h1>Phrasal<br>Verb<br>House</h1><p>Everyday actions live in two-word rooms.</p><span class="door">GET UP</span><span class="door">TIDY UP</span><span class="door">HEAD OUT</span></div>`),
S('Check-in: your morning route','4 min. Students may use a fictional morning.',`<div class="stage"><h3>01 · check-in</h3><h2>Which door do you open first?</h2><div class="tokens" id="morning">${['wake up','get dressed','turn on the light','look for my phone','head out'].map(x=>`<button class="token" data-morning="${x}">${x}</button>`).join('')}</div><p id="morningOut" class="feedback">Choose one and say what happens next.</p></div>`),
S('Bridge from Lesson 23','3 min. Connect reviews to daily-life actions.',`<div class="stage"><h3>02 · bridge</h3><div class="memo">A review says: “The character <b>heads out</b> before sunrise.”<br><br>Today we open the action words inside that sentence.</div></div>`),
S('Street scene: follow the action','5 min. Students point, predict, and use one phrasal verb.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>What is happening outside?</h2><img class="figure" src="${A}morning-street.png" alt="Illustrated morning street with cyclist bus stop shop and friends"><p class="feedback">Find someone who is picking something up, heading out, or meeting up.</p></div>`),
S('House map','1 min. Preview the room-to-room route.',`<div class="stage"><h3>04 · route</h3><div class="path"><div class="node"><b>Home</b><br>daily actions</div><div class="line"></div><div class="node"><b>Street</b><br>movement</div><div class="line"></div><div class="node"><b>Problem</b><br>solutions</div></div></div>`),
S('Wake-up room','5 min. Students tap a verb and mime it.',`<div class="stage"><h3>05 · room 1</h3><div class="rooms" id="wake">${['wake up','get up','turn off','put on','pick up','look for'].map(x=>`<button class="room choice" data-wake="${x}"><strong>${x}</strong><p>mime it</p></button>`).join('')}</div><p id="wakeOut" class="feedback">Choose one and finish: “I ___ at seven.”</p></div>`),
S('Living-room particles','5 min. Show how the small word changes the direction.',`<div class="stage"><h3>06 · particle focus</h3><div class="memo">pick <b>up</b> = lift<br>pick <b>out</b> = choose<br>turn <b>on</b> = start<br>turn <b>off</b> = stop</div><p>Say each pair with a gesture.</p></div>`),
S('Kitchen verbs','4 min. Choose the action that fits the picture prompt.',`<div class="stage"><h3>07 · room 2</h3><div class="tokens" id="kitchen">${['cut up','heat up','clean up','eat out','run out of','fill up'].map(x=>`<button class="token" data-kitchen="${x}">${x}</button>`).join('')}</div><p id="kitchenOut" class="feedback">Build: “We ___ the leftovers.”</p></div>`),
S('Separable or together?','5 min. Notice where the object can move.',`<div class="stage"><h3>08 · grammar window</h3><div class="grid2"><div class="memo">turn off the light<br>turn the light off</div><div class="memo">look after the baby<br>✗ look the baby after</div></div><p>Some phrasal verbs split. Some stay together.</p></div>`),
S('Object pronoun rule','4 min. Repair the sentence with it/them.',`<div class="stage"><h3>09 · repair</h3><div class="grid2" id="pronouns"><button class="choice">Turn it off.</button><button class="choice">Turn off it.</button><button class="choice">Pick them up.</button><button class="choice">Pick up them.</button></div><p id="proOut" class="feedback">With it/them, the object goes in the middle for separable verbs.</p></div>`),
S('Street movement','5 min. Students select a route and narrate it.',`<div class="stage"><h3>10 · room 3</h3><div class="path"><div class="node">set off</div><div class="line"></div><div class="node">get on</div><div class="line"></div><div class="node">get off</div><div class="line"></div><div class="node">come back</div></div><p>Tell a tiny travel story using the path.</p></div>`),
S('Meaning twins','4 min. Match each phrasal verb to a plain-English meaning.',`<div class="stage"><h3>11 · meaning</h3><div class="rooms"><div class="room"><strong>give up</strong><p>stop trying</p></div><div class="room"><strong>find out</strong><p>discover</p></div><div class="room"><strong>carry on</strong><p>continue</p></div></div></div>`),
S('Controlled choice','5 min. Choose the phrasal verb that completes each daily sentence.',`<div class="stage"><h3>12 · controlled practice</h3><div class="grid2" id="control"><button class="choice">Please ___ your shoes. (take off)</button><button class="choice">I need to ___ what happened. (find out)</button><button class="choice">We ___ milk yesterday. (ran out of)</button><button class="choice">Don’t ___! Keep trying. (give up)</button></div><p id="controlOut" class="feedback">Choose, then read the full sentence.</p></div>`),
S('Problem house','4 min. Choose the useful action for each problem.',`<div class="stage"><h3>13 · problem room</h3><div class="rooms" id="problems"><button class="room choice">The alarm rings → turn it off</button><button class="room choice">You cannot find keys → look for them</button><button class="room choice">The bin is full → take it out</button></div><p class="feedback">Add a reason: “because …”</p></div>`),
S('Read the floorplan','2 min. Predict the order of the morning.',`<div class="stage"><h3>14 · reading preview</h3><img class="figure" src="${A}home-floorplan.png" alt="Illustrated overhead home floorplan with arrows between rooms and household objects"><p>Which phrasal verbs might appear first, next, and last?</p></div>`),
S('Text: Saturday at home','6 min. Partner-read and highlight the action words.',`<div class="stage"><h3>15 · close reading</h3><div class="memo"><p>On Saturday, Leo woke up late and turned off his alarm. He put on a hoodie, looked for his keys, and found them under the sofa. In the kitchen, he ran out of cereal, so he cleaned up quickly and headed out. Later, he came back and helped his sister with homework.</p></div><p>Circle five phrasal verbs. What happened first?</p></div>`),
S('Reading check','4 min. Click the evidence line that answers each question.',`<div class="stage"><h3>16 · evidence</h3><div class="grid2" id="read"><button class="choice">What did Leo turn off? his alarm</button><button class="choice">Where were the keys? under the sofa</button><button class="choice">Why did he head out? no cereal</button><button class="choice">Who did he help? his sister</button></div><p id="readOut" class="feedback">Point to the exact phrase in the reading.</p></div>`),
S('Particle picture board','4 min. Use the image to create two action sentences.',`<div class="stage"><h3>17 · visual language</h3><img class="figure" src="${A}home-floorplan.png" alt="Illustrated floorplan with household objects and directional arrows"><p class="feedback">Use one verb with up, one with out, and one with off.</p></div>`),
S('Information gap: missing object','6 min. Partner A has a room; Partner B has the object. Ask for the missing piece.',`<div class="stage"><h3>18 · pair task</h3><div class="grid2"><div class="memo"><b>Room card</b><br>kitchen: pick ___</div><div class="memo"><b>Object card</b><br>the apple: pick it up</div></div><p>Ask: “What do I pick up?” “Where is it?” Swap.</p></div>`),
S('Street mission','6 min. Teams give directions using phrasal verbs.',`<div class="stage"><h3>19 · mission</h3><div class="path"><div class="node">head out</div><div class="line"></div><div class="node">walk past</div><div class="line"></div><div class="node">look for</div><div class="line"></div><div class="node">meet up</div></div><p>Give a 30-second route from home to a meeting place.</p></div>`),
S('Phrasal verb charades','6 min. One student mimes; the team guesses.',`<div class="stage"><h3>20 · speaking game</h3><div class="tokens" id="charades">${['wake up','put on','take off','pick up','give up','carry on','come back','find out'].map(x=>`<button class="token" data-charade="${x}">${x}</button>`).join('')}</div><p id="charadeOut" class="feedback">Tap a card, mime it, and let the team guess.</p></div>`),
S('Build a daily-life comic','7 min. Students make three frames with phrasal verbs.',`<div class="stage"><h3>21 · production setup</h3><div class="rooms"><div class="room"><strong>Frame 1</strong><p>morning: wake up / put on</p></div><div class="room"><strong>Frame 2</strong><p>problem: run out / look for</p></div><div class="room"><strong>Frame 3</strong><p>solution: find out / carry on</p></div></div></div>`),
S('Comic-strip retell','7 min. Students present the comic in 45 seconds.',`<div class="stage"><h3>22 · production</h3><div class="memo">“First I woke up. Then I ran out of milk, so I headed out. I found a shop and carried on with my day.”</div><p>Listeners raise a hand when they hear a phrasal verb.</p></div>`),
S('Partner repair shop','5 min. Partners correct one particle or object mistake.',`<div class="stage"><h3>23 · feedback</h3><div class="rooms"><div class="room"><strong>✗ turn off it</strong><p>✓ turn it off</p></div><div class="room"><strong>✗ look the keys for</strong><p>✓ look for the keys</p></div><div class="room"><strong>✗ give on</strong><p>✓ give up</p></div></div></div>`),
S('Review house quiz','5 min. Choose the best phrasal verb for each situation.',`<div class="stage"><h3>24 · review</h3><div class="grid2" id="quiz"><button class="choice">continue = carry on</button><button class="choice">discover = find out</button><button class="choice">return = come back</button><button class="choice">remove clothes = take off</button></div><p id="quizOut" class="feedback">Choose four correct doors.</p></div>`),
S('One-minute route','2 min. Students tell a route using five phrasal verbs.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START ROUTE</button><p>Start at home. End at a friend’s place. Use five action verbs.</p></div>`),
S('Homework: house guide','2 min. Students draw a room map and label six actions.',`<div class="stage"><h3>26 · homework</h3><div class="rooms"><div class="room"><strong>Draw</strong><p>three rooms or places</p></div><div class="room"><strong>Label</strong><p>six phrasal verbs</p></div><div class="room"><strong>Tell</strong><p>one tiny daily story</p></div></div></div>`),
S('Exit ticket','2 min. Students complete one action frame. Preview Question Tags.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Close one door with a sentence.</h2><div class="tokens" id="exit"><button class="token">Today I woke up …</button><button class="token">I need to find out …</button><button class="token">I can carry on when …</button></div><p id="exitOut" class="feedback">Choose one and finish it for a partner.</p><div class="eyebrow">Next: Question Tags · Small Talk</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--sun)">Phrasal Verb House map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-morning]').forEach(b=>b.onclick=()=>{b.classList.add('on');morningOut.textContent=`You chose ${b.dataset.morning}. Add what happens next.`});document.querySelectorAll('[data-wake]').forEach(b=>b.onclick=()=>{b.classList.add('selected');wakeOut.textContent=`Use: I ${b.dataset.wake} at seven.`});document.querySelectorAll('[data-kitchen]').forEach(b=>b.onclick=()=>{b.classList.add('on');kitchenOut.textContent=`Use “${b.dataset.kitchen}” in a kitchen sentence.`});document.querySelectorAll('#pronouns .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');proOut.textContent='Check the object: it/them goes inside a separable phrasal verb.'});document.querySelectorAll('#control .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');controlOut.textContent='Read the complete sentence aloud.'});document.querySelectorAll('#read .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');readOut.textContent='Evidence selected — point to the reading line.'});document.querySelectorAll('[data-charade]').forEach(b=>b.onclick=()=>{b.classList.add('on');charadeOut.textContent=`Mime: ${b.dataset.charade}.`});document.querySelectorAll('#quiz .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');quizOut.textContent='Good — the meaning matches the phrasal verb.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .token').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Complete the sentence for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #071a2c}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe3a2!important}</style></body></html>
