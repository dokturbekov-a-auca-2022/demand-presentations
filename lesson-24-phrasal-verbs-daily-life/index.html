<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <title>Lesson 24 | Everyday Action Studio</title>
  <link rel="stylesheet" href="experience-v4.css">
</head>
<body>
  <main id="deck"></main>
  <div class="studio-tools"><button id="mapBtn">CUT LIST</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside><aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">→</button></nav>
  <script>
    const A='assets/';
    const info=t=>`<div class="instruction"><span>i</span>${t}</div>`;
    const S=(title,note,body,style='paper')=>({title,note,body,style});
    const scenes=[
      S('Everyday Action Studio','Open with the moving title. Ask students to name actions they can already describe.',`<img class="fullbleed" src="${A}action-studio-hero-v2.png" alt="Teenagers getting ready for the day in an energetic editorial collage"><div class="hero-copy"><small>LESSON 24 · PHRASAL VERBS</small><h1><em>EVERYDAY</em><br>ACTION<br>STUDIO</h1><p>Turn ordinary routines into precise English.</p></div><div class="crawl">WAKE UP · PUT ON · HEAD OUT · MEET UP · CARRY ON</div>`,'dark hero'),
      S('Choose your opening action','Each student chooses one action and adds two details.',`<div class="scene-no">01</div><div class="checkin"><h2>What did you do <i>first</i> today?</h2><div class="action-dial" id="checkin">${['wake up','get up','turn off an alarm','put on clothes','pick up a phone','look for something','head out'].map((x,i)=>`<button class="dial-word" data-pick="${x}" style="--r:${-9+i*3}deg">${x}</button>`).join('')}</div>${info('Choose one action. Say when, where, and what happened next.')}<p id="checkinOut" class="live-line">Your sentence starts here.</p></div>`,'yellow'),
      S('Watch the morning happen','Students describe the three actions before seeing the target wording.',`<img class="wide-photo torn" src="${A}morning-triptych-v2.png" alt="The same teenager waking up, putting on a jacket, and picking up a backpack"><div class="photo-words"><b>WAKE <i>UP</i></b><b>PUT <i>ON</i></b><b>PICK <i>UP</i></b></div>${info('Describe the three actions from left to right. Then add one action before or after them.')}`,'ink'),
      S('Today you will control the action','Keep this quick and student-facing.',`<div class="scene-no">03</div><h2 class="manifesto">UNDERSTAND<br><i>18</i> DAILY PHRASAL VERBS.<br><span>PLACE OBJECTS</span> CORRECTLY.<br>PERFORM A <u>60-SECOND DAY.</u></h2><div class="orbit"><span>UP</span><span>OUT</span><span>ON</span><span>OFF</span></div>`,'cream'),
      S('A small word changes the whole action','Click particles and let students predict meaning first.',`<img class="float-object alarm" src="${A}alarm-cutout-v2.png" alt="A ringing black alarm clock"><div class="build-word"><button id="baseVerb">TURN</button><strong>+</strong><div id="particles">${['ON','OFF','UP','DOWN'].map(x=>`<button data-particle="${x}">${x}</button>`).join('')}</div><p id="particleMeaning">Choose a particle.</p></div>${info('Choose a particle. Act out the new meaning and use it in one sentence.')}`,'blue'),
      S('Particles carry direction','Students copy the gestures, then give one new example.',`<div class="particle-stage"><div class="particle p-up"><strong>UP</strong><span>complete / higher</span><small>clean up · stand up</small></div><div class="particle p-out"><strong>OUT</strong><span>outside / finish</span><small>head out · run out</small></div><div class="particle p-on"><strong>ON</strong><span>start / continue</span><small>turn on · carry on</small></div><div class="particle p-off"><strong>OFF</strong><span>stop / separate</span><small>turn off · take off</small></div></div><img class="float-object keys-mini" src="${A}keys-cutout-v2.png" alt="A red-tagged keyring floating in motion">${info('Make the gesture for each particle. Add one phrasal verb you already know.')}`,'ink'),
      S('Build your core action vocabulary','One item per student. Students explain the meaning without translating.',`<div class="verb-river">${[['wake up','stop sleeping'],['put on','dress yourself in'],['pick up','lift or collect'],['look for','try to find'],['run out of','have none left'],['head out','leave a place'],['carry on','continue']].map((x,i)=>`<button class="river-word" style="--i:${i}" data-meaning="${x[1]}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div>${info('One verb per student. Explain it, mime it, then click to reveal the short meaning.')}`,'red'),
      S('Choose the exact meaning','Students commit before revealing. Ask for a different example afterward.',`<div class="scene-no">07</div><h2 class="slanted-title">One particle.<br><i>Different result.</i></h2><div class="meaning-lines">${[['pick up','lift something'],['pick out','choose something'],['turn on','start a device'],['turn off','stop a device'],['find out','discover information'],['head out','leave'],['eat out','eat at a restaurant']].map((x,i)=>`<button class="meaning-line" data-answer="${x[1]}"><span>${x[0]}</span><i>→</i><b>?</b></button>`).join('')}</div>${info('Read one phrasal verb. Say its meaning and an example. Click to check.')}`,'paper'),
      S('Put the morning in order','Assign one action to each student, then build one shared sequence.',`<div class="scene-no">08</div><h2>A believable morning has an order.</h2><div class="order-track" id="morningOrder">${[[3,'pick up my bag'],[0,'wake up'],[5,'head out'],[2,'put on my jacket'],[1,'turn off the alarm'],[4,'look for my keys'],[6,'meet up with a friend']].map(x=>`<button data-order="${x[0]}">${x[1]}</button>`).join('')}</div>${info('Select all seven actions in a logical order. The counter checks every move.')}<p id="orderOut" class="live-line">0 / 7 actions selected.</p>`,'yellow'),
      S('Some phrasal verbs can split','Click the sentence to move the object without changing the meaning.',`<img class="float-object sneaker" src="${A}sneaker-cutout-v2.png" alt="A blue high-top sneaker floating in mid-air"><div class="swap-stage"><h2>TAKE <span id="swapObject">OFF</span> YOUR SHOES.</h2><button id="swapBtn">MOVE THE OBJECT</button><p id="swapLine">Take off your shoes.</p><small>take off the shoes = take the shoes off</small></div>${info('Move the object. Say both correct forms aloud.')}`,'cream'),
      S('Pronouns must go in the middle','Students choose quickly and explain the position rule.',`<div class="pronoun-hit"><span>TURN</span><strong>IT</strong><span>OFF</span></div><div class="cross-lines" id="pronouns">${[['Turn it off.','good'],['Turn off it.','bad'],['Pick them up.','good'],['Pick up them.','bad'],['Put it on.','good'],['Put on it.','bad'],['Take them off.','good']].map((x,i)=>`<button data-state="${x[1]}">${x[0]}</button>`).join('')}</div>${info('One sentence per student. Decide correct or incorrect, then click for feedback.')}<p id="pronounOut" class="live-line">Rule: verb + pronoun + particle.</p>`,'blue'),
      S('Complete seven everyday sentences','Each student answers one. Wrong options stay available for discussion.',`<div class="scene-no">11</div><h2 class="slash-title">Fill the gap.<br><i>Keep the day moving.</i></h2><div class="sentence-run" id="controlled">${[['I ___ at 6:45.','wake up'],['Please ___ the light.','turn off'],['She ___ her red jacket.','put on'],['Can you ___ my notebook?','look for'],['We ___ milk this morning.','ran out of'],['They ___ at the bus stop.','met up'],['Do not stop. ___.','Carry on']].map((x,i)=>`<button data-answer="${x[1]}"><b>${i+1}</b><span>${x[0]}</span><em>${x[1]}</em></button>`).join('')}</div>${info('One sentence per student. Supply the verb, read the full sentence, then click to reveal.')}`,'paper'),
      S('Breakfast has become a problem','Students locate and name visible actions, then predict the next action.',`<img class="fullbleed" src="${A}kitchen-chaos-v2.png" alt="Three teenagers dealing with empty milk, heating breakfast, and cleaning spilled cereal"><div class="image-copy left"><small>12 · VISUAL STORY</small><h2>What has<br>gone wrong?</h2><div class="image-verbs"><button>RUN OUT OF</button><button>HEAT UP</button><button>CLEAN UP</button></div></div>${info('Find three actions in the picture. Describe each one and predict what happens next.')}`,'dark'),
      S('Solve seven daily problems','Students answer in order; classmates may improve the solution.',`<div class="problem-splash"><h2>NO MILK.<br>LOST KEYS.<br>DEAD PHONE.<br><i>SOLVE IT.</i></h2></div><div class="problem-lines">${[['Your alarm is ringing.','turn it off'],['Your room is messy.','clean it up'],['There is no cereal left.','pick something else out'],['Your keys are missing.','look for them'],['Your phone is on the floor.','pick it up'],['Your bus arrives.','get on'],['A task feels difficult.','carry on']].map((x,i)=>`<div><b>${i+1}</b><span>${x[0]}</span><em>${x[1]}</em></div>`).join('')}</div>${info('One problem per student. Give a useful action and a reason. Reveal the sample only after speaking.')}`,'red'),
      S('Listen to a morning voice note','Play twice. First for the problem, second for phrasal verbs.',`<div class="sound-stage"><div class="sound-number">15</div><h2>Why was Maya<br><i>almost late?</i></h2><div class="waveform">${Array.from({length:31},(_,i)=>`<i style="--h:${18+(i*17)%68}%"></i>`).join('')}</div><p>First listen: identify the main problem.<br>Second listen: write every phrasal verb you hear.</p></div>${info('Listen twice. Do not open the transcript until the second listening is complete.')}`,'ink'),
      S('Rebuild the voice note','The audio sequence has seven clear actions. Students select them in order.',`<div class="scene-no">15</div><h2>What happened first, next, and last?</h2><div class="audio-order" id="audioOrder">${[[4,'ran out of cereal'],[0,'woke up late'],[2,'looked for her keys'],[6,'met up with Lina'],[1,'turned off the alarm'],[5,'headed out'],[3,'picked the keys up']].map(x=>`<button data-order="${x[0]}">${x[1]}</button>`).join('')}</div>${info('Select all seven actions in the order you heard. The indicator checks the sequence.')}<p id="audioOrderOut" class="live-line">0 / 7 actions selected.</p>`,'yellow'),
      S('The day moves outside','Students make present-continuous descriptions, then replace them with phrasal verbs.',`<img class="fullbleed" src="${A}city-motion-v2.png" alt="Teenagers getting on and off a bus, meeting up, and cycling through a city"><div class="city-type"><b>GET <i>ON</i></b><b>GET <i>OFF</i></b><b>MEET <i>UP</i></b><b>HEAD <i>OUT</i></b></div>${info('Point to four actions. Describe who is doing each one, then add a destination.')}`,'dark'),
      S('Movement verbs create a route','Students speak while the words animate across the screen.',`<div class="route-stage"><span class="route-home">HOME</span><strong class="route-word w1">HEAD OUT</strong><strong class="route-word w2">GET ON</strong><strong class="route-word w3">GET OFF</strong><strong class="route-word w4">MEET UP</strong><strong class="route-word w5">COME BACK</strong><span class="route-end">HOME</span><div class="route-line"></div></div>${info('Tell the route as one connected story. Add a transport, place, and time.')}`,'cream'),
      S('Give seven different routes','One route per student. No student may repeat the same transport.',`<div class="scene-no">18</div><h2 class="vertical-title">LEAVE.<br>TRAVEL.<br>ARRIVE.<br>RETURN.</h2><div class="route-prompts">${[['home → school','bus'],['home → sports centre','bicycle'],['school → café','walk'],['home → library','metro'],['park → cinema','taxi'],['shop → friend’s house','scooter'],['station → home','train']].map((x,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${x[0]}</span><em>${x[1]}</em></div>`).join('')}</div>${info('One route per student. Use head out, get on/off, meet up, and come back where possible.')}`,'blue'),
      S('Find the keys before time runs out','Give students 15 seconds to search silently before speaking.',`<img class="fullbleed" src="${A}lost-keys-v2.png" alt="Overhead view of teenagers searching for visible keys in a bedroom"><div class="search-copy"><div id="searchTimer">15</div><h2>LOOK<br><i>FOR</i><br>THE KEYS.</h2><button id="searchStart">START SEARCH</button><p id="searchAnswer">Do not reveal the location yet.</p></div>${info('Search silently. Then describe the location using a complete sentence.')}`,'dark'),
      S('Read a morning that fell apart','Students read in roles: narrator, Maya, brother, and friend.',`<article class="editorial-reading"><header>A MORNING THAT FELL APART</header><div><p>Maya <b>woke up</b> twenty minutes late because she forgot to charge her phone. She quickly <b>put on</b> a hoodie and went to the kitchen.</p><p>She had <b>run out of</b> cereal, so she heated up some soup. Then she could not find her keys. Her brother helped her <b>look for</b> them, and they found them under his jacket.</p><p>Maya <b>picked them up</b>, <b>headed out</b>, and got on the next bus. At the final stop, she <b>got off</b> and <b>met up</b> with Lina. She arrived late, but she did not give up on the group project.</p></div><footer>Which three problems slowed Maya down?</footer></article>`,'paper'),
      S('Use the text as evidence','Questions reveal short answers but students must quote or paraphrase the evidence.',`<div class="scene-no">21</div><h2 class="slash-title">Seven questions.<br><i>Seven pieces of evidence.</i></h2><div class="reading-questions">${[['Why did Maya wake up late?','Her phone was not charged.'],['What did she put on?','A hoodie.'],['What food had run out?','Cereal.'],['Who helped her look for the keys?','Her brother.'],['Where were the keys?','Under his jacket.'],['What transport did she get on?','A bus.'],['Who did she meet up with?','Lina.']].map((x,i)=>`<button data-answer="${x[1]}"><b>${i+1}</b><span>${x[0]}</span><em>${x[1]}</em></button>`).join('')}</div>${info('One question per student. Answer in a full sentence and identify the evidence before clicking.')}`,'cream'),
      S('Seven people, seven actions','Use the visual as a quick performance prompt before the charades slide.',`<img class="fullbleed" src="${A}seven-actions-v2.png" alt="Exactly seven teenagers performing different everyday actions in a torn-paper collage"><div class="centre-copy"><small>22 · ONLINE ACTION CAST</small><h2>NAME<br>THE<br>ACTION.</h2></div>${info('Assign one person to each student. Describe or mime that person’s action without saying the verb.')}`,'dark'),
      S('Run online action charades','Every student has a clear action and listener job.',`<div class="scene-no">23</div><h2 class="charade-title">CAMERA ON.<br>SOUND OFF.<br><i>ACT IT OUT.</i></h2><div class="charade-cast">${[['Student 1','wake up'],['Student 2','put on a jacket'],['Student 3','pick up a bag'],['Student 4','turn off a light'],['Student 5','look for keys'],['Student 6','head out'],['Student 7','meet up']].map((x,i)=>`<button data-charade="${x[1]}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div>${info('One role per student. Mime for 15 seconds. Listeners guess with a full sentence.')}`,'yellow'),
      S('Direct a terrible morning','Students build one connected story with seven speaking turns.',`<div class="director"><h2>THE<br>WORST<br>MORNING<br>EVER.</h2><div class="clapper"><span>60</span><small>SECONDS</small></div></div><div class="story-beats">${[['1','wake-up problem'],['2','clothing problem'],['3','missing object'],['4','food problem'],['5','transport problem'],['6','meeting problem'],['7','solution and ending']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>${info('One beat per student. Continue the same story and use at least one phrasal verb in your turn.')}`,'red'),
      S('Drop the correct particle','Seven rounds. The active sentence changes after each correct answer.',`<div class="particle-drop"><div id="dropSentence">Please turn ___ the light before you leave.</div><div id="dropChoices">${['UP','OUT','ON','OFF'].map(x=>`<button data-drop="${x}">${x}</button>`).join('')}</div><p id="dropOut">Round 1 / 7</p></div><div class="falling-words"><i>UP</i><i>OUT</i><i>ON</i><i>OFF</i></div>${info('One round per student. Choose the particle, read the complete sentence, and explain the meaning.')}`,'blue'),
      S('Perform the final director’s cut','Use the beat track for timing and peer listening.',`<div class="final-cut"><h2>YOUR DAY.<br><i>ONE TAKE.</i></h2><div class="countdown" id="finalTimer">60</div><button id="finalStart">START ONE TAKE</button><p>Use five different phrasal verbs. Include one problem, one solution, and a clear ending.</p><div class="listen-for">Listeners count: correct particle · clear object position · connected story</div></div>${info('Speak for 60 seconds without reading. Listeners give one specific success and one useful correction.')}`,'ink'),
      S('Finish independently, then take the lesson home','Every student answers the exit ticket before the homework is explained.',`<div class="closing-split"><div class="exit-stage"><small>EXIT TICKET</small><h2>Finish one line<br><i>without help.</i></h2><div id="exitLines">${['Today I found out that ...','I usually head out at ...','When I run out of ..., I ...','I can carry on when ...'].map(x=>`<button>${x}</button>`).join('')}</div>${info('Choose one line and complete it with a reason or detail. Then rate your confidence from 1 to 5.')}<p id="exitOut" class="live-line">Next lesson: Question Tags for Small Talk.</p></div><div class="homework-type"><small>HOMEWORK</small><h2>DRAW 6 ACTIONS.<br>WRITE 6 SENTENCES.<br>RECORD 45 SECONDS.</h2><p>Include two separable verbs with <b>it</b> or <b>them</b> in the middle.</p></div></div>`,'yellow')
    ];
    const deck=document.querySelector('#deck');
    deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i===0?'active ':''}${s.style} enter-${i%5}" data-scene="${i+1}">${s.body}</section>`).join('');
  </script>
  <script src="experience-v4.js"></script>
</body>
</html>
