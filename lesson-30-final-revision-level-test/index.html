<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 30 — Constellation Review</title><style>
:root{--n:#101d45;--c:#75dbe5;--r:#ef765d;--g:#f5d36b;--w:#fff7e6;--ink:#263047}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5vh 8vw 10vh;background:var(--w);position:relative;overflow:auto}.scene.active{display:block;animation:rise .35s both}.scene:before{content:'✦';position:absolute;right:4vw;bottom:6vh;color:var(--g);font-size:8rem;opacity:.15}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#101d45ee,#101d45a8 52%,#101d4520)}.title{position:relative;z-index:2;color:white;max-width:55rem;padding:10vh 2rem 2rem;border-left:12px solid var(--g);background:#101d459e}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.1rem,2vw,1.7rem)}.eyebrow,h3{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--r)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--n);margin:.2em 0 .55em}p{font-size:clamp(1rem,1.4vw,1.4rem);line-height:1.42}.star{display:inline-block;background:var(--g);color:var(--n);padding:.45rem .8rem;border-radius:50%;font-weight:900;margin:.2rem}.orbit{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.node,.choice{background:white;border:3px solid var(--n);padding:1rem;min-height:7rem;box-shadow:7px 7px 0 #101d4522;cursor:pointer}.node:nth-child(2){background:var(--c)}.node:nth-child(3){background:var(--g)}.choice{text-align:left;font-weight:900;color:var(--n);min-height:auto}.choice:hover,.choice.selected{background:var(--c)}.prompt{background:white;border-left:12px solid var(--r);padding:1.2rem 1.5rem;font-size:clamp(1.3rem,2.2vw,2.2rem);box-shadow:8px 8px 0 #101d4522}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid white;box-shadow:12px 12px 0 var(--c)}.feedback{font-weight:900;color:var(--r);min-height:1.5em}.meter{height:20px;background:#d8cdbb;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--r);transition:.25s}.timer{font-size:clamp(4rem,8vw,7rem);font-weight:900;text-align:center;color:var(--n)}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--r);color:white;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#101d45ef;color:white;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--g)}.note,.map{display:none;position:fixed;z-index:30;background:#101d45f5;color:white;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.score{font-size:clamp(3rem,7vw,6rem);font-weight:900;color:var(--n);text-align:center}@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.orbit,.grid2{grid-template-columns:1fr}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">STAR MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const topics=[
['Check-in','Find your brightest language star.','Choose one skill you can use today.',['I can explain ideas','I can ask follow-ups','I can tell a story']],
['Bridge from Lesson 29','Carry one forum move into the test.','Write a claim, reason, and example.',['claim','reason','example']],
['Read the star map','A course map is easier to remember than a list.','Trace the route: notice → practise → transfer.',['notice','practise','transfer']],
['Review route','Pick the orbit you need first.','Which route feels most useful?',['grammar','vocabulary','communication']],
['Grammar orbit','Time signals guide your verb choice.','Match signal to tense.',['already → present perfect','yesterday → past simple','right now → present continuous']],
['Grammar orbit II','Make meaning visible with form.','Repair: “She go yesterday.”',['She went yesterday.','She has gone yesterday.','She is go yesterday.']],
['Conditions & possibility','If-clauses turn facts into choices.','Complete: If I had more time, I…',['would practise','will practised','am practise']],
['Passive & focus','Change the spotlight without losing the event.','Rewrite: “People built the bridge.”',['The bridge was built.','The bridge built people.','People were build.']],
['Reported speech','Move a message across time.','Report: “I am ready,” said Ana.',['Ana said she was ready.','Ana says I ready.','Ana said she is ready yesterday.']],
['Question star','Good questions open longer answers.','Choose the best follow-up to “I disagree.”',['What makes you think that?','Do you disagree?','Why no?']],
['Vocabulary galaxy','Group words by the job they do.','Which cluster is about evidence?',['data · source · pattern','mood · tone · vivid','route · ticket · platform']],
['Collocations','Words travel in pairs.','Complete: make a…',['decision','homework','attention']],
['Linking stars','Connect ideas so listeners can follow.','Choose a contrast connector.',['however','because','for example']],
['Reading star','Read for gist, then proof.','Headline: “City roofs become gardens.” What is likely next?',['details about urban planting','a recipe for soup','a train timetable']],
['Listening star','Listen for the turn.','When a speaker says “actually,” what may happen?',['a correction or new point','the end of the talk','a spelling lesson']],
['Speaking star','A clear answer has shape.','Build: answer → reason → example.',['I think… because… for example…','Maybe. Next. Done.','Reason answer example?']],
['Error constellation','Errors are coordinates, not failures.','Find the fix: “He suggested me to go.”',['He suggested that I go.','He suggested me go.','He suggest I went.']],
['Test kit','Set your focus before the timer starts.','Pick a strategy for a hard item.',['underline signal words','guess every answer','skip all examples']],
['Grammar test','Round 1 · orbit forms','Choose: “By Friday, we ___ the draft.”',['will have finished','finish yesterday','are finish']],
['Vocabulary test','Round 2 · galaxy recall','Choose the precise verb: “The data ___ a trend.”',['reveals','does','puts']],
['Reading test','Round 3 · evidence','A paragraph gives three examples after a claim. Their job is to…',['support the claim','change the topic','hide the conclusion']],
['Listening test','Round 4 · main message','You hear a problem, two options, and a decision. Track…',['the decision and why','every filler word','only the first noun']],
['Speaking test','Round 5 · one-minute answer','Prompt: Should school start later? Include…',['position + reason + example','three unrelated facts','only “yes”']],
['Score constellation','Turn points into a pattern.','Record your round scores, then circle one bright area.',['grammar','meaning','fluency']],
['Strength map','A level is a direction, not a label.','Which evidence supports your self-rating?',['a successful task','a specific correction','both together']],
['Repair orbit','Plan one small, repeatable repair.','Choose a 7-day micro-practice.',['5-minute voice note','3 collocations a day','one paragraph + edit']],
['Final exit ticket','Close with one constellation line.','Complete: “Next, I will…”',['read more','listen more','speak more']]
];
const scenes=[{t:'Constellation Review',n:'Open with the observatory image. Frame the final lesson as a map of what learners can now do.',b:`<img class="hero" src="${A}observatory.png" alt="Illustrated teens in an observatory looking at a constellation map of language stars"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 30 · final revision + level test</div><h1>Constellation<br>Review</h1><p>Connect the course, test your skills, and choose your next star.</p><span class="star">MAP</span><span class="star">TEST</span><span class="star">GROW</span></div>`}];
topics.forEach((x,i)=>{let [t,lead,prompt,opts]=x;let img=i===2?`<img class="figure" src="${A}constellation.png" alt="Illustrated constellation of connected language stars">`:i===16?`<img class="figure" src="${A}test-kit.png" alt="Illustrated language test kit with timer and answer cards">`:'';let controls=opts.map(o=>`<button class="choice">${o}</button>`).join('');let extra=i===17?`<div class="timer" id="timer">60</div><button class="choice" id="start">START 60-SECOND ROUND</button>`:'';let meter=i===23?`<div class="meter"><i id="meter"></i></div><div class="orbit" id="levels"><button class="choice" data-level="30">read more</button><button class="choice" data-level="60">listen more</button><button class="choice" data-level="90">speak more</button></div>`:'';scenes.push({t,n:`${i+2} min. ${lead} Use the prompt, then ask one learner to justify a choice.`,b:`<div class="stage"><h3>${String(i+1).padStart(2,'0')} · ${t}</h3><div class="grid2"><div><h2>${lead}</h2><div class="prompt">${prompt}</div><div class="orbit">${controls}</div><p class="feedback"></p>${extra}${meter}</div>${img}</div></div>`})});
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map'),count=document.querySelector('#count'),bar=document.querySelector('#bar');map.innerHTML='<h3 style="color:var(--g)">Constellation Review map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');let f=b.parentElement.parentElement.querySelector('.feedback');if(f)f.textContent='Recorded — explain your reasoning to a partner.'});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelector('#meter').style.width=b.dataset.level+'%'});let seconds=60,run;const st=document.querySelector('#start');if(st)st.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{timer.textContent=--seconds;if(seconds<=0)clearInterval(run)},1000)};
</script></body></html>
