<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>Lesson 22 - After-School Live</title>
  <style>
    :root{--night:#071a33;--blue:#1749ff;--yellow:#f7df36;--coral:#ff6557;--ice:#bfe9ff;--paper:#fff9ed;--white:#fff;--muted:#49627b;--good:#c9f26b}
    *{box-sizing:border-box}
    html,body{height:100%;touch-action:pan-x pan-y pinch-zoom}
    body{margin:0;background:var(--night);color:var(--night);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
    button{font:800 1rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer;touch-action:manipulation}
    #deck{height:100vh}
    .scene{display:none;width:100%;height:100vh;max-height:100vh;padding:5.2vh 7vw 10vh;background:var(--paper);position:relative;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;isolation:isolate}
    .scene.active{display:block}
    .scene:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(118deg,transparent 0 72%,#1749ff0d 72% 78%,transparent 78%),radial-gradient(circle at 92% 10%,#f7df3633 0 7rem,transparent 7.1rem)}
    .scene:after{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--blue) 0 48%,var(--yellow) 48% 72%,var(--coral) 72%)}
    .scene.active[data-transition="wipe"]{animation:wipeIn .62s cubic-bezier(.2,.8,.2,1) both}
    .scene.active[data-transition="push"]{animation:pushIn .55s cubic-bezier(.16,.85,.25,1) both}
    .scene.active[data-transition="zoom"]{animation:zoomIn .55s cubic-bezier(.2,.8,.2,1) both}
    .scene.active[data-transition="split"]{animation:splitIn .62s cubic-bezier(.2,.75,.15,1) both}
    .stage{position:relative;z-index:2;width:min(1200px,100%);margin:0 auto}
    @media(min-width:701px){.stage{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.splitStage,.readingStage,.listenStage{display:grid}}
    .motion{animation:itemRise .55s calc(var(--d,0)*70ms + 120ms) both}
    .kicker{font:900 .76rem/1 "Trebuchet MS",sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#d23e34;margin:.2rem 0 .75rem}
    h1,h2,h3{font-family:"Arial Black","Trebuchet MS",sans-serif}
    h1{font-size:clamp(4rem,8vw,8.7rem);line-height:.84;margin:.08em 0}
    h2{font-size:clamp(2rem,4vw,4.15rem);line-height:.96;margin:.08em 0 .5em;max-width:20ch}
    h3{font-size:clamp(1.05rem,1.5vw,1.4rem);line-height:1.1;margin:.15em 0 .45em}
    p,li{font-size:clamp(1rem,1.3vw,1.25rem);line-height:1.42}
    .hero,.finalHero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
    .heroShade,.finalShade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#071a33f8 0 39%,#071a33a8 55%,transparent 75%)}
    .titleCopy{color:var(--white);max-width:43rem;padding-top:9vh}
    .titleCopy p{font-size:clamp(1.15rem,1.8vw,1.55rem);max-width:31ch}
    .signalTags{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:1rem}.signalTag{padding:.43rem .7rem;background:var(--yellow);color:var(--night);font-weight:900;transform:rotate(var(--r,-1deg))}
    .taskNote{display:flex;gap:.65rem;align-items:flex-start;margin:.7rem 0 1rem;padding:.75rem 1rem;background:var(--ice);border-left:8px solid var(--coral);font-weight:800;line-height:1.38}
    .taskIcon{display:inline-grid;place-items:center;flex:0 0 1.65rem;height:1.65rem;border-radius:50%;background:var(--night);color:var(--white);font-family:Georgia,serif;font-style:italic}
    .ticker{position:relative;overflow:hidden;background:var(--night);color:var(--white);padding:.8rem 0;margin:.8rem 0}.tickerTrack{display:flex;width:max-content;gap:2.5rem;animation:ticker 18s linear infinite}.tickerTrack span{font-weight:900;text-transform:uppercase;letter-spacing:.08em}.tickerTrack span:before{content:"●";color:var(--yellow);margin-right:.65rem}
    .hobbyStrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.55rem;margin-top:.8rem}.hobbyPick{min-height:8rem;padding:.75rem .5rem;background:var(--white);border:3px solid var(--night);color:var(--night);box-shadow:0 6px 0 #071a3320;text-align:center;animation:itemRise .45s calc(var(--i)*65ms) both}.hobbyPick b{display:block;font-size:2rem;margin-bottom:.45rem}.hobbyPick.selected{background:var(--yellow);transform:translateY(-5px)}
    .splitStage{display:grid;grid-template-columns:1.05fr .95fr;gap:1.3rem;align-items:center}.splitStage>*{min-width:0}.featureImage{width:100%;max-height:60vh;object-fit:cover;border:6px solid var(--night);box-shadow:12px 12px 0 var(--blue)}
    .objectiveLine{display:flex;align-items:stretch;gap:.55rem}.objective{flex:1;position:relative;padding:1rem;background:var(--night);color:var(--white);min-height:8rem}.objective:after{content:attr(data-n);position:absolute;right:.15rem;bottom:.05rem;color:#ffffff15;font:900 5rem/1 "Arial Black"}.objective b{display:block;color:var(--yellow);font-size:1.2rem;margin-bottom:.35rem}
    .discoveryFrame{position:relative}.discoveryFrame img{width:100%;height:57vh;object-fit:cover;border:7px solid var(--night)}.captionPair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(43rem,85%);display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.caption{background:#fffdf3f2;border:4px solid var(--night);padding:1rem;box-shadow:8px 8px 0 var(--coral)}.caption b{display:block;color:#c6352d;font-size:1.2rem;margin-bottom:.4rem}.caption mark{background:var(--yellow);padding:.1rem .25rem}
    .meaningRail{display:grid;grid-template-columns:1fr auto 1fr;gap:.7rem;align-items:center}.meaningSide{padding:1.3rem;background:var(--white);border-top:10px solid var(--tone);min-height:16rem}.meaningSide .giant{font:900 clamp(2rem,5vw,5.5rem)/.9 "Arial Black";color:var(--tone)}.meaningVs{font:900 2rem "Arial Black";color:var(--coral)}
    .formulaStage{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.formula{background:var(--night);color:var(--white);padding:1.2rem;border-bottom:12px solid var(--tone);position:relative}.formula .form{font:900 clamp(1.7rem,3.1vw,3.25rem)/1 "Arial Black";margin:.5rem 0}.formula .example{background:var(--white);color:var(--night);padding:.8rem;margin-top:.8rem}.formula:after{content:"";position:absolute;width:5rem;height:5rem;border:12px solid #ffffff10;border-radius:50%;right:.4rem;top:.4rem}
    .verbWave{display:flex;gap:.55rem;align-items:stretch;flex-wrap:wrap}.verbTile{flex:1 1 8.5rem;min-height:9rem;padding:.8rem;background:var(--white);border:3px solid var(--night);color:var(--night);text-align:left;position:relative}.verbTile strong{display:block;font-size:1.3rem}.verbTile .family{display:none;margin-top:.7rem;color:#c6352d;font-weight:900}.verbTile.open{background:var(--yellow)}.verbTile.open .family{display:block}.verbTile:after{content:attr(data-n);position:absolute;right:.35rem;bottom:.1rem;color:#071a3313;font:900 3.8rem/1 "Arial Black"}
    .bothBand{display:grid;grid-template-columns:repeat(5,1fr);gap:.65rem}.bothVerb{padding:1rem .6rem;text-align:center;background:var(--blue);color:var(--white);font-size:1.2rem;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.bothExample{margin-top:1rem;padding:1rem 1.2rem;background:var(--white);border-left:10px solid var(--yellow);font-size:clamp(1.1rem,1.8vw,1.55rem)}
    .pairGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.choicePair{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--night);background:var(--white)}.choicePair .stem{grid-column:1/-1;padding:.65rem .8rem;font-weight:900;background:var(--night);color:var(--white)}.choice{padding:.72rem;background:var(--white);border:0;border-right:1px solid #071a3320;color:var(--night)}.choice.correct{background:var(--good)}.choice.incorrect{background:#ffd0ca}.choicePair:nth-child(7){grid-column:1/-1}
    .repairRoll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}.repair{padding:.8rem 1rem;background:var(--white);border-left:9px solid var(--coral);color:var(--night);text-align:left;min-height:5.6rem}.repair .fixed{display:none;color:#246416;margin-top:.5rem}.repair.open{background:#f0fad0}.repair.open .fixed{display:block}.repair:nth-child(7){grid-column:1/-1}
    .rhythmStage{display:grid;grid-template-columns:.72fr 1.28fr;gap:1rem;align-items:center}.beatPanel{background:var(--night);color:var(--white);padding:1.2rem}.beat{display:flex;align-items:center;gap:.45rem;margin:.7rem 0}.beat i{display:block;width:1rem;height:1rem;border-radius:50%;background:var(--yellow);animation:pulseBeat 1.2s calc(var(--i)*.14s) infinite}.beat span{font-weight:900;font-size:1.25rem}.shadowLines{display:grid;gap:.55rem}.shadowLine{padding:.8rem 1rem;background:var(--white);border-bottom:7px solid var(--tone);font-weight:900}
    .readingStage{display:grid;grid-template-columns:.86fr 1.14fr;gap:1.1rem;align-items:center}.readingArt{width:100%;max-height:63vh;object-fit:cover;border:6px solid var(--night);box-shadow:11px 11px 0 var(--coral)}.readingCopy{background:var(--white);padding:1.1rem 1.25rem;border-top:10px solid var(--blue);box-shadow:7px 7px 0 #071a3320}.readingCopy p{font-size:clamp(.95rem,1.14vw,1.12rem);margin:.5rem 0}.readingCopy b{color:#c6352d}
    .preReadFrame{position:relative}.preReadFrame>img{width:100%;height:60vh;object-fit:cover;border:6px solid var(--night)}.preReadPanel{position:absolute;right:3%;top:50%;transform:translateY(-50%);width:min(31rem,42%);padding:1.1rem;background:#fff9edf2;border-left:10px solid var(--coral);box-shadow:10px 10px 0 var(--blue)}
    .questionRun{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}.questionCard{padding:.75rem .9rem;background:var(--white);border-bottom:6px solid var(--blue);color:var(--night);text-align:left;min-height:5.2rem}.questionCard .answer{display:none;color:#246416;margin-top:.45rem}.questionCard.open{background:#f0fad0}.questionCard.open .answer{display:block}.questionCard:nth-child(7){grid-column:1/-1}
    .listenStage{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;align-items:center}.listenImage{width:100%;max-height:59vh;object-fit:cover;border:6px solid var(--night);box-shadow:12px 12px 0 var(--yellow)}.predictionStack{display:grid;gap:.65rem}.prediction{padding:.85rem 1rem;background:var(--white);border-left:9px solid var(--tone);font-weight:900}
    .languageHunt{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.huntLane{padding:1.1rem;background:var(--night);color:var(--white);border-bottom:12px solid var(--tone)}.huntLane h3{color:var(--tone)}.huntLane p{padding:.55rem;background:#ffffff12}.huntAnswer{display:none;color:var(--yellow)}.huntLane.open .huntAnswer{display:block}
    .profileRail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.profile{min-height:12rem;padding:.75rem .55rem;background:var(--white);border-top:8px solid var(--tone);box-shadow:0 6px 0 #071a3320}.profile strong{display:grid;place-items:center;width:2rem;height:2rem;background:var(--night);color:var(--white);border-radius:50%;margin-bottom:.5rem}.profile b{display:block;font-size:1.05rem;margin-bottom:.35rem}.profile small{display:block;line-height:1.35;color:var(--muted)}
    .reportFrame{display:grid;grid-template-columns:.8fr 1.2fr;gap:1rem}.questionScript{background:var(--night);color:var(--white);padding:1.1rem}.questionScript p{border-bottom:2px solid #ffffff30;padding-bottom:.55rem}.reportTemplate{padding:1.1rem;background:var(--white);border:4px solid var(--night);box-shadow:10px 10px 0 var(--ice)}.reportTemplate mark{background:var(--yellow)}
    .contrastLine{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.contrastScene{padding:1.2rem;background:var(--white);border-top:10px solid var(--tone)}.contrastScene strong{display:block;font:900 clamp(1.45rem,2.5vw,2.4rem)/1.05 "Arial Black";margin:.4rem 0}.contrastScene em{color:#c6352d;font-style:normal;font-weight:900}
    .finalCopy{color:var(--white);max-width:39rem;padding-top:6vh}.finalCopy h2{color:var(--white)}.finalChecklist{display:grid;gap:.4rem}.finalChecklist span{padding:.5rem .7rem;background:#fff9edeb;color:var(--night);font-weight:900}
    .rundown{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.segment{min-height:12rem;padding:.7rem .55rem;background:var(--white);border-bottom:9px solid var(--tone)}.segment strong{font:900 1.7rem "Arial Black";color:#c6352d}.segment b{display:block;margin:.35rem 0}.segment small{line-height:1.35;color:var(--muted)}
    .reviewWall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}.reviewCard{min-height:9rem;padding:.8rem;background:var(--night);color:var(--white);border:3px solid var(--night);text-align:left;transform:rotate(var(--r))}.reviewCard .back{display:none;color:var(--yellow);margin-top:.6rem}.reviewCard.open{background:var(--paper);color:var(--night)}.reviewCard.open .back{display:block}.score{font:900 1.2rem "Arial Black";color:#c6352d;margin-top:.8rem}
    .homeworkStage{display:grid;grid-template-columns:1.1fr .9fr;gap:1rem}.homeworkBrief{background:var(--white);border:4px solid var(--night);padding:1.1rem;box-shadow:10px 10px 0 var(--blue)}.homeworkList{background:var(--yellow);padding:1.1rem;border:4px solid var(--night)}.exitOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.exitOption{padding:1rem;background:var(--white);border:3px solid var(--night);color:var(--night);text-align:left;min-height:9rem}.exitOption.selected{background:var(--good);transform:translateY(-5px)}
    .feedback{font-weight:900;color:#c6352d;min-height:1.5em}
    .tools{position:fixed;z-index:40;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--coral);color:var(--white);padding:.58rem .82rem;font-weight:900}.tools button{box-shadow:3px 3px 0 var(--night)}
    .nav{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:1rem;background:#071a33f2;color:var(--white);padding:.5rem .8rem;display:flex;gap:.65rem;align-items:center;border-radius:999px;box-shadow:0 7px 22px #0004}.count{min-width:5rem;text-align:center;font-weight:900}.progress{width:8rem;height:5px;background:#ffffff35}.progress i{display:block;height:100%;background:var(--yellow);transition:.35s}
    .note,.map{display:none;position:fixed;z-index:55;background:#071a33f8;color:var(--white);padding:1rem;top:4.4rem;right:1rem;max-width:32rem;border:2px solid var(--yellow)}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(900px,92vw);max-height:78vh;overflow:auto}.map button{margin:.2rem;padding:.45rem;border:0}
    @keyframes wipeIn{from{opacity:.4;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0)}}@keyframes pushIn{from{opacity:0;transform:translateX(5vw)}to{opacity:1;transform:none}}@keyframes zoomIn{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}@keyframes splitIn{from{opacity:0;clip-path:inset(0 48%)}to{opacity:1;clip-path:inset(0)}}@keyframes itemRise{from{opacity:0;transform:translateY(22px) rotate(.5deg)}to{opacity:1;transform:none}}@keyframes ticker{to{transform:translateX(-50%)}}@keyframes pulseBeat{50%{transform:scale(1.55);background:var(--coral)}}
    @media(max-width:980px){.hobbyStrip,.profileRail,.rundown{grid-template-columns:repeat(4,minmax(0,1fr))}.objectiveLine{flex-wrap:wrap}.objective{flex:1 1 12rem}}
    @media(max-width:700px){
      .scene{padding:4.7rem 1rem 6.8rem}h1{font-size:3.7rem}h2{font-size:2.28rem;max-width:none}
      .splitStage,.formulaStage,.readingStage,.listenStage,.rhythmStage,.languageHunt,.reportFrame,.contrastLine,.homeworkStage{grid-template-columns:1fr}
      .hobbyStrip,.profileRail,.rundown,.reviewWall,.exitOptions{grid-template-columns:1fr}.objectiveLine{display:grid}.meaningRail{grid-template-columns:1fr}.meaningVs{text-align:center}.bothBand{grid-template-columns:1fr}.pairGrid,.repairRoll,.questionRun{grid-template-columns:1fr}.choicePair:nth-child(7),.repair:nth-child(7),.questionCard:nth-child(7){grid-column:auto}
      .featureImage,.readingArt,.listenImage{max-height:32vh}.discoveryFrame img{height:68vh;object-position:center}.captionPair{position:relative;left:auto;top:auto;transform:none;width:100%;grid-template-columns:1fr;margin-top:-3rem;padding:0 .5rem}.discoveryFrame{padding-bottom:0}.meaningSide{min-height:0}.preReadFrame>img{height:46vh;object-position:36% center}.preReadPanel{position:relative;right:auto;top:auto;transform:none;width:calc(100% - 1rem);margin:-3rem .5rem 0}
      .profile,.segment{min-height:0}.finalShade,.heroShade{background:#071a33d9}.hero{object-position:67% center}.finalHero{object-position:72% center}.titleCopy{padding-top:13vh}.finalCopy{padding-top:10vh}
      .tools{top:.55rem;right:.55rem}.nav{bottom:.55rem}.tickerTrack{animation-duration:26s}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>

<body>
  <main id="deck"></main>
  <div class="tools"><button id="mapBtn">SHOW MAP</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside><aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">&larr;</button><span id="count" class="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">&rarr;</button></nav>
  <script>
    const A='assets/';
    const S=(title,n,b)=>({title,n,b});
    const info=text=>`<div class="taskNote motion" style="--d:1"><span class="taskIcon">i</span><span>${text}</span></div>`;
    const scenes=[
      S('After-School Live','2 min. Introduce the lesson topic and final live-show task. Ask students to name the hobbies they can see.',`<img class="hero" src="${A}hobby-channel-hero-v2.png" alt="Seven teenagers preparing an after-school hobby show in a modern broadcast studio"><div class="heroShade"></div><div class="stage titleCopy"><div class="kicker" style="color:var(--yellow)">Lesson 22 - grammar and speaking</div><h1>After-School<br>Live</h1><p>Gerunds and infinitives for hobbies and interests.</p><div class="signalTags"><span class="signalTag">ENJOY DOING</span><span class="signalTag" style="--r:1deg">WANT TO DO</span></div></div>`),
      S('Choose a current hobby','5 min. Assign one option to each student if the group has seven. Each student gives one true sentence.',`<div class="stage"><div class="kicker">01 - check-in</div><h2>What do you enjoy doing now?</h2>${info('Choose one hobby. Say how often you do it and why you enjoy it.')}<div class="hobbyStrip" id="checkIn">${[['CAM','taking photos'],['SK8','skateboarding'],['GTR','playing music'],['ART','drawing'],['BALL','playing basketball'],['BAKE','baking'],['MIC','making podcasts']].map((x,i)=>`<button class="hobbyPick" data-hobby="${x[1]}" style="--i:${i}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div><p id="checkOut" class="feedback">Choose one hobby.</p></div>`),
      S('Identify seven hobbies','5 min. Give each student one object. Students identify it, name the hobby, then make an enjoy sentence.',`<div class="stage splitStage"><img class="featureImage motion" src="${A}hobby-lineup-v2.png" alt="Seven hobby objects including a camera, skateboard, guitar, sketchbook, basketball, baking tools and podcast microphone"><div><div class="kicker">02 - visual lead-in</div><h2>Identify the hobby for each object.</h2>${info('One object per student. Name the object, the hobby, and one action people do in that hobby.')}<p class="feedback">Example: camera - photography - taking portraits.</p></div></div>`),
      S('Lesson objectives','2 min. Read the objectives. Students choose the one they most need.',`<div class="stage"><div class="kicker">03 - objectives</div><h2>By the end of the lesson, you can...</h2><div class="objectiveLine">${[['Recognise','verbs followed by -ing'],['Recognise','verbs followed by to + verb'],['Choose','the correct form in a sentence'],['Interview','someone about hobbies'],['Present','a clear hobby profile']].map((x,i)=>`<div class="objective motion" style="--d:${i}" data-n="${i+1}"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>${info('Choose one objective. Explain why it is useful for you.')}</div>`),
      S('Notice the two patterns','5 min. Elicit the highlighted forms before explaining the rule.',`<div class="stage"><div class="kicker">04 - grammar discovery</div><h2>What comes after the first verb?</h2><div class="discoveryFrame"><img src="${A}grammar-split-v2.png" alt="One teenager painting a skateboard and another teenager learning photography"><div class="captionPair"><div class="caption motion"><b>ACTIVITY NOW</b>I enjoy <mark>painting</mark> skateboard designs.</div><div class="caption motion" style="--d:2"><b>PLAN FOR NEXT</b>I want <mark>to learn</mark> photography.</div></div></div>${info('Underline the first verb and circle the form after it. What is different?')}</div>`),
      S('Meaning of the two forms','5 min. Explain the main meaning difference at this level, then ask for personal examples.',`<div class="stage"><div class="kicker">05 - meaning</div><h2>Use the form required by the first verb.</h2><div class="meaningRail"><div class="meaningSide motion" style="--tone:var(--coral)"><div class="giant">-ING</div><h3>An activity or experience</h3><p>I enjoy <b>editing</b> photos.</p><p>She avoids <b>practising</b> late.</p></div><div class="meaningVs">OR</div><div class="meaningSide motion" style="--d:2;--tone:var(--blue)"><div class="giant">TO + VERB</div><h3>A plan, goal, choice, or need</h3><p>I hope <b>to join</b> the club.</p><p>He decided <b>to try</b> baking.</p></div></div>${info('Make one true sentence with each form.')}</div>`),
      S('Form and spelling','6 min. Model the two structures. Check spelling changes orally with make, run, and lie.',`<div class="stage"><div class="kicker">06 - form</div><h2>Build each pattern accurately.</h2><div class="formulaStage"><div class="formula motion" style="--tone:var(--coral)"><h3>GERUND</h3><div class="form">verb + verb-ing</div><div class="example">enjoy + drawing<br>finish + making<br>keep + running</div></div><div class="formula motion" style="--d:2;--tone:var(--blue)"><h3>INFINITIVE</h3><div class="form">verb + to + base verb</div><div class="example">want + to draw<br>decide + to make<br>need + to practise</div></div></div>${info('Say the -ing spelling for make, run, and lie. Then make one infinitive example.')}</div>`),
      S('Verbs followed by a gerund','6 min. One verb per student. Students predict before revealing the family and example.',`<div class="stage"><div class="kicker">07 - verb group A</div><h2>These verbs are followed by -ing.</h2>${info('One verb per student. Say a possible hobby sentence, then click to check the pattern.')}<div class="verbWave" id="gerundVerbs">${[['enjoy','enjoy drawing'],['avoid','avoid buying'],['finish','finish editing'],['keep','keep practising'],['mind','mind waiting'],['suggest','suggest trying'],['practise','practise playing']].map((x,i)=>`<button class="verbTile" data-n="${i+1}"><strong>${x[0]}</strong><span class="family">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Verbs followed by an infinitive','6 min. One verb per student. Students predict before revealing the pattern and example.',`<div class="stage"><div class="kicker">08 - verb group B</div><h2>These verbs are followed by to + verb.</h2>${info('One verb per student. Say a possible hobby goal, then click to check the pattern.')}<div class="verbWave" id="infinitiveVerbs">${[['want','want to learn'],['hope','hope to improve'],['plan','plan to join'],['decide','decide to try'],['need','need to practise'],['learn','learn to edit'],['agree','agree to help']].map((x,i)=>`<button class="verbTile" data-n="${i+1}"><strong>${x[0]}</strong><span class="family">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Verbs that allow both forms','5 min. Keep the explanation simple: both are possible with little or no change in these examples.',`<div class="stage"><div class="kicker">09 - both forms</div><h2>These verbs can use either form.</h2><div class="bothBand">${['like','love','prefer','start','continue'].map((x,i)=>`<div class="bothVerb motion" style="--d:${i}">${x}</div>`).join('')}</div><div class="bothExample">I love <b>playing</b> guitar. = I love <b>to play</b> guitar.<br>She started <b>painting</b>. = She started <b>to paint</b>.</div>${info('Choose one verb. Make two versions of the same sentence.')}</div>`),
      S('Choose the correct form','8 min. Assign one numbered pair to each student. Only one answer can remain active in each pair.',`<div class="stage"><div class="kicker">10 - controlled practice</div><h2>Choose the correct caption.</h2>${info('One sentence per student. Choose one answer, explain the verb pattern, and read the full sentence.')}<div class="pairGrid" id="captionChoices">${[
        ['Mia enjoys ___ portraits.','taking','to take',0],['Leo plans ___ a band.','starting','to start',1],['We finished ___ the cake.','decorating','to decorate',0],['I hope ___ a new trick.','learning','to learn',1],['They avoid ___ expensive gear.','buying','to buy',0],['Sara decided ___ the club.','joining','to join',1],['Do you mind ___ this video?','editing','to edit',0]
      ].map((x,i)=>`<div class="choicePair"><div class="stem">${i+1}. ${x[0]}</div><button class="choice" data-good="${x[3]===0}">${x[1]}</button><button class="choice" data-good="${x[3]===1}">${x[2]}</button></div>`).join('')}</div><p id="captionOut" class="feedback">Select one answer in each pair.</p></div>`),
      S('Correct seven common errors','8 min. Assign one error per student. Students correct it aloud before clicking.',`<div class="stage"><div class="kicker">11 - error correction</div><h2>Correct the verb form.</h2>${info('One line per student. Say the correction and the rule, then click to reveal.')}<div class="repairRoll">${[
        ['I enjoy to draw comics.','I enjoy drawing comics.'],['She wants learning guitar.','She wants to learn guitar.'],['We finished to film the clip.','We finished filming the clip.'],['He hopes winning the match.','He hopes to win the match.'],['They avoid to practise late.','They avoid practising late.'],['I decided joining the team.','I decided to join the team.'],['Do you mind to wait five minutes?','Do you mind waiting five minutes?']
      ].map((x,i)=>`<button class="repair"><b>${i+1}. ${x[0]}</b><span class="fixed">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Listen for the verb patterns','6 min. Play the audio once for form, then again for rhythm. Students shadow one sentence each.',`<div class="stage rhythmStage"><div class="beatPanel"><div class="kicker" style="color:var(--yellow)">12 - pronunciation</div><h2 style="color:white">Hear the first verb and the following form.</h2><div class="beat"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><span>enjoy DRAW-ing</span></div><div class="beat"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><span>WANT to LEARN</span></div></div><div><div class="shadowLines">${['I enjoy drawing.','I avoid buying expensive materials.','I want to learn photography.','I hope to visit an art show.','I plan to make a small zine.'].map((x,i)=>`<div class="shadowLine motion" style="--d:${i};--tone:${i%2?'var(--coral)':'var(--blue)'}">${x}</div>`).join('')}</div>${info('Listen once. Then choose one line and repeat it with the same stress.')}</div></div>`),
      S('Predict the reading','4 min. Use the image and title only. Do not reveal the reading yet.',`<div class="stage"><div class="kicker">13 - pre-reading</div><h2>Three students swap hobbies for seven days.</h2><div class="preReadFrame"><img src="${A}hobby-swap-prediction-v2.png" alt="Three teenagers comparing photography, baking and basketball equipment for a hobby swap"><div class="preReadPanel">${info('Predict: Which hobbies do they try? What might be difficult? Use one gerund or infinitive.')}<div class="ticker"><div class="tickerTrack"><span>photography</span><span>baking</span><span>drawing</span><span>basketball</span><span>music</span><span>photography</span><span>baking</span><span>drawing</span><span>basketball</span><span>music</span></div></div></div></div></div>`),
      S('Read about the hobby swap','8 min. Students read silently, then take one paragraph each and identify its verb patterns.',`<div class="stage readingStage"><img class="readingArt" src="${A}hobby-swap-story-v2.png" alt="Three scenes showing a teenager baking, a teenager taking a city photograph and teenagers playing basketball"><article class="readingCopy"><div class="kicker">14 - reading</div><h2>The seven-day hobby swap</h2><p><b>Dany</b> enjoys playing basketball, but he decided to try baking. At first, he avoided using a recipe because he wanted to invent his own cake. After one messy attempt, he agreed to follow the instructions.</p><p><b>Amina</b> loves taking photos and hopes to work on a school magazine. She planned to photograph one new place each day. She kept waking up early to catch the morning light.</p><p><b>Leo</b> usually spends his free time drawing. He agreed to join Dany for a basketball practice. He did not mind running, but he disliked waiting on the bench.</p><p>At the end, all three suggested trying a new hobby with a friend. Dany plans to bake again, Amina wants to create a photo story, and Leo hopes to practise basketball next week.</p></article></div>`),
      S('Answer seven reading questions','7 min. Assign one question to each student. Students answer and point to evidence before revealing.',`<div class="stage"><div class="kicker">15 - reading check</div><h2>Find the answer in the text.</h2>${info('One question per student. Answer in a full sentence and quote the key phrase, then click to check.')}<div class="questionRun">${[
        ['What hobby did Dany decide to try?','He decided to try baking.'],['Why did Dany avoid using a recipe?','He wanted to invent his own cake.'],['What does Amina hope to do?','She hopes to work on a school magazine.'],['Why did Amina keep waking up early?','To catch the morning light.'],['What did Leo agree to do?','He agreed to join basketball practice.'],['What did Leo dislike doing?','He disliked waiting on the bench.'],['What did all three students suggest?','They suggested trying a new hobby with a friend.']
      ].map((x,i)=>`<button class="questionCard"><b>${i+1}. ${x[0]}</b><span class="answer">${x[1]}</span></button>`).join('')}</div></div>`),
      S('Predict the interview','4 min. Students inspect the image and choose likely answers before listening.',`<div class="stage listenStage"><img class="listenImage motion" src="${A}hobby-interview-v2.png" alt="Two teenagers recording a podcast interview about photography"><div><div class="kicker">16 - pre-listening</div><h2>What will the guest talk about?</h2><div class="predictionStack">${[['a hobby they enjoy','var(--coral)'],['something they collect','var(--blue)'],['a skill they want to learn','var(--yellow)'],['a plan for next weekend','var(--ice)']].map((x,i)=>`<div class="prediction motion" style="--d:${i};--tone:${x[1]}">${x[0]}</div>`).join('')}</div>${info('Choose two predictions. Give a reason from the image.')}</div></div>`),
      S('Listen for the main ideas','6 min. Play the interview twice. First for gist, then for the exact forms.',`<div class="stage listenStage"><img class="listenImage" src="${A}hobby-interview-v2.png" alt="Teen hobby photographer answering questions in a podcast studio"><div><div class="kicker">17 - listening</div><h2>Complete the guest profile.</h2>${info('Listen and write four answers: current hobby, two activities, next skill, and reason.')}<div class="reportTemplate"><p><b>Current hobby:</b> __________</p><p><b>Enjoys:</b> __________ and __________</p><p><b>Wants:</b> __________</p><p><b>Useful pattern:</b> enjoy + ___ / want + ___</p></div></div></div>`),
      S('Find language in a short story','7 min. Play the story. Students list the forms, then open each lane to compare.',`<div class="stage"><div class="kicker">18 - listening language hunt</div><h2>Sort the phrases you hear.</h2>${info('Listen once. Write every gerund and infinitive phrase you hear. Open the lanes after comparing answers.')}<div class="languageHunt"><button class="huntLane" style="--tone:var(--coral)"><h3>GERUND PHRASES</h3><p>verb + verb-ing</p><div class="huntAnswer">enjoys collecting</div></button><button class="huntLane" style="--tone:var(--blue)"><h3>INFINITIVE PHRASES</h3><p>verb + to + base verb</p><div class="huntAnswer">wants to design<br>plans to photograph<br>hopes to finish</div></button></div></div>`),
      S('Interview seven hobby guests','9 min. Assign one numbered profile per student. Students use the facts but answer in complete sentences.',`<div class="stage"><div class="kicker">19 - online interview</div><h2>Ask about interests and goals.</h2>${info('One profile per student. In pairs, ask both questions. Change partners once, then report one answer.')}<div class="profileRail">${[
        ['Maya','photography','edit videos'],['Noah','basketball','coach younger players'],['Lina','baking','design celebration cakes'],['Omar','playing guitar','perform live'],['Sora','skateboarding','learn a new trick'],['Eva','drawing comics','create a graphic novel'],['Ben','making podcasts','interview an athlete']
      ].map((x,i)=>`<div class="profile" style="--tone:${i%3===0?'var(--coral)':i%3===1?'var(--blue)':'var(--yellow)'}"><strong>${i+1}</strong><b>${x[0]}</b><small>enjoys ${x[1]}<br>wants to ${x[2]}</small></div>`).join('')}</div></div>`),
      S('Choose the best hobby partner','9 min. Students speak to two classmates and make a justified match.',`<div class="stage"><div class="kicker">20 - speaking</div><h2>Find a useful hobby partner.</h2>${info('Ask two classmates. Choose one partner. Report what both people enjoy doing and want to learn.')}<div class="reportFrame"><div class="questionScript"><h3>ASK</h3><p>What do you enjoy doing?</p><p>What do you want to learn next?</p><p>What do you avoid doing?</p><p>Would you like to work together?</p></div><div class="reportTemplate"><h3>REPORT</h3><p><mark>___ enjoys ___ing</mark>, and <mark>___ enjoys ___ing</mark>.</p><p>They want <mark>to ___</mark> together.</p><p>This is a useful match because __________.</p></div></div></div>`),
      S('Like doing and would like to do','5 min. Contrast a general preference with a present or future wish.',`<div class="stage"><div class="kicker">21 - useful contrast</div><h2>These two meanings are different.</h2><div class="contrastLine"><div class="contrastScene motion" style="--tone:var(--coral)"><h3>GENERAL ENJOYMENT</h3><strong>I like filming.</strong><p>I enjoy this activity in general.</p><em>like + verb-ing</em></div><div class="contrastScene motion" style="--d:2;--tone:var(--blue)"><h3>PRESENT OR FUTURE WISH</h3><strong>I'd like to film.</strong><p>I want to do this now or later.</p><em>would like + to + verb</em></div></div>${info('Make one true sentence with like doing and one wish with would like to do.')}</div>`),
      S('Plan the live hobby show','5 min. Open the group task after explaining the output and success criteria.',`<img class="finalHero" src="${A}live-finale-v2.png" alt="Seven teenagers presenting different hobbies on a professional live television stage"><div class="finalShade"></div><div class="stage finalCopy"><div class="kicker" style="color:var(--yellow)">22 - production task</div><h2>Prepare a 90-second hobby show.</h2><div class="finalChecklist"><span>7 students - one clear part each</span><span>At least 4 gerunds</span><span>At least 4 infinitives</span><span>One interview question</span><span>One recommendation for the audience</span></div>${info('Open the group task. Assign roles, prepare, then present without reading full sentences.')}</div>`),
      S('Give every student one part','8 min. Assign all seven segments. Students prepare their exact contribution before the run-through.',`<div class="stage"><div class="kicker">23 - show rundown</div><h2>Each person presents one segment.</h2>${info('Take one numbered segment each. Prepare two or three sentences. Rehearse once in this order.')}<div class="rundown">${[
        ['Host','Introduce the topic and guests.'],['Guest 1','Describe a hobby you enjoy doing.'],['Guest 2','Explain something you avoid doing.'],['Guest 3','Describe a skill you want to learn.'],['Interviewer','Ask two natural hobby questions.'],['Coach','Recommend one hobby and explain why.'],['Closer','Summarise three ideas and invite the audience to try one.']
      ].map((x,i)=>`<div class="segment motion" style="--d:${i};--tone:${i%3===0?'var(--coral)':i%3===1?'var(--blue)':'var(--yellow)'}"><strong>${i+1}</strong><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div>`),
      S('Review the grammar','7 min. Teams answer before opening each card. Award one point for the form and one for a complete sentence.',`<div class="stage"><div class="kicker">24 - review game</div><h2>Correct or complete each line.</h2>${info('One card per student. Say the full answer first, then open the card. Score two points for form plus complete sentence.')}<div class="reviewWall" id="reviewWall">${[
        ['enjoy + ?','enjoy doing'],['want + ?','want to do'],['Correct: I avoid to wait.','I avoid waiting.'],['Complete: She hopes...','She hopes to improve.'],['finish + ?','finish doing'],['Correct: We decided joining.','We decided to join.'],['like doing vs would like to do','general enjoyment vs present/future wish']
      ].map((x,i)=>`<button class="reviewCard" style="--r:${i%2?'.6deg':'-.6deg'}"><b>${i+1}. ${x[0]}</b><span class="back">${x[1]}</span></button>`).join('')}</div><div id="reviewScore" class="score">0 / 7 cards opened</div></div>`),
      S('Homework: record a hobby segment','3 min. Students may submit audio or video. Read the checklist and model one opening sentence.',`<div class="stage homeworkStage"><div class="homeworkBrief"><div class="kicker">25 - homework</div><h2>Record a 60-90 second hobby segment.</h2><p>Describe a real or imaginary hobby. Explain what you enjoy doing, what you avoid doing, and what you want or plan to learn.</p><p><b>Optional challenge:</b> recommend the hobby to a classmate.</p></div><div class="homeworkList"><h3>INCLUDE</h3><p>2 gerund phrases</p><p>2 infinitive phrases</p><p>1 reason or example</p><p>Clear opening and closing</p><p>Natural voice, not fast reading</p></div></div>`),
      S('Exit ticket','3 min. Every student selects one prompt and answers before leaving. Preview the next lesson.',`<div class="stage"><div class="kicker">26 - exit ticket</div><h2>Show what you can use independently.</h2>${info('Choose one prompt. Give a complete answer without looking at the grammar slides.')}<div class="exitOptions" id="exitOptions"><button class="exitOption"><h3>GERUND</h3>Say two things you enjoy or avoid doing.</button><button class="exitOption"><h3>INFINITIVE</h3>Say two things you want, hope, or plan to do.</button><button class="exitOption"><h3>BOTH</h3>Use like doing and would like to do with different meanings.</button></div><p id="exitOut" class="feedback">Choose one prompt.</p><div class="ticker"><div class="tickerTrack"><span>next lesson: movies, books and reviews</span><span>next lesson: movies, books and reviews</span><span>next lesson: movies, books and reviews</span></div></div></div>`)
    ];

    const transitions=['zoom','push','wipe','split'];
    const deck=document.querySelector('#deck');
    deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}" data-transition="${transitions[i%transitions.length]}">${s.b}</section>`).join('');
    const note=document.querySelector('#note'),map=document.querySelector('#map');
    map.innerHTML='<h3 style="color:var(--yellow)">After-School Live</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');
    let cur=0;
    function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>{x.classList.toggle('active',n===cur);if(n===cur){x.scrollTop=0;x.querySelectorAll('.motion').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''})}});document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open')}
    show(0);
    document.querySelector('#next').onclick=()=>show(cur+1);document.querySelector('#prev').onclick=()=>show(cur-1);
    document.querySelector('#mapBtn').onclick=()=>map.classList.toggle('open');document.querySelector('#noteBtn').onclick=()=>{note.innerHTML=`<b>Teacher note - ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};
    document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#noteBtn').click()});
    let sx=0,sy=0,browserGesture=false;document.addEventListener('touchstart',e=>{browserGesture=e.touches.length!==1||(window.visualViewport?.scale||1)>1.01;if(!browserGesture){sx=e.touches[0].screenX;sy=e.touches[0].screenY}},{passive:true});document.addEventListener('touchend',e=>{if(browserGesture||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4)show(cur+(dx<0?1:-1))},{passive:true});
    document.querySelectorAll('[data-hobby]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-hobby]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#checkOut').textContent=`I enjoy ${b.dataset.hobby}. Add frequency and a reason.`});
    document.querySelectorAll('.verbTile').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    document.querySelectorAll('.choicePair').forEach(pair=>pair.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{pair.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','incorrect'));const good=b.dataset.good==='true';b.classList.add(good?'correct':'incorrect');document.querySelector('#captionOut').textContent=good?'Correct. Name the first verb and its pattern.':'Not this form. Check which pattern follows the first verb.'}));
    document.querySelectorAll('.repair,.questionCard,.huntLane').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    let opened=0;document.querySelectorAll('.reviewCard').forEach(b=>b.onclick=()=>{const was=b.classList.contains('open');b.classList.toggle('open');opened+=was?-1:1;document.querySelector('#reviewScore').textContent=`${opened} / 7 cards opened`});
    document.querySelectorAll('.exitOption').forEach(b=>b.onclick=()=>{document.querySelectorAll('.exitOption').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#exitOut').textContent='Selected. Give your complete answer now.'});
  </script>
  <script src="experience-v3.js"></script>
</body>
</html>
