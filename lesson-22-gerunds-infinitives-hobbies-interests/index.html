<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 22 — Verb Garden</title><style>
:root{--forest:#183d35;--leaf:#79b58c;--lilac:#c8b6e8;--apricot:#f4a16c;--cream:#fff7e8;--ink:#2a2b2b}*{box-sizing:border-box}body{margin:0;background:var(--forest);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:6vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:germinate .4s both}.scene:before{content:'❧';position:absolute;right:4vw;bottom:7vh;font-size:7rem;color:var(--leaf);opacity:.16}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#183d35ec,#183d35a5 48%,#183d3522)}.title{position:relative;z-index:2;color:#fff;max-width:50rem;padding:12vh 2rem 2rem;border-left:10px solid var(--lilac);background:#183d3594}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.15rem,2vw,1.7rem)}.eyebrow,h3{font:900 .78rem 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--apricot)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.95;color:var(--forest);margin:.15em 0 .6em}p{font-size:clamp(1rem,1.45vw,1.4rem);line-height:1.45}.tag{display:inline-block;background:var(--lilac);color:var(--forest);padding:.45rem .8rem;font:bold .82rem 'Courier New';transform:rotate(-3deg);margin:.2rem}.specimens{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.specimen{background:#fff;border:2px solid var(--forest);padding:1.1rem;min-height:9rem;box-shadow:7px 7px 0 #183d3524;position:relative}.specimen:after{content:'✿';position:absolute;right:.8rem;top:.55rem;color:var(--apricot);font-size:1.5rem}.specimen strong{font-size:1.3rem;color:var(--forest)}.stem{display:flex;gap:0;align-items:stretch;margin:1rem 0}.bud{flex:1;padding:1rem;background:var(--leaf);border-radius:50% 50% 0 0;text-align:center;min-height:7rem}.bud:nth-child(2){background:var(--lilac)}.bud:nth-child(3){background:var(--apricot)}.bridge{height:8px;background:var(--forest);flex:.25;align-self:center}.choice{background:#fff;border:3px solid var(--forest);padding:.85rem 1rem;color:var(--forest);font:bold 1rem Georgia;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #183d3522}.choice:hover,.choice.selected{background:var(--lilac)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.phrase{font-size:clamp(1.4rem,2.6vw,2.8rem);background:#fff;border-left:12px solid var(--apricot);padding:1.2rem;box-shadow:9px 9px 0 #183d3522}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--leaf)}.feedback{font-weight:900;color:#b35a3e;min-height:1.5em}.tray{display:flex;flex-wrap:wrap;gap:.65rem}.seed{border:0;background:var(--forest);color:#fff;padding:.8rem 1rem;font:bold 1rem Georgia;cursor:pointer;border-radius:50% 50% 45% 45%}.seed.on{background:var(--apricot);color:var(--forest)}.timer{font-size:clamp(4rem,8vw,7rem);text-align:center;color:var(--forest);font-weight:900}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{border:0;background:var(--forest);color:#fff;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#183d35ef;color:#fff;padding:.5rem .8rem;display:flex;gap:.6rem;align-items:center}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--lilac)}.note,.map{display:none;position:fixed;z-index:30;background:#183d35f5;color:#fff;padding:1rem;top:4.4rem;right:1rem;max-width:30rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.meter{height:20px;background:#d7d0c4;margin:1rem 0}.meter i{display:block;height:100%;width:35%;background:var(--apricot);transition:.25s}@keyframes germinate{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.specimens,.grid2{grid-template-columns:1fr}.stem{display:block}.bud{margin:.5rem 0;border-radius:20px}.bridge{height:1rem;width:8px;margin:auto}.figure{max-height:30vh}.title{padding-top:13vh}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="experience-v3.css">
</head><body><main id="deck"></main><div class="tools"><button id="mapBtn">GARDEN MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(t,n,b)=>({t,n,b});const scenes=[
S('Verb Garden','2 min. Open with the greenhouse image. Ask what hobbies could grow there.',`<img class="hero" src="${A}greenhouse-hobbies.png" alt="Illustrated greenhouse with teenagers tending hobby-shaped plants"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 22 · grammar + speaking</div><h1>Verb<br>Garden</h1><p>Grow better sentences with gerunds and infinitives.</p><span class="tag">-ING</span><span class="tag">TO + VERB</span></div>`),
S('Check-in: what do you enjoy?','4 min. Students may choose an imaginary hobby.',`<div class="stage"><h3>01 · check-in</h3><h2>Which hobby would you plant?</h2><div class="tray" id="hobby"><button class="seed" data-hobby="drawing">drawing</button><button class="seed" data-hobby="cooking">cooking</button><button class="seed" data-hobby="playing music">playing music</button><button class="seed" data-hobby="taking photos">taking photos</button><button class="seed" data-hobby="a hobby I invent">invent one</button></div><p id="hobbyOut" class="feedback">Complete: “I enjoy …”</p></div>`),
S('Bridge from Lesson 21','3 min. Link business actions to verb patterns.',`<div class="stage"><h3>02 · bridge</h3><div class="grid2"><div class="phrase">We discussed <b>changing</b> the plan.</div><div class="phrase">We decided <b>to change</b> the plan.</div></div><p>Some verbs grow an <b>-ing</b> leaf. Others grow a <b>to + verb</b> stem.</p></div>`),
S('Look inside the greenhouse','5 min. Students notice the hobby objects and predict the grammar.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>Every interest has a verb pattern.</h2><img class="figure" src="${A}specimen-tray.png" alt="Illustrated tray of hobby objects with blank botanical tags"><p class="feedback">Point to an object: “I like …”</p></div>`),
S('Today’s growth plan','1 min. Preview the garden route.',`<div class="stage"><h3>04 · route</h3><div class="stem"><div class="bud"><b>Notice</b><br>the seed word</div><div class="bridge"></div><div class="bud"><b>Choose</b><br>-ing or to</div><div class="bridge"></div><div class="bud"><b>Grow</b><br>a hobby story</div></div></div>`),
S('Gerund seeds: hobbies as things','5 min. Tap seeds and say the phrase aloud.',`<div class="stage"><h3>05 · gerund garden</h3><h2>These activities behave like nouns.</h2><div class="tray" id="gerunds">${['reading','painting','cycling','singing','dancing','collecting','writing','baking'].map(x=>`<button class="seed" data-gerund="${x}">${x}</button>`).join('')}</div><p id="gerundOut" class="feedback">Try: “I enjoy ___.”</p></div>`),
S('Infinitive stems: plans and goals','5 min. Tap a stem and complete the goal.',`<div class="stage"><h3>06 · infinitive garden</h3><h2>Goals often grow with to + verb.</h2><div class="tray" id="infinitives">${['to learn','to improve','to practise','to visit','to make','to join'].map(x=>`<button class="seed" data-inf="${x}">${x}</button>`).join('')}</div><p id="infOut" class="feedback">Try: “I want ___.”</p></div>`),
S('The two plant families','5 min. Sort the verb families by their favourite soil.',`<div class="stage"><h3>07 · pattern map</h3><div class="stem"><div class="bud"><b>Enjoy / avoid / finish</b><br>+ -ing<br><br>I avoid wasting time.</div><div class="bridge"></div><div class="bud"><b>want / hope / decide</b><br>+ to<br><br>I hope to improve.</div></div></div>`),
S('Choice path','4 min. Choose the form that fits the lead verb.',`<div class="stage"><h3>08 · path choice</h3><h2>Which path does the sentence need?</h2><div class="grid2" id="path"><button class="choice" data-answer="ing">I enjoy ___ (read) comics.</button><button class="choice" data-answer="to">I want ___ (learn) guitar.</button><button class="choice" data-answer="ing">She avoids ___ (use) her phone late.</button><button class="choice" data-answer="to">They decided ___ (join) the club.</button></div><p id="pathOut" class="feedback">Choose a path, then say the complete sentence.</p></div>`),
S('Meaning: activity or goal?','4 min. Contrast an activity you like with a future goal.',`<div class="stage"><h3>09 · meaning</h3><div class="grid2"><div class="phrase">I like <b>drawing</b>.<br>It is an activity I enjoy.</div><div class="phrase">I want <b>to draw</b> a comic.<br>It is a goal or plan.</div></div></div>`),
S('Negatives in the garden','4 min. Add not before the correct plant.',`<div class="stage"><h3>10 · negative form</h3><div class="phrase">I decided <b>not to join</b> the competition.<br>I avoid <b>noticing</b> every tiny mistake.</div><p>Which sentence sounds like a decision? Which sounds like a habit?</p></div>`),
S('Questions for a gardener','4 min. Practise asking about interests and goals.',`<div class="stage"><h3>11 · questions</h3><div class="specimens"><div class="specimen"><strong>What do you enjoy doing?</strong><p>I enjoy …</p></div><div class="specimen"><strong>What do you want to learn?</strong><p>I want to …</p></div><div class="specimen"><strong>What do you avoid doing?</strong><p>I avoid …</p></div></div></div>`),
S('Controlled practice: leaf or stem','5 min. Choose the correct ending.',`<div class="stage"><h3>12 · controlled practice</h3><div class="grid2" id="control"><button class="choice">We finished ___ (paint) the wall.</button><button class="choice">I hope ___ (visit) Japan.</button><button class="choice">She loves ___ (dance).</button><button class="choice">He plans ___ (start) a band.</button></div><p id="controlOut" class="feedback">Tap, then say the ending aloud.</p></div>`),
S('Common mistake: two stems','4 min. Repair the crowded sentence.',`<div class="stage"><h3>13 · repair</h3><div class="phrase">✗ I want <b>to learning</b> guitar.<br>✓ I want <b>to learn</b> guitar.</div><p>After <b>to</b>, use the base verb. After enjoy, use <b>-ing</b>.</p>`),
S('Reading label: The Hobby Shelf','2 min. Predict the patterns you will see.',`<div class="stage"><h3>14 · reading preview</h3><div class="phrase">Mina enjoys collecting old postcards, but she wants to design her own travel book.</div><p>Underline the activity. Circle the goal.</p></div>`),
S('Text: Mina’s Hobby Shelf','6 min. Partner-read and mark each verb family.',`<div class="stage"><h3>15 · close reading</h3><div class="phrase"><p>Mina enjoys collecting old postcards. She avoids throwing them away because she likes finding small stories in the pictures. This year, she decided to make a travel book. She hopes to visit a new city and plans to interview local artists.</p></div><p>Highlight three <b>-ing</b> phrases and three <b>to + verb</b> phrases.</p></div>`),
S('Reading check','4 min. Click the line that answers each question.',`<div class="stage"><h3>16 · evidence check</h3><div class="grid2" id="read"><button class="choice">What does Mina enjoy? collecting postcards</button><button class="choice">What does she avoid? throwing them away</button><button class="choice">What did she decide? to make a travel book</button><button class="choice">What does she hope? to visit a new city</button></div><p id="readOut" class="feedback">Point to the exact phrase in the reading.</p></div>`),
S('Specimen tray: verb families','4 min. Use the image to make one sentence from each family.',`<div class="stage"><h3>17 · visual language</h3><img class="figure" src="${A}specimen-tray.png" alt="Illustrated hobby specimen tray with headphones paintbrush football book and camera"><p class="feedback">Choose one object for “I enjoy …” and one for “I want …”</p></div>`),
S('Path split: choose your interest','5 min. Students choose a gate and build a sentence.',`<div class="stage"><h3>18 · path challenge</h3><img class="figure" src="${A}path-split.png" alt="Illustrated garden path splitting toward an ing-leaf gate and a to-verb gate"><div class="tray" id="gates"><button class="seed" data-gate="ing">-ING GATE</button><button class="seed" data-gate="to">TO + VERB GATE</button></div><p id="gateOut" class="feedback">Choose a gate and complete a hobby sentence.</p></div>`),
S('Information gap: hobby club','6 min. Partner A has a club list; Partner B has member goals. Ask and match.',`<div class="stage"><h3>19 · pair task</h3><div class="grid2"><div class="phrase"><b>Clubs</b><br>photo club · cooking club · cycling club</div><div class="phrase"><b>Goals</b><br>wants to learn · enjoys making · avoids sitting</div></div><p>Ask: “What does Alex enjoy?” “What does Alex want to learn?”</p></div>`),
S('Grammar gardener interview','6 min. Students ask three questions and note the answers.',`<div class="stage"><h3>20 · speaking</h3><div class="specimens"><div class="specimen"><strong>enjoy</strong><p>What do you enjoy doing?</p></div><div class="specimen"><strong>want</strong><p>What do you want to learn?</p></div><div class="specimen"><strong>avoid</strong><p>What do you avoid doing?</p></div></div><p>Report one answer accurately.</p></div>`),
S('Build a hobby seed packet','7 min. Students create a fictional hobby profile.',`<div class="stage"><h3>21 · production setup</h3><h2>Plant a hobby for a character.</h2><div class="specimens"><div class="specimen"><strong>Name</strong><p>Who is the gardener?</p></div><div class="specimen"><strong>Enjoys</strong><p>Write one -ing activity.</p></div><div class="specimen"><strong>Wants</strong><p>Write one to + verb goal.</p></div></div></div>`),
S('Seed packet presentation','7 min. Students present their character in 45 seconds.',`<div class="stage"><h3>22 · production</h3><div class="phrase">“This is Kai. Kai enjoys making model planes. Kai wants to learn to fly a real plane. Kai avoids watching scary films.”</div><p>Listeners hold up a leaf for -ing and a stem for to + verb.</p></div>`),
S('Gallery poll','5 min. Class chooses the most surprising hobby goal.',`<div class="stage"><h3>23 · response</h3><div class="tray" id="poll"><button class="seed">most creative</button><button class="seed">most useful</button><button class="seed">most surprising</button><button class="seed">a hobby I want to try</button></div><p id="pollOut" class="feedback">Choose one and explain with a complete sentence.</p></div>`),
S('Review: the garden quiz','5 min. Teams choose a plant family for each verb.',`<div class="stage"><h3>24 · review</h3><div class="specimens" id="review"><button class="choice">enjoy → -ing</button><button class="choice">decide → to + verb</button><button class="choice">avoid → -ing</button><button class="choice">hope → to + verb</button><button class="choice">finish → -ing</button><button class="choice">plan → to + verb</button></div><p id="reviewOut" class="feedback">Say the full phrase after each choice.</p></div>`),
S('One-minute growth sprint','2 min. Students speak for one minute using both families.',`<div class="stage"><h3>25 · fluency</h3><div class="timer" id="timer">60</div><button class="choice" id="start">START GROWTH SPRINT</button><p>Use: I enjoy … / I want … / I avoid … / I hope …</p></div>`),
S('Homework: a hobby field guide','2 min. Draw or describe one character and their interests.',`<div class="stage"><h3>26 · homework</h3><div class="specimens"><div class="specimen"><strong>Leaf</strong><p>Two things the character enjoys doing.</p></div><div class="specimen"><strong>Stem</strong><p>Two things the character wants to do.</p></div><div class="specimen"><strong>Care note</strong><p>One thing they avoid doing.</p></div></div></div>`),
S('Exit ticket','2 min. Students complete one frame. Preview Movies, Books & Reviews.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Leave one seed growing.</h2><div class="tray" id="exit"><button class="seed">I enjoy …</button><button class="seed">I want to …</button><button class="seed">I avoid …</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Movies, Books & Reviews</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--lilac)">Verb Garden map</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.t}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));count.textContent=`${cur+1} / ${scenes.length}`;bar.style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-hobby]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');hobbyOut.textContent=`I enjoy ${b.dataset.hobby}.`});document.querySelectorAll('[data-gerund]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');gerundOut.textContent=`I enjoy ${b.dataset.gerund}.`});document.querySelectorAll('[data-inf]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');infOut.textContent=`I want ${b.dataset.inf}.`});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{b.classList.add('selected');pathOut.textContent='Good — name the lead verb and its plant family.'});document.querySelectorAll('#control .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');controlOut.textContent='Say it aloud and listen for the ending.'});document.querySelectorAll('#read .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');readOut.textContent='Evidence selected — point to the sentence.'});document.querySelectorAll('[data-gate]').forEach(b=>b.onclick=()=>{gateOut.textContent=b.dataset.gate==='ing'?'Build: I enjoy drawing / I avoid waiting.':'Build: I want to learn / I hope to visit.'});document.querySelectorAll('#poll .seed').forEach(b=>b.onclick=()=>{b.classList.add('on');pollOut.textContent='Explain your vote with a hobby sentence.'});document.querySelectorAll('#review .choice').forEach(b=>b.onclick=()=>{b.classList.add('selected');reviewOut.textContent='Keep growing: say the complete phrase.'});let seconds=60,run;start.onclick=()=>{clearInterval(run);seconds=60;timer.textContent=seconds;run=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0)clearInterval(run)},1000)};document.querySelectorAll('#exit .seed').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Complete the seed sentence for a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #102a23}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffe1a2!important}</style><script src="experience-v3.js"></script>
</body></html>
