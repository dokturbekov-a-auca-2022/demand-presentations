<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 19 - Airport Listening</title>
  <style>
    :root{--navy:#08243d;--teal:#17c3b2;--orange:#ff754f;--cream:#fff6df;--ink:#102f45;--line:#9fded5;--white:#fff}
    *{box-sizing:border-box}
    html,body{height:100%;touch-action:pan-x pan-y pinch-zoom}
    body{margin:0;background:var(--navy);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}
    #deck{height:100vh}
    .scene{display:none;width:100%;height:100vh;max-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .scene.active{display:block;animation:enter .3s both}
    .scene:after{content:'';position:absolute;right:-8rem;bottom:-8rem;width:19rem;height:19rem;border:2.5rem solid #17c3b21c;border-radius:50%;pointer-events:none}
    .stage{position:relative;z-index:1;max-width:1150px;margin:0 auto}
    .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .veil{position:absolute;inset:0;background:linear-gradient(90deg,#08243ded 0%,#08243dc9 48%,#08243d25 100%)}
    .title{position:relative;z-index:2;color:#fff;padding:10vh 0 0;max-width:48rem}
    .title h1{font-size:clamp(4rem,8vw,8.5rem);line-height:.86;margin:.1em 0}
    .title p{font-size:clamp(1.2rem,2vw,1.8rem);line-height:1.35}
    .eyebrow,h3{font:900 .78rem/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
    h2{font-size:clamp(2rem,4vw,4.1rem);line-height:.98;color:var(--navy);margin:.15em 0 .55em}
    p,li{font-size:clamp(1rem,1.45vw,1.35rem);line-height:1.42}
    .tag{display:inline-block;margin:.25rem .35rem .25rem 0;padding:.48rem .7rem;background:var(--teal);color:var(--navy);font-weight:900}
    .figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--teal)}
    .wave{height:82px;display:flex;align-items:center;gap:4px;margin:1.1rem 0;background:#d6f0eb;padding:0 1rem;overflow:hidden}
    .wave i{display:block;width:5px;height:var(--h);background:var(--teal);border-radius:4px;animation:pulse 1s infinite alternate}
    .wave.paused i{animation-play-state:paused}
    .transcript{background:#fff;border-left:10px solid var(--orange);padding:1.2rem 1.4rem;box-shadow:8px 8px 0 #08243d22;font-size:clamp(1.1rem,1.8vw,1.65rem);line-height:1.45}
    .transcript mark{background:#c7f0e9}
    .chips{display:flex;flex-wrap:wrap;gap:.65rem}
    button{font:800 1rem Arial,sans-serif;cursor:pointer}
    .chip,.answer{background:var(--navy);color:#fff;border:0;padding:.78rem 1rem;box-shadow:4px 4px 0 #08243d2b}
    .chip.on,.answer.selected{background:var(--orange)}
    .answer{background:#fff;color:var(--navy);border:3px solid var(--navy);text-align:left}
    .answer.correct{background:#c7f0e9}
    .answer.incorrect{background:#ffd5ca}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
    .slot{background:var(--navy);color:#fff;padding:1rem;min-height:8rem;border-top:8px solid var(--teal)}
    .slot strong{color:var(--teal);font-size:1.25rem}
    .ticket{background:#fff;padding:1.2rem;border:3px dashed var(--orange);box-shadow:7px 7px 0 #08243d1d}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
    .feedback{font-weight:900;color:#b84025;min-height:1.5em}
    .taskBrief{margin:.8rem 0 1rem;padding:.9rem 1rem;background:#d6f0eb;border-left:8px solid var(--orange);font-weight:800;line-height:1.45}
    .taskGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
    .numberCard,.taskCard{background:#fff;border:3px solid var(--navy);padding:.85rem;box-shadow:5px 5px 0 #08243d24}
    .numberCard>strong,.taskCard>strong,.routeStep>strong{display:inline-grid;place-items:center;width:2rem;height:2rem;margin:0 .4rem .45rem 0;background:var(--orange);color:#fff;border-radius:50%}
    .numberOptions{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
    .numberOption{border:2px solid var(--navy);background:#fff;color:var(--navy);padding:.65rem .3rem}
    .numberOption.selected{background:var(--teal)}
    .taskCard{min-height:8.5rem;text-align:left}
    .taskCard .taskAnswer{display:none;margin-top:.65rem;padding-top:.65rem;border-top:2px dashed var(--orange);color:#245d15}
    .taskCard.open{background:#eff9d6}
    .taskCard.open .taskAnswer{display:block}
    .routeSteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin:1rem 0}
    .routeStep{background:#fff;border-bottom:7px solid var(--teal);padding:.85rem;min-height:7.5rem;font-weight:800}
    .model{background:var(--navy);color:#fff;padding:1rem 1.2rem;line-height:1.5}
    .meter{height:17px;background:#b5d8d4;margin:1rem 0}
    .meter i{display:block;height:100%;width:30%;background:var(--orange);transition:.25s}
    .tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}
    .tools button,.nav button{background:var(--orange);color:#fff;border:0;padding:.55rem .8rem;font-weight:900}
    .nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#08243def;color:#fff;display:flex;align-items:center;gap:.65rem;padding:.5rem .8rem}
    .count{min-width:5rem;text-align:center}
    .progress{width:8rem;height:5px;background:#ffffff44}
    .progress i{display:block;height:100%;background:var(--teal)}
    .note,.map{display:none;position:fixed;z-index:30;background:#08243df5;color:#fff;top:4.4rem;right:1rem;max-width:30rem;padding:1rem}
    .note.open,.map.open{display:block}
    .map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw);max-height:76vh;overflow:auto}
    .map button{margin:.2rem;padding:.4rem;border:0}
    @keyframes pulse{to{transform:scaleY(.25)}}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(max-width:700px){
      .scene{padding:4.5rem 1rem 6.5rem}
      .board,.grid2,.taskGrid,.routeSteps{grid-template-columns:1fr}
      .figure{max-height:29vh}
      .title{padding-top:13vh}
      .wave{height:62px}
      .tools{top:.5rem;right:.5rem}
      .nav{bottom:.5rem}
      .taskCard,.numberCard,.routeStep{min-height:0}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <link rel="stylesheet" href="experience-v3.css">
</head>
<body>
  <main id="deck"></main>
  <div class="tools"><button id="mapBtn">SLIDES</button><button id="noteBtn">NOTES</button></div>
  <aside id="note" class="note"></aside>
  <aside id="map" class="map"></aside>
  <nav class="nav"><button id="prev" aria-label="Previous slide">&larr;</button><span id="count" class="count"></span><span class="progress"><i id="bar"></i></span><button id="next" aria-label="Next slide">&rarr;</button></nav>
  <script>
    const A='assets/';
    const S=(title,n,b)=>({title,n,b});
    const scenes=[
      S('Airport Listening','2 min. Ask students to identify two kinds of information they hear in airports.',`<img class="hero" src="${A}departures-hall.png" alt="Illustrated airport departures hall with travellers and suitcases"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 19 - listening and travel</div><h1>Airport<br>Listening</h1><p>Understand airport announcements and respond correctly.</p><span class="tag">MAIN IDEA</span><span class="tag">DETAILS</span><span class="tag">ACTION</span></div>`),
      S('Choose important information','4 min. Each student chooses one item and explains why a traveller needs it.',`<div class="stage"><h3>01 - discussion</h3><h2>What information do you need from an airport announcement?</h2><div class="chips" id="focus">${['gate number','departure time','destination','passenger name','delay or change','baggage belt'].map(x=>`<button class="chip" data-focus="${x}">${x}</button>`).join('')}</div><p id="focusOut" class="feedback">Choose one item and explain why it is important.</p></div>`),
      S('Relative clauses in announcements','3 min. Read both examples and identify the noun described by each relative clause.',`<div class="stage"><h3>02 - grammar review</h3><h2>Relative clauses can add important travel details.</h2><div class="transcript">“Flight 208 is the flight <b>that</b> goes to Istanbul.”<br>“Gate 14 is the gate <b>where</b> we meet.”</div><p>Question 1: What does <b>that goes to Istanbul</b> describe?<br>Question 2: What does <b>where we meet</b> describe?</p></div>`),
      S('Predict announcement vocabulary','4 min. Students study the picture and list three words that may appear in an airport announcement.',`<div class="stage"><h3>03 - prediction</h3><h2>Which words might you hear at this gate?</h2><img class="figure" src="${A}gate-listening.png" alt="Illustrated teenager listening to an airport announcement at a gate"><div class="taskBrief">Write three likely words in the chat. Then explain what information each word could give a passenger.</div></div>`),
      S('Three listening steps','1 min. Explain that students will listen for the main message, specific details, and the required action.',`<div class="stage"><h3>04 - lesson steps</h3><h2>Use three steps for each announcement.</h2><div class="board"><div class="slot"><strong>1 - Main message</strong><br>What is the announcement about?</div><div class="slot"><strong>2 - Key details</strong><br>Which flight, gate, time, or name is mentioned?</div><div class="slot"><strong>3 - Passenger action</strong><br>What should the passenger do?</div></div></div>`),
      S('Airport vocabulary','5 min. Assign one or two words to each student. Students define the word and use it in a sentence.',`<div class="stage"><h3>05 - vocabulary</h3><h2>Define and use these airport words.</h2><div class="chips" id="vocab">${['boarding pass','gate','aisle seat','window seat','delay','final call','security','baggage claim'].map(x=>`<button class="chip" data-vocab="${x}">${x}</button>`).join('')}</div><p id="vocabOut" class="feedback">Choose a word. Give a definition and one airport example.</p></div>`),
      S('Practise airport numbers','7 min. Assign one numbered card to each student. Read one option from each card without showing which one you chose.',`<div class="stage"><h3>06 - number listening</h3><h2>Listen, choose the number, and repeat the full phrase.</h2><div class="taskBrief"><b>Online task:</b> Give each student a card number. Read one option from that card. The assigned student says “option 1” or “option 2” and repeats the complete phrase. Everyone else votes 1 or 2 in the chat. With fewer than seven students, give some students a second card.</div><div class="taskGrid" id="numberTask">${[['Gate 13','Gate 30'],['Gate 14','Gate 40'],['15:50','5:50'],['16:15','6:15'],['Flight 208','Flight 280'],['Flight 619','Flight 690'],['Belt 17','Belt 70']].map((pair,i)=>`<div class="numberCard"><strong>${i+1}</strong><div class="numberOptions">${pair.map((x,j)=>`<button class="numberOption" data-number="${i+1}.${j+1}">${j+1}. ${x}</button>`).join('')}</div></div>`).join('')}</div><p id="numberOut" class="feedback">Selected answers will appear here.</p></div>`),
      S('First listening: main idea','3 min. Play the audio once. Students choose the main purpose before seeing the transcript.',`<div class="stage"><h3>07 - first listening</h3><h2>What is the announcement mainly about?</h2><div class="wave">${Array.from({length:34},(_,i)=>`<i style="--h:${18+(i%7)*8}px"></i>`).join('')}</div><div class="chips" id="gist"><button class="answer" data-gist="correct">a gate change</button><button class="answer" data-gist="wrong">a lost suitcase</button><button class="answer" data-gist="wrong">a meal service</button></div><p id="gistOut" class="feedback">Listen once and choose one answer.</p></div>`),
      S('Read the gate-change announcement','4 min. Show the transcript after the first-listening answer. Students identify the old gate, new gate, time, and action.',`<div class="stage"><h3>08 - transcript</h3><h2>Find four important details.</h2><div class="ticket"><p>“Attention, please. Flight 208 to Istanbul will now leave from Gate 18, not Gate 14. Boarding begins at 14:35. Passengers <mark>who need assistance</mark> should speak to the desk.”</p></div><div class="taskBrief">Underline the old gate. Circle the new gate. Box the boarding time. State what passengers who need assistance should do.</div></div>`),
      S('Second listening: key details','5 min. Play the announcement again. Assign one detail to each student, then check all four answers.',`<div class="stage"><h3>09 - second listening</h3><h2>Identify the destination, new gate, time, and action.</h2><div class="board" id="facts">${[['destination','Istanbul'],['new gate','18'],['boarding time','14:35'],['passenger action','speak to the desk']].map(([a,b])=>`<button class="answer" data-fact="${b}"><strong>${a}</strong><br>${b}</button>`).join('')}</div><p id="factOut" class="feedback">Click each detail when the class hears it.</p></div>`),
      S('Words for change, time, and action','4 min. Students add one more airport example to each group.',`<div class="stage"><h3>10 - language</h3><h2>These words show the purpose of a detail.</h2><div class="board"><div class="slot"><strong>Change</strong><br>now, instead, not</div><div class="slot"><strong>Time</strong><br>at, until, begins</div><div class="slot"><strong>Action</strong><br>please, should, proceed</div></div><p>In the chat, add one word or phrase to one group.</p></div>`),
      S('Listen again for each key detail','5 min. Reread or replay the announcement. Pause after the destination, gate, time, and passenger action.',`<div class="stage"><h3>11 - detailed listening</h3><h2>Pause after each important detail.</h2><div class="wave paused" id="wave2">${Array.from({length:40},(_,i)=>`<i style="--h:${12+(i%9)*7}px"></i>`).join('')}</div><button class="chip" id="pauseBtn">START OR PAUSE</button><div class="taskBrief">After each pause, one student repeats the last detail. Another student says whether it is a destination, gate, time, or action.</div></div>`),
      S('Flight delay announcement','4 min. Play the second announcement without showing the transcript. Students answer the three questions.',`<div class="stage"><h3>12 - new announcement</h3><h2>Listen for the problem, length of delay, and location.</h2><div class="board"><div class="slot"><strong>Problem</strong><br>What happened to the flight?</div><div class="slot"><strong>Time</strong><br>How long is the delay?</div><div class="slot"><strong>Location</strong><br>Where should passengers wait?</div></div><p class="feedback">Answer in the chat after the audio ends.</p></div>`),
      S('Choose the correct passenger actions','5 min. Students select two actions supported by the delay announcement and quote the words that support each choice.',`<div class="stage"><h3>13 - response</h3><h2>What should the passenger do?</h2><div class="grid2" id="moves"><button class="answer" data-move="wrong">go to Gate 18</button><button class="answer" data-move="correct">remain near Gate 6</button><button class="answer" data-move="correct">watch the information screen</button><button class="answer" data-move="wrong">collect baggage now</button></div><p id="moveOut" class="feedback">Choose two actions and explain which words support them.</p></div>`),
      S('Common listening problems and strategies','4 min. Assign one problem to each pair. They explain how the strategy helps.',`<div class="stage"><h3>14 - strategies</h3><h2>Use a specific strategy for each listening problem.</h2><div class="board"><div class="slot"><strong>Fast speech</strong><br>Listen for complete phrases, not separate words.</div><div class="slot"><strong>Similar numbers</strong><br>Write the number and check it in context.</div><div class="slot"><strong>Unfamiliar place names</strong><br>Listen for the flight number and gate as well.</div></div></div>`),
      S('Short dictation','5 min. Read the sentence twice. Students choose the chunks in the order they hear them.',`<div class="stage"><h3>15 - dictation</h3><h2>Put the sentence chunks in order.</h2><div class="transcript">“Please remain near Gate 6 until the boarding call.”</div><div class="chips" id="dictation">${['remain','near','Gate 6','until','boarding call'].map(x=>`<button class="chip" data-dict="${x}">${x}</button>`).join('')}</div><p id="dictOut" class="feedback">Select all five chunks in the correct order.</p></div>`),
      S('Baggage announcement','5 min. Read the announcement once. Students identify the suitcase detail and the baggage belt.',`<div class="stage"><h3>16 - third listening</h3><h2>Which detail identifies the suitcase?</h2><div class="wave">${Array.from({length:28},(_,i)=>`<i style="--h:${20+(i%5)*10}px"></i>`).join('')}</div><div class="ticket"><p>“The passenger whose suitcase has a yellow ribbon should visit Belt 3.”</p></div><p>Answer: What is on the suitcase? Which belt should the passenger visit?</p></div>`),
      S('Match the suitcase to the baggage belt','4 min. Students choose the matching description and explain their answer with the announcement.',`<div class="stage"><h3>17 - detail check</h3><h2>Which suitcase belongs at Belt 3?</h2><div class="board" id="bags"><button class="answer" data-bag="wrong">red tag - Belt 1</button><button class="answer" data-bag="correct">yellow ribbon - Belt 3</button><button class="answer" data-bag="wrong">blue sticker - Belt 5</button></div><p id="bagOut" class="feedback">Choose one suitcase and quote the identifying detail.</p></div>`),
      S('Retell an airport journey in order','8 min. Assign one numbered step to each student. Students read their step, then retell the whole journey without reading.',`<div class="stage"><h3>18 - ordered retelling</h3><h2>Use these seven steps to retell the journey.</h2><div class="taskBrief"><b>How to do the task:</b> Give each student one numbered step. Read the steps in order once. Hide or look away from the slide. Student 1 begins with “First,” and each student continues with one sentence. The final student retells all seven steps.</div><div class="routeSteps">${['Enter the departures hall.','Check the flight number on the departures screen.','Show a passport and collect the boarding pass.','Go through security.','Walk to Gate 18.','Listen for the boarding group.','Show the boarding pass and board the plane.'].map((x,i)=>`<div class="routeStep"><strong>${i+1}</strong>${x}</div>`).join('')}</div><div class="model"><b>Model retell:</b> First, the traveller enters the departures hall. Next, they check the flight number on the screen. Then, they show their passport and collect their boarding pass. After that, they go through security and walk to Gate 18. They listen for their boarding group. Finally, they show their boarding pass and board the plane.</div></div>`),
      S('Read and report airport announcements','9 min. Assign one numbered announcement to each student. The student reads it once; classmates record the key facts.',`<div class="stage"><h3>19 - group listening task</h3><h2>Report the destination, gate, status, and action.</h2><div class="taskBrief"><b>Online task:</b> Give each student one card. The student reads the announcement once without showing it. Classmates type the destination, gate, status, and action. Click the card to check. With fewer than seven students, use a second round.</div><div class="taskGrid" id="callTask">${[['Madrid','Gate 9','boarding now','go to Gate 9'],['Rome','Gate 12','delayed 25 minutes','stay near Gate 12'],['Bishkek','Gate 4','gate changed','go to Gate 4'],['Oslo','Gate 6','delayed 40 minutes','watch the screen'],['Istanbul','Gate 18','boarding at 14:35','speak to the desk for help'],['Seoul','Gate 21','final call','proceed immediately'],['Dubai','Belt 5','baggage available','collect checked baggage']].map((x,i)=>`<button class="taskCard revealCard"><strong>${i+1}</strong>${x[0]} - listen for four facts.<span class="taskAnswer"><b>Answer:</b> ${x.slice(1).join(' - ')}</span></button>`).join('')}</div></div>`),
      S('Ask for repetition','4 min. Students practise each phrase, then use one phrase during the next role-play.',`<div class="stage"><h3>20 - clarification phrases</h3><h2>Use these phrases when information is unclear.</h2><div class="chips"><span class="tag">Could you repeat that?</span><span class="tag">Which gate did you say?</span><span class="tag">Did you say fifteen or fifty?</span><span class="tag">What time does boarding begin?</span><span class="tag">Thank you. I understand now.</span></div></div>`),
      S('Airport help desk role-play','9 min. Assign one case to each student. One classmate acts as the desk agent, then roles change.',`<div class="stage"><h3>21 - role-play</h3><h2>Ask for information and confirm the answer.</h2><div class="taskBrief"><b>Steps:</b> The traveller explains the problem. The desk agent gives the gate, time, and required action. The traveller asks one clarification question and repeats the final information. Classmates check whether all three details were included.</div><div class="taskGrid" id="roleCases">${['You missed a gate-change announcement.','You cannot hear whether the gate is 15 or 50.','Your flight is delayed and you need the new time.','You need help finding the security area.','Your boarding pass shows the wrong seat.','Your suitcase did not arrive at the baggage belt.','You heard your name in the final call.'].map((x,i)=>`<button class="taskCard revealCard"><strong>${i+1}</strong>${x}<span class="taskAnswer"><b>Include:</b> one clear question, the agent’s answer, and confirmation from the traveller.</span></button>`).join('')}</div></div>`),
      S('Create an airport announcement','7 min. Students complete the form and read the announcement twice.',`<div class="stage"><h3>22 - speaking task</h3><h2>Write a complete airport announcement.</h2><div class="ticket"><div class="grid2"><p>Flight: ______<br>Destination: ______</p><p>Gate: ______<br>Time: ______</p></div><p>Status or change: __________________</p><p>Passenger action: __________________</p></div><div class="taskBrief">Read it once at normal speed. A listener writes the four details. Read it again, then compare the listener’s notes with the form.</div></div>`),
      S('Peer listening checklist','5 min. Students listen to a classmate’s announcement and complete all four checks.',`<div class="stage"><h3>23 - peer feedback</h3><h2>Check whether the announcement is complete.</h2><div class="board"><div class="slot"><strong>Destination</strong><br>I heard where the flight is going.</div><div class="slot"><strong>Gate and time</strong><br>I heard both numbers clearly.</div><div class="slot"><strong>Status</strong><br>I heard whether the flight is boarding, delayed, or changed.</div><div class="slot"><strong>Action</strong><br>I know what the passenger should do.</div></div></div>`),
      S('Review airport announcements','7 min. Assign one question to each student. Students answer before clicking to reveal the model answer.',`<div class="stage"><h3>24 - review</h3><h2>Answer seven questions about airport announcements.</h2><div class="taskGrid" id="reviewTask">${[['What does “now leave from Gate 18” mean?','The gate has changed to Gate 18.'],['What should passengers do if told to remain near Gate 6?','Stay close to Gate 6.'],['What does “delayed by 40 minutes” mean?','The flight will leave 40 minutes later.'],['Why is a yellow ribbon mentioned?','It identifies the correct suitcase.'],['What information follows “final call”?','Passenger, flight, and gate information.'],['Which question checks a number clearly?','Did you say fifteen or fifty?'],['What four details should you record?','Destination, gate or belt, status or time, and action.']].map((x,i)=>`<button class="taskCard revealCard"><strong>${i+1}</strong>${x[0]}<span class="taskAnswer"><b>Answer:</b> ${x[1]}</span></button>`).join('')}</div></div>`),
      S('Listening self-check','3 min. Students choose one statement and give an example from today’s lesson.',`<div class="stage"><h3>25 - reflection</h3><h2>Which listening skill can you use independently?</h2><div class="meter"><i id="meter"></i></div><div class="chips" id="levels"><button class="chip" data-level="30">I can identify the main message.</button><button class="chip" data-level="60">I can record key details.</button><button class="chip" data-level="90">I can choose the correct passenger action.</button></div><p id="levelOut" class="feedback">Choose one statement and give an example.</p></div>`),
      S('Homework: record or write an announcement','2 min. Explain the required details and allow either an audio or written submission.',`<div class="stage"><h3>26 - homework</h3><h2>Create a 30-second airport announcement.</h2><div class="board"><div class="slot"><strong>Required details</strong><br>flight, destination, gate, and time</div><div class="slot"><strong>Status</strong><br>boarding, delayed, changed, or final call</div><div class="slot"><strong>Passenger action</strong><br>one clear instruction</div></div><p>Submit a short audio recording or a written script.</p></div>`),
      S('Exit ticket','2 min. Each student completes one sentence aloud or in the chat.',`<div class="stage"><h3>27 - final check</h3><h2>Complete one sentence.</h2><div class="chips" id="exit"><button class="chip">One airport word I can use is...</button><button class="chip">One clarification question I can ask is...</button><button class="chip">One detail I will write down is...</button></div><p id="exitOut" class="feedback">Choose one sentence and complete it with a specific example.</p><div class="eyebrow">Next lesson: Used to and Be Used to - Childhood and Habits</div></div>`)
    ];

    const deck=document.querySelector('#deck');
    deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}" data-index="${i}">${s.b}</section>`).join('');
    const note=document.querySelector('#note');
    const map=document.querySelector('#map');
    map.innerHTML='<h3 style="color:var(--teal)">Airport Listening slides</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');
    let cur=0;
    function show(i){
      cur=(i+scenes.length)%scenes.length;
      document.querySelectorAll('.scene').forEach((x,n)=>{x.classList.toggle('active',n===cur);if(n===cur)x.scrollTop=0});
      document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;
      document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;
      note.classList.remove('open');
      map.classList.remove('open');
    }
    show(0);
    document.querySelector('#next').onclick=()=>show(cur+1);
    document.querySelector('#prev').onclick=()=>show(cur-1);
    document.querySelector('#mapBtn').onclick=()=>map.classList.toggle('open');
    document.querySelector('#noteBtn').onclick=()=>{note.innerHTML=`<b>Teacher note - ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};
    map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};
    document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')document.querySelector('#noteBtn').click()});
    let sx=0;
    document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});
    document.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});

    document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');document.querySelector('#focusOut').textContent=`Selected: ${b.dataset.focus}. Explain why a passenger needs it.`});
    document.querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');document.querySelector('#vocabOut').textContent=`Define “${b.dataset.vocab}” and use it in one sentence.`});
    document.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>{const card=b.closest('.numberCard');card.querySelectorAll('.numberOption').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#numberOut').textContent=`Card ${b.dataset.number.split('.')[0]}: option ${b.dataset.number.split('.')[1]} selected. Repeat the full phrase.`});
    document.querySelectorAll('[data-gist]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-gist]').forEach(x=>x.classList.remove('correct','incorrect'));const good=b.dataset.gist==='correct';b.classList.add(good?'correct':'incorrect');document.querySelector('#gistOut').textContent=good?'Correct. The announcement is about a gate change.':'Try again. Listen for the old gate and the new gate.'});
    document.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');const done=document.querySelectorAll('#facts .selected').length;document.querySelector('#factOut').textContent=`Details checked: ${done} / 4.`});
    document.querySelector('#pauseBtn').onclick=()=>document.querySelector('#wave2').classList.toggle('paused');
    document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const good=b.dataset.move==='correct';b.classList.toggle(good?'correct':'incorrect');document.querySelector('#moveOut').textContent=good?'Correct. Quote the words that support this action.':'That action is not supported by the announcement.'});
    document.querySelectorAll('[data-bag]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bag]').forEach(x=>x.classList.remove('correct','incorrect'));const good=b.dataset.bag==='correct';b.classList.add(good?'correct':'incorrect');document.querySelector('#bagOut').textContent=good?'Correct: the yellow ribbon identifies the suitcase for Belt 3.':'Check both the suitcase detail and the belt number.'});
    let dictation=[];
    const dictationOrder=['remain','near','Gate 6','until','boarding call'];
    document.querySelectorAll('[data-dict]').forEach(b=>b.onclick=()=>{if(dictation.includes(b.dataset.dict))return;dictation.push(b.dataset.dict);b.classList.add('on');const correct=dictation.every((x,i)=>x===dictationOrder[i]);document.querySelector('#dictOut').textContent=!correct?'The order is incorrect. Move to the next slide and return to reset.':dictation.length===5?'Correct: remain near Gate 6 until boarding call.':`${dictation.length} / 5 chunks selected in the correct order.`});
    document.querySelectorAll('.revealCard').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
    document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelector('#meter').style.width=b.dataset.level+'%';document.querySelector('#levelOut').textContent='Give one example that supports your choice.'});
    document.querySelectorAll('#exit .chip').forEach(b=>b.onclick=()=>{b.classList.add('on');document.querySelector('#exitOut').textContent='Complete the selected sentence with a specific example.'});
  </script>
  <style>.title{background:#08243da6;padding:1.5rem 2rem;border-left:8px solid var(--teal);text-shadow:0 3px 15px #001b38}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffb09f!important}</style>
  <script src="experience-v3.js"></script>
</body>
</html>
