<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 19 — Terminal Frequency</title><style>
:root{--navy:#08243d;--teal:#17c3b2;--orange:#ff754f;--cream:#fff6df;--ink:#102f45;--line:#9fded5}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.scene{display:none;min-height:100vh;padding:5.5vh 8vw 10vh;background:var(--cream);position:relative;overflow:auto}.scene.active{display:block;animation:scan .35s both}.scene:after{content:'✦';position:absolute;right:4vw;bottom:7vh;color:var(--orange);font-size:5rem;opacity:.14}.stage{position:relative;z-index:1;max-width:1150px}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#08243de8 0%,#08243db7 45%,#08243d1f 100%)}.title{position:relative;z-index:2;color:#fff;padding-top:11vh;max-width:50rem}.title h1{font-size:clamp(4rem,8vw,9rem);line-height:.82;margin:.1em 0}.title p{font-size:clamp(1.2rem,2vw,1.8rem)}.eyebrow,h3{font:900 .78rem Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}h2{font-size:clamp(2rem,4vw,4.2rem);line-height:.96;color:var(--navy);margin:.15em 0 .6em}p{font-size:clamp(1rem,1.45vw,1.4rem);line-height:1.42}.stamp{display:inline-block;border:3px solid var(--teal);color:var(--teal);padding:.45rem .75rem;font-weight:900;transform:rotate(-3deg);margin:.25rem}.wave{height:90px;display:flex;align-items:center;gap:4px;margin:1.3rem 0;background:#d6f0eb;padding:0 1rem;overflow:hidden}.wave i{display:block;width:5px;height:var(--h);background:var(--teal);border-radius:4px;animation:pulse 1s infinite alternate}.wave.paused i{animation-play-state:paused}.transcript{background:#fff;border-left:10px solid var(--orange);padding:1.2rem 1.4rem;box-shadow:8px 8px 0 #08243d22;font-size:clamp(1.15rem,1.8vw,1.7rem);line-height:1.45}.transcript mark{background:#c7f0e9}.chips{display:flex;flex-wrap:wrap;gap:.6rem}.chip,.answer{background:var(--navy);color:#fff;border:0;padding:.75rem 1rem;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 #08243d2b}.chip.on,.answer.selected{background:var(--orange)}.answer{background:#fff;color:var(--navy);border:3px solid var(--navy);text-align:left}.answer:hover{background:#d6f0eb}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.slot{background:var(--navy);color:#fff;padding:1rem;min-height:8rem;border-top:8px solid var(--teal)}.slot strong{color:var(--teal);font-size:1.3rem}.ticket{background:#fff;padding:1.2rem;border:3px dashed var(--orange);position:relative;box-shadow:7px 7px 0 #08243d1d}.ticket:after{content:'✈';position:absolute;right:1rem;top:.7rem;color:var(--orange);font-size:2rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.figure{width:100%;max-height:43vh;object-fit:cover;border:8px solid #fff;box-shadow:12px 12px 0 var(--teal)}.meter{height:17px;background:#b5d8d4;margin:1rem 0}.meter i{display:block;height:100%;width:30%;background:var(--orange);transition:.25s}.tools{position:fixed;z-index:20;right:1rem;top:1rem;display:flex;gap:.4rem}.tools button,.nav button{background:var(--orange);color:#fff;border:0;padding:.55rem .8rem;font-weight:900;cursor:pointer}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:1rem;background:#08243def;color:#fff;display:flex;align-items:center;gap:.65rem;padding:.5rem .8rem}.count{min-width:5rem;text-align:center}.progress{width:8rem;height:5px;background:#ffffff44}.progress i{display:block;height:100%;background:var(--teal)}.note,.map{display:none;position:fixed;z-index:30;background:#08243df5;color:#fff;top:4.4rem;right:1rem;max-width:30rem;padding:1rem}.note.open,.map.open{display:block}.map{left:50%;right:auto;transform:translateX(-50%);width:min(800px,92vw)}.map button{margin:.2rem;padding:.4rem;border:0}.feedback{font-weight:900;color:var(--orange);min-height:1.5em}@keyframes pulse{to{transform:scaleY(.25)}}@keyframes scan{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.scene{padding:4.5rem 1rem 6.5rem}.board,.grid2{grid-template-columns:1fr}.figure{max-height:29vh}.title{padding-top:13vh}.wave{height:65px}.tools{top:.5rem;right:.5rem}.nav{bottom:.5rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="deck"></main><div class="tools"><button id="mapBtn">FLIGHT MAP</button><button id="noteBtn">NOTE</button></div><aside id="note" class="note"></aside><aside id="map" class="map"></aside><nav class="nav"><button id="prev">←</button><span id="count"></span><span class="progress"><i id="bar"></i></span><button id="next">→</button></nav><script>
const A='assets/';const S=(title,n,b)=>({title,n,b});const scenes=[
S('Terminal Frequency','2 min. Use the image to ask what travellers listen for at an airport.',`<img class="hero" src="${A}departures-hall.png" alt="Illustrated airport departures hall with travellers and suitcases"><div class="veil"></div><div class="title"><div class="eyebrow">Lesson 19 · listening + travel</div><h1>Terminal<br>Frequency</h1><p>Catch the words, catch the flight, catch the meaning.</p><span class="stamp">LISTEN</span><span class="stamp">CHECK</span><span class="stamp">MOVE</span></div>`),
S('Check-in: what do you listen for?','4 min. Students choose a focus and justify it.',`<div class="stage"><h3>01 · check-in</h3><h2>At an airport, my ears look for…</h2><div class="chips" id="focus">${['the gate','the time','the destination','my name','a change','the baggage belt'].map(x=>`<button class="chip" data-focus="${x}">${x}</button>`).join('')}</div><p id="focusOut" class="feedback">Choose one. Finish: “I listen for it because …”</p></div>`),
S('Bridge from Lesson 18','3 min. Connect relative clauses to travel announcements.',`<div class="stage"><h3>02 · bridge</h3><div class="transcript">“Flight 208 is the flight <b>that</b> goes to Istanbul.”<br>“Gate 14 is the gate <b>where</b> we meet.”</div><p>Listen for the noun first; the extra detail comes after it.</p></div>`),
S('Read the terminal picture','4 min. Students predict the words they may hear.',`<div class="stage"><h3>03 · visual lead-in</h3><h2>Before the sound, build a picture.</h2><img class="figure" src="${A}gate-listening.png" alt="Illustrated teenager listening to an airport announcement at a gate"><p class="feedback">Name three things you expect in the announcement.</p></div>`),
S('Today’s signal path','1 min. Preview the listening loop.',`<div class="stage"><h3>04 · signal path</h3><h2>We will listen in three passes.</h2><div class="board"><div class="slot"><strong>1 · Catch</strong><br>gist and mood</div><div class="slot"><strong>2 · Lock</strong><br>times, gates, names</div><div class="slot"><strong>3 · Act</strong><br>choose the next move</div></div></div>`),
S('Airport words: the sound shelf','5 min. Students tap a word, pronounce it, and mime it.',`<div class="stage"><h3>05 · vocabulary</h3><h2>Make the terminal vocabulary audible.</h2><div class="chips" id="vocab">${['boarding pass','gate','aisle','window seat','delay','final call','security','baggage claim'].map(x=>`<button class="chip" data-vocab="${x}">${x}</button>`).join('')}</div><p id="vocabOut" class="feedback">Tap a word, then use it in a travel sentence.</p></div>`),
S('Numbers on the loudspeaker','5 min. Practise times and gate numbers in chunks.',`<div class="stage"><h3>06 · pronunciation</h3><h2>Hear the number, not every letter.</h2><div class="board"><div class="slot"><strong>Gate 18</strong><br>“eighteen”</div><div class="slot"><strong>14:35</strong><br>“two thirty-five”</div><div class="slot"><strong>Flight 208</strong><br>“two oh eight”</div></div><p>Teacher calls one; students point to the matching slot.</p></div>`),
S('Listening loop: pass one','3 min. Play/read the script once. Students choose the global message.',`<div class="stage"><h3>07 · first listen</h3><h2>What is the announcement mainly about?</h2><div class="wave" id="wave1">${Array.from({length:34},(_,i)=>`<i style="--h:${18+(i%7)*8}px"></i>`).join('')}</div><div class="chips" id="gist"><button class="answer">a gate change</button><button class="answer">a lost suitcase</button><button class="answer">a meal service</button></div><p id="gistOut" class="feedback">No notes yet. Choose the big message.</p></div>`),
S('Script window: Gate change','4 min. Reveal the transcript after students make a first guess.',`<div class="stage"><h3>08 · transcript window</h3><div class="ticket"><p>“Attention, please. Flight 208 to Istanbul will now leave from Gate 18, not Gate 14. Boarding begins at 14:35. Passengers <mark>who need assistance</mark> should speak to the desk.”</p></div><p>Circle the changed detail. Underline the action passengers should take.</p></div>`),
S('Lock the facts','5 min. Students click the fact that matches the transcript.',`<div class="stage"><h3>09 · second listen</h3><h2>Lock four details.</h2><div class="board" id="facts">${[['destination','Istanbul'],['new gate','18'],['boarding time','14:35'],['help','the desk']].map(([a,b])=>`<button class="answer" data-fact="${b}"><strong>${a}</strong><br>${b}</button>`).join('')}</div><p id="factOut" class="feedback">Tap each fact as you hear it.</p></div>`),
S('Signal words for announcements','4 min. Sort words by their job in the message.',`<div class="stage"><h3>10 · language noticing</h3><h2>Airport English has clear signals.</h2><div class="board"><div class="slot"><strong>Change</strong><br>now, instead, not</div><div class="slot"><strong>Time</strong><br>at, until, begins</div><div class="slot"><strong>Action</strong><br>please, should, proceed</div></div></div>`),
S('Listening loop: pass two','5 min. Teacher rereads with one deliberate pause before each key fact.',`<div class="stage"><h3>11 · sound focus</h3><h2>Pause where the meaning turns.</h2><div class="wave paused" id="wave2">${Array.from({length:40},(_,i)=>`<i style="--h:${12+(i%9)*7}px"></i>`).join('')}</div><button class="chip" id="pauseBtn">PAUSE / PLAY</button><p class="feedback">When the wave pauses, whisper the last fact you heard.</p></div>`),
S('A second announcement','4 min. Listen for a different kind of problem.',`<div class="stage"><h3>12 · prediction</h3><div class="ticket"><p>“Passengers on Flight 61 to Oslo: the flight is delayed by 40 minutes because of weather. Please remain near Gate 6.”</p></div><div class="chips"><span class="stamp">delay</span><span class="stamp">40 minutes</span><span class="stamp">Gate 6</span></div></div>`),
S('Choose the next move','5 min. Teams choose an action and explain which words helped.',`<div class="stage"><h3>13 · decision</h3><h2>The message changes what you do.</h2><div class="grid2" id="moves"><button class="answer">go to Gate 6</button><button class="answer">run to Gate 18</button><button class="answer">ask about the weather</button><button class="answer">wait near the gate</button></div><p id="moveOut" class="feedback">Choose two actions that fit the announcement.</p></div>`),
S('Common listening traps','4 min. Notice what can make a familiar announcement hard.',`<div class="stage"><h3>14 · repair</h3><div class="board"><div class="slot"><strong>Fast speech</strong><br>listen for chunks</div><div class="slot"><strong>Similar numbers</strong><br>write them down</div><div class="slot"><strong>New place names</strong><br>wait for the whole phrase</div></div></div>`),
S('Mini dictation: the last five words','5 min. Read once, pause, students reconstruct the ending.',`<div class="stage"><h3>15 · controlled practice</h3><h2>Catch the landing phrase.</h2><div class="transcript">“Please remain near Gate 6 until the boarding call.”</div><div class="chips" id="dictation">${['remain','near','Gate 6','until','boarding call'].map(x=>`<button class="chip" data-dict="${x}">${x}</button>`).join('')}</div><p id="dictOut" class="feedback">Tap the chunks in order.</p></div>`),
S('Listening loop: pass three','5 min. Students listen for a detail they need to act on.',`<div class="stage"><h3>16 · third listen</h3><h2>Now listen like a traveller.</h2><div class="wave">${Array.from({length:28},(_,i)=>`<i style="--h:${20+(i%5)*10}px"></i>`).join('')}</div><div class="ticket"><p>“The passenger whose suitcase has a yellow ribbon should visit Belt 3.”</p></div></div>`),
S('Baggage claim board','4 min. Students match the description to the belt.',`<div class="stage"><h3>17 · detail match</h3><h2>Which bag belongs to Belt 3?</h2><div class="board" id="bags"><button class="answer">red tag · Belt 1</button><button class="answer">yellow ribbon · Belt 3</button><button class="answer">blue sticker · Belt 5</button></div><p id="bagOut" class="feedback">Use the describing detail from the announcement.</p></div>`),
S('Route map: from hall to gate','4 min. Use the image to retell a traveller’s path.',`<div class="stage"><h3>18 · map listening</h3><img class="figure" src="${A}airport-route.png" alt="Illustrated overhead airport route map with gates and arrows"><p>Retell with sequence words: first, then, after that, finally.</p></div>`),
S('Information gap: terminal calls','6 min. Partner A reads one call; Partner B chooses the matching ticket.',`<div class="stage"><h3>19 · pair task</h3><h2>Can your partner catch the right ticket?</h2><div class="grid2"><div class="ticket"><b>Call A</b><p>Gate 9 · boarding now · Madrid</p></div><div class="ticket"><b>Call B</b><p>Gate 12 · delayed · Rome</p></div></div><p>Swap roles. The listener may ask: “Could you repeat the gate?”</p></div>`),
S('Useful repair phrases','4 min. Choral repetition, then role-play a noisy terminal.',`<div class="stage"><h3>20 · speaking support</h3><div class="chips"><span class="stamp">Could you repeat that?</span><span class="stamp">Which gate did you say?</span><span class="stamp">Did you say fifteen?</span><span class="stamp">Thanks, I’ve got it.</span></div></div>`),
S('Travel desk role-play','7 min. Pairs solve a realistic airport problem.',`<div class="stage"><h3>21 · production setup</h3><h2>One traveller. One desk agent. One solution.</h2><div class="board"><div class="slot"><strong>Traveller</strong><br>missed a gate change</div><div class="slot"><strong>Agent</strong><br>give time + gate + action</div><div class="slot"><strong>Observer</strong><br>tick three facts heard</div></div></div>`),
S('Build a boarding pass','7 min. Students create a fictional ticket and announce it clearly.',`<div class="stage"><h3>22 · production</h3><h2>Design the announcement your class needs.</h2><div class="ticket"><div class="grid2"><p>Flight: ______<br>Destination: ______</p><p>Gate: ______<br>Time: ______</p></div><p>Change or action: __________________</p></div><p>Read it twice: once naturally, once slowly for a listener.</p></div>`),
S('Peer check: did the signal land?','5 min. Listeners use three checks, not a general “good job.”',`<div class="stage"><h3>23 · feedback</h3><div class="board"><div class="slot"><strong>1</strong><br>I caught the destination.</div><div class="slot"><strong>2</strong><br>I caught the gate/time.</div><div class="slot"><strong>3</strong><br>I knew what to do.</div></div></div>`),
S('Review: terminal quiz','5 min. Teams answer and explain the listening clue.',`<div class="stage"><h3>24 · review</h3><h2>What does the loudspeaker mean?</h2><div class="grid2" id="quiz"><button class="answer">“now leave from Gate 18” = changed gate</button><button class="answer">“delayed 40 minutes” = board immediately</button><button class="answer">“remain near Gate 6” = stay close</button><button class="answer">“whose suitcase…” = description helps identify</button></div><p id="quizOut" class="feedback">Choose two statements that keep the meaning.</p></div>`),
S('Self-check: how strong is your signal?','3 min. Students choose a listening confidence level.',`<div class="stage"><h3>25 · reflection</h3><h2>Where is your listening frequency today?</h2><div class="meter"><i id="meter"></i></div><div class="chips" id="levels"><button class="chip" data-level="30">I catch the gist</button><button class="chip" data-level="60">I catch key facts</button><button class="chip" data-level="90">I can act on the message</button></div><p id="levelOut" class="feedback">Choose honestly; this is a signal, not a score.</p></div>`),
S('Homework: airport audio postcard','2 min. Record or write a 30-second fictional announcement.',`<div class="stage"><h3>26 · homework</h3><h2>Send a clear signal.</h2><div class="board"><div class="slot"><strong>Include</strong><br>destination + gate + time</div><div class="slot"><strong>Add</strong><br>one change or problem</div><div class="slot"><strong>Finish</strong><br>one action for passengers</div></div></div>`),
S('Exit ticket','2 min. Students finish one prompt, aloud or on paper. Preview Used to / Be Used to.',`<div class="stage"><h3>27 · exit ticket</h3><h2>Before you leave the terminal…</h2><div class="chips" id="exit"><button class="chip">One word I caught today was…</button><button class="chip">One repair phrase I can use is…</button><button class="chip">One airport action I can explain is…</button></div><p id="exitOut" class="feedback">Choose one and complete it for a partner.</p><div class="eyebrow">Next: Used to / Be Used to · Childhood & Habits</div></div>`)
];
const deck=document.querySelector('#deck');deck.innerHTML=scenes.map((s,i)=>`<section class="scene ${i?'':'active'}">${s.b}</section>`).join('');const note=document.querySelector('#note'),map=document.querySelector('#map');map.innerHTML='<h3 style="color:var(--teal)">Terminal Frequency route</h3>'+scenes.map((s,i)=>`<button data-jump="${i}">${i+1}. ${s.title}</button>`).join('');let cur=0;function show(i){cur=(i+scenes.length)%scenes.length;document.querySelectorAll('.scene').forEach((x,n)=>x.classList.toggle('active',n===cur));document.querySelector('#count').textContent=`${cur+1} / ${scenes.length}`;document.querySelector('#bar').style.width=`${(cur+1)/scenes.length*100}%`;note.classList.remove('open');map.classList.remove('open');window.scrollTo(0,0)}show(0);next.onclick=()=>show(cur+1);prev.onclick=()=>show(cur-1);mapBtn.onclick=()=>map.classList.toggle('open');noteBtn.onclick=()=>{note.innerHTML=`<b>Teacher note · ${cur+1}</b><br>${scenes[cur].n}`;note.classList.toggle('open')};map.onclick=e=>{if(e.target.dataset.jump!==undefined)show(+e.target.dataset.jump)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}if(e.key.toLowerCase()==='m')map.classList.toggle('open');if(e.key.toLowerCase()==='n')noteBtn.click()});let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(cur+(d<0?1:-1))},{passive:true});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');focusOut.textContent=`You chose ${b.dataset.focus}. Now finish the because sentence.`});document.querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');vocabOut.textContent=`Use “${b.dataset.vocab}” in a travel sentence.`});document.querySelectorAll('#gist .answer').forEach(b=>b.onclick=()=>{b.classList.add('selected');gistOut.textContent='Good — gist first, detail second.'});document.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>{b.classList.add('selected');factOut.textContent='Fact locked. Listen for the next signal.'});pauseBtn.onclick=()=>document.querySelector('#wave2').classList.toggle('paused');document.querySelectorAll('#moves .answer,#bags .answer,#quiz .answer').forEach(b=>b.onclick=()=>{b.classList.add('selected');moveOut&&(moveOut.textContent='Explain which words made that action possible.');quizOut&&(quizOut.textContent='Keep the statement that matches the announcement.');bagOut&&(bagOut.textContent='Description matched — the clue points to the bag.')});let ds=[];document.querySelectorAll('[data-dict]').forEach(b=>b.onclick=()=>{if(!ds.includes(b.dataset.dict))ds.push(b.dataset.dict);b.classList.add('on');dictOut.textContent=ds.length===5?'Complete phrase: remain near Gate 6 until boarding call.':`${ds.length}/5 chunks heard.`});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{meter.style.width=b.dataset.level+'%';levelOut.textContent='Now name one strategy you will use next time.'});document.querySelectorAll('#exit .chip').forEach(b=>b.onclick=()=>{b.classList.add('on');exitOut.textContent='Finish the sentence with a partner.'});
</script><style>.title{z-index:10!important;color:#fff!important;text-shadow:0 3px 15px #001b38;background:#08243d9c;padding:1.5rem 2rem;border-left:8px solid var(--teal)}.title h1,.title p{color:#fff!important}.title .eyebrow{color:#ffb09f!important}</style></body></html>
